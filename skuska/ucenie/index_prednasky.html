<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OZ Prednášky – Interaktívne učenie</title>
<style>
  *{box-sizing:border-box;}
  body{font-family:'Segoe UI',Calibri,Arial,sans-serif;margin:0;background:#0f1b2d;color:#e8eef7;padding:18px;
       display:flex;flex-direction:column;align-items:center;min-height:100vh;}
  /* rozcestník */
  #roz{width:100%;max-width:900px;}
  #roz h1{font-size:24px;margin:0 0 4px;color:#fff;text-align:center;}
  .sub{color:#8fa6c4;font-size:14px;text-align:center;margin-bottom:22px;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;}
  .tile{display:block;text-align:left;text-decoration:none;background:#16243a;border:1px solid #28406a;border-radius:14px;
        padding:16px 16px 14px;color:#e8eef7;transition:.13s;position:relative;overflow:hidden;cursor:pointer;font-family:inherit;width:100%;}
  .tile:hover{transform:translateY(-2px);border-color:#3a82c9;background:#1a2c48;}
  .tnum{font-size:13px;color:#6f9bd6;font-weight:700;}
  .tname{font-size:16.5px;font-weight:700;margin:4px 0 10px;line-height:1.25;color:#fff;}
  .pbar{height:8px;background:#0f1b2d;border-radius:8px;overflow:hidden;border:1px solid #28406a;}
  .pfill{height:100%;width:0;background:linear-gradient(90deg,#36c98b,#2ea3e6);}
  .pct{font-size:12px;color:#9db4d2;margin-top:5px;}
  .badge{position:absolute;top:10px;right:12px;font-size:18px;}
  .foot{text-align:center;color:#6c829e;font-size:12.5px;margin-top:22px;}
  .reset{background:none;border:1px solid #34507a;color:#9db4d2;border-radius:8px;padding:6px 12px;cursor:pointer;font-family:inherit;font-size:12.5px;}
  .pdf{color:#7fc1ff;text-decoration:none;}
  /* test (engine) */
  #test{width:100%;max-width:760px;}
  .top{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
  .home{color:#7fc1ff;text-decoration:none;font-size:13px;white-space:nowrap;cursor:pointer;background:none;border:none;font-family:inherit;}
  .th{font-size:19px;margin:0;color:#fff;flex:1;font-weight:700;}
  .progwrap{width:100%;background:#16243a;border-radius:20px;height:12px;overflow:hidden;border:1px solid #283d5e;margin-bottom:6px;}
  .prog{height:100%;width:0;background:linear-gradient(90deg,#36c98b,#2ea3e6);transition:width .3s;}
  .meta{font-size:12.5px;color:#9db4d2;margin-bottom:8px;text-align:center;}
  .palette{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:2px 0 14px;}
  .pbtn{min-width:32px;height:32px;border-radius:8px;border:1px solid #34507a;background:#16243a;color:#cfe0f5;font-weight:700;cursor:pointer;font-size:13px;padding:0 6px;font-family:inherit;}
  .pbtn:hover{filter:brightness(1.18);}
  .pbtn.cur{outline:3px solid #ffd166;outline-offset:1px;}
  .pbtn.ok{background:#2bbf80;color:#06281b;border-color:#2bbf80;}
  .pbtn.bad{background:#ef6b5b;color:#3a0b05;border-color:#ef6b5b;}
  .pbtn.seen{background:#274063;}
  .pbtn.sub{background:#2ea3e6;color:#06283b;border:none;}
  .stage{background:#fbfdff;color:#16263d;border-radius:16px;box-shadow:0 12px 30px rgba(0,0,0,.4);padding:24px 22px;min-height:240px;}
  .kind{font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:#2c5fa0;margin-bottom:12px;}
  .q{font-size:20px;font-weight:700;line-height:1.35;margin-bottom:6px;}
  .ahint{color:#5a6b82;font-size:13px;margin-bottom:12px;}
  .answer{font-size:17px;line-height:1.5;color:#1d3a2a;background:#e9f8ef;border-left:4px solid #36c98b;padding:12px 14px;border-radius:0 6px 6px 0;margin-top:14px;display:none;}
  .answer.show{display:block;} .answer b{color:#15633f;}
  .fillline{font-size:19px;line-height:1.7;}
  .fillinp{font-size:18px;padding:6px 10px;border:2px solid #9db8de;border-radius:7px;min-width:140px;background:#fff;color:#16263d;}
  .fillinp.ok{border-color:#36c98b;background:#eafaf1;} .fillinp.bad{border-color:#ef6b5b;background:#fdecea;}
  .opts{display:flex;flex-direction:column;gap:10px;margin-top:8px;}
  .opt{text-align:left;background:#eef3fb;border:2px solid #cfdcef;border-radius:10px;padding:12px 14px;font-size:16px;cursor:pointer;color:#16263d;transition:.1s;font-family:inherit;}
  .opt:hover{background:#e2ecfa;} .opt.ok{background:#e3f8ed;border-color:#36c98b;} .opt.bad{background:#fdecea;border-color:#ef6b5b;} .opt.dim{opacity:.55;}
  .pool{display:flex;flex-wrap:wrap;gap:9px;margin:6px 0 16px;min-height:20px;}
  .chip{background:#2e5496;color:#fff;border-radius:9px;padding:9px 13px;font-size:15px;cursor:grab;user-select:none;border:2px solid transparent;}
  .chip.sel{border-color:#ffd166;box-shadow:0 0 0 2px #ffd16655;} .chip.dragging{opacity:.5;}
  .zones{display:flex;flex-direction:column;gap:10px;}
  .zone{display:flex;align-items:center;gap:10px;background:#eef3fb;border:2px dashed #9db8de;border-radius:10px;padding:10px 12px;min-height:48px;}
  .zone.over{background:#dcebff;border-color:#2ea3e6;}
  .zlabel{font-size:14.5px;color:#26405f;flex:1;}
  .zslot{display:flex;flex-wrap:wrap;gap:7px;min-width:120px;min-height:40px;align-items:center;padding:4px;border-radius:8px;}
  .zone.ok{border-style:solid;border-color:#36c98b;background:#eafaf1;} .zone.bad{border-style:solid;border-color:#ef6b5b;background:#fdecea;}
  .catbox{flex-direction:column;align-items:stretch;} .catbox .zslot{min-height:54px;}
  .controls{display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap;}
  .btn{cursor:pointer;border:none;padding:13px 20px;border-radius:10px;font-weight:600;font-size:15px;font-family:inherit;transition:.12s;}
  .btn:hover{filter:brightness(1.08);}
  .btn-pri{background:#2ea3e6;color:#06283b;} .btn-ok{background:#36c98b;color:#06281b;} .btn-bad{background:#ef6b5b;color:#3a0b05;} .btn-ghost{background:#1b2c45;color:#cfe0f5;border:1px solid #34507a;}
  .fb{text-align:center;font-weight:700;font-size:16px;margin-top:14px;min-height:22px;}
  .fb.good{color:#2bbf80;} .fb.no{color:#ff8a7a;}
  .center{text-align:center;} .big{font-size:46px;font-weight:800;margin:6px 0;}
  .kbd{display:inline-block;background:#22354f;border:1px solid #3a5680;border-radius:5px;padding:1px 7px;font-size:12px;color:#cfe0f5;}
  .qfig{margin:4px 0 14px;text-align:center;background:#f3f7fc;border:1px solid #d8e3f1;border-radius:10px;padding:12px 8px;overflow-x:auto;}
  .qfig svg{max-width:100%;height:auto;}
  .qfig img{max-width:100%;max-height:300px;border-radius:6px;}
  .qfig table{border-collapse:collapse;margin:2px;}
  .qfig td{border:1px solid #9db8de;min-width:24px;height:24px;text-align:center;font-size:12.5px;color:#16263d;padding:0 2px;}
  .qfig .xcell{background:#fff3b0;font-weight:bold;color:#9a7b00;}
  .qfig .fcell{background:#e3ecfb;}
  .convrow{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;}
  .convrow .op{font-size:20px;font-weight:bold;color:#2c5fa0;}
  .convrow .cap{font-size:11px;color:#5a6b82;display:block;margin-top:3px;}

  .reading{background:#fbfdff;color:#16263d;border-radius:14px;padding:24px 28px;
    max-width:760px;margin:0 auto 18px;line-height:1.55;font-size:15.5px;
    box-shadow:0 8px 22px rgba(0,0,0,.25);}
  .reading h2{color:#1f3864;margin:0 0 10px;font-size:22px;border-bottom:2px solid #cfdcef;padding-bottom:6px;}
  .reading h3{color:#2c5fa0;margin:18px 0 6px;font-size:17px;}
  .reading p{margin:6px 0 10px;}
  .reading p.lead{font-size:16px;color:#26405f;font-style:italic;}
  .reading ul,.reading ol{margin:4px 0 10px 24px;padding:0;}
  .reading li{margin:3px 0;}
  .reading code{background:#eef3fb;border:1px solid #d8e3f1;padding:1px 5px;
    border-radius:3px;font-family:Consolas,'Courier New',monospace;font-size:13.5px;color:#c0392b;}
  .reading pre{background:#eef3fb;border-left:4px solid #2c5fa0;padding:8px 12px;
    border-radius:0 6px 6px 0;overflow-x:auto;margin:8px 0;}
  .reading pre code{background:none;border:none;color:#1f3864;padding:0;font-size:13px;}
  .reading strong{color:#1f3864;}
  .reading em{color:#2c5fa0;font-style:italic;}
  .reading .summary{background:#e3f8ed;border-left:4px solid #36c98b;padding:10px 14px;
    border-radius:0 6px 6px 0;margin-top:18px;}
  .reading .summary h3{color:#15633f;margin-top:0;}
</style>
</head>
<body>
<div id="roz">
  <h1>📚 Prednášky — interaktívne učenie zo slidov</h1>
  <div class="sub">10 prednášok. Klikni na tému → prečítaj si prednášku → klikni Spustiť test. Pokrok sa ukladá samostatne.</div>
  <div class="grid" id="grid"></div>
  <div class="foot">
    <button class="reset" id="reset">Vynulovať pokrok</button><br><br>
    🔄 Alternatíva: <a class="pdf" href="index_cvika.html">Učenie po úlohách (cv + projekt)</a> · 📄 <a class="pdf" href="../poznamky/">PDF poznámky</a> · <a class="pdf" href="../prednasky/">PDF prednášky</a>.
  </div>
</div>
<div id="test" style="display:none"></div>

<script>
/* ===== helpers ===== */
function el(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
function norm(s){return (s||'').toString().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]/g,'');}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

/* ===== engine: jeden test do kontajnera ===== */
function runTest(T, root, onExit, onProgress){
  const N=T.tasks.length;
  root.innerHTML='';
  const wrap=el('div');
  const top=el('div','top');
  const home=el('button','home','‹ Rozcestník');
  const th=el('div','th', T.num+'. '+T.name);
  top.append(home, th);
  const progwrap=el('div','progwrap'); const prog=el('div','prog'); progwrap.appendChild(prog);
  const meta=el('div','meta'); const palette=el('div','palette'); const stageHost=el('div');
  const controls=el('div','controls'); const fb=el('div','fb');
  wrap.append(top,progwrap,meta,palette,stageHost,fb,controls);
  root.appendChild(wrap);

  let state=new Array(N).fill('todo'), cells=new Array(N), cur=null, pos=0;
  function score(){return state.filter(s=>s==='ok').length;}
  function todoCount(){return state.filter(s=>s==='todo').length;}
  function touchedCount(){let n=0;for(let i=0;i<N;i++){if(cells[i]&&(cells[i].touched||cells[i].done))n++;}return n;}
  function setControls(bs){controls.innerHTML='';bs.forEach(b=>{if(!b)return;const x=el('button','btn '+(b.cls||'btn-ghost'),b.label);x.onclick=b.on;controls.appendChild(x);});}
  function setFB(t,g){fb.textContent=t||'';fb.className='fb '+(t?(g?'good':'no'):'');}
  function saveProgress(){
    const answered=N-todoCount(), correct=score(), touched=touchedCount(), pct=N?Math.round(correct/N*100):0;
    let best=pct; const prev=(PROG&&PROG[T.num])||null; if(prev) best=Math.max(pct, prev.best!=null?prev.best:0);
    onProgress(T.num, {n:N,answered:answered,correct:correct,touched:touched,pct:pct,best:best,done:answered===N});
  }
  function markTouched(c){if(c&&!c.touched){c.touched=true;saveProgress();renderNav();}}
  function navButtons(extra){
    const arr=[{label:'‹ Späť',cls:'btn-ghost',on:()=>goTo(pos-1)}];
    (extra||[]).forEach(e=>arr.push(e));
    if(pos<N-1) arr.push({label:'Ďalej ›',cls:'btn-ghost',on:()=>goTo(pos+1)});
    else arr.push({label:'Vyhodnotiť ▸',cls:'btn-pri',on:results});
    setControls(arr);
  }
  function renderNav(){
    palette.innerHTML='';
    for(let i=0;i<N;i++){const seen=cells[i]&&state[i]==='todo';
      const cls='pbtn'+(state[i]==='ok'?' ok':state[i]==='bad'?' bad':(seen?' seen':''))+(i===pos?' cur':'');
      const b=el('button',cls,String(i+1));b.onclick=()=>goTo(i);palette.appendChild(b);}
    const sub=el('button','pbtn sub','✓ Vyhodnotiť');sub.onclick=results;palette.appendChild(sub);
    prog.style.width=Math.round((pos+1)/N*100)+'%';
    meta.textContent='Otázka '+(pos+1)+' / '+N+'   •   správne '+score()+(todoCount()?('   •   nezodp. '+todoCount()):'');
  }
  function show(node){while(stageHost.firstChild)stageHost.removeChild(stageHost.firstChild);stageHost.appendChild(node);}
  function goTo(i){clearSel();dragged=null;pos=Math.max(0,Math.min(N-1,i));cur=cells[pos]||buildCell(pos);show(cur.el);
    setFB(cur.fb?cur.fb.txt:'',cur.fb?cur.fb.good:false);cur.refreshControls();renderNav();
    if(cur._focus&&!cur.done){setTimeout(cur._focus,20);}}
  function record(c,ok){if(c.done)return;c.done=true;c.touched=true;state[c.idx]=ok?'ok':'bad';
    c.fb={txt:ok?'✓ Správne':'✗ Nesprávne',good:ok};saveProgress();renderNav();
    if(c===cur){setFB(c.fb.txt,c.fb.good);c.refreshControls();}}
  function buildCell(i){const cell={idx:i,done:false,touched:false,revealed:false,fb:null,isFlash:false,_check:null,_reveal:null,_focus:null,autoEval:null,refreshControls:()=>navButtons([])};
    const host=el('div','stage');cell.el=host;RENDER[T.tasks[i].type](T.tasks[i],cell,host);
    if(T.tasks[i].fig){const f=el('figure','qfig');f.innerHTML=T.tasks[i].fig;const a=host.querySelector('.q')||host.querySelector('.kind');if(a){if(a.nextSibling)host.insertBefore(f,a.nextSibling);else host.appendChild(f);}else host.insertBefore(f,host.firstChild);}
    cells[i]=cell;return cell;}
  function startTest(){state=new Array(N).fill('todo');cells=new Array(N);pos=0;goTo(0);}
  function startIntro(){
    const best=(PROG&&PROG[T.num])||null;
    palette.innerHTML='';prog.style.width='0%';meta.textContent='';
    const s=el('div');
    const hdr=el('div','stage');
    hdr.style.marginBottom='10px';
    hdr.innerHTML='<div class="center"><div class="kind">T\u00e9ma '+T.num+' \u2014 '+N+' ot\u00e1zok</div>'
      +'<div class="q" style="margin-top:6px">'+T.name+'</div>'
      +(best?'<p style="color:#2c8f63;font-weight:700;margin:6px 0 0">Najlep\u0161ie: '+(best.best!=null?best.best:0)+'%</p>':'')
      +'<p style="font-size:13px;color:#7a8ba3;margin:8px 0 0">\ud83d\udcd6 Najprv si pre\u010d\u00edtaj predn\u00e1\u0161ku, potom spusti test. Kl\u00e1vesy: <span class="kbd">Enter</span> skontrolova\u0165 \u00b7 <span class="kbd">\u2190</span>/<span class="kbd">\u2192</span> ot\u00e1zky \u00b7 <span class="kbd">medzern\u00edk</span> karti\u010dka.</p></div>';
    s.appendChild(hdr);
    if(T.reading){
      const r=el('div','reading');
      r.innerHTML=T.reading;
      s.appendChild(r);
    }
    show(s);setFB('');
    setControls([{label:'\u25b6 Spusti\u0165 test',cls:'btn-pri',on:startTest}]);
  }
  function results(){
    for(let i=0;i<N;i++){if(cells[i]&&cells[i].autoEval)cells[i].autoEval();}
    const sc=score(),un=todoCount(),pct=Math.round(sc/N*100);saveProgress();
    let emo=pct===100?'🏆':pct>=80?'🎉':pct>=50?'💪':'📚';
    const s=el('div','stage');
    s.innerHTML='<div class="center"><div class="big">'+emo+' '+pct+'%</div>'
      +'<p style="font-size:17px;color:#26405f">Správne '+sc+' z '+N+'.'+(un?(' Nezodpovedané: '+un+'.'):'')+'</p>'
      +(sc<N?'<p style="color:#7a8ba3;font-size:14px">V navigácii hore klikni na <b>červené</b> čísla a oprav si ich.</p>':'<p style="color:#2c8f63;font-weight:700">Bez chyby! 👏</p>')+'</div>';
    show(s);setFB('');renderNav();meta.textContent='Vyhodnotenie';prog.style.width='100%';
    const btns=[];const fw=state.findIndex(s2=>s2==='bad');
    if(fw>=0)btns.push({label:'↦ Na prvú nesprávnu',cls:'btn-bad',on:()=>goTo(fw)});
    btns.push({label:'↻ Skúsiť znova',cls:'btn-ghost',on:startTest});
    btns.push({label:'‹ Späť na otázky',cls:'btn-ghost',on:()=>goTo(pos)});
    setControls(btns);
  }
  /* DnD */
  let dragged=null,selected=null;
  function poolOf(node){return node.closest('.stage').querySelector('.pool');}
  function makeChip(val,data){const c=el('span','chip',val);c.draggable=true;if(data)Object.keys(data).forEach(k=>c.dataset[k]=data[k]);
    c.addEventListener('dragstart',e=>{dragged=c;c.classList.add('dragging');e.dataTransfer.setData('text','x');});
    c.addEventListener('dragend',()=>{c.classList.remove('dragging');dragged=null;});
    c.addEventListener('click',()=>{if(c.parentElement&&c.parentElement.classList.contains('zslot')){poolOf(c).appendChild(c);markTouched(cur);clearSel();return;}
      if(selected===c){clearSel();}else{clearSel();selected=c;c.classList.add('sel');}});
    return c;}
  function clearSel(){if(selected){selected.classList.remove('sel');selected=null;}}
  function makeSlot(zone,single){const slot=el('div','zslot');slot.dataset.single=single?'1':'';
    zone.addEventListener('dragover',e=>{e.preventDefault();zone.classList.add('over');});
    zone.addEventListener('dragleave',()=>zone.classList.remove('over'));
    zone.addEventListener('drop',e=>{e.preventDefault();zone.classList.remove('over');if(dragged){placeIn(slot,dragged);markTouched(cur);}});
    zone.addEventListener('click',()=>{if(selected){placeIn(slot,selected);markTouched(cur);clearSel();}});
    return slot;}
  function placeIn(slot,chip){if(!chip||chip.closest('.stage')!==slot.closest('.stage'))return;if(slot.dataset.single==='1'&&slot.children.length){poolOf(slot).appendChild(slot.children[0]);}slot.appendChild(chip);}
  /* renderers */
  const RENDER={
    flash(t,cell,host){
      host.appendChild(el('div','kind','Kartička — vybav si z hlavy'));
      host.appendChild(el('div','q',t.q));
      host.appendChild(el('div','ahint','Klikni „Ukázať odpoveď" (alebo medzerník), potom sa ohodnoť.'));
      const ans=el('div','answer',t.a);host.appendChild(ans);cell.isFlash=true;
      cell._reveal=function(){if(cell.done)return;cell.revealed=true;markTouched(cell);ans.classList.add('show');cell.refreshControls();};
      cell.refreshControls=function(){if(cell.done)navButtons([]);
        else if(cell.revealed)navButtons([{label:'✗ Nevedel',cls:'btn-bad',on:()=>record(cell,false)},{label:'✓ Vedel',cls:'btn-ok',on:()=>record(cell,true)}]);
        else navButtons([{label:'Ukázať odpoveď (medzerník)',cls:'btn-pri',on:cell._reveal}]);};
    },
    fill(t,cell,host){
      host.appendChild(el('div','kind','Doplňovačka — napíš chýbajúce slovo'));
      const parts=t.text.split('___');const line=el('div','fillline');
      line.appendChild(document.createTextNode(parts[0]||''));
      const inp=el('input','fillinp');inp.type='text';inp.autocomplete='off';inp.spellcheck=false;line.appendChild(inp);
      line.appendChild(document.createTextNode(parts[1]||''));host.appendChild(line);
      cell._focus=()=>inp.focus();
      inp.addEventListener('input',()=>markTouched(cell));
      inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();check();}});
      function check(){if(cell.done)return;const good=[t.answer].concat(t.alts||[]).some(a=>norm(a)===norm(inp.value));
        inp.classList.add(good?'ok':'bad');inp.disabled=true;
        if(!good){host.appendChild(el('div','answer show','Správne: <b>'+t.answer+'</b>'));}record(cell,good);}
      cell._check=check;cell.autoEval=function(){if(!cell.done&&inp.value.trim()!=='')check();};
      cell.refreshControls=function(){if(cell.done)navButtons([]);
        else navButtons([{label:'Skontrolovať (Enter)',cls:'btn-pri',on:check},{label:'Ukáž',cls:'btn-ghost',on:()=>{inp.value=t.answer;markTouched(cell);}}]);};
    },
    quiz(t,cell,host){
      host.appendChild(el('div','kind','Kvíz — vyber správnu odpoveď'));
      host.appendChild(el('div','q',t.q));const opts=el('div','opts');
      shuffle(t.options.map((o,i)=>({o,i}))).forEach(({o,i})=>{const b=el('button','opt',o);b.onclick=()=>pick(i,b);opts.appendChild(b);});
      host.appendChild(opts);cell.refreshControls=function(){navButtons([]);};
      function pick(i,b){if(cell.done)return;[...opts.children].forEach(c=>c.classList.add('dim'));b.classList.remove('dim');
        if(i===t.correct){b.classList.add('ok');record(cell,true);}
        else{b.classList.add('bad');[...opts.children].forEach(c=>{if(c.textContent===t.options[t.correct]){c.classList.remove('dim');c.classList.add('ok');}});record(cell,false);}
        if(t.explain)host.appendChild(el('div','answer show',t.explain));}
    },
    match(t,cell,host){dndTask(t,'match',cell,host);},
    order(t,cell,host){dndTask(t,'order',cell,host);},
    cat(t,cell,host){dndTask(t,'cat',cell,host);}
  };
  function dndTask(t,mode,cell,host){
    const kind=mode==='order'?'Drag &amp; drop — usporiadaj do správneho poradia':mode==='cat'?'Drag &amp; drop — roztrieď do skupín':'Drag &amp; drop — priraď k sebe';
    host.appendChild(el('div','kind',kind));host.appendChild(el('div','q',t.prompt));
    host.appendChild(el('div','ahint','Ťahaj kartičky myšou — alebo klikni kartičku a potom cieľ.'));
    const pool=el('div','pool');const zones=el('div','zones');let chips=[];
    if(mode==='order'){const items=t.items.map((v,i)=>({v,i}));shuffle(items).forEach(it=>chips.push(makeChip(it.v,{idx:it.i})));
      t.items.forEach((_,i)=>{const z=el('div','zone');z.dataset.slot=i;z.appendChild(el('div','zlabel',(i+1)+'.'));z.appendChild(makeSlot(z,true));zones.appendChild(z);});}
    else if(mode==='match'){shuffle(t.pairs.map(p=>p[0])).forEach(term=>chips.push(makeChip(term,{})));
      shuffle(t.pairs.slice()).forEach(p=>{const z=el('div','zone');z.dataset.correct=p[0];z.appendChild(el('div','zlabel',p[1]));z.appendChild(makeSlot(z,true));zones.appendChild(z);});}
    else{const groups=Object.keys(t.groups);let all=[];groups.forEach(g=>t.groups[g].forEach(v=>all.push({v,g})));
      shuffle(all).forEach(it=>chips.push(makeChip(it.v,{grp:it.g})));
      groups.forEach(g=>{const z=el('div','zone catbox');z.dataset.group=g;z.appendChild(el('div','zlabel','<b>'+g+'</b>'));z.appendChild(makeSlot(z,false));zones.appendChild(z);});}
    chips.forEach(c=>pool.appendChild(c));host.appendChild(pool);host.appendChild(zones);
    function check(silent){if(cell.done)return;if(pool.children.length){if(!silent)setFB('Najprv umiestni všetky kartičky.',false);return;}
      let ok=true;[...zones.children].forEach(z=>{const ch=z.querySelector('.zslot').children;let zok=true;
        if(mode==='order'){zok=ch.length===1&&(+ch[0].dataset.idx===+z.dataset.slot);}
        else if(mode==='match'){zok=ch.length===1&&(ch[0].textContent===z.dataset.correct);}
        else{zok=[...ch].every(c=>c.dataset.grp===z.dataset.group);if(!ch.length)zok=true;}
        z.classList.add(zok?'ok':'bad');if(!zok)ok=false;});
      if(!ok){host.appendChild(el('div','answer show',solutionText(t,mode)));}record(cell,ok);}
    cell._check=()=>check(false);cell.autoEval=function(){if(!cell.done&&!pool.children.length)check(true);};
    cell.refreshControls=function(){if(cell.done)navButtons([]);else navButtons([{label:'Skontrolovať (Enter)',cls:'btn-pri',on:()=>check(false)}]);};
  }
  function solutionText(t,mode){
    if(mode==='order')return '<b>Správne poradie:</b> '+t.items.map((v,i)=>(i+1)+') '+v).join('  ·  ');
    if(mode==='match')return '<b>Správne dvojice:</b><br>'+t.pairs.map(p=>'• '+p[0]+' → '+p[1]).join('<br>');
    return '<b>Správne zaradenie:</b><br>'+Object.keys(t.groups).map(g=>'• <b>'+g+':</b> '+t.groups[g].join(', ')).join('<br>');
  }

    else if(e.code==='Space'&&cur.isFlash&&!cur.revealed){e.preventDefault();cur._reveal&&cur._reveal();}

{num:1,label:`P1 Úvod KD`,name:`Úvod do získavania znalostí`,reading:`<h2>Téma 1: Úvod do získavania znalostí</h2>

<h3>1. Paradox dát a znalostí</h3>
<p>Dnešná doba je charakteristická obrovským <strong>množstvom elektronicky dostupných dát</strong>, ale paradoxne <strong>nedostatkom znalostí</strong>. Firmy zhromažďujú gigabajty logov, transakcií a textov, ale samotné záznamy majú <em>slabú výpovednú hodnotu</em>. Surové dáta nepovedia, prečo zákazník odišiel ani ktoré stránky vedú k nákupu. Z tohto paradoxu sa zrodil koncept <strong>objavovania znalostí</strong> (Knowledge Discovery).</p>

<h3>2. Definícia objavovania znalostí ako procesu</h3>
<p>Objavovanie znalostí chápeme ako <strong>proces</strong>, ktorý zahŕňa päť na seba nadväzujúcich fáz:</p>
<ol>
  <li><strong>Výber dát</strong> — určenie, ktorá podmnožina záznamov je relevantná pre cieľ analýzy.</li>
  <li><strong>Predspracovanie dát</strong> — čistenie, odstránenie šumu, doplnenie chýbajúcich hodnôt, identifikácia entít.</li>
  <li><strong>Transformácia dát</strong> — prevedenie do formy vhodnej pre dolovacie algoritmy (agregácie, sedenia, vektory).</li>
  <li><strong>Analýza dát</strong> — aplikácia algoritmov data miningu (asociačné a sekvenčné pravidlá, klastrovanie, klasifikácia).</li>
  <li><strong>Interpretácia výsledkov</strong> — preklad nájdených vzorov do akčných znalostí pre rozhodovateľa.</li>
</ol>
<p>Tento proces je <strong>iteratívny</strong> — výsledky interpretácie často ukážu, že treba vrátiť sa späť, vybrať iné dáta alebo zvoliť inú transformáciu.</p>

<h3>3. Tri vetvy objavovania znalostí</h3>
<p>Podľa zdroja dát rozlišujeme tri základné oblasti:</p>
<ul>
  <li><strong>KDD — Knowledge Discovery in Databases</strong>. Pracuje so štruktúrovanými dátami v relačných databázach a dátových skladoch (transakcie, evidencie, zákaznícke záznamy).</li>
  <li><strong>Text Mining — Knowledge Discovery from Texts</strong>. Extrakcia znalostí z neštruktúrovaných textov (dokumenty, e-maily, recenzie). Vyžaduje špecifické techniky ako tokenizáciu, lematizáciu a vektorizáciu.</li>
  <li><strong>Web Mining — Knowledge Discovery from Web</strong>. Analýza dát súvisiacich s webom — obsahu, štruktúry odkazov a správania používateľov.</li>
</ul>

<h3>4. Tri vetvy Web Miningu</h3>
<p>Web Mining môžeme definovať ako <strong>extrakciu zaujímavých a potenciálne užitočných znalostí a informácií z aktivít súvisiacich s webom</strong>. Delí sa na tri vetvy podľa toho, čo je vstupom:</p>
<ul>
  <li><strong>Web Content Mining</strong> — vstupom je <em>obsah stránok</em> (HTML, text, obrázky). Príklad: analýza sentimentu recenzií, klasifikácia článkov.</li>
  <li><strong>Web Structure Mining</strong> — vstupom je <em>hyperlinkový graf</em> medzi stránkami. Najznámejší príklad je algoritmus <strong>PageRank</strong> používaný spoločnosťou Google, ktorý určuje dôležitosť stránky podľa toho, kto na ňu odkazuje.</li>
  <li><strong>Web Log Mining (Web Usage Mining, WUM)</strong> — vstupom sú <em>logy návštev</em> webového servera. Cieľom je <strong>analýza správania sa používateľov pri prechádzaní webu</strong>.</li>
</ul>

<h3>5. Princíp objavovania znalostí — pyramída hodnoty</h3>
<p>Hodnota informácie rastie, keď ju spracovávame od surovej formy k akčnej. Tento princíp ilustruje pyramída:</p>
<pre><code>             AKČNÉ ZNALOSTI       ← použiteľné pravidlá rozhodovania
                  ▲
               ZNALOSTI             ← sekvenčné a asociačné pravidlá
                  ▲
              INFORMÁCIE            ← agregácie (počet návštev, priemerná dĺžka)
                  ▲
                DÁTA                ← surové záznamy o používaní webu</code></pre>
<p>Príklad pyramídy v praxi: <em>surové riadky Apache logu</em> sú dáta. Keď ich zoskupíme do sedení a vypočítame priemernú dĺžku, získame <em>informácie</em>. Keď nájdeme vzor „kto navštívi A, navštívi aj B", máme <em>znalosť</em>. Keď z toho vyrobíme pravidlo „zobraz B v menu hneď po A", dostávame <strong>akčnú znalosť</strong>.</p>

<h3>6. Web Log Mining — cieľ a podstata</h3>
<p>Cieľom Web Log Miningu je pochopiť, <strong>ako sa ľudia po webe pohybujú</strong> — nie čo je na stránkach, ale ako ich používajú. Typické otázky:</p>
<ul>
  <li>Ktoré stránky vedú k nákupu, registrácii alebo opačne k odchodu?</li>
  <li>Aké sú typické navigačné cesty (sekvencie kliknutí)?</li>
  <li>Ako kategorizovať návštevníkov podľa ich správania?</li>
</ul>
<p>Vstupom je <strong>prístupový log</strong> webového servera (napr. Apache access log), kde každý riadok zachytáva jednu HTTP požiadavku — IP adresu klienta, čas, URL, status kód, referrer a user-agent.</p>

<h3>7. Tri fázy procesu Web Log Miningu</h3>
<p>Proces WUM sa formálne rozdeľuje do troch základných častí, ktoré nasledujú za sebou:</p>
<ol>
  <li><strong>Data Preprocessing (predspracovanie dát)</strong> — čistenie logu od šumu (statické súbory, roboty), identifikácia <em>používateľov</em> a <em>sedení</em>, doplnenie chýbajúcich ciest cez referrer. Táto fáza typicky tvorí <strong>60–80 % času</strong> celého projektu.</li>
  <li><strong>Pattern Discovery (objavovanie vzorov)</strong> — aplikácia algoritmov: asociačné pravidlá (ktoré stránky sa navštevujú spolu), sekvenčné pravidlá (v akom poradí), klastrovanie sedení, klasifikácia.</li>
  <li><strong>Pattern Analysis (analýza vzorov)</strong> — štatistické testy, interpretácia, vizualizácia a sumarizácia nájdených vzorov pre používateľa.</li>
</ol>
<p><strong>Prečo je preprocessing kritický:</strong> bez čistenia by vzory boli skreslené robotmi a obrázkami; bez identifikácie sedení by sa hľadali cesty cez celé týždne; bez doplnenia ciest by pravidlá mali medzery. Kvalita znalostí v fáze 3 je priamo determinovaná kvalitou prípravy v fáze 1.</p>

<h3>8. CRISP-DM ako referenčná metodika</h3>
<p><strong>CRISP-DM</strong> (Cross-Industry Standard Process for Data Mining) je všeobecná, doménovo neutrálna metodika pre projekty data miningu. Stala sa de facto štandardom a slúži ako referenčný rámec aj pre Web Log Mining. CRISP-DM má <strong>6 fáz</strong>:</p>
<ol>
  <li><strong>Business Understanding</strong> — pochopenie obchodných cieľov a preklad do dolovacej úlohy.</li>
  <li><strong>Data Understanding</strong> — prvotné preskúmanie dát, ich kvality a rozsahu.</li>
  <li><strong>Data Preparation</strong> — čistenie, transformácia, integrácia (najzdĺhavejšia fáza).</li>
  <li><strong>Modeling</strong> — výber a aplikácia dolovacích algoritmov.</li>
  <li><strong>Evaluation</strong> — vyhodnotenie modelu vzhľadom na obchodné ciele.</li>
  <li><strong>Deployment</strong> — nasadenie znalostí do reálnej prevádzky.</li>
</ol>
<p>CRISP-DM je <strong>cyklická</strong> — zistenia v Evaluation často vedú späť do Business Understanding alebo Data Preparation. Práve preto sa nehovorí o lineárnom postupe, ale o procese.</p>

{num:2,label:`P2 Zdroje dát I`,name:`Zdroje dát I — DB, text, web`,reading:`<h2>Téma 2: Zdroje dát I — Databázy, text, web</h2>

<p>Pri objavovaní znalostí nepracujeme so vzduchom. Potrebujeme <strong>surovinu</strong> — dáta. Existujú tri základné kategórie zdrojov, z ktorých sa dá ťažiť: <strong>databázy</strong>, <strong>texty</strong> a <strong>web</strong>. Každá kategória má vlastnú štruktúru, vlastné výzvy a vlastné techniky prípravy.</p>

<h3>1. Tri kategórie zdrojov dát</h3>

<ul>
<li><strong>Databázy</strong> — štruktúrované, relačné, dobre definované schémy.</li>
<li><strong>Text</strong> — kolekcie elektronických dokumentov, neštruktúrovaný prirodzený jazyk.</li>
<li><strong>Web</strong> — obsah stránok, mapa webu (linková štruktúra) a logovacie súbory (správanie používateľov).</li>
</ul>

<p>Pre každú kategóriu platí, že dáta sa nedajú použiť priamo — najprv ich treba <strong>extrahovať, vyčistiť a transformovať</strong> do formy vhodnej pre algoritmy strojového učenia.</p>

<h3>2. Typy databáz</h3>

<p>Databázy ako zdroj dát rozdeľujeme do troch skupín podľa účelu a prístupu:</p>

<ol>
<li><strong>Produkčné databázy (OLTP)</strong> — Online Transaction Processing. Slúžia každodennej prevádzke (banka, e-shop, nemocnica). Sú optimalizované na <strong>rýchle zápisy a krátke transakcie</strong>. Obsahujú aktuálny stav, často sú normalizované a neukladajú historický kontext.</li>
<li><strong>Dátové sklady (OLAP)</strong> — Online Analytical Processing. Slúžia <strong>analýze a rozhodovaniu</strong>. Sú optimalizované na čítanie a komplexné agregačné dotazy nad veľkými objemami dát.</li>
<li><strong>Verejné databázy</strong> — voľne dostupné štatistické zdroje, ktoré dopĺňajú interné dáta organizácie o vonkajší kontext.</li>
</ol>

<h3>3. Štyri vlastnosti dátového skladu</h3>

<p>Dátový sklad nie je len „veľká databáza". Definuje ho štvorica vlastností (podľa W. Inmona):</p>

<ul>
<li><strong>Subjektovo orientovaný</strong> — dáta sú organizované okolo predmetu záujmu (zákazník, produkt, predaj), nie okolo aplikácie, ktorá ich vytvorila.</li>
<li><strong>Integrovaný</strong> — dáta z rôznych zdrojov sú zjednotené v <strong>spoločnom formáte</strong> (rovnaké kódovanie pohlavia, rovnaká mena, rovnaký dátumový formát).</li>
<li><strong>Časovo premenný</strong> — každý záznam má časovú dimenziu. Sklad uchováva <strong>históriu</strong>, nie len aktuálny stav. Vieme sa pozrieť, ako vyzeral biznis pred rokom.</li>
<li><strong>Nemenný (non-volatile)</strong> — raz vložené dáta sa nemenia a nemažú. Robia sa len <strong>nahrávania</strong> a čítania. Vďaka tomu sú analýzy reprodukovateľné.</li>
</ul>

<h3>4. Trojvrstvová architektúra dátového skladu</h3>

<p>Typický dátový sklad má tri vrstvy:</p>

<ol>
<li><strong>Zdrojová vrstva</strong> — produkčné databázy, externé súbory, verejné registre.</li>
<li><strong>Vrstva skladu (ETL + úložisko)</strong> — proces Extract-Transform-Load dáta načíta, vyčistí, integruje a uloží do skladu v hviezdicovej alebo snehovej schéme.</li>
<li><strong>Prezentačná vrstva</strong> — OLAP kocky, reporty, dashboardy, nástroje pre data mining.</li>
</ol>

<p>Príklad: <strong>databáza banky + RegDat</strong> — banka spojí svoje interné dáta o klientoch s verejnými regionálnymi štatistikami a vie skórovať riziko podľa regiónu.</p>

<h3>5. Verejné databázy</h3>

<ul>
<li><strong>DATAcube</strong> — verejná databáza Štatistického úradu SR, multidimenzionálne kocky.</li>
<li><strong>RegDat</strong> — regionálna databáza ŠÚ SR, údaje na úrovni okresov a krajov.</li>
<li><strong>STATdat</strong> — databáza Štatistického úradu so širokou paletou ukazovateľov.</li>
<li><strong>Eurostat</strong> — európska štatistická databáza, porovnateľné údaje za krajiny EÚ.</li>
</ul>

<h3>6. Text ako zdroj dát</h3>

<p>Text je <strong>neštruktúrovaný</strong> — neexistuje pevná schéma. Typické kolekcie elektronických dokumentov:</p>

<ul>
<li><strong>Kvalifikačné práce</strong> — bakalárske, diplomové, dizertačné.</li>
<li><strong>Lekárske správy</strong> popisujúce symptómy pacientov.</li>
<li><strong>Otvorené odpovede v dotazníkoch</strong>.</li>
<li><strong>Webový obsah</strong> — stránky, tweety, statusy, blogy, diskusie.</li>
</ul>

<h3>7. Web ako zdroj dát</h3>

<p>Web ponúka tri rôzne pohľady:</p>

<ul>
<li><strong>Obsah</strong> — samotný text a multimédiá na stránkach (web content mining).</li>
<li><strong>Mapa webu</strong> — linková štruktúra medzi stránkami (web structure mining).</li>
<li><strong>Logovacie súbory</strong> — záznamy o tom, kto, kedy a čo na webe robil (web usage mining).</li>
</ul>

<h3>8. Vektorová reprezentácia textu</h3>

<p>Algoritmy nevedia pracovať so „surovým" textom. Text musíme previesť do <strong>číselného vektora</strong>. Dokument sa reprezentuje ako vektor váh slov. Najjednoduchšia váha je <strong>frekvencia výskytu</strong> slova v dokumente — označuje sa <code>wf</code> (word frequency).</p>

<p>Existujú tri základné lokálne váhy:</p>

<pre><code>1) word frequency:    f(wf) = wf
2) binary frequency:  f(wf) = 1, ak wf > 0;  inak 0
3) log frequency:     f(wf) = 1 + log10(wf), ak wf > 0;  inak 0</code></pre>

<p><strong>Prečo logaritmus?</strong> Surová frekvencia preceňuje časté slová — ak sa slovo vyskytne 100-krát, neznamená to, že je 100-krát dôležitejšie ako slovo s jedným výskytom. Logaritmická transformácia tento efekt <strong>tlmí</strong>.</p>

<h3>9. IDF a TF-IDF</h3>

<p>Lokálna frekvencia nestačí. Slovo „a" alebo „je" sa vyskytuje vo všetkých dokumentoch a nerozlišuje ich. Potrebujeme váhu, ktorá zvýhodní <strong>diskriminatívne</strong> (zriedkavé) slová. To rieši <strong>inverzná dokumentová frekvencia</strong>:</p>

<pre><code>IDF_i = log10( N / df_i )</code></pre>

<p>kde <strong>N</strong> je počet dokumentov v kolekcii a <strong>df_i</strong> je počet dokumentov, v ktorých sa i-te slovo vyskytuje (document frequency). Ak sa slovo nachádza vo všetkých dokumentoch (df = N), potom IDF = log(1) = 0 — slovo nemá rozlišovaciu silu. Ak je slovo veľmi zriedkavé, IDF je vysoké.</p>

<p>Spojením lokálnej a globálnej váhy dostaneme <strong>TF-IDF</strong>:</p>

<pre><code>w_ij = (1 + log10(tf_ij)) * log10(N / df_i),  ak tf_ij > 0
w_ij = 0,                                     ak tf_ij = 0</code></pre>

<p>kde <strong>tf_ij</strong> je počet výskytov i-teho (kmeňového) slova v j-tom dokumente, <strong>df_i</strong> je počet dokumentov obsahujúcich i-te slovo a <strong>N</strong> je veľkosť kolekcie. TF-IDF dáva vysokú váhu slovám, ktoré sú časté <strong>v jednom dokumente</strong>, ale zriedkavé <strong>v celej kolekcii</strong> — presne také slová najlepšie charakterizujú obsah dokumentu.</p>

<h3>10. Stemming — redukcia na kmeň</h3>

<p>V prirodzenom jazyku majú slová rôzne tvary: „učiteľ", „učitelia", „učiteľov", „učiteľský". Pre algoritmus sú to štyri rôzne reťazce, hoci nesú rovnaký význam. <strong>Stemming</strong> orezáva slová na ich spoločný <strong>kmeň</strong> (napr. „učit-"), čím sa redukuje rozmer slovníka a posilní signál. Stemming je pravidlový a rýchly — neberie ohľad na slovník, len odsekáva typické prípony.</p>

<li><strong>OLTP vs OLAP</strong>: produkčné DB pre transakcie, dátové sklady pre analýzu; sklad je subjektovo orientovaný, integrovaný, časovo premenný a nemenný.</li>
<li><strong>Verejné databázy</strong> (DATAcube, RegDat, STATdat, Eurostat) dopĺňajú interné dáta o vonkajší kontext.</li>

{num:3,label:`P3 Zdroje dát II`,name:`Zdroje dát II — reprezentácia textu, log súbory`,reading:`<h2>Prednáška 3: Zdroje dát II — reprezentácia textu, log súbory</h2>

<p>Druhá časť o zdrojoch dát rieši dva typy <strong>neštruktúrovaných dát</strong>: <strong>textové dokumenty</strong> a <strong>log súbory webových serverov</strong>. Obe sa pred analýzou musia previesť do tabuľkového tvaru — text reprezentáciou cez termy, log parsovaním pevného formátu.</p>

<h3>1. Reprezentácia textu — transakčný a sekvenčný model</h3>

<p>Text v prirodzenej forme (vety, odseky) sa pre dolovanie znalostí transformuje do jedného z dvoch modelov.</p>

<p><strong>Transakčný model (bag-of-words):</strong> dokument = množina termov bez poradia. Každý dokument je riadok, každý term je stĺpec, v bunke je váha (frekvencia alebo TF-IDF). Stráca sa informácia o poradí slov, ale model je jednoduchý a vhodný pre klasifikáciu, klastrovanie a asociačné pravidlá.</p>

<p><strong>Sekvenčný model:</strong> dokument = postupnosť termov v pôvodnom poradí. Zachováva sa kontext (napríklad „nie dobrý“ vs. „dobrý nie“), čo je nutné pre sekvenčné pravidlá, n-gramy a jazykové modely. Cena je vyššia výpočtová a pamäťová náročnosť.</p>

<p><strong>Váženie TF-IDF</strong> v transakčnom modeli kombinuje lokálnu a globálnu váhu termu:</p>

<pre><code>TF(t,d) = počet výskytov termu t v dokumente d
IDF(t)  = log10(N / df(t))
TF-IDF(t,d) = TF(t,d) × IDF(t)

N    = počet všetkých dokumentov
df(t) = počet dokumentov obsahujúcich term t</code></pre>

<p>Princíp: zriedkavé termy (malé <code>df</code>) dostanú vyššiu váhu, lebo viac diskriminujú dokumenty. Slová ako „a“, „je“, „v“ sa nachádzajú všade a ich IDF je blízke nule.</p>

<h3>2. Predspracovanie textu — od reťazca k termu</h3>

<p>Surový text prejde sériou krokov, kým sa stane riadkom v dátovej matici:</p>

<ol>
<li><strong>Tokenizácia</strong> — rozdelenie textu na slová (tokeny) podľa medzier a interpunkcie.</li>
<li><strong>Odstránenie stop-slov</strong> — vyhodenie funkčných slov bez sémantickej hodnoty (spojky, predložky, zámená).</li>
<li><strong>Lematizácia alebo stemming</strong> — zjednotenie tvarov toho istého slova.</li>
<li><strong>POS tagging</strong> — priradenie slovného druhu (voliteľný krok pred lematizáciou).</li>
<li><strong>Vektorizácia</strong> — termy sa nahradia číselnými váhami (TF, TF-IDF).</li>
</ol>

<h3>3. Lematizácia vs. stemming</h3>

<p>Obe metódy redukujú flektívne tvary slova na jeden základný tvar, ale líšia sa princípom.</p>

<p><strong>Stemming</strong> mechanicky orezáva sufix podľa pravidiel. Je rýchly, jednoduchý, ale produkuje aj nereálne korene a robí chyby pri nepravidelných slovách.</p>

<pre><code>učiteľmi  → učit
učiteľka  → učitel
behám     → beh
beží      → bež    (rovnaké sloveso, iný stem!)</code></pre>

<p><strong>Lematizácia</strong> vyhľadáva základný tvar (<strong>lemu</strong>) v slovníku. Je presnejšia, ale potrebuje jazykový slovník a často aj POS tag, lebo rovnaký tvar môže byť rôzny slovný druh.</p>

<pre><code>učiteľmi  → učiteľ   (substantívum, lema = nominatív sg.)
učila     → učiť     (sloveso, lema = infinitív)
behám     → bežať
beží      → bežať    (správne zjednotené)</code></pre>

<p>Pre slovenčinu — silne flektívny jazyk s bohatou morfológiou — je lematizácia výrazne kvalitnejšia ako stemming.</p>

<h3>4. POS tagging a 5-pozičný tag substantíva</h3>

<p><strong>POS tagging</strong> (Part-Of-Speech) priradí každému tokenu slovný druh (substantívum, sloveso, prídavné meno, …). V slovenčine sa používa <strong>poziciový tag</strong>, kde každá pozícia kóduje jednu morfologickú kategóriu.</p>

<p>Pre <strong>substantíva</strong> má tag <strong>5 pozícií</strong>:</p>

<ol>
<li><strong>Slovný druh</strong> — S (substantívum)</li>
<li><strong>Paradigma</strong> — vzor skloňovania (chlap, dub, žena, mesto, …)</li>
<li><strong>Rod</strong> — mužský / ženský / stredný (m / f / n)</li>
<li><strong>Číslo</strong> — jednotné / množné (s / p)</li>
<li><strong>Pád</strong> — 1–6 (nominatív až lokál; inštrumentál je 7. v iných školách, slovenský tagset používa 6)</li>
</ol>

<p>Príklad: <code>učiteľmi</code> → <code>SSmpi</code> (Substantívum, vzor chlap, mužský rod, plurál, inštrumentál). Tag plne určí gramatickú funkciu slova vo vete a umožní strojovú lematizáciu.</p>

<h3>5. Apache Combined Log Format</h3>

<p>Webové servery zaznamenávajú každú HTTP požiadavku do textového súboru — <strong>access logu</strong>. Najrozšírenejší formát je <strong>Apache Combined Log Format</strong>:</p>

<pre><code>IP - - [DateTime] "Method URL HTTP/Version" StatusCode Bytes "Referrer" "User-Agent"</code></pre>

<p>Konkrétny záznam:</p>

<pre><code>178.41.1.187 - - [16/Dec/2019:18:16:26 +0100]
"GET /studium/akreditovane-programy HTTP/1.1" 200 15364
"http://www.ukf.sk/studium"
"Mozilla/5.0 (Windows NT 5.1; rv:1.9.2.13) Firefox/3.6.13"</code></pre>

<p>Polia logu:</p>
<ul>
<li><strong>IP</strong> — sieťová adresa klienta</li>
<li><strong>DateTime</strong> — čas prijatia požiadavky vrátane časovej zóny</li>
<li><strong>Method</strong> — GET (čítanie), POST (odoslanie formulára), HEAD (iba hlavičky)</li>
<li><strong>URL</strong> — žiadaný zdroj</li>
<li><strong>StatusCode</strong> — 2xx úspech, 3xx presmerovanie, 4xx chyba klienta, 5xx chyba servera</li>
<li><strong>Bytes</strong> — veľkosť odpovede</li>
<li><strong>Referrer</strong> — URL stránky, z ktorej klient prišiel (znak „-“ ak chýba)</li>
<li><strong>User-Agent</strong> — identifikácia prehliadača a operačného systému</li>
</ul>

<p>Apache log je <strong>pasívny záznam</strong> — server zapíše iba prijatú požiadavku. Nevie, čo užívateľ na stránke robí (scrollovanie, čas čítania, kliky na nelinkované elementy). Toto je fundamentálne obmedzenie analýzy zo serverového logu.</p>

<h3>6. Tri typy pripojenia klienta k serveru</h3>

<p>Spôsob, akým sa klient pripojí k webovému serveru, ovplyvňuje, čo IP adresa v logu reálne reprezentuje.</p>

<ol>
<li><strong>Priame pripojenie do internetu</strong> — klient komunikuje so serverom priamo. IP v logu = skutočná IP zariadenia. Najčistejší prípad.</li>
<li><strong>Pripojenie cez proxy server</strong> — všetka komunikácia ide cez sprostredkujúci server. V logu vidíme <strong>IP proxy</strong>, nie pôvodného klienta. Viac užívateľov za jednou proxy splynie do jednej IP.</li>
<li><strong>Pripojenie cez vyrovnávač záťaže (load balancer)</strong> — záťaž sa rozkladá medzi viacero serverov. Klient nevidí konkrétny server, server nevidí klienta priamo. Bez nastavenia hlavičky <code>X-Forwarded-For</code> sa v logu nezobrazí skutočná IP klienta.</li>
</ol>

<p>Dôsledok: <strong>jedna IP v logu nie je jednoznačná identifikácia užívateľa</strong>. Preto sa pre identifikáciu používateľa kombinuje <strong>IP + User-Agent</strong> — kompromis medzi presnosťou a dostupnosťou údajov.</p>

<h3>7. Mapa webu</h3>

<p><strong>Mapa webu</strong> je graf hyperlinkov medzi stránkami portálu: kde z ktorej stránky vedie odkaz. Buduje sa buď z HTML obsahu (crawler prejde web), alebo zo samotného logu — pre každú URL sa zoberie <strong>najčastejší Referrer</strong> ako jej kanonický „rodič“.</p>

<p>Využitie pri Web Usage Mining: ak v sekvencii prístupov jedného sedenia chýba medzistránka (užívateľ kliknul „späť“ a prehliadač zobrazil stránku z lokálnej cache bez požiadavky na server), mapa webu umožní <strong>rekonštruovať chýbajúci krok</strong>: medzi prístupom na A a C sa vloží pravdepodobná medzistránka B podľa <code>parent[C] = B</code>.</p>

<h3>8. robots.txt</h3>

<p>Súbor <code>robots.txt</code> sa nachádza v koreni domény (napr. <code>www.ukf.sk/robots.txt</code>) a obsahuje pravidlá pre <strong>vyhľadávacie roboty</strong> — ktoré sekcie smú indexovať a ktoré nie. Štandard <em>Robots Exclusion Protocol</em>.</p>

<p>Kľúčové pozorovanie pre WUM: <strong>bežný používateľ tento súbor nikdy nevidí</strong> — neexistuje naňho odkaz, prehliadač ho nestiahne. Preto platí pravidlo: <strong>každá IP, ktorá si stiahla robots.txt, je s vysokou pravdepodobnosťou robot</strong>. Slúži ako prvý heuristický filter na odstránenie crawlerov pred analýzou. Druhý filter sa robí cez User-Agent (kľúčové slová <code>bot</code>, <code>crawl</code>, <code>spider</code>).</p>

<h3>9. Anonymizácia IP adresy</h3>

<p>IP adresa je <strong>osobný údaj</strong> podľa GDPR — v kombinácii s ďalšími údajmi (časom, User-Agent) môže identifikovať konkrétnu fyzickú osobu. Pred publikovaním alebo dlhodobým ukladaním logov je nutná <strong>anonymizácia</strong>.</p>

<p>Bežné techniky:</p>
<ul>
<li><strong>Vynulovanie posledného oktetu</strong> — <code>178.41.1.187</code> → <code>178.41.1.0</code>. Zachová geografickú a sieťovú informáciu, eliminuje konkrétne zariadenie.</li>
<li><strong>Hashovanie</strong> — IP sa nahradí kryptografickým hashom (napríklad SHA-256). Rovnaká IP dá rovnaký hash, čo umožní identifikovať toho istého návštevníka bez znalosti reálnej IP.</li>
<li><strong>Pseudonymizácia</strong> — IP sa nahradí umelým identifikátorom (USER_ID), pôvodný údaj sa vymaže.</li>
</ul>

<p>Anonymizácia <strong>nesmie</strong> byť reverzibilná bez kľúča — inak GDPR požiadavku nesplní.</p>

{num:4,label:`P4 Proces KD`,name:`Proces objavovania znalostí — metodiky`,reading:`<h2>Téma 4: Proces objavovania znalostí — metodiky</h2>

<p>Objavovanie znalostí (Knowledge Discovery, KD) nie je jednorazová analýza, ale <strong>opakovateľný proces</strong>. Aby bol predvídateľný, dokumentovateľný a porovnateľný medzi tímami, vznikli štandardizované <strong>metodiky</strong> — recepty, ktoré hovoria, aké fázy musí KD projekt prejsť a v akom poradí. Táto prednáška predstavuje štyri najznámejšie metodiky (CRISP-DM, 5A, SEMMA, Six Sigma DMAIC), špecifickú metodiku pre Web Usage Mining a vzťah KD k vizuálnej percepcii.</p>

<h3>1. CRISP-DM — najrozšírenejšia metodika</h3>

<p><strong>CRISP-DM</strong> (Cross-Industry Standard Process for Data Mining) je odvetvovo nezávislý štandard pre data mining projekty. Má <strong>šesť fáz</strong>, ktoré sa navzájom prelínajú a tvoria <em>cyklus</em>, nie lineárnu postupnosť — z ktorejkoľvek fázy sa dá vrátiť späť, ak zistíme problém.</p>

<ol>
<li><strong>Business Understanding</strong> — porozumenie biznisu. Definuje sa cieľ projektu z pohľadu organizácie (napr. „znížiť odchody zákazníkov o 10 %") a prekladá sa do analytického cieľa.</li>
<li><strong>Data Understanding</strong> — porozumenie dátam. Zber dostupných dát, prvotná deskripcia, kontrola kvality, prvé hypotézy.</li>
<li><strong>Data Preparation</strong> — príprava dát. Selekcia, čistenie, transformácie, odvodené premenné, integrácia z viacerých zdrojov. <strong>Časovo najnáročnejšia fáza</strong> — typicky tvorí <strong>60 až 80 % celkového času</strong> projektu.</li>
<li><strong>Modeling</strong> — modelovanie. Výber a aplikácia analytických metód (klasifikácia, klastrovanie, asociačné pravidlá), ladenie parametrov. <strong>Analyticky najnáročnejšia fáza.</strong></li>
<li><strong>Evaluation</strong> — vyhodnotenie. Posudzuje sa nielen presnosť modelu, ale aj to, či výsledok napĺňa pôvodný biznisový cieľ.</li>
<li><strong>Deployment</strong> — nasadenie. Integrácia modelu do prevádzky, dokumentácia, monitoring, plán údržby.</li>
</ol>

<p><strong>Princíp:</strong> CRISP-DM oddeľuje <em>biznisovú rovinu</em> (fázy 1 a 6) od <em>technickej roviny</em> (fázy 2–5). Bez fázy 1 by sme riešili „pekný model bez účelu"; bez fázy 6 by model zostal v notebooku a nikdy by neprodukoval hodnotu.</p>

<h3>2. 5A — kompaktná alternatíva</h3>

<p>Metodika <strong>5A</strong> zhŕňa proces do piatich krokov začínajúcich písmenom A:</p>
<ul>
<li><strong>Assess</strong> — posúdiť (definovať problém, ciele)</li>
<li><strong>Access</strong> — sprístupniť dáta (zber, integrácia)</li>
<li><strong>Analyze</strong> — analyzovať (modelovanie, interpretácia)</li>
<li><strong>Act</strong> — konať (rozhodnutie na základe výsledku)</li>
<li><strong>Automate</strong> — automatizovať (rutinné nasadenie do prevádzky)</li>
</ul>
<p>5A oproti CRISP-DM zdôrazňuje krok <em>Act</em> — výsledok analýzy musí viesť k <strong>akcii</strong>, nielen ku správe. Posledný krok <em>Automate</em> zase odráža potrebu opakovateľnosti v produkčnom prostredí.</p>

<h3>3. SEMMA — metodika SAS Institute</h3>

<p><strong>SEMMA</strong> bola navrhnutá spoločnosťou SAS a sústreďuje sa primárne na <em>technickú</em> stranu analýzy (chýba jej explicitná biznisová fáza). Päť krokov:</p>
<ul>
<li><strong>Sample</strong> — výber vzorky reprezentatívnej podmnožiny dát</li>
<li><strong>Explore</strong> — prieskum dát (vizualizácie, deskriptívna štatistika)</li>
<li><strong>Modify</strong> — úprava (čistenie, transformácie, tvorba premenných)</li>
<li><strong>Model</strong> — modelovanie (aplikácia analytických techník)</li>
<li><strong>Assess</strong> — posúdenie kvality výsledkov</li>
</ul>
<p><strong>Rozdiel oproti CRISP-DM:</strong> SEMMA nepokrýva Business Understanding ani Deployment — predpokladá, že tieto rieši okolitý proces. Je vhodná pre tímy, ktoré dostávajú zadanie a odovzdávajú model.</p>

<h3>4. Six Sigma DMAIC</h3>

<p><strong>DMAIC</strong> pochádza z metodiky riadenia kvality <strong>Six Sigma</strong> a využíva sa najmä pri zlepšovaní existujúcich procesov:</p>
<ul>
<li><strong>Define</strong> — definovať problém a cieľ</li>
<li><strong>Measure</strong> — merať aktuálny stav (zber dát, metriky)</li>
<li><strong>Analyze</strong> — analyzovať príčiny variability a defektov</li>
<li><strong>Improve</strong> — zlepšiť proces (návrh a otestovanie zmien)</li>
<li><strong>Control</strong> — kontrolovať (zaviesť stabilizačné mechanizmy, aby sa problém nevrátil)</li>
</ul>
<p>DMAIC je silnejší v oblasti <em>štatistickej kontroly procesu</em> a hodí sa, keď KD slúži ako nástroj pre <strong>kontinuálne zlepšovanie kvality</strong> (výroba, služby).</p>

<h3>5. Časová náročnosť fáz</h3>

<p>Bez ohľadu na konkrétnu metodiku platí empirické pravidlo o rozložení úsilia v KD projekte:</p>
<pre><code>Data Preparation  →  60 – 80 %  času  (Časovo náročná fáza)
Modeling           →   ~10 %      času  (Analyticky náročná fáza)
Evaluation         →   ~10 %      času
Ostatné fázy       →   zvyšok</code></pre>
<p><strong>Princíp:</strong> Hodnota modelu je daná kvalitou vstupných dát. Surové dáta zo zdrojov sú vždy „špinavé" — obsahujú chyby, duplicity, chýbajúce hodnoty, šum, rôzne formáty. Pretransformovať ich na čistý analytický dataset je <strong>najdrahšia časť projektu</strong>. Modelovanie je voči tomu rýchle — algoritmy sú dostupné v knižniciach, ladenie parametrov je rutinné. Začínajúci analytici často podceňujú prípravu a preceňujú modelovanie; skúsenosť to obracia.</p>

<h3>6. WUM — metodika pre Web Usage Mining</h3>

<p>Pre špecifický prípad analýzy logov webových serverov sa používa trojfázová metodika <strong>WUM (Web Usage Mining)</strong>:</p>
<ol>
<li><strong>Preprocessing</strong> (predspracovanie) — čistenie logu, odstránenie statického obsahu a robotov, identifikácia užívateľov, identifikácia sedení, doplnenie chýbajúcich stránok. Toto je <em>ekvivalent fázy Data Preparation</em> v CRISP-DM a tvorí 60–80 % práce.</li>
<li><strong>Pattern Discovery</strong> (objavovanie vzorov) — hľadanie asociačných pravidiel (typu „kto pozrel A, pozrel aj B"), sekvenčných pravidiel (cesty po webe), klastrovanie užívateľov.</li>
<li><strong>Pattern Analysis</strong> (analýza vzorov) — štatistické testovanie významnosti nájdených vzorov, vizualizácia, interpretácia, návrh akcií.</li>
</ol>
<p>WUM teda kondenzuje šesť fáz CRISP-DM do troch, ale princíp zostáva: bez kvalitného preprocessingu nemajú objavené vzory zmysel — boli by skreslené šumom a robotmi.</p>

<h3>7. Vizuálna percepcia (VP) vs. Objavovanie znalostí (KD)</h3>

<p>Existujú dva odlišné spôsoby, ako z dát získavať poznatky. Treba ich rozlišovať:</p>

<p><strong>Výskumné plány</strong> (cenzus, výberové zisťovanie, experimentálne plány) sú <em>plánované</em>:</p>
<ul>
<li>cielené získavanie dát na konkrétnu otázku</li>
<li>merania a pozorovania sa robia podľa vopred stanoveného protokolu</li>
<li>použité metódy sú <strong>súčasťou plánu</strong> už pred zberom dát</li>
</ul>

<p><strong>Objavovanie znalostí</strong> (KDD, Text Mining, WUM, Web Content Mining, Web Structure Mining) je <em>sekundárna analýza</em>:</p>
<ul>
<li>pracuje s existujúcimi <strong>dátovými zdrojmi</strong> a <strong>veľkými dátami</strong></li>
<li>dáta vznikli na iný účel ako analýza (napr. log servera vznikol kvôli prevádzke)</li>
<li>použitie metód je <strong>formalizované</strong> až dodatočne</li>
</ul>

{num:5,label:`P5 CRISP-DM I`,name:`CRISP-DM I — Porozumenie problematike a dátam`,reading:`<h2>Téma 5: CRISP-DM I — Porozumenie problematike a dátam</h2>

<p>Metodika <strong>CRISP-DM</strong> (Cross-Industry Standard Process for Data Mining) rozdeľuje proces objavovania znalostí do šiestich fáz. Prvé dve — <strong>porozumenie problematike</strong> a <strong>porozumenie dátam</strong> — sú základom všetkého, čo sa stane neskôr. Bez správnej formulácie úlohy a poznania povahy dát budú aj najlepšie algoritmy produkovať nezmyselné výsledky.</p>

<h3>1. Porozumenie problematike — typy úloh objavovania znalostí</h3>

<p>Prvý krok je preložiť obchodný alebo výskumný cieľ do typu úlohy, ktorú vie data mining riešiť. Existuje <strong>šesť základných typov</strong>:</p>

<ol>
  <li><strong>Deskripcia dát a sumarizácia</strong> — kompaktný prehľad o dátach: priemery, mediány, rozdelenia, kontingenčné tabuľky. Cieľ je <em>opísať</em>, nie predikovať. Príklad: „aký je priemerný počet stránok na sedenie".</li>
  <li><strong>Segmentácia</strong> — rozdelenie populácie do homogénnych skupín (klastrov), ktoré nie sú vopred definované. Algoritmus sám nájde štruktúru. Príklad: zhlukovanie návštevníkov podľa správania.</li>
  <li><strong>Deskripcia konceptov</strong> — zrozumiteľný popis charakteristík vopred danej skupiny. Odpovedá na otázku „čím sa typický člen tejto triedy líši od ostatných?". Výstupom sú zvyčajne <strong>pravidlá</strong> alebo stromy.</li>
  <li><strong>Klasifikácia</strong> — priradenie nového objektu do jednej z <strong>vopred známych tried</strong>. Trieda je kategoriálna (áno/nie, A/B/C). Príklad: je tento prístup od robota alebo od človeka?</li>
  <li><strong>Predikcia</strong> — odhad <strong>numerickej</strong> hodnoty v budúcnosti alebo pri neznámom vstupe. Príklad: koľko stránok navštívi používateľ v sedení.</li>
  <li><strong>Analýza závislostí</strong> — hľadanie vzťahov medzi atribútmi alebo udalosťami. Patria sem <strong>asociačné pravidlá</strong> a <strong>sekvenčné vzory</strong>. Príklad: „kto navštívil stránku A, navštívil aj B".</li>
</ol>

<p><strong>Rozdiel klasifikácia vs. predikcia:</strong> obe priraďujú hodnotu novému objektu, ale klasifikácia vracia <em>diskrétnu triedu</em>, predikcia <em>spojité číslo</em>. <strong>Rozdiel segmentácia vs. klasifikácia:</strong> pri segmentácii triedy <em>nepoznáme dopredu</em> (učenie bez učiteľa), pri klasifikácii ich <em>poznáme</em> (učenie s učiteľom).</p>

<h3>2. Porozumenie dátam — dva svety zdrojov</h3>

<p>V kontexte objavovania znalostí o používaní webu existujú dva principiálne odlišné typy zdrojov dát:</p>

<ul>
  <li><strong>Informačné systémy</strong> — dáta majú <strong>vlastnú štruktúru</strong>, sú organizované v databáze (tabuľky, vzťahy, schémy). Príklad: e-shop ukladá objednávky do relačnej DB. Štruktúra je definovaná návrhárom systému, dotazujeme sa cez SQL.</li>
  <li><strong>Web/proxy servery</strong> — dáta majú <strong>spoločnú štandardnú textovú štruktúru</strong> (Apache Common/Combined Log Format). Každý webový server na svete loguje v rovnakom formáte, ale výstup je obyčajný text, nie databáza.</li>
</ul>

<p>Typický riadok Apache logu:</p>

<pre><code>178.41.1.187 - - [16/Dec/2019:18:16:26 +0100] "GET /studium/akreditovane-programy HTTP/1.1" 200 15364 "http://www.ukf.sk/studium" "Mozilla/5.0 (Windows; ...) Firefox/3.6.13"</code></pre>

<p>Tento riadok obsahuje <strong>sedem polí</strong>: IP adresa, identita (zvyčajne <code>-</code>), používateľ, časová pečiatka, požiadavka (metóda + URL + protokol), návratový kód, počet bajtov, referrer (odkiaľ klient prišiel) a User-Agent (identifikácia prehliadača). Apache log je <strong>pasívny záznam</strong> — server zapíše len to, čo dostane ako požiadavku. Nevidí scrollovanie, čas čítania ani kliknutia na nelinkované elementy.</p>

<h3>3. Šum v logu — prečo treba čistiť</h3>

<p>Surový log obsahuje obrovské množstvo záznamov, ktoré <strong>nereprezentujú navigáciu človeka</strong>. Pri otvorení jednej HTML stránky s 30 obrázkami prehliadač automaticky vyžiada všetkých 30 obrázkov plus CSS, JS, fonty — jedna návšteva tak generuje desiatky riadkov logu. Bez očistenia by priemerný „počet stránok na sedenie" bol nadhodnotený rádovo.</p>

<p>Pravidlá filtrovania:</p>
<ul>
  <li>Ponechávame iba metódu <code>GET</code> s návratovým kódom <strong>2xx</strong> (úspech) alebo <strong>3xx</strong> (presmerovanie).</li>
  <li>Odstraňujeme statické súbory (obrázky, CSS, JS, fonty).</li>
  <li>Odstraňujeme <code>4xx</code> (napr. 404 — neexistujúca stránka) a <code>5xx</code> (chyba servera).</li>
  <li>Odstraňujeme <code>POST</code> a <code>HEAD</code> — nie sú to navigácie.</li>
</ul>

<h3>4. Identifikácia robotov — tri spôsoby</h3>

<p>Vyhľadávacie služby (Google, Bing, Yandex, Seznam) prevádzkujú <strong>crawlery</strong> — programy, ktoré automaticky prechádzajú web a indexujú stránky. Pre web log mining sú nežiaduce, lebo skreslia metriky („Googlebot navštívil 10 000 stránok za hodinu" nie je ľudská návšteva). Robotov rozpoznávame tromi nezávislými spôsobmi:</p>

<ol>
  <li><strong>Podľa poľa User-Agent alebo IP adresy</strong> — slušní roboti sa identifikujú v User-Agent reťazci, kde sa objavujú kľúčové slová <code>bot</code>, <code>crawl</code>, <code>spider</code>. Príklady: <code>Googlebot/2.1</code>, <code>msnbot/1.1</code>, <code>ia_archiver</code> (Alexa), <code>spider27.yandex.ru</code>. Známym IP adresám robotov je možné priradiť aj reverzný DNS záznam (host).</li>
  <li><strong>Podľa prístupu k súboru <code>robots.txt</code></strong> — tento súbor v koreni domény (napr. <code>www.ukf.sk/robots.txt</code>) hovorí robotom, kam smú a kam nie. <strong>Bežný používateľ ho nikdy nevidí</strong> — žiadna stránka naňho neodkazuje, prehliadač ho automaticky nestiahne. Preto platí: <em>kto si stiahol <code>robots.txt</code>, je takmer určite robot</em>.</li>
  <li><strong>Podľa prístupu k skrytému odkazu (honeypot)</strong> — na stránke je úmyselne umiestnený odkaz, ktorý je pre človeka <strong>neviditeľný</strong> (skrytý cez CSS <code>display:none</code> alebo nulové rozmery). Človek naň nemôže kliknúť, lebo ho nevidí, prehliadač ho nenačíta. Crawler, ktorý slepo prechádza všetky <code><a href></code> v HTML, sa do pasce chytí. Každý prístup na túto skrytú URL je dôkazom o robotovi.</li>
</ol>

<p>Tieto tri prístupy sú <strong>komplementárne</strong>: User-Agent zachytí slušných robotov, ktorí sa priznajú; <code>robots.txt</code> a honeypot zachytia aj tých, ktorí sa pretvarujú za prehliadač.</p>

<h3>5. Postup prípravy dát — poradie fáz</h3>

<p>Príprava dát z log súboru prebieha v presnom poradí, kde výstup jedného kroku je vstupom ďalšieho:</p>

<ol>
  <li>Získanie súboru z webového servera (hrubé dáta).</li>
  <li>Čistenie súboru od nepotrebných dát (statické súbory, neúspešné požiadavky).</li>
  <li>Čistenie súboru od robotov vyhľadávacích služieb.</li>
  <li>Identifikácia používateľov na základe rôznej verzie internetového prehliadača (kombinácia IP + User-Agent).</li>
  <li>Rozlíšenie sedení na základe agenta (zmena prehliadača = nové sedenie).</li>
  <li>Rozlíšenie sedení na základe času alebo štruktúry odkazov.</li>
  <li>Doplnenie ciest — chýbajúce záznamy logovacieho súboru.</li>
</ol>

<p>Každý krok je <strong>nutnou prípravou</strong> pre nasledujúci. Bez čistenia by vzory boli skreslené robotmi, bez sedení by analýza hľadala cesty cez týždne, bez doplnenia ciest by mali pravidlá medzery.</p>

  <li><strong>Dva svety dát:</strong> informačné systémy (vlastná štruktúra, databáza) vs. web/proxy servery (spoločná textová štruktúra, Apache log).</li>

</ul>

{num:6,label:`P6 CRISP-DM II`,name:`CRISP-DM II — Príprava dát (čistenie, roboti)`,reading:`<h2>Téma 6: CRISP-DM II — Príprava dát (čistenie, roboti)</h2>

<p>Príprava dát je fáza, ktorá v procese <strong>Web Usage Mining (WUM)</strong> typicky zaberá <strong>60–80 % celkového času</strong>. Surový Apache log obsahuje milióny záznamov, z ktorých väčšina nevypovedá nič o navigačnom správaní reálneho používateľa. Bez dôkladnej prípravy by každá ďalšia fáza — hľadanie vzorov aj ich analýza — bola skreslená šumom, robotmi a technickými požiadavkami.</p>

<h3>1. Postavenie prípravy dát v CRISP-DM</h3>

<p>Metodika CRISP-DM definuje šesť fáz (porozumenie problému, porozumenie dátam, príprava dát, modelovanie, vyhodnotenie, nasadenie). V kontexte WUM sa príprava dát rozpadá do série krokov, ktoré sa vykonávajú v presnom poradí:</p>

<ol>
  <li><strong>Získanie súboru</strong> z webového servera (Apache access log).</li>
  <li><strong>Čistenie od nepotrebných záznamov</strong> (RequestMethod, StatusCode, URL).</li>
  <li><strong>Čistenie od robotov</strong> vyhľadávacích služieb.</li>
  <li><strong>Identifikácia používateľov</strong> (IP + User-Agent).</li>
  <li><strong>Rozlíšenie sedení</strong> podľa času alebo štruktúry.</li>
  <li><strong>Doplnenie chýbajúcich záznamov</strong> v navigačných cestách.</li>
</ol>

<p>Každý krok produkuje vstup pre ten ďalší — preto poradie nie je voliteľné.</p>

<h3>2. Apache log ako pasívny záznam</h3>

<p>Apache je webový server, ktorý pri každej HTTP požiadavke zapíše jeden riadok do textového súboru. Formát <strong>Combined Log Format</strong> obsahuje polia:</p>

<pre><code>IP - - [DateTime] "Method URL HTTP/Version" StatusCode Bytes "Referrer" "Agent"</code></pre>

<p>Apache log je <strong>pasívny záznam</strong>: server zapíše len to, že prišla požiadavka. Nevidí, čo používateľ skutočne robí (scroll, čas čítania, kliky bez požiadavky na server). Toto je fundamentálne obmedzenie WUM — všetko, čo nasleduje, je odvodené práve z týchto riadkov.</p>

<h3>3. Čistenie od nepotrebných záznamov</h3>

<p>Prvá filtrácia odstraňuje záznamy, ktoré nereprezentujú navigačné správanie ľudského používateľa. Aplikujú sa tri kritériá nad tromi poliami logu.</p>

<h3>4. RequestMethod — typ HTTP operácie</h3>

<p>HTTP definuje viacero metód, ale pre WUM je relevantná iba jedna:</p>

<ul>
  <li><strong>GET</strong> — žiadosť o stránku alebo súbor (skutočná navigácia). <strong>Ponechávame.</strong></li>
  <li><strong>POST</strong> — odoslanie formulára (akcia, nie navigácia).</li>
  <li><strong>HEAD</strong> — žiadosť iba o hlavičky bez tela odpovede; používajú prevažne skripty a monitorovacie nástroje.</li>
</ul>

<p>Záznamy s metódami inými ako GET sa vyradia.</p>

<h3>5. StatusCode — odpoveď servera</h3>

<p>HTTP stavové kódy sa delia do tried podľa prvej číslice:</p>

<ul>
  <li><strong>2xx</strong> — úspech (napr. 200 OK). <strong>Ponechávame.</strong></li>
  <li><strong>3xx</strong> — presmerovanie (napr. 301, 302). <strong>Ponechávame</strong> — používateľ stránku reálne dostal, len cez iný krok.</li>
  <li><strong>4xx</strong> — chyba klienta (404 Not Found, 403 Forbidden). Stránka sa nezobrazila — nepatrí do navigácie.</li>
  <li><strong>5xx</strong> — chyba servera. Rovnako neúspešné.</li>
</ul>

<p>Ponechávajú sa iba kódy v rozsahu <code>200–399</code>.</p>

<h3>6. URL — vyradenie statických súborov</h3>

<p>Jedna HTML stránka spustí v prehliadači <strong>desiatky automatických požiadaviek</strong> na vlastné súbory: obrázky, CSS, JavaScript, fonty, ikony. Ak má stránka 30 obrázkov, jedna návšteva vytvorí v logu 31 záznamov. Bez vyradenia týchto súborov by priemerný počet stránok na sedenie bol mnohonásobne nadhodnotený.</p>

<p>Vyhodené sú URL s príponami zodpovedajúcimi statickým súborom:</p>

<ul>
  <li><strong>Obrázky:</strong> bmp, jpg, jpeg, png, gif, svg, ico</li>
  <li><strong>Štýly a skripty:</strong> css, js, json</li>
  <li><strong>Fonty:</strong> woff, woff2, eot, ttf, otf</li>
  <li><strong>Ostatné:</strong> flv, swf, rss, xml, cur</li>
</ul>

<p>Ponechané zostávajú iba URL, ktoré reprezentujú <strong>navigovateľné stránky</strong>.</p>

<h3>7. Roboti — prečo sú nežiaduci</h3>

<p>Vyhľadávače (Google, Bing, Seznam) prevádzkujú <strong>crawlery</strong> — programy, ktoré automaticky prechádzajú web a indexujú stránky. Pre WUM sú nežiaduce, lebo skreslia metriky: „Googlebot navštívil 10 000 stránok za hodinu" nie je návšteva v ľudskom zmysle. Robot nemá intent, nepoužíva navigáciu, nereprezentuje cieľovú skupinu.</p>

<p>Existujú dva nezávislé spôsoby identifikácie robota, ktoré sa kombinujú.</p>

<h3>8. Identifikácia robotov — prístup k <code>robots.txt</code></h3>

<p>Súbor <code>robots.txt</code> sa nachádza v koreni domény (napr. <code>www.ukf.sk/robots.txt</code>) a obsahuje pravidlá, ktoré stránky robot smie a nesmie indexovať. <strong>Bežný používateľ tento súbor nikdy nevidí</strong> — neexistuje naňho odkaz, prehliadač ho automaticky nestiahne.</p>

<p>Princíp je preto jednoduchý a robustný: <strong>každá IP, ktorá si stiahla <code>robots.txt</code>, je takmer určite robot.</strong> Algoritmus:</p>

<ol>
  <li>Prejdi log a nájdi všetky záznamy, kde URL obsahuje <code>robots.txt</code>.</li>
  <li>Vytiahni z nich IP adresy.</li>
  <li>Z hlavného logu vyhoď všetky záznamy s týmito IP.</li>
</ol>

<p>Tento spôsob je <strong>nezávislý od User-Agent</strong> a zachytí aj robotov, ktorí sa skrývajú za bežne vyzerajúci prehliadač.</p>

<h3>9. Identifikácia robotov — kľúčové slová v User-Agent</h3>

<p>Drvivá väčšina robotov sa v poli User-Agent identifikuje sama. Hľadajú sa <strong>kľúčové slová</strong> bez ohľadu na veľkosť písmen:</p>

<ul>
  <li><strong>bot</strong> — <code>Googlebot</code>, <code>bingbot</code>, <code>YandexBot</code></li>
  <li><strong>crawl</strong> — všeobecné crawlery</li>
  <li><strong>spider</strong> — historický názov pre crawlery</li>
</ul>

<p>Príklad robotického User-Agent:</p>

<pre><code>Mozilla/5.0 (compatible; bingbot/2.0; +http://www.bing.com/bingbot.htm)</code></pre>

<h3>10. Automatizované nástroje a prázdny User-Agent</h3>

<p>Okrem klasických crawlerov pristupujú k serveru aj rôzne skripty, monitorovacie nástroje a scrapery. Tie nie sú vyhľadávače, ale ani ľudia — patria do tej istej kategórie nežiaducich záznamov. Identifikujú sa cez kľúčové slová:</p>

<ul>
  <li><strong>curl</strong> — nástroj príkazového riadku na HTTP požiadavky</li>
  <li><strong>wget</strong> — nástroj na sťahovanie</li>
  <li><strong>libwww</strong> — knižnica pre HTTP klienta</li>
  <li><strong>cron</strong> — naplánované automatizované úlohy</li>
</ul>

<p>Osobitnú kategóriu tvorí <strong>prázdny User-Agent</strong> — v Apache logu reprezentovaný pomlčkou <code>"-"</code>. Žiadny štandardný prehliadač neposiela prázdny User-Agent. Záznamy s týmto agentom sa vyradia.</p>

<h3>11. Kombinácia metód</h3>

<p>V praxi sa všetky tri filtre aplikujú postupne:</p>

<ol>
  <li>Vyhoď záznamy, ktorých User-Agent obsahuje <code>bot</code>, <code>crawl</code> alebo <code>spider</code>.</li>
  <li>Vyhoď záznamy s nástrojmi <code>curl</code>, <code>wget</code>, <code>libwww</code>, <code>cron</code>.</li>
  <li>Vyhoď záznamy s prázdnym User-Agent (<code>"-"</code>).</li>
  <li>Vyhoď všetky záznamy z IP adries, ktoré pristupovali k <code>robots.txt</code>.</li>
</ol>

<p>Každý filter zachytí inú podmnožinu robotov: User-Agent zachytí tých, ktorí sa identifikujú; <code>robots.txt</code> zachytí aj tých, ktorí sa maskujú. Kombinácia oboch dáva podstatne čistejší dataset, ako ktorýkoľvek filter samostatne.</p>

<h3>12. Dôsledok pre ďalšie fázy</h3>

<p>Po vyčistení od šumu a robotov zostane v datasete iba <strong>ľudská navigácia</strong>. To je podmienka, aby ďalšie kroky (identifikácia používateľov, sedenia, doplnenie ciest) mali zmysel. Robot s 10 000 prístupmi za hodinu by pri identifikácii používateľov dostal jedno <code>USER_ID</code> a pri sedeniach by vytvoril obrovské falošné sedenia, ktoré by úplne zničili štatistiky dĺžky a počtu stránok.</p>

{num:7,label:`P7 CRISP-DM III`,name:`CRISP-DM III — Príprava dát (UNIXTIME, používatelia, Length)`,reading:`<h2>Téma 7: CRISP-DM III — Príprava dát (UNIXTIME, používatelia, Length)</h2>

<p>Príprava dát je tretia a najnáročnejšia časť procesu Web Usage Mining — typicky zaberá <strong>60–80 % celého času</strong>. Zo surového logu webového servera musíme vyrobiť čisté, dobre označkované dáta, aby sa na nich dali hľadať vzory. Táto prednáška pokrýva tri kľúčové kroky: prevod času na <strong>UNIXTIME</strong>, <strong>identifikáciu používateľov</strong> a vytvorenie premennej <strong>Length</strong>, ktorá je základom pre rozdelenie aktivity do sedení.</p>

<h3>1. UNIXTIME — reprezentácia času ako jedného čísla</h3>

<p>Časový reťazec v logu (napr. <code>17/Dec/2017:06:28:17 +0100</code>) je čitateľný pre človeka, ale zle sa s ním počíta. Koľko sekúnd je medzi dvomi takými reťazcami? Treba parsovať dni, mesiace, časové zóny, riešiť polnoc a koniec mesiaca.</p>

<p><strong>UNIX timestamp</strong> tento problém rieši elegantne — je to jediné celé číslo, ktoré udáva <strong>počet sekúnd od 1.1.1970 00:00:00 UTC</strong> (tzv. „epoch"). Ide o arbitrárny štartovací bod, ktorý si zvolil operačný systém UNIX.</p>

<pre><code>"17/Dec/2017:06:28:17 +0100"  →  1 513 488 497
"17/Dec/2017:06:30:42 +0100"  →  1 513 488 642
                                 ───────────────
                                 rozdiel = 145 sekúnd
</code></pre>

<p>Výhody UNIXTIME:</p>
<ul>
<li>jedno číslo — jednoduchá aritmetika (rozdiel = obyčajné odčítanie)</li>
<li>nezávislé od časovej zóny (pod kapotou vždy v UTC)</li>
<li>menšie číslo = skorší čas → jednoduché triedenie a porovnávanie</li>
<li>vhodné pre databázy a indexy</li>
</ul>

<p>Bez UNIXTIME by sme každý rozdiel časov museli počítať cez datetime knižnicu. S UNIXTIME je to obyčajné odčítanie dvoch celých čísel.</p>

<h3>2. Identifikácia používateľov — bezstavový problém HTTP</h3>

<p>HTTP je <strong>bezstavový protokol</strong> — server nevie, či dve požiadavky pochádzajú od toho istého človeka alebo od dvoch rôznych. Toto je fundamentálny problém, ktorý rieši aj Google či Facebook, nielen WUM. Existujú štyri základné metódy identifikácie, zoradené od najslabšej po najsilnejšiu.</p>

<h4>a) Iba IP adresa</h4>
<p>Najjednoduchšia, ale nepresná. Problémy:</p>
<ul>
<li><strong>NAT (Network Address Translation)</strong> — celá firma, internát alebo WiFi hotspot zdieľa jednu verejnú IP. Môže za ňou byť aj 100+ ľudí.</li>
<li><strong>DHCP</strong> — doma sa IP mení po reštarte routra. Jeden človek dostane za týždeň viac IP adries.</li>
<li><strong>Mobilné siete a proxy</strong> — carrier-grade NAT zdieľa IP medzi tisíckami zariadení.</li>
</ul>

<h4>b) IP + User-Agent</h4>
<p>Kompromisné riešenie. Predpoklad: dvaja ľudia za jednou NAT IP zvyčajne <strong>nemajú úplne rovnaký prehliadač</strong> (iná verzia, iný OS, iné rozšírenia). Spojením IP a User-Agentu vznikne presnejší identifikátor.</p>

<p>Slabosti:</p>
<ul>
<li>jeden človek s viacerými prehliadačmi (Chrome + Firefox) sa javí ako <strong>viac používateľov</strong></li>
<li>dvaja ľudia s úplne rovnakým prehliadačom za NAT sa javia ako <strong>jeden používateľ</strong></li>
</ul>

<h4>c) Cookies</h4>
<p>Server pošle pri prvej návšteve unikátny token, prehliadač ho vracia s každou ďalšou požiadavkou. Funguje aj cez zmenu IP. Slabina: užívateľ môže cookies vymazať alebo zakázať. V štandardnom Apache logu sa cookies <strong>nelogujú</strong>.</p>

<h4>d) Prihlásenie (login)</h4>
<p>Najpresnejšia metóda — server pozná konkrétneho používateľa. Funguje ale len pre prihlásených, nie pre anonymných návštevníkov.</p>

<p><strong>V projekte používame IP + User-Agent</strong>, pretože v Apache logu nemáme cookies ani login. Každej unikátnej dvojici (IP, Agent) priradíme jeden <strong>USER_ID</strong>.</p>

<h3>3. Premenná Length — aproximácia času na stránke</h3>

<p>Apache log neobsahuje údaj „čas strávený na stránke". Server nevie, kedy užívateľ stránku opustí — keď zavrie tab alebo klikne preč, server o tom nedostane žiadny signál. Čas na stránke <strong>aproximujeme</strong> rozdielom medzi dvomi po sebe idúcimi prístupmi toho istého používateľa:</p>

<pre><code>Length[i] = UNIXTIME[i] - UNIXTIME[i-1]
            (v rámci toho istého USER_ID, chronologicky)
</code></pre>

<p>Posledný prístup používateľa nemá nasledovníka, takže jeho Length zostáva nedefinovaný (NaN).</p>

<h3>4. 60-minútové STT (Session Timeout Threshold)</h3>

<p>Bez ďalšieho pravidla by sa stalo, že medzi posledným prístupom v piatok večer a prvým v sobotu ráno by Length vyšiel ako <strong>desať hodín</strong>. To zjavne nereprezentuje „čas na stránke" — používateľ medzitým spal, pracoval, žil.</p>

<p>Preto sa zavádza <strong>heuristika 60-minútového STT</strong>: ak je rozdiel medzi dvomi prístupmi väčší alebo rovný <strong>3600 sekúnd</strong> (60 minút), považujeme to za znak, že <strong>sedenie skončilo</strong>. Length sa v takom prípade nastaví na <em>None</em> — nemá zmysel ho používať ako čas na stránke.</p>

<pre><code>Ak Length >= 3600  →  Length = None
                       (sedenie skončilo, nasleduje nové)
</code></pre>

<p>Hodnota 60 minút je <strong>dohovorová heuristika</strong> založená na empirických pozorovaniach správania používateľov webu. Nie je to magická konštanta — v literatúre sa stretneme aj s 30 minútami či inými hodnotami.</p>

<h3>5. Exponenciálne rozdelenie premennej Length</h3>

<p>Premenná Length, ktorá meria čas medzi po sebe nasledujúcimi prístupmi, má teoreticky <strong>exponenciálne rozdelenie</strong>. Predstavte si zastávku, kde merate čas medzi príchodmi autobusov. Ak prichádzajú náhodne a nezávisle, časy medzi nimi majú práve toto rozdelenie.</p>

<pre><code>Hustota:    f(t) = λ · e^(-λ·t)         pre t >= 0
Distribučná: F(t) = 1 - e^(-λ·t)
</code></pre>

<p>Symboly:</p>
<ul>
<li><strong>λ</strong> (lambda) — intenzita udalostí (priemerný počet udalostí za jednotku času)</li>
<li><strong>t</strong> — čas (v sekundách)</li>
<li><strong>e</strong> — Eulerovo číslo (~2,718)</li>
</ul>

<p>Vlastnosti, ktoré dávajú pri webovej navigácii zmysel:</p>
<ul>
<li>v t = 0 má hustota najvyššiu hodnotu → krátke pauzy sú <strong>najčastejšie</strong> (rýchle preklikávanie navigáciou)</li>
<li>hustota postupne klesá → dlhé pauzy sú <strong>zriedkavé</strong> (zastavil sa a čítal)</li>
<li>stredná hodnota rozdelenia je <strong>1/λ</strong></li>
</ul>

<h3>6. MLE odhad parametra λ</h3>

<p>Parameter λ neostane neznámy — odhadneme ho z dát metódou maximálnej vierohodnosti (Maximum Likelihood Estimation). Pre exponenciálne rozdelenie vyjde jednoduchý vzorec:</p>

<pre><code>λ̂ = 1 / x̄

kde x̄ je výberový priemer pozorovaných Length
</code></pre>

<p>Inými slovami: <strong>odhad intenzity λ je prevrátená hodnota priemeru</strong>. Ak je priemerná pauza 173 sekúnd, intenzita je 1/173 ≈ 0,0058 udalostí za sekundu.</p>

<h3>7. Kvantilová funkcia — odhad hraničného času</h3>

<p>Pri identifikácii sedení potrebujeme určiť <strong>hraničný čas δ</strong> (delta) — prah, nad ktorým považujeme pauzu za koniec sedenia. Pre exponenciálne rozdelenie sa to dá vypočítať pomocou <strong>kvantilovej funkcie</strong> (inverzia distribučnej funkcie):</p>

<pre><code>δ = F⁻¹(p) = -ln(1 - p) / λ

kde p je relatívna početnosť navigačných stránok
    (typicky p = 0,4 = 40 %)
    0 <= p < 1
</code></pre>

<p>Význam: ak <strong>p = 0,4</strong>, tak približne 40 % záznamov má Length menšie ako δ (sú to <em>navigačné stránky</em> — rýchlo preklikol), zvyšných 60 % má Length väčšie alebo rovné δ (sú to <em>content stránky</em> — zastavil sa a čítal). Hodnotu δ potom použijeme ako prah pre delenie sedení: ak Length ≥ δ, ide o nové sedenie.</p>

<p>Konkrétne pre p = 0,4: <code>-ln(0,6) ≈ 0,5108</code>, takže <code>δ ≈ 0,51 × priemer Length</code>.</p>

<h3>8. Definícia sedenia</h3>

<p>Keď máme odhad hraničného času δ, sedenie definujeme ako sekvenciu navštívených stránok s časovými známkami, pre ktorú medzi po sebe idúcimi záznamami platí <code>Length < δ</code>. Pre <strong>poslednú stránku</strong> sedenia platí, že nasledujúci rozdiel je už <code>Length >= δ</code> — od tej stránky začína nové sedenie.</p>
