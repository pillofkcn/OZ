{num:8,label:`P8 CRISP-DM IV`,name:`CRISP-DM IV — Sedenia + Doplnenie ciest`,reading:`<h2>Téma 8: CRISP-DM IV — Sedenia a doplnenie ciest</h2>

<p>Po vyčistení logu a identifikácii používateľov stojíme pred ďalšou úlohou prípravy dát: <strong>rozdeliť prístupy jedného používateľa na sedenia</strong> a <strong>doplniť chýbajúce stránky</strong> v navigačných cestách. HTTP protokol neposkytuje žiadny signál „sedenie skončilo" — musíme ho odhadnúť heuristikami nad časom a štruktúrou.</p>

<h3>1. Formálne definície: WALS a USS</h3>

<p><strong>WALS</strong> (Web Access Log Set) je množina webových prístupov zachytených v logovacom súbore, zoradených podľa časovej značky. Každý prístup obsahuje IP, cookie, čas, URL, referrer, agent a iné polia. WALS je vstup, USS výstup tejto fázy.</p>

<p><strong>USS</strong> (User Session Set) je množina sedení. <strong>Sedenie</strong> je sekvencia navštívených stránok jedného používateľa s časovými značkami, pre ktoré platí podmienka spolupatričnosti. Dva po sebe nasledujúce záznamy patria do toho istého sedenia, ak medzi nimi platí časová alebo štruktúrna rovnosť — inak začína nové sedenie.</p>

<pre><code>s = <u, p1, t1, p2, t2, ..., pn, tn>
kde u = používateľ, pi = stránka, ti = čas prístupu
podmienka: ti - ti-1 ≤ δ  (časový limit)</code></pre>

<h3>2. Päť metód identifikácie sedení</h3>

<p>Všetky metódy potrebujú odhad <strong>STT (Session Timeout Threshold)</strong> — časového okna, po prekročení ktorého považujeme prístup za začiatok nového sedenia.</p>

<h3>2.1 STT_MEAN — priemer dĺžky návštev</h3>

<p>Najjednoduchší odhad: STT = aritmetický priemer všetkých dĺžok pobytu na stránke. Ak je <code>Length ≥ priemer</code>, ide o nové sedenie. Použitie priemeru je rozšírené, ale <strong>nie je vhodné</strong>, pretože priemer je citlivý na extrémne hodnoty (jeden 8-hodinový záznam vychýli priemer pre tisíce krátkych návštev).</p>

<h3>2.2 STT_Q — kvartilový (Tukey) odhad</h3>

<p>Robustná, neparametrická alternatíva — používa sa ak premenná Length <strong>nemá exponenciálne rozdelenie</strong>. Aplikuje Tukeyho pravidlo na detekciu odľahlých hodnôt:</p>

<pre><code>STT_Q = Q3 + 1.5 × IQR
IQR = Q3 - Q1

Q3  = 75. percentil (horný kvartil)
Q1  = 25. percentil (dolný kvartil)
IQR = kvartilové rozpätie (stredných 50 % hodnôt)</code></pre>

<p>Interpretácia: <strong>neobvykle dlhá pauza medzi dvoma prístupmi → koniec sedenia</strong>. Q3+1.5×IQR je klasická hranica pre outliery — pauza, ktorá je takto „mimo normy", už nepatrí do bežnej navigácie.</p>

<h3>2.3 SLength — pevný 10-minútový limit</h3>

<p>Tu sa STT neaplikuje na medzeru medzi dvoma stránkami, ale na <strong>celé sedenie</strong>. Ak súčet dĺžok od začiatku sedenia presiahne pevný limit (typicky 10 minút), ďalší záznam patrí do nového sedenia. Statická metóda — nemá schopnosť prispôsobiť sa povahe dát.</p>

<h3>2.4 RLength — Reference Length s exponenciálnym rozdelením</h3>

<p>Ak má Length <strong>exponenciálne rozdelenie</strong> (hustota <code>f(x) = λe<sup>-λx</sup></code>, distribučná funkcia <code>F(x) = 1 - e<sup>-λx</sup></code>), môžeme STT odhadnúť pomocou <strong>kvantilovej funkcie</strong>:</p>

<pre><code>STT = F⁻¹(p) = -ln(1 - p) / λ
            = -ln(1 - p) × priemer_Length

p = relatívna početnosť navigačných stránok (0 ≤ p < 1)
λ = 1 / priemer (maximálne vierohodný odhad)</code></pre>

<p>V projekte sa volí <strong>p = 0,4</strong> — predpoklad, že 40 % stránok sú navigačné (krátke, presunové) a 60 % obsahové (čítané dlho). Inverzná distribučná funkcia povie: „nad akou hodnotou času ležia obsahové stránky" — táto hodnota je hranicou pre nové sedenie.</p>

<p>Predpoklad exponenciality treba overiť <strong>Kolmogorov-Smirnovovým testom</strong>. Ak <code>p-hodnota < 0,05</code>, zamietame H₀ a používame <strong>fallback STT_Q</strong>. V reálnych logoch KS test typicky zlyháva — roboty, ktorí prežili čistenie, klikajú perfektne pravidelne (nie exponenciálne).</p>

<h3>2.5 h-ref — heuristic referrer (Cooley)</h3>

<p>Cooleyho metóda kombinuje <strong>čas + štruktúru</strong>. Časové okno je rovnaké ako STT_MEAN (priemer Length), ale pridáva sa <strong>kontextová podmienka na referrer</strong>.</p>

<p>Nové sedenie začína, ak platí <strong>aspoň jedna</strong> z troch podmienok (OR):</p>

<ol>
<li><code>Length</code> je <code>NaN</code> — prvý záznam používateľa, nemá predchodcu</li>
<li><code>Length ≥ priemer</code> — pauza presahuje časové okno</li>
<li><code>Referrer = "-"</code> — používateľ otvoril stránku <strong>priamo</strong> (zadal URL, otvoril záložku, prišiel z externého zdroja, ktorý referrer nepošle)</li>
</ol>

<p>Tretia podmienka je kľúčová. Aj keď čas nesignalizuje novú návštevu, prázdny referrer hovorí „začiatok niečoho nového". Preto h-ref typicky tvorí <strong>viac, ale kratších sedení</strong> než čisto časové metódy.</p>

<h3>3. Doplnenie ciest (path completion)</h3>

<p>V logu chýbajú stránky, lebo server o nich nevedel. Príčiny:</p>

<ul>
<li><strong>Browser cache</strong> — pri tlačidle „späť" prehliadač zobrazí stránku z lokálnej pamäte, k serveru nepríde žiadna požiadavka, v logu nie je záznam.</li>
<li><strong>Multi-tab navigácia</strong> — Ctrl+klik otvorí stránku v novom tabe, log môže zachytiť požiadavky v zvláštnom poradí.</li>
<li><strong>Sieťové problémy</strong> — požiadavka sa stratí, server nezaznamená, klient stránku dostane z cache.</li>
</ul>

<p>Dôsledok: v sekvencii prístupov sú „diery". Pravidlo „A → C" v skutočnosti znamená „A → B → C", kde B chýba. Bez doplnenia by sa skresľovala fáza objavovania vzorov (asociačné a sekvenčné pravidlá).</p>

<h3>3.1 Mapa webu</h3>

<p>Mapa webu je graf <code>parent[URL] = Referrer</code> — pre každú stránku najčastejší referrer, t. j. „bežne sa sem chodí z…". Buduje sa zo samotného logu: agregujú sa dvojice (Referrer, URL), filtrujú sa iba interné odkazy a pre každé URL sa vyberie modálny (najčastejší) referrer ako kanonický rodič.</p>

<h3>3.2 Algoritmus doplnenia</h3>

<p>Pre každú dvojicu po sebe idúcich záznamov v tom istom sedení:</p>

<ol>
<li>Ak je medzi nimi „skok" (cieľová URL má v mape rodiča iného než aktuálna URL),</li>
<li>vlož medzi ne nový záznam s URL = <code>parent[cieľ]</code>.</li>
</ol>

<pre><code>PRED doplnením:
  SESSION_ID=5, URL=/uvod        (Referrer: -)
  SESSION_ID=5, URL=/clanok-42   (Referrer: /blog)  ← /blog chýba!

PO doplnení:
  SESSION_ID=5, URL=/uvod
  SESSION_ID=5, URL=/blog        ← doplnené (parent[/clanok-42] = /blog)
  SESSION_ID=5, URL=/clanok-42</code></pre>

<p>Doplnené záznamy preberajú IP, čas a sedenie z predchádzajúceho záznamu — sú to <strong>rekonštruované</strong>, nie reálne udalosti.</p>

<h3>4. Rozdiely medzi metódami</h3>

<ul>
<li><strong>STT_MEAN</strong> — prah = priemer Length; jednoduchá, citlivá na outliery</li>
<li><strong>STT_Q</strong> — prah = Q3 + 1,5×IQR; robustná, neparametrická, fallback pre RLength</li>
<li><strong>SLength</strong> — prah = pevné 10 min na celé sedenie; statická</li>
<li><strong>RLength</strong> — prah = -ln(1-p)×priemer; štatistická, vyžaduje exponenciálne rozdelenie</li>
<li><strong>h-ref</strong> — čas (priemer) + Referrer="-"; heuristická, kombinuje čas a kontext</li>
</ul>

<div class="summary">
<h3>Zhrnutie</h3>
<ul>
<li><strong>WALS → USS</strong>: cieľom je rozdeliť prístupy používateľa na sedenia pomocou odhadu časového okna STT.</li>
<li><strong>STT_Q = Q3 + 1,5×IQR</strong> je robustný neparametrický odhad — funguje aj keď Length nemá exponenciálne rozdelenie.</li>
<li><strong>RLength = -ln(1-p) × priemer</strong> vyžaduje exponenciálne rozdelenie (overuj KS testom); pre p=0,4 reflektuje pomer navigačných stránok.</li>
<li><strong>h-ref</strong> kombinuje čas (priemer) a štruktúru (Referrer="-") — generuje viac, ale kratších sedení než čisto časové metódy.</li>
<li><strong>Doplnenie ciest</strong> rekonštruuje chýbajúce stránky pomocou mapy webu (parent[URL]=najčastejší referrer); rieši browser cache, multi-tab a stratené požiadavky.</li>
</ul>

{num:9,label:`P9 CRISP-DM V`,name:`CRISP-DM V — Modelovanie`,reading:`<h2>Téma 9: CRISP-DM V — Modelovanie (asociačné pravidlá)</h2>

<p><strong>Modelovanie</strong> je piata fáza metodiky CRISP-DM a predstavuje jadro celého procesu objavovania znalostí — aplikáciu konkrétnych algoritmov dolovania dát na pripravený dataset. Predchádza jej porozumenie biznisu, porozumenie dát, príprava dát; nasleduje vyhodnotenie a nasadenie. Vo Web Usage Miningu modelovanie zodpovedá <strong>fáze 2 (pattern discovery)</strong> — hľadaniu vzorov v sedeniach, ktoré boli vyrobené v príprave dát.</p>

<h3>1. Šesť typov úloh dolovania dát</h3>

<p>CRISP-DM definuje šesť všeobecných typov problémov, ktoré modelovanie rieši. Každý typ má iný cieľ a iné odporúčané metódy:</p>

<ol>
<li><strong>Deskripcia dát a sumarizácia</strong> — zhrnúť, čo dáta hovoria.</li>
<li><strong>Segmentácia</strong> — rozdeliť záznamy do skupín na základe podobnosti.</li>
<li><strong>Deskripcia konceptov</strong> — opísať vlastnosti tried zrozumiteľnými pravidlami.</li>
<li><strong>Klasifikácia</strong> — priradiť záznam do vopred známej triedy.</li>
<li><strong>Predikcia</strong> — odhadnúť číselnú hodnotu cieľovej premennej.</li>
<li><strong>Analýza závislostí</strong> — odhaliť, ktoré premenné spolu súvisia.</li>
</ol>

<h3>2. Deskripcia dát a sumarizácia</h3>

<p>Cieľom je <strong>stručne charakterizovať dáta</strong> — rozsah, distribúcie, anomálie. Odporúčané metódy:</p>
<ul>
<li><strong>Popisná štatistika</strong> — priemer, medián, smerodajná odchýlka, kvartily.</li>
<li><strong>Vizualizácia dát</strong> — histogramy, box-ploty, scatter-ploty.</li>
<li><strong>OLAP analýza</strong> — viacrozmerné agregácie nad kockou (drill-down, roll-up).</li>
</ul>
<p>Táto úloha sa robí najprv — pomáha pochopiť, čo v dátach je, a smeruje výber ďalších metód.</p>

<h3>3. Segmentácia — hľadanie skupín</h3>

<p>Segmentácia delí dáta do <strong>homogénnych skupín bez vopred známych tried</strong> (unsupervised learning). Odporúčané techniky:</p>
<ul>
<li><strong>Zhlukovanie (clustering)</strong> — <em>k-means</em> (delí dáta na k zhlukov minimalizáciou vzdialeností od centroidov), <em>hierarchické zhlukovanie</em> (postupne spája najpodobnejšie objekty do dendrogramu).</li>
<li><strong>Neurónové siete</strong> — napr. Kohonenove samoorganizujúce sa mapy (SOM).</li>
<li><strong>Vizualizácia dát</strong> — odhalenie zhlukov vizuálne.</li>
</ul>
<p><strong>Princíp k-means:</strong> minimalizuje súčet štvorcov vzdialeností bodov od stredu ich zhluku. Vyžaduje zvoliť k vopred. Hierarchické zhlukovanie k nepotrebuje, ale je výpočtovo náročnejšie.</p>

<h3>4. Deskripcia konceptov</h3>

<p>Cieľ: <strong>zrozumiteľne opísať triedu</strong> v jazyku ľudských pravidiel (nie čierna skrinka). Odporúčané metódy:</p>
<ul>
<li><strong>Rozhodovacie pravidlá</strong> — IF-THEN výrazy typu „IF vek > 30 AND príjem > 1000 THEN klient = bonitný".</li>
<li><strong>Zhlukovanie konceptov</strong> — zoskupenie príbuzných pojmov.</li>
</ul>

<h3>5. Klasifikácia — priradenie do známej triedy</h3>

<p>Vstup: záznamy s označením triedy (supervised learning). Výstup: model, ktorý priradí triedu novému záznamu. Odporúčané metódy:</p>
<ul>
<li><strong>Rozhodovacie stromy</strong> — strom IF-THEN otázok; v každom uzle sa volí atribút maximalizujúci informačný zisk.</li>
<li><strong>Rozhodovacie pravidlá</strong>, <strong>diskriminačná analýza</strong>.</li>
<li><strong>Neurónové siete</strong> — viacvrstvová sieť trénovaná spätným šírením chyby.</li>
<li><strong>k-najbližších susedov (k-NN)</strong> a <strong>prípadové usudzovanie</strong> — metódy založené na analógii: nová inštancia dostane triedu podľa najpodobnejších známych prípadov.</li>
<li><strong>Genetické algoritmy</strong>.</li>
</ul>

<h3>6. Predikcia — odhad číselnej hodnoty</h3>

<p>Cieľová premenná je <strong>spojitá</strong> (nie kategorická). Odporúčané metódy:</p>
<ul>
<li><strong>Regresná analýza</strong> — lineárna, logistická.</li>
<li><strong>Regresné stromy</strong> — analógia rozhodovacích stromov pre čísla.</li>
<li><strong>Neurónové siete</strong> — univerzálny aproximátor nelineárnych vzťahov.</li>
<li><strong>k-NN</strong>, <strong>Box-Jenkinsova metodológia</strong> (časové rady ARIMA), <strong>genetické algoritmy</strong>.</li>
</ul>
<p><strong>Neurónové siete rámcovo:</strong> vstupy sa vážene sčítajú, prejdú aktivačnou funkciou (sigmoida, ReLU) a posunú do ďalšej vrstvy. Trénovanie upravuje váhy tak, aby výstup zodpovedal známej hodnote.</p>

<h3>7. Analýza závislostí — kto s kým súvisí</h3>

<p>Hľadá <strong>vzťahy medzi premennými alebo udalosťami</strong>. Odporúčané metódy:</p>
<ul>
<li><strong>Korelačná analýza</strong> a <strong>regresná analýza</strong>.</li>
<li><strong>Asociačné pravidlá</strong> — kľúčová metóda WUM.</li>
<li><strong>Bayesovské siete</strong> — pravdepodobnostné grafy závislostí.</li>
<li><strong>Induktívne logické programovanie</strong> — učenie pravidiel v logike prvého rádu.</li>
<li><strong>Vizualizácia dát</strong>.</li>
</ul>

<h3>8. Asociačné pravidlá a algoritmus Apriori</h3>

<p>Asociačné pravidlo má tvar <strong>X ⇒ Y</strong>, kde X a Y sú množiny položiek (itemsety) a X ∩ Y = ∅. Príklad zo supermarketu: „kto kúpi pivo, kúpi aj plienky".</p>

<p><strong>Vstup pre Apriori:</strong> množina <strong>transakcií</strong>. Vo WUM je transakcia jedno sedenie (session) a položkami sú navštívené stránky.</p>

<p><strong>Tri kľúčové miery</strong> (X = antecedent, Y = consequent):</p>

<pre><code>support(X ⇒ Y) = P(X ∩ Y) = počet transakcií obsahujúcich X aj Y
                                   ─────────────────────────────────────
                                          celkový počet transakcií

confidence(X ⇒ Y) = P(Y | X) = support(X ∩ Y)
                                  ────────────────
                                     support(X)

lift(X ⇒ Y) = P(X ∩ Y)         = confidence(X ⇒ Y)
                ───────────────         ──────────────────
                P(X) · P(Y)              support(Y)</code></pre>

<p><strong>Význam mier:</strong></p>
<ul>
<li><strong>Support</strong> meria, ako často sa kombinácia vyskytuje — odfiltruje zriedkavé, štatisticky nespoľahlivé vzory.</li>
<li><strong>Confidence</strong> je podmienená pravdepodobnosť — keď platí X, ako často platí aj Y.</li>
<li><strong>Lift</strong> meria silu väzby oproti náhode: lift = 1 znamená nezávislosť, lift > 1 pozitívnu väzbu (X a Y sa vyskytujú spolu častejšie, než by sa očakávalo náhodou), lift < 1 zápornú.</li>
</ul>

<p><strong>Princíp Apriori (anti-monotónna vlastnosť):</strong> ak je itemset zriedkavý, každá jeho nadmnožina je tiež zriedkavá. Vďaka tomu algoritmus orezáva kombinatorický priestor — netreba skúšať všetky podmnožiny.</p>

<p><strong>Postup Apriori:</strong></p>
<ol>
<li>Nájdi všetky <strong>frekventované 1-itemsety</strong> (support ≥ min_sup).</li>
<li>Z nich poskladaj kandidátov pre 2-itemsety a nechaj len frekventované.</li>
<li>Opakuj pre k = 3, 4, …, kým existujú frekventované k-itemsety.</li>
<li>Z frekventovaných itemsetov vygeneruj pravidlá s confidence ≥ min_conf.</li>
</ol>

<h3>9. Sekvenčné pravidlá — PrefixSpan</h3>

<p>Asociačné pravidlá ignorujú poradie. Sekvenčné pravidlá ho rešpektujú — pracujú s usporiadanými sekvenciami udalostí. Vo WUM je vstupom <strong>postupnosť stránok v sedení</strong>.</p>

<p><strong>PrefixSpan</strong> (Prefix-projected Sequential pattern mining) hľadá <strong>frekventované sekvencie</strong> tak, že rastúce prefixy postupne projektuje do databázy. Pre prefix <A> vytvorí podprojekciu obsahujúcu len to, čo nasleduje po A, a rekurzívne hľadá ďalšie frekventované rozšírenia.</p>

<p><strong>Rozdiel:</strong> asociačné pravidlo „A ⇒ C" znamená „A a C sú v tom istom sedení". Sekvenčné pravidlo „A → C" znamená „najprv A, potom C". Vo WUM práve sekvenčné pravidlá modelujú navigačné cesty.</p>

<div class="summary">
<h3>🎯 Zhrnutie</h3>
<ul>
<li><strong>Modelovanie</strong> v CRISP-DM rieši 6 typov úloh: deskripcia, segmentácia, deskripcia konceptov, klasifikácia, predikcia, analýza závislostí.</li>
<li>Pre každú úlohu platí iná sada metód — klasifikácia má rozhodovacie stromy, predikcia regresiu a neurónové siete, segmentácia k-means a hierarchické zhlukovanie.</li>
<li><strong>Asociačné pravidlo X ⇒ Y</strong> má tri miery: <strong>support</strong> = P(X∩Y), <strong>confidence</strong> = P(Y|X), <strong>lift</strong> = P(X∩Y) / (P(X)·P(Y)).</li>
<li><strong>Apriori</strong> stojí na anti-monotónnosti: nadmnožina zriedkavého itemsetu je tiež zriedkavá — to umožňuje efektívne orezávanie.</li>
<li><strong>Sekvenčné pravidlá (PrefixSpan)</strong> zachovávajú poradie udalostí — vo WUM modelujú reálne navigačné cesty, nie len spoluvýskyt stránok v sedení.</li>
</ul>

{num:10,label:`P10 CRISP-DM VI`,name:`CRISP-DM VI — Evaluácia a deployment`,reading:`<h2>Téma 10: CRISP-DM VI — Evaluácia a deployment</h2>

<p>Po fáze modelovania prichádzajú dve záverečné fázy metodiky CRISP-DM: <strong>evaluácia výsledkov</strong> (overujeme, či model je platný a má zmysel) a <strong>deployment</strong> (využitie výsledkov v praxi). Bez nich je celý predošlý postup len akademické cvičenie — práve tu sa rozhoduje, či projekt prinesie hodnotu.</p>

<h3>1. Tri ciele fázy vyhodnotenia</h3>

<p>Vo fáze evaluácie sa uplatňujú najmä <strong>základné štatistické metódy</strong>. Slúžia trom účelom:</p>
<ol>
<li><strong>Overenie predpokladov</strong> použitých modelov (či sme nepoužili metódu na dáta, ktoré jej predpoklady porušujú).</li>
<li><strong>Porovnanie výsledkov</strong> — empirické pozorovania verzus teoretické predpovede modelu.</li>
<li><strong>Vizualizácia</strong> rozdielov a identifikácia extrémnych hodnôt.</li>
</ol>

<h3>2. Overenie predpokladov modelovania</h3>

<p>Každá štatistická metóda má svoje predpoklady. Ak ich poručíme, výsledky strácajú platnosť. Pred interpretáciou modelu preto overujeme:</p>
<ul>
<li><strong>Rozdelenie premennej</strong> — testy rozdelenia (napr. Kolmogorov-Smirnov, Shapiro-Wilk pre normalitu).</li>
<li><strong>Rovnosť rozptylov</strong> (homoskedasticita) — testy o rozptyle (F-test, Levene) a ich neparametrické alternatívy.</li>
<li><strong>Homogenita variančno-kovariančných matíc</strong> — multivariačné testy pre prípad viacerých premenných (Box M).</li>
<li><strong>Nezávislosť premenných</strong> — vzťahy medzi premennými (korelácie, chí-kvadrát pre kategoriálne).</li>
</ul>

<p>Princíp: pokiaľ <strong>p-hodnota > α</strong> (typicky 0,05), nemáme dôvod predpoklad zamietnuť a môžeme metódu použiť.</p>

<h3>3. Testovanie rozdielov medzi závislými vzorkami</h3>

<p>Keď porovnávame výsledky <strong>na tých istých objektoch v rôznych podmienkach</strong> (napr. tá istá webová časť pozorovaná v rôznych časových úsekoch), ide o <strong>závislé vzorky</strong>. Pre tieto situácie máme špecializované testy.</p>

<h4>Cochranov Q test</h4>
<p>Používa sa pre <strong>binárne dáta</strong> (úspech / neúspech, 1 / 0) pri <strong>k ≥ 2 podmienkach</strong> na tých istých subjektoch. Otázka, ktorú zodpovedá: <em>„Je pravdepodobnosť úspechu rovnaká vo všetkých podmienkach?"</em></p>

<pre><code>H0: P(uspech | podmienka_1) = P(uspech | podmienka_2) = ... = P(uspech | podmienka_k)
H1: aspon dve podmienky maju roznu pravdepodobnost uspechu

                k * (k-1) * sum_j (C_j - C/k)^2
            Q = ───────────────────────────────────
                k * R - sum_i (R_i)^2

kde:
  k   = pocet podmienok
  C_j = pocet uspechov v podmienke j
  C   = celkovy pocet uspechov
  R_i = pocet uspechov u subjektu i
  R   = celkovy sucet
</code></pre>
<p>Štatistika Q má pri platnosti H0 približne <strong>chí-kvadrát rozdelenie s k−1 stupňami voľnosti</strong>. Cochranov test je zovšeobecnením McNemarovho testu (ten je pre k = 2).</p>

<h4>Kendallov W koeficient konkordancie</h4>
<p>Kým Q test povie, či sa podmienky líšia, <strong>Kendallov W meria silu zhody</strong> (konkordancie) medzi subjektmi v poradí podmienok. Nadobúda hodnoty <strong>0 ≤ W ≤ 1</strong>:</p>
<ul>
<li><strong>W = 0</strong> — žiadna zhoda, subjekty hodnotia chaoticky.</li>
<li><strong>W = 1</strong> — dokonalá zhoda, všetky subjekty zoraďujú podmienky rovnako.</li>
</ul>

<pre><code>      12 * S
W = ─────────────
    m^2 * (k^3 - k)

kde:
  S = suma stvorcov odchyliek suctov poradi od ich priemeru
  m = pocet subjektov
  k = pocet podmienok
</code></pre>

<h4>Friedmanov test</h4>
<p>Alternatíva Cochranovho testu pre <strong>ordinálne dáta</strong> (poradové). Pracuje s poradiami namiesto binárnych hodnôt. H0 hovorí, že stredné poradie je rovnaké vo všetkých podmienkach. Je to neparametrická alternatíva opakovaných meraní ANOVA.</p>

<h3>4. Porovnanie empirických a teoretických počtov prístupov</h3>

<p>Model nám predpovedá <strong>teoretické pravdepodobnosti</strong> výberu webovej časti <em>j</em> v čase <em>i</em>. Empirické dáta (skutočné logy) dávajú <strong>relatívne početnosti prístupov</strong>. Otázka evaluácie: <em>Sedia tieto dva pohľady?</em></p>

<ul>
<li><strong>Porovnanie rozdelení</strong> — testy o strednej hodnote (t-test) a ich neparametrické alternatívy (Wilcoxon, Mann-Whitney).</li>
<li><strong>Porovnanie teoretických a empirických početností</strong> pre vybrané kategórie obsahu portálu — testy rozdelenia (chí-kvadrát test dobrej zhody).</li>
</ul>

<h3>5. Vizualizácia a identifikácia extrémov</h3>

<p>Čísla samy o sebe vyžadujú podporu zrakom. Dve kľúčové vizualizácie:</p>
<ol>
<li><strong>Rozdiely empirických a teoretických početností prístupov</strong> — graf zobrazí, kde model „strieľa vedľa". Tu hľadáme <strong>extrémne hodnoty</strong> pomocou popisnej štatistiky.</li>
<li><strong>Empirické vs. teoretické logity</strong> pre jednotlivé webové časti (okrem referenčnej, ktorá slúži ako základ porovnania).</li>
</ol>

<p>Logit je transformácia pravdepodobnosti: <code>logit(p) = ln(p / (1 − p))</code>. Mapuje interval (0; 1) na celú reálnu os, čím zviditeľní rozdiely v okolí 0 aj 1.</p>

<p><strong>Identifikácia extrémov</strong> v popisnej štatistike sa najčastejšie robí pravidlom: hodnota je extrém, ak leží mimo intervalu <code>[Q1 − 1,5·IQR ; Q3 + 1,5·IQR]</code>, kde IQR = Q3 − Q1 (medzikvartilové rozpätie). Extrémy buď signalizujú chybu v dátach, alebo zaujímavý jav, ktorý si zaslúži ďalšie skúmanie.</p>

<h3>6. Validácia výsledkov</h3>

<p>Validácia znamená ubezpečiť sa, že zistené vzory <strong>nie sú náhodné</strong> a <strong>preniknú aj na nové dáta</strong>. Praktické postupy:</p>
<ul>
<li>Krížová validácia (k-fold) — rozdelíme dáta na trénovaciu a testovaciu časť.</li>
<li>Testovanie na nezávislej vzorke (hold-out).</li>
<li>Porovnanie metrík modelu (presnosť, odvolanie, F1) na trénovacej vs. testovacej sade — veľký rozdiel znamená <strong>preučenie</strong>.</li>
<li>Pri štatistickom modelovaní: kontrola p-hodnôt a intervalov spoľahlivosti.</li>
</ul>

<h3>7. Deployment — využitie výsledkov</h3>

<p>Záverečná fáza CRISP-DM. Model alebo zistenie sa zavedie do prevádzky a začne generovať hodnotu. Vo všeobecnosti rozdeľujeme <strong>aplikácie web log miningu do piatich kategórií</strong>:</p>

<ol>
<li><strong>Personalizácia</strong> — prispôsobenie obsahu konkrétnemu užívateľovi (odporúčania, dynamické menu). Metódy: segmentácia, klasifikácia, analýza závislostí.</li>
<li><strong>Zlepšovanie systémov</strong> (marketing, plánovanie údržby) — predpoveď zaťaženia, optimalizácia kampaní. Metóda: predikcia.</li>
<li><strong>Modifikácia webových stránok</strong> (dizajn, reštrukturalizácia) — preusporiadanie navigácie podľa skutočného správania. Metóda: analýza závislostí.</li>
<li><strong>Business intelligence / e-commerce optimalizácia</strong> — konverzné lieviky, analýza nákupných ciest, A/B testy.</li>
<li><strong>Charakteristika používania</strong> (security, audit) — detekcia botov, anomálií, podvodov. Metódy: profilovanie, detekcia odchýlok.</li>
</ol>

<p>Konkrétne príklady úloh a metód použiteľných v deploymente:</p>
<ul>
<li>Analýza návštevnosti — analýza závislostí.</li>
<li>Plánovanie údržby — predikcia.</li>
<li>Reštrukturalizácia — analýza závislostí.</li>
<li>Personalizácia — segmentácia, klasifikácia, analýza závislostí.</li>
</ul>

<h3>8. Záverečný pohľad na celý proces</h3>

<p>Cieľom celej série prednášok bolo predstaviť šesť fáz získavania znalostí. Najviac sme sa zamerali na <strong>zdroje dát o používaní webu</strong> (logy), no rovnaký postup je platný aj pre objavovanie znalostí <strong>z databáz alebo textov</strong>. Najväčšie rozdiely medzi týmito oblasťami sú vo fáze <strong>prípravy dát</strong>. Práve príprava dát predstavuje <strong>časovo najnáročnejšiu fázu</strong> celého procesu — zložitosť závisí od použitého zdroja dát.</p>

<li><strong>Evaluácia má 3 ciele</strong>: overiť predpoklady modelu, porovnať empirické s teoretickými výsledkami a vizualizovať rozdiely.</li>
<li><strong>Cochranov Q test</strong> rieši binárne dáta v k podmienkach na tých istých subjektoch (H0: P(úspech) je rovnaká); <strong>Kendallov W</strong> meria silu zhody (0 = chaos, 1 = dokonalá zhoda); <strong>Friedman</strong> je ordinálna alternatíva.</li>

 {type:`quiz`,q:`Porovnanie rozdelenia pravdepodobnosti empirických relatívnych početností prístupov a odhadnutých pravdepodobností výberu webovej časti j v čase i sa podľa prednášky 10 robí pomocou:`,options:[`Testov o strednej hodnote a ich neparametrických alternatív`,`Testov o rozptyle a ich neparametrických alternatív`,`Testov rozdelenia premennej`,`Testov nezávislosti premenných`],correct:0,explain:`Prednáška 10 doslovne: porovnanie rozdelenia pravdepodobnosti empirických a odhadnutých pravdepodobností výberu sa robí testami o strednej hodnote a ich neparametrickými alternatívami.`},
 {type:`quiz`,q:`Porovnanie teoretických a empirických početností prístupov pre vybrané kategórie obsahu portálu sa podľa prednášky 10 vykonáva pomocou:`,options:[`Testov rozdelenia`,`Testov o rozptyle`,`Testov vzťahov medzi premennými`,`Multivariačných testov o rozptyle`],correct:0,explain:`Prednáška 10 uvádza, že porovnanie teoretických a empirických početností prístupov pre vybrané kategórie obsahu portálu sa robí testami rozdelenia.`},
 {type:`match`,prompt:`Priraď úlohu vo fáze vyhodnotenia výsledkov k vhodnej skupine metód (podľa prednášky 10).`,pairs:[[`Porovnanie empirických a odhadnutých pravdepodobností výberu webovej časti`,`Testy o strednej hodnote a ich neparametrické alternatívy`],[`Porovnanie teoretických a empirických početností prístupov pre kategórie obsahu`,`Testy rozdelenia`],[`Vizualizácia rozdielov empirických a teoretických početností a logitov`,`Popisná štatistika`]]},
 {type:`flash`,q:`Čo je logit a prečo sa v prednáške 10 vizualizuje?`,a:`Logit = <code>ln(p / (1−p))</code>, logaritmus pomeru šancí (odds). Vizualizuje sa pre <b>jednotlivé webové časti okrem referenčnej</b>, aby sa graficky porovnali <b>empirické a teoretické pravdepodobnosti výberu</b> webovej časti — odchýlky odhalia, kde model nesedí s realitou. Patrí pod <b>popisnú štatistiku</b>.`},
 {type:`fill`,text:`Vizualizujú sa empirické a teoretické logity pre jednotlivé webové časti, okrem ___ časti.`,answer:`referencnej`,alts:[`referenčnej`,`referencnej`]},
 {type:`cat`,prompt:`Roztried metódy vyhodnotenia výsledkov podľa ich účelu (overenie / porovnanie / vizualizácia).`,groups:{"Overenie predpokladov":[`Test rozdelenia premennej`,`Univariačný test o rozptyle`,`Multivariačný test homogenity variančno-kovariančných matíc`],"Porovnanie výsledkov":[`Test o strednej hodnote (alebo jeho neparametrická alternatíva)`,`Test rozdelenia pre porovnanie empirických a teoretických početností`],"Vizualizácia":[`Vizualizácia rozdielov empirických a teoretických početností`,`Vizualizácia logitov pre jednotlivé webové časti`]}},
 {type:`flash`,q:`Prečo prednáška 10 pri každom type testu spomína aj 'neparametrické alternatívy'?`,a:`Klasické (parametrické) testy predpokladajú konkrétne rozdelenie dát (často normálne). Ak tento predpoklad neplatí, používa sa <b>neparametrická alternatíva</b>, ktorá nepredpokladá konkrétne rozdelenie a typicky pracuje s poradiami. Prednáška spomína tieto alternatívy pri testoch o rozptyle, o strednej hodnote aj pri multivariačných testoch.`},
 {type:`fill`,text:`Vo fáze vyhodnotenia výsledkov sa pri logitoch a rozdieloch empirických a teoretických početností používa popisná ___.`,answer:`statistika`,alts:[`štatistika`,`statistika`]},
 {type:`flash`,q:`Do koľkých všeobecných kategórií aplikácií rozdeľuje prednáška 10 web log mining a aké to sú?`,a:`Do <b>5 kategórií</b>:<br><b>1.</b> Personalizácia<br><b>2.</b> Zlepšovanie systémov<br><b>3.</b> Modifikácia webových stránok<br><b>4.</b> Business intelligence<br><b>5.</b> Charakteristika používania`},
 {type:`fill`,text:`Všeobecne môžeme aplikácie web log miningu rozdeliť do ___ kategórií.`,answer:`piatich`,alts:[`5`,`piatich`,`5tich`]},
 {type:`match`,prompt:`Priraď aplikáciu web log miningu k použitej dolovacej technike (podľa prednášky 10).`,pairs:[[`Analýza návštevnosti`,`Analýza závislostí`],[`Plánovanie údržby`,`Predikcia`],[`Reštrukturalizácia webu`,`Analýza závislostí`],[`Personalizácia`,`Segmentácia, klasifikácia, analýza závislostí`]]},
 {type:`quiz`,q:`Pre ktorú aplikáciu sa podľa prednášky 10 výslovne využíva PREDIKCIA?`,options:[`Plánovanie údržby`,`Personalizácia`,`Analýza návštevnosti`,`Reštrukturalizácia webu`],correct:0,explain:`Prednáška 10 priamo uvádza dvojicu: Plánovanie údržby — Predikcia. Ostatné aplikácie využívajú segmentáciu, klasifikáciu alebo analýzu závislostí.`},
 {type:`quiz`,q:`Pre ktorú aplikáciu prednáška 10 uvádza KOMBINÁCIU troch techník (segmentácia + klasifikácia + analýza závislostí)?`,options:[`Personalizácia`,`Analýza návštevnosti`,`Plánovanie údržby`,`Reštrukturalizácia`],correct:0,explain:`Personalizácia ako najkomplexnejšia aplikácia vyžaduje rozdeliť používateľov (segmentácia), zaradiť ich (klasifikácia) a nájsť vzťahy medzi prístupmi (analýza závislostí).`},
 {type:`order`,prompt:`Usporiadaj fázy CRISP-DM v správnom poradí (rámec pre celú prednášku).`,items:[`Porozumenie problému`,`Porozumenie dátam`,`Príprava dát`,`Modelovanie`,`Vyhodnotenie výsledkov`,`Využitie výsledkov (deployment)`]},
 {type:`quiz`,q:`Ktorá fáza CRISP-DM je podľa záveru prednášky 10 časovo najnáročnejšia v rámci celého procesu objavovania znalostí?`,options:[`Príprava dát`,`Modelovanie`,`Vyhodnotenie výsledkov`,`Využitie výsledkov`],correct:0,explain:`Záver prednášky 10 doslovne uvádza, že príprava dát predstavuje časovo najnáročnejšiu fázu celého procesu objavovania znalostí; jej zložitosť závisí od použitého zdroja dát.`},
 {type:`flash`,q:`V čom sú podľa záveru prednášky 10 najväčšie rozdiely medzi oblasťami objavovania znalostí (z webu, z databáz, z textov) pri riadení procesu metodikou CRISP-DM?`,a:`Najväčšie rozdiely sú vo <b>fáze prípravy dát</b>. Modelovanie a vyhodnotenie sa robia podobne, ale <b>predspracovanie</b> silne závisí od <b>typu zdroja dát</b> (logy vs. databázové tabuľky vs. text). Zložitosť prípravy dát teda závisí od použitého zdroja.`},
 {type:`fill`,text:`Zložitosť prípravy dát podľa záveru prednášky 10 závisí od použitého ___ dát.`,answer:`zdroja`,alts:[`zdroja`,`zdroju`]}
]}
];

/* ===== rozcestník + pokrok (v pamäti, navyše localStorage) ===== */
const PROG={};
TOPICS.forEach(t=>{ try{ const v=JSON.parse(localStorage.getItem('oz_prednasky_'+t.num)||'null'); if(v) PROG[t.num]=v; }catch(e){} });
function saveProg(num,obj){ PROG[num]=obj; try{ localStorage.setItem('oz_prednasky_'+num, JSON.stringify(obj)); }catch(e){} }
const roz=document.getElementById('roz'), testDiv=document.getElementById('test'), grid=document.getElementById('grid');
function renderGrid(){
  grid.innerHTML='';
  TOPICS.forEach(t=>{
    const o=PROG[t.num]||null;
    const n=o&&o.n?o.n:t.tasks.length;
    const answered=o?(o.answered!=null?o.answered:(o.done?n:0)):0;
    const touched=o?(o.touched!=null?o.touched:answered):0;
    const best=o?(o.best!=null?o.best:0):0;
    const barPct=o?Math.round(touched/n*100):0;
    let label;
    if(!o||touched===0) label='zatiaľ neskúšané';
    else if(o.done) label='dokončené · najlepšie '+best+'%';
    else label='rozpracované '+touched+'/'+n+(best?(' · najlepšie '+best+'%'):'');
    const b=el('button','tile');
    b.innerHTML='<div class="tnum">TÉMA '+t.num+'</div>'
      +(best===100?'<div class="badge">🏆</div>':'')
      +'<div class="tname">'+t.label+'</div>'
      +'<div class="pbar"><div class="pfill" style="width:'+barPct+'%"></div></div>'
      +'<div class="pct">'+label+'</div>';
    b.onclick=()=>openTopic(t);
    grid.appendChild(b);
  });
}
function openTopic(t){ roz.style.display='none'; testDiv.style.display='block'; testDiv.innerHTML=''; window.scrollTo(0,0); runTest(t,testDiv,backToGrid,saveProg); }
function backToGrid(){ testDiv.style.display='none'; testDiv.innerHTML=''; roz.style.display='block'; renderGrid(); window.scrollTo(0,0); }
document.getElementById('reset').onclick=()=>{ if(confirm('Vynulovať pokrok vo všetkých témach?')){ TOPICS.forEach(t=>{ delete PROG[t.num]; try{localStorage.removeItem('oz_prednasky_'+t.num);}catch(e){} }); renderGrid(); } };
renderGrid();
</script>
