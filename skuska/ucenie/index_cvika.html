&lt;li&gt;&lt;b&gt;Prečo logaritmus?&lt;/b&gt; Slovo, ktoré sa objaví 100×, nie je 100× dôležitejšie ako slovo s 1 výskytom. Log to stlmí — analógia: výška platu vs. spokojnosť.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Prečo IDF?&lt;/b&gt; Slová ako „the" sú všade — nesú nulovú informáciu. IDF ich potrestá nízkou váhou a zvýrazní vzácne, charakteristické slová.&lt;/li&gt;
&lt;/ul&gt;&lt;/div&gt;

&lt;div class="thbox thnabif"&gt;&lt;h4&gt;Nabif (vzorce, čísla, idiómy)&lt;/h4&gt;
&lt;ul&gt;
&lt;li&gt;&lt;b&gt;IDF&lt;/b&gt; = log&lt;sub&gt;10&lt;/sub&gt;(N / df), kde N = počet dokumentov, df = v koľkých sa slovo objavilo. Pre N=5 a slovo v 1 dokumente: log&lt;sub&gt;10&lt;/sub&gt;(5/1) ≈ &lt;b&gt;0.699&lt;/b&gt;. Slovo v všetkých 5: log&lt;sub&gt;10&lt;/sub&gt;(5/5) = &lt;b&gt;0&lt;/b&gt;.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;TF-IDF&lt;/b&gt; = (1 + log&lt;sub&gt;10&lt;/sub&gt;(tf)) × IDF — kombinácia „ako často v tomto dokumente" × „aké vzácne v korpuse".&lt;/li&gt;
&lt;li&gt;Vstup: &lt;code&gt;in/*.txt&lt;/code&gt; (5 dokumentov). Výstup: 1 Excel, &lt;b&gt;5 hárkov&lt;/b&gt; (wf, binary, log, idf, tf-idf).&lt;/li&gt;
&lt;li&gt;Pred lematizáciou vždy &lt;code&gt;.lower()&lt;/code&gt; — inak „The" a „the" sú dva riadky tabuľky.&lt;/li&gt;
&lt;li&gt;&lt;code&gt;sent_tokenize&lt;/code&gt; pred &lt;code&gt;word_tokenize&lt;/code&gt; — bodka je aj v skratkách („U.S.A."), naivné delenie podľa bodky by zlyhalo.&lt;/li&gt;
&lt;/ul&gt;&lt;/div&gt;`,
    '04': `&lt;h2&gt;Krok 04 — POS tagging a lematizácia&lt;/h2&gt;
&lt;p class="thintro"&gt;Predtým sme so slovami zaobchádzali ako s &quot;kúskami textu&quot;. Teraz každému slovu pridáme gramatickú nálepku (podstatné meno, sloveso...) a zredukujeme ho na základný slovníkový tvar (lemma). Vďaka tomu &lt;b&gt;cats&lt;/b&gt;, &lt;b&gt;Cat&lt;/b&gt; aj &lt;b&gt;cat's&lt;/b&gt; splynú do jedného slova &lt;code&gt;cat&lt;/code&gt;.&lt;/p&gt;

&lt;h3&gt;Ako sme to robili v projekte&lt;/h3&gt;
&lt;p&gt;Pre každý z 5 anglických .txt súborov: rozdelíme text na vety (&lt;code&gt;sent_tokenize&lt;/code&gt;), vetu na slová (&lt;code&gt;word_tokenize&lt;/code&gt;), na &lt;b&gt;celú vetu naraz&lt;/b&gt; pustíme &lt;code&gt;pos_tag&lt;/code&gt; (potrebuje kontext susedov!), vyhodíme interpunkciu a stop-slová, a zvyšným slovám zistíme lemmu cez WordNet. Výsledok ide do &lt;code&gt;out/identifikacia.xlsx&lt;/code&gt; so stĺpcami Subor, ID_veta, Slovo, Tag, Lemma, Poradie, Slovny_Druh.&lt;/p&gt;
&lt;pre&gt;&lt;code&gt;tagged = nltk.pos_tag(words)              # [(&quot;The&quot;,&quot;DT&quot;), (&quot;cats&quot;,&quot;NNS&quot;), ...]
for word, tag in tagged:
    if all(c in string.punctuation for c in word): continue
    if word.lower() in stop_words: continue
    lemma = lemmatizer.lemmatize(word.lower(), pos=get_wordnet_pos(tag))&lt;/code&gt;&lt;/pre&gt;

&lt;h3&gt;Vizuálne&lt;/h3&gt;
&lt;table class="thtable"&gt;
&lt;tr&gt;&lt;th&gt;Slovo&lt;/th&gt;&lt;th&gt;POS tag&lt;/th&gt;&lt;th&gt;WordNet kat.&lt;/th&gt;&lt;th&gt;Lemma&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;The&lt;/td&gt;&lt;td&gt;DT&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;&lt;i&gt;vyhodené (stop-slovo)&lt;/i&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;cats&lt;/td&gt;&lt;td&gt;NNS&lt;/td&gt;&lt;td&gt;n&lt;/td&gt;&lt;td&gt;&lt;b&gt;cat&lt;/b&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;were&lt;/td&gt;&lt;td&gt;VBD&lt;/td&gt;&lt;td&gt;v&lt;/td&gt;&lt;td&gt;&lt;b&gt;be&lt;/b&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;running&lt;/td&gt;&lt;td&gt;VBG&lt;/td&gt;&lt;td&gt;v&lt;/td&gt;&lt;td&gt;&lt;b&gt;run&lt;/b&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;.&lt;/td&gt;&lt;td&gt;.&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;&lt;i&gt;vyhodené (interpunkcia)&lt;/i&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;/table&gt;
&lt;p&gt;&lt;b&gt;Pipeline:&lt;/b&gt; text → vety → slová → POS tag → filter (interpunkcia + stop-slová) → lemma → riadok tabuľky.&lt;/p&gt;

&lt;div class="thbox thpochop"&gt;&lt;h4&gt;Pochop (princíp, prečo)&lt;/h4&gt;&lt;ul&gt;
&lt;li&gt;&lt;b&gt;Prečo tagovať PRED filtrovaním?&lt;/b&gt; Tagger pozerá na susedov vo vete. Slovo &lt;i&gt;&quot;lead&quot;&lt;/i&gt; môže byť kov (NN) aj &quot;viesť&quot; (VB) — bez plnej vety vrátane &quot;the&quot; a bodky tagger stratí kontext.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Prečo lematizovať?&lt;/b&gt; Aby sa &lt;code&gt;running, ran, runs&lt;/code&gt; spočítali ako jedno slovo &lt;code&gt;run&lt;/code&gt;. Inak by sa frekvencia rozdrobila do mnohých tvarov a štatistika by klamala.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Prečo Munk zvýrazňuje substantíva?&lt;/b&gt; Prednáška 3 (kap. SUBSTANTÍVA) hovorí, že podstatné mená nesú najviac obsahu textu. Stĺpec &lt;code&gt;Slovny_Druh&lt;/code&gt; (N/V/J/R) umožní neskôr vybrať len &quot;N&quot; a pracovať s nimi samostatne.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Stop-slová&lt;/b&gt; (the, is, on) sú tak časté, že nerozlišujú dokumenty — len by zaplnili tabuľku šumom.&lt;/li&gt;
&lt;/ul&gt;&lt;/div&gt;

&lt;div class="thbox thnabif"&gt;&lt;h4&gt;Nabif (vzorce, čísla, idiómy)&lt;/h4&gt;&lt;ul&gt;
&lt;li&gt;&lt;b&gt;Treebank → WordNet mapovanie:&lt;/b&gt; V* → &lt;code&gt;v&lt;/code&gt;, J* → &lt;code&gt;a&lt;/code&gt;, R* → &lt;code&gt;r&lt;/code&gt;, inak &lt;code&gt;n&lt;/code&gt; (bezpečná default-voľba). WordNet pozná len 4 kategórie.&lt;/li&gt;
&lt;li&gt;&lt;code&gt;nltk.download('punkt_tab','averaged_perceptron_tagger_eng','stopwords','wordnet')&lt;/code&gt; — pri prvom behu sa stiahnu modely.&lt;/li&gt;
&lt;li&gt;Stop-slová ako &lt;code&gt;set(...)&lt;/code&gt; → O(1) lookup namiesto O(n) v zozname.&lt;/li&gt;
&lt;li&gt;&lt;code&gt;rows = []&lt;/code&gt; potom &lt;code&gt;pd.DataFrame(rows)&lt;/code&gt; je &lt;b&gt;rádovo rýchlejšie&lt;/b&gt; než &lt;code&gt;df.append&lt;/code&gt; v cykle.&lt;/li&gt;
&lt;li&gt;&lt;code&gt;word.lower()&lt;/code&gt; pred lemmou — &quot;Cats&quot; aj &quot;cats&quot; majú lemmu &quot;cat&quot;; stop-slovník je tiež malými písmenami.&lt;/li&gt;
&lt;/ul&gt;&lt;/div&gt;`,
  },
  2: {
    '01': `&lt;h2&gt;Krok 01 — Parsovanie a čistenie Apache logu&lt;/h2&gt;
&lt;p class="thintro"&gt;Surový log webservera (cca &lt;b&gt;257 000 riadkov&lt;/b&gt; za jeden deň) je zmes skutočných návštev a technického "šumu" — obrázkov, štýlov, chýb a robotov. V tomto kroku riadky &lt;b&gt;rozparzujeme&lt;/b&gt; (rozložíme na stĺpce) a &lt;b&gt;vyhodíme smetie&lt;/b&gt;, aby zostali len reálne otvorenia stránok ľuďmi.&lt;/p&gt;

&lt;h3&gt;Ako sme to robili v projekte&lt;/h3&gt;
&lt;p&gt;Každý riadok logu má rovnakú "šablónu" (IP, dátum, metóda, URL, kód, referrer, agent). Použili sme &lt;b&gt;regulárny výraz&lt;/b&gt; (regex) — to je vzor, ktorý povie "tu je IP, tu dátum, tu URL". Riadky čítame &lt;i&gt;po jednom&lt;/i&gt; (nie celý súbor naraz), aby sme nezaplnili pamäť. Z každého riadku si vytiahneme len 7 stĺpcov — &lt;code&gt;Cookie&lt;/code&gt;, &lt;code&gt;user&lt;/code&gt; a &lt;code&gt;Bytes&lt;/code&gt; podľa zadania zahadzujeme. Potom postupne aplikujeme 3 filtre.&lt;/p&gt;
&lt;pre&gt;&lt;code&gt;pattern = re.compile(
  r'^(\S+)\s+\S+\s+\S+\s+'        # IP + preskoč Cookie, user
  r'\[([^\]]+)\]\s+'              # [dátum]
  r'"(\S+)\s+(\S+)\s*\S*"\s+'     # "GET /url HTTP/1.1"
  r'(\d{3})\s+(\S+)\s+'           # 200  20925
  r'"([^"]*)"\s+"([^"]*)"'        # "referrer" "agent"
)&lt;/code&gt;&lt;/pre&gt;

&lt;h3&gt;Vizuálne — pipeline filtrov&lt;/h3&gt;
&lt;table class="thtable"&gt;
&lt;tr&gt;&lt;th&gt;Krok&lt;/th&gt;&lt;th&gt;Čo vyhodíme&lt;/th&gt;&lt;th&gt;Prečo&lt;/th&gt;&lt;th&gt;~Zostáva&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Parse&lt;/td&gt;&lt;td&gt;nevalidné riadky&lt;/td&gt;&lt;td&gt;regex ich nematchne&lt;/td&gt;&lt;td&gt;~257 000&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Metóda&lt;/td&gt;&lt;td&gt;POST, HEAD&lt;/td&gt;&lt;td&gt;to nie sú otvorenia stránok&lt;/td&gt;&lt;td&gt;menej&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Kód&lt;/td&gt;&lt;td&gt;4xx, 5xx&lt;/td&gt;&lt;td&gt;user stránku &lt;i&gt;nevidel&lt;/i&gt; (404, 500)&lt;/td&gt;&lt;td&gt;menej&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Prípona&lt;/td&gt;&lt;td&gt;.jpg .png .css .js .svg ...&lt;/td&gt;&lt;td&gt;to je len výzdoba stránky&lt;/td&gt;&lt;td&gt;&lt;b&gt;~57 650&lt;/b&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;/table&gt;

&lt;div class="thbox thpochop"&gt;&lt;h4&gt;Pochop (princíp, prečo)&lt;/h4&gt;&lt;ul&gt;
&lt;li&gt;&lt;b&gt;Munk (prednáška 5)&lt;/b&gt;: príprava dát = "čistenie súboru od nepotrebných dát" + "čistenie od robotov". Bez tohto kroku by sa nedali objaviť žiadne vzory správania.&lt;/li&gt;
&lt;li&gt;Keď user otvorí 1 stránku, prehliadač stiahne aj &lt;b&gt;10–100 ďalších súborov&lt;/b&gt; (obrázky, CSS, JS). V logu sú to samostatné GET-y, ale človek si ich vedome "nenavštívil".&lt;/li&gt;
&lt;li&gt;HTTP kódy: &lt;b&gt;2xx&lt;/b&gt; = OK, &lt;b&gt;3xx&lt;/b&gt; = presmerovanie (user nakoniec niečo videl), &lt;b&gt;4xx/5xx&lt;/b&gt; = chyba → návšteva sa de facto nestala.&lt;/li&gt;
&lt;li&gt;Regex je len &lt;i&gt;šablóna&lt;/i&gt; — &lt;code&gt;()&lt;/code&gt; znamená "toto si zapamätaj", &lt;code&gt;\S+&lt;/code&gt; = "ľubovoľný neprázdny text".&lt;/li&gt;
&lt;/ul&gt;&lt;/div&gt;

&lt;div class="thbox thnabif"&gt;&lt;h4&gt;Nabif (vzorce, čísla, idiómy)&lt;/h4&gt;&lt;ul&gt;
&lt;li&gt;Vstup: &lt;code&gt;Log_jeden_den.log&lt;/code&gt; ≈ &lt;b&gt;257 000 riadkov&lt;/b&gt; → výstup &lt;code&gt;05_cleaned_log.csv&lt;/code&gt; ≈ &lt;b&gt;57 650 riadkov&lt;/b&gt;.&lt;/li&gt;
&lt;li&gt;Necháme len &lt;b&gt;GET&lt;/b&gt; metódu; vyhodíme POST a HEAD.&lt;/li&gt;
&lt;li&gt;Necháme len status v rozsahu &lt;b&gt;200–399&lt;/b&gt; (&lt;code&gt;between(200, 399)&lt;/code&gt; — vrátane oboch koncov).&lt;/li&gt;
&lt;li&gt;Statické prípony preč: &lt;code&gt;bmp, jpg, jpeg, png, gif, css, flv, ico, swf, rss, xml, cur, js, json, svg, woff/woff2, eot, ttf, otf&lt;/code&gt;.&lt;/li&gt;
&lt;li&gt;Idióm: &lt;code&gt;(?:\?|$)&lt;/code&gt; za príponou — aby sa nematchli URL ako &lt;code&gt;/clanok.cssicky/&lt;/code&gt;.&lt;/li&gt;
&lt;li&gt;Stĺpce vo výstupe: &lt;code&gt;IP, DateTime, RequestMethod, URL, StatusCode, Referrer, Agent&lt;/code&gt; (Cookie, user, Bytes podľa zadania zahodené).&lt;/li&gt;
&lt;/ul&gt;&lt;/div&gt;`,
    '02': `&lt;h2&gt;Krok 02 — Hlbšie čistenie logu (dalsie_cistenie.py)&lt;/h2&gt;
&lt;p class="thintro"&gt;V prvom kole sme vyhodili obrázky, CSS a chybové stavy. Teraz ideme ďalej: chceme z logu vyhodiť všetko, čo &lt;b&gt;nie je skutočná návšteva človeka&lt;/b&gt; — roboty, dvojkliky, interné URL a presmerovania. Cieľ: dostať sa z ~57 000 riadkov na zhruba &lt;b&gt;31 500&lt;/b&gt; reálnych kliknutí.&lt;/p&gt;

&lt;h3&gt;Ako sme to robili v projekte&lt;/h3&gt;
&lt;p&gt;Skript aplikuje &lt;b&gt;päť filtrov za sebou&lt;/b&gt; na tabuľku z prvého kola. Najprv vyhodí roboty (Google, Yahoo, Bing…) podľa kľúčových slov v hlavičke &lt;code&gt;User-Agent&lt;/code&gt;. Potom zmaže prístupy k súboru &lt;code&gt;robots.txt&lt;/code&gt; (ten číta iba bot, človek nikdy). Tretí krok zlúči duplicitné kliky (rovnaké IP + čas + URL = dvojklik alebo F5). Štvrtý filter vyhodí URL, ktoré nie sú „stránka“ — náhľady obrázkov, PDF, RSS feedy, &lt;code&gt;/component/&lt;/code&gt; cesty. Posledný krok ponechá len úspešné zobrazenia (HTTP stav 200–299).&lt;/p&gt;
&lt;pre&gt;&lt;code&gt;bot_pattern = re.compile(r'bot|crawl|spider|slurp|...', re.IGNORECASE)
df = df[~df["Agent"].str.contains(bot_pattern, na=False)]
df = df[~df["URL"].str.contains(r'robots\.txt', case=False, na=False)]
df = df.drop_duplicates(subset=["IP", "DateTime", "URL"])
df = df[df["StatusCode"].between(200, 299)]&lt;/code&gt;&lt;/pre&gt;

&lt;h3&gt;Vizuálne — postupné filtrovanie&lt;/h3&gt;
&lt;table class="thtable"&gt;
&lt;tr&gt;&lt;th&gt;Krok&lt;/th&gt;&lt;th&gt;Filter&lt;/th&gt;&lt;th&gt;Zostalo riadkov&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Vstup&lt;/td&gt;&lt;td&gt;po 1. kole čistenia&lt;/td&gt;&lt;td&gt;~57 000&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;1&lt;/td&gt;&lt;td&gt;preč roboty (User-Agent)&lt;/td&gt;&lt;td&gt;menej&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;2&lt;/td&gt;&lt;td&gt;preč prístup k robots.txt&lt;/td&gt;&lt;td&gt;menej&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;3&lt;/td&gt;&lt;td&gt;preč duplicitné kliky&lt;/td&gt;&lt;td&gt;menej&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;4&lt;/td&gt;&lt;td&gt;preč obrázky/PDF/feed/component&lt;/td&gt;&lt;td&gt;menej&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;5&lt;/td&gt;&lt;td&gt;len HTTP 2xx (úspech)&lt;/td&gt;&lt;td&gt;&lt;b&gt;~31 500&lt;/b&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;/table&gt;

&lt;div class="thbox thpochop"&gt;&lt;h4&gt;Pochop (princíp, prečo)&lt;/h4&gt;
&lt;ul&gt;
&lt;li&gt;&lt;b&gt;Prečo vôbec čistiť?&lt;/b&gt; WUM (Web Usage Mining) hľadá vzorce v správaní &lt;i&gt;ľudí&lt;/i&gt;. Ak v dátach nechám robota, ktorý za noc prešiel 5000 stránok, „typický návštevník“ bude vyzerať ako maniak — výsledky budú skreslené.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Robot sa väčšinou sám priznáva&lt;/b&gt; v hlavičke User-Agent („Googlebot/2.1“). Stačí v texte nájsť slovo „bot“, „crawler“, „spider“ — preto použijeme regulárny výraz (vzor na hľadanie textu).&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Dvojklik nie sú dve návštevy.&lt;/b&gt; Rovnaké IP + presne ten istý čas + tá istá URL = ten istý úmysel. Ponecháme jeden riadok, ostatné zahodíme.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Presmerovanie (3xx) by sa rátalo dvakrát&lt;/b&gt; — raz ako presmerovanie a raz ako cieľová stránka. Preto ponecháme iba stav 2xx (skutočne zobrazené).&lt;/li&gt;
&lt;/ul&gt;&lt;/div&gt;

&lt;div class="thbox thnabif"&gt;&lt;h4&gt;Nabif (vzorce, čísla, idiómy)&lt;/h4&gt;
&lt;ul&gt;
&lt;li&gt;&lt;b&gt;Munk — 4 metódy detekcie robotov&lt;/b&gt; (prednáška 5): (1) podľa User-Agent reťazca, (2) podľa zoznamu známych IP, (3) podľa prístupu k &lt;code&gt;robots.txt&lt;/code&gt;, (4) podľa prístupu k skrytému odkazu. My používame &lt;b&gt;1 + 3&lt;/b&gt; — najspoľahlivejšie bez externých zoznamov.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Idióm pandas „opačný filter“:&lt;/b&gt; &lt;code&gt;df[~df["X"].str.contains(vzor, na=False)]&lt;/code&gt; — vlnovka &lt;code&gt;~&lt;/code&gt; otáča pravdivosť, &lt;code&gt;na=False&lt;/code&gt; berie prázdne ako „nezhoda“.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Duplicitný klik:&lt;/b&gt; &lt;code&gt;drop_duplicates(subset=["IP","DateTime","URL"])&lt;/code&gt; — prvý výskyt ostane.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;HTTP stavy:&lt;/b&gt; 2xx = OK zobrazené, 3xx = presmerovanie, 4xx = chyba klienta, 5xx = chyba servera. Ponechávame iba 2xx.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Výsledok:&lt;/b&gt; 57 000 → ~31 500 riadkov, ktoré sú vstupom pre cvičenie 2 (sedenia).&lt;/li&gt;
&lt;/ul&gt;&lt;/div&gt;`,
    '03': `&lt;h2&gt;Krok 03 — Identifikácia IP adries robotov&lt;/h2&gt;
&lt;p class="thintro"&gt;V logu sú zmiešaní ľudia a automatické programy (roboti, napr. &lt;b&gt;Googlebot&lt;/b&gt;). V tomto kroku zistíme, ktoré IP adresy patria robotom — aby sme ich neskôr mohli vyhodiť.&lt;/p&gt;

&lt;h3&gt;Ako sme to robili v projekte&lt;/h3&gt;
&lt;p&gt;Použili sme jednoduchý trik: na webe existuje malý súbor &lt;code&gt;robots.txt&lt;/code&gt;, ktorý je &lt;b&gt;návod pre robotov&lt;/b&gt; — bežný človek v prehliadači si ho nikdy nepýta (neexistuje naň link). Preto platí: ak nejaká IP stiahla &lt;code&gt;robots.txt&lt;/code&gt;, je to skoro určite robot. Prešli sme log riadok po riadku, regexom vytiahli URL a IP, a zapamätali si IP-čky tých, čo žiadali &lt;code&gt;robots.txt&lt;/code&gt;.&lt;/p&gt;
&lt;pre&gt;&lt;code&gt;url = m.group(4)
if "robots.txt" in url.lower():
    rows.append({"IP": m.group(1)})&lt;/code&gt;&lt;/pre&gt;
&lt;p&gt;Výsledok uložíme do &lt;code&gt;07_robot_ips.csv&lt;/code&gt; — &lt;b&gt;333 záznamov&lt;/b&gt; (aj s opakovaniami, ak tá istá IP pýtala robots.txt viackrát).&lt;/p&gt;

&lt;h3&gt;Vizuálne&lt;/h3&gt;
&lt;pre&gt;&lt;code&gt;log riadok:  192.168.0.1 ... "GET /robots.txt HTTP/1.1" ...
                ↓ regex
            IP = 192.168.0.1, URL = /robots.txt
                ↓ filter "robots.txt" in URL
            ULOZ do zoznamu robotov
                ↓
            07_robot_ips.csv (333 riadkov)&lt;/code&gt;&lt;/pre&gt;
&lt;table class="thtable"&gt;&lt;tr&gt;&lt;th&gt;URL v žiadosti&lt;/th&gt;&lt;th&gt;Kto to bol?&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;code&gt;/studium/programy&lt;/code&gt;&lt;/td&gt;&lt;td&gt;človek&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;code&gt;/robots.txt&lt;/code&gt;&lt;/td&gt;&lt;td&gt;&lt;b&gt;robot&lt;/b&gt; → zapíš IP&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;

&lt;div class="thbox thpochop"&gt;&lt;h4&gt;Pochop (princíp, prečo)&lt;/h4&gt;&lt;ul&gt;
&lt;li&gt;&lt;b&gt;Prečo vyhadzujeme robotov:&lt;/b&gt; chceme analyzovať správanie &lt;i&gt;ľudí&lt;/i&gt;. Googlebot prejde za sekundu 50 stránok — to by skreslilo štatistiky.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Prečo robots.txt:&lt;/b&gt; je to najspoľahlivejší znak. User-Agent sa dá podvrhnúť, zoznam IP rýchlo zastará, ale o &lt;code&gt;robots.txt&lt;/code&gt; sa zaujímajú &lt;b&gt;len roboti&lt;/b&gt;.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;V tomto kroku len zbierame zoznam&lt;/b&gt; — samotné vyhodenie robotov z logu spravíme v ďalšom kroku.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Munk (prednáška 5):&lt;/b&gt; uvádza 4 spôsoby identifikácie robotov — podľa User-Agent, podľa zoznamu známych IP, podľa prístupu k &lt;code&gt;robots.txt&lt;/code&gt; (toto používame my) a podľa skrytého odkazu.&lt;/li&gt;
&lt;/ul&gt;&lt;/div&gt;

&lt;div class="thbox thnabif"&gt;&lt;h4&gt;Nabif (vzorce, čísla, idiómy)&lt;/h4&gt;&lt;ul&gt;
&lt;li&gt;&lt;b&gt;Vstup:&lt;/b&gt; &lt;code&gt;in/Log_jeden_den.log&lt;/code&gt; &lt;b&gt;→ Výstup:&lt;/b&gt; &lt;code&gt;out/07_robot_ips.csv&lt;/code&gt; (1 stĺpec &lt;code&gt;IP&lt;/code&gt;, &lt;b&gt;333 riadkov&lt;/b&gt;).&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Pravidlo:&lt;/b&gt; &lt;code&gt;"robots.txt" in url.lower()&lt;/code&gt; — case-insensitive, lebo niekto môže napísať &lt;code&gt;Robots.TXT&lt;/code&gt;.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Necháme duplicity:&lt;/b&gt; ak IP žiadala robots.txt 5×, je v CSV 5×. Zadanie chce 333 záznamov, nie 333 unikátnych IP.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Čítame riadok po riadku&lt;/b&gt; (&lt;code&gt;for line in f&lt;/code&gt;) — nie celý log naraz, aby sme nepretiažili pamäť.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Poškodený riadok&lt;/b&gt; (regex nesedí) ticho preskočíme — &lt;code&gt;if m:&lt;/code&gt;.&lt;/li&gt;
&lt;/ul&gt;&lt;/div&gt;`,
    '04': `&lt;h2&gt;Krok 04 — Filtrovanie robotov&lt;/h2&gt;
&lt;p class="thintro"&gt;Toto je posledný krok čistenia. Z logu vyhadzujeme automatické programy (Googlebot, curl, skripty), aby nám v dátach ostali iba kliky &lt;b&gt;skutočných ľudí&lt;/b&gt;.&lt;/p&gt;

&lt;h3&gt;Ako sme to robili v projekte&lt;/h3&gt;
&lt;p&gt;Robotov rozoznávame štyrmi sitami. Najprv hľadáme v stĺpci &lt;code&gt;Agent&lt;/code&gt; (meno prehliadača) slová &lt;i&gt;bot, crawl, spider&lt;/i&gt; — väčšina slušných robotov sa sama prizná (napr. &lt;code&gt;Googlebot&lt;/code&gt;, &lt;code&gt;Baiduspider&lt;/code&gt;). Potom vyhodíme automatické nástroje (&lt;code&gt;curl&lt;/code&gt;, &lt;code&gt;wget&lt;/code&gt;, &lt;code&gt;cron&lt;/code&gt;) — to nie sú prehliadače. Tretie sito odstráni riadky, kde Agent je iba pomlčka &lt;code&gt;"-"&lt;/code&gt; (skutočný prehliadač sa vždy predstaví). A nakoniec použijeme zoznam podozrivých IP z minulého kroku — aj keby robot klamal o mene, IP tak ľahko nezmení.&lt;/p&gt;
&lt;pre&gt;&lt;code&gt;bot = df["Agent"].str.contains(r"bot|crawl|spider", case=False, na=False)
df = df[~bot]                    # vlnovka = opak, ponecháme NE-roboty
df = df[df["Agent"] != "-"]      # vyhodíme prázdnych
df = df[~df["IP"].isin(robot_ips)]  # vyhodíme podozrivé IP&lt;/code&gt;&lt;/pre&gt;

&lt;h3&gt;Vizuálne — štyri sitá za sebou&lt;/h3&gt;
&lt;table class="thtable"&gt;
&lt;tr&gt;&lt;th&gt;Sito&lt;/th&gt;&lt;th&gt;Čo zachytí&lt;/th&gt;&lt;th&gt;Príklad&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;1. Meno robota&lt;/td&gt;&lt;td&gt;bot, crawl, spider&lt;/td&gt;&lt;td&gt;&lt;code&gt;Googlebot/2.1&lt;/code&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;2. Skripty&lt;/td&gt;&lt;td&gt;cron, curl, wget, libwww&lt;/td&gt;&lt;td&gt;&lt;code&gt;curl/7.68&lt;/code&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;3. Prázdny Agent&lt;/td&gt;&lt;td&gt;klient sa nepredstavil&lt;/td&gt;&lt;td&gt;&lt;code&gt;"-"&lt;/code&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;4. Robot IP&lt;/td&gt;&lt;td&gt;IP z predošlého kroku&lt;/td&gt;&lt;td&gt;&lt;code&gt;65.55.110.205&lt;/code&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;/table&gt;

&lt;div class="thbox thpochop"&gt;&lt;h4&gt;Pochop (princíp, prečo)&lt;/h4&gt;&lt;ul&gt;
&lt;li&gt;&lt;b&gt;Prečo to robíme:&lt;/b&gt; chceme analyzovať správanie &lt;i&gt;ľudí&lt;/i&gt;. Roboti chodia systematicky cez všetky stránky a skreslili by štatistiky (priemerný čas, najobľúbenejšia stránka).&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Viac sít, lebo žiadne nie je dokonalé:&lt;/b&gt; slušný robot sa prizná v Agent, drzý robot sa maskuje za Firefox — toho chytíme až cez IP a správanie.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Munk (prednáška 5):&lt;/b&gt; identifikácia robotov sa robí cez &lt;i&gt;User-Agent, IP adresu, prístup k súboru robots.txt a prístup k skrytému odkazu&lt;/i&gt;. My používame prvé dva spôsoby.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Posledný krok čistenia:&lt;/b&gt; až po ňom môžeme rozumne tvoriť sedenia (session) a hľadať vzorce — inak by každé sedenie obsahovalo desiatky robotích klikov.&lt;/li&gt;
&lt;/ul&gt;&lt;/div&gt;

&lt;div class="thbox thnabif"&gt;&lt;h4&gt;Nabif (vzorce, čísla, idiómy)&lt;/h4&gt;&lt;ul&gt;
&lt;li&gt;&lt;b&gt;Idióm pandas:&lt;/b&gt; &lt;code&gt;df["X"].str.contains(vzor, case=False, na=False)&lt;/code&gt; — vráti &lt;i&gt;True/False&lt;/i&gt; pre každý riadok. &lt;code&gt;na=False&lt;/code&gt; znamená "prázdne polia neberiem ako zhodu".&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Vlnovka &lt;code&gt;~&lt;/code&gt;:&lt;/b&gt; opak masky. &lt;code&gt;df[~bot]&lt;/code&gt; = "nechaj riadky, kde to NIE JE robot".&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Regulárny výraz:&lt;/b&gt; &lt;code&gt;bot|crawl|spider&lt;/code&gt; — zvislá čiara &lt;code&gt;|&lt;/code&gt; znamená "alebo".&lt;/li&gt;
&lt;li&gt;&lt;b&gt;&lt;code&gt;isin(zoznam)&lt;/code&gt;:&lt;/b&gt; rýchla kontrola, či hodnota je v zozname — používame na filtrovanie podľa zoznamu robotích IP.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;&lt;code&gt;reset_index(drop=True)&lt;/code&gt;:&lt;/b&gt; po vyhadzovaní riadkov sú v indexe diery (0, 3, 7…) — toto ich prečísluje pekne 0, 1, 2, 3.&lt;/li&gt;
&lt;/ul&gt;&lt;/div&gt;`,
  },
  3: {
    '01': `&lt;h2&gt;Krok 01 — unixtime.py&lt;/h2&gt;
&lt;p class="thintro"&gt;Z textového dátumu typu &lt;code&gt;19/Feb/2020:06:25:49 +0100&lt;/code&gt; spravíme &lt;b&gt;jedno veľké číslo&lt;/b&gt; — počet sekúnd od 1.1.1970. S číslom sa dá počítať: odčítať dva časy, triediť, hľadať medzery.&lt;/p&gt;

&lt;h3&gt;Ako sme to robili v projekte&lt;/h3&gt;
&lt;p&gt;Načítame očistený log z cv1 (&lt;code&gt;cleaned_log4.csv&lt;/code&gt;, ~20 666 riadkov). Pre každý riadok rozparsujeme text dátumu: rozdelíme ho cez &lt;code&gt;":"&lt;/code&gt; na dátum + hodiny + minúty + sekundy, mesiac &lt;i&gt;Feb&lt;/i&gt; preložíme cez slovník na číslo 2, časové pásmo &lt;code&gt;+0100&lt;/code&gt; zahodíme. Z toho postavíme &lt;code&gt;datetime(...)&lt;/code&gt; a zavoláme &lt;code&gt;.timestamp()&lt;/code&gt; — Python sám dopočíta sekundy od 1970. Výsledok uložíme ako nový stĺpec &lt;b&gt;UNIXTIME&lt;/b&gt;.&lt;/p&gt;
&lt;pre&gt;&lt;code&gt;parts = dt_str.split(":")
day, month_str, year = parts[0].split("/")
return datetime.datetime(int(year), months[month_str], int(day),
                         int(parts[1]), int(parts[2]),
                         int(parts[3].split(" ")[0])).timestamp()&lt;/code&gt;&lt;/pre&gt;

&lt;h3&gt;Vizuálne&lt;/h3&gt;
&lt;table class="thtable"&gt;
&lt;tr&gt;&lt;th&gt;DateTime (text)&lt;/th&gt;&lt;th&gt;UNIXTIME (číslo)&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;19/Feb/2020:06:25:49 +0100&lt;/td&gt;&lt;td&gt;1582089949.0&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;19/Feb/2020:06:26:30 +0100&lt;/td&gt;&lt;td&gt;1582089990.0&lt;/td&gt;&lt;/tr&gt;
&lt;/table&gt;
&lt;p&gt;Rozdiel &lt;code&gt;1582089990 − 1582089949 = 41 s&lt;/code&gt; → používateľ strávil na prvej stránke 41 sekúnd. &lt;b&gt;Toto číslo je palivo pre úlohy 02 (Length) a 03 (Session).&lt;/b&gt;&lt;/p&gt;

&lt;div class="thbox thpochop"&gt;&lt;h4&gt;Pochop (princíp, prečo)&lt;/h4&gt;&lt;ul&gt;
&lt;li&gt;Text typu &lt;i&gt;"19/Feb/2020"&lt;/i&gt; je pre počítač iba reťazec znakov — &lt;b&gt;nedá sa s ním rátať&lt;/b&gt;. Číslo áno.&lt;/li&gt;
&lt;li&gt;UNIX timestamp je &lt;b&gt;jediná os&lt;/b&gt; (sekundy od 1.1.1970) — odčítaním dvoch hodnôt hneď dostaneme medzeru v sekundách.&lt;/li&gt;
&lt;li&gt;Munk v prednáške 6 ukazuje, že identifikácia sedení &lt;b&gt;na základe času&lt;/b&gt; potrebuje merať dĺžky medzi klikmi — bez UNIXTIME by to nešlo.&lt;/li&gt;
&lt;li&gt;Časové pásmo &lt;code&gt;+0100&lt;/code&gt; zahadzujeme — všetky kliky sú z toho istého servera, posun by len pripočítal konštantu.&lt;/li&gt;
&lt;/ul&gt;&lt;/div&gt;

&lt;div class="thbox thnabif"&gt;&lt;h4&gt;Nabif (vzorce, čísla, idiómy)&lt;/h4&gt;&lt;ul&gt;
&lt;li&gt;&lt;b&gt;Vstup:&lt;/b&gt; &lt;code&gt;in/cleaned_log4.csv&lt;/code&gt; (~20 666 riadkov). &lt;b&gt;Výstup:&lt;/b&gt; &lt;code&gt;out/cleaned_log4_unixtime.csv&lt;/code&gt; + nový stĺpec &lt;code&gt;UNIXTIME&lt;/code&gt;.&lt;/li&gt;
&lt;li&gt;Idióm pandas: &lt;code&gt;df["UNIXTIME"] = df["DateTime"].apply(to_unixtime)&lt;/code&gt; — pustí funkciu na každý riadok.&lt;/li&gt;
&lt;li&gt;Mesiac cez slovník: &lt;code&gt;months = {"Jan":1, "Feb":2, ...}&lt;/code&gt; — Apache píše skratky, &lt;code&gt;datetime&lt;/code&gt; chce číslo.&lt;/li&gt;
&lt;li&gt;&lt;code&gt;datetime(rok, mesiac, den, hod, min, sek).timestamp()&lt;/code&gt; → float sekúnd od 1.1.1970.&lt;/li&gt;
&lt;li&gt;Pri ukladaní &lt;code&gt;to_csv(..., index=False)&lt;/code&gt; — bez zbytočných čísel riadkov.&lt;/li&gt;
&lt;/ul&gt;&lt;/div&gt;`,
    '02': `&lt;h2&gt;Krok 02 — Identifikácia používateľov&lt;/h2&gt;
&lt;p class="thintro"&gt;Server v logu nevie, kto je kto — nevidí mená ani prihlásenia. Tento krok každému kliku priradí číslo používateľa &lt;code&gt;USER_ID&lt;/code&gt; pomocou jednoduchého pravidla: jeden človek = jedna dvojica (IP adresa, prehliadač).&lt;/p&gt;

&lt;h3&gt;Ako sme to robili v projekte&lt;/h3&gt;
&lt;p&gt;Načítame log z predošlej úlohy (už má UNIXTIME). Zoradíme riadky podľa &lt;b&gt;IP&lt;/b&gt;, &lt;b&gt;Agent&lt;/b&gt; (prehliadač) a &lt;b&gt;času&lt;/b&gt; — vďaka tomu kliky toho istého človeka idú pekne za sebou v chronologickom poradí. Potom funkciou &lt;code&gt;groupby&lt;/code&gt; zoskupíme riadky podľa dvojice (IP, Agent) a každej skupine pridelíme číslo cez &lt;code&gt;ngroup()+1&lt;/code&gt;.&lt;/p&gt;
&lt;pre&gt;&lt;code&gt;df = df.sort_values(by=["IP","Agent","UNIXTIME"])
df["USER_ID"] = df.groupby(["IP","Agent"]).ngroup() + 1
df.to_csv("out/cleaned_log4_users.csv", index=False)&lt;/code&gt;&lt;/pre&gt;
&lt;p&gt;Výsledok: každý riadok má svoje &lt;code&gt;USER_ID&lt;/code&gt;, podľa zadania to vyjde okolo &lt;b&gt;4040 používateľov&lt;/b&gt; (reálne &lt;b&gt;4096&lt;/b&gt;, malé odchýlky sú normálne).&lt;/p&gt;

&lt;h3&gt;Vizuálne&lt;/h3&gt;
&lt;table class="thtable"&gt;
&lt;tr&gt;&lt;th&gt;IP&lt;/th&gt;&lt;th&gt;Agent (prehliadač)&lt;/th&gt;&lt;th&gt;USER_ID&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;178.41.1.187&lt;/td&gt;&lt;td&gt;Chrome / Windows&lt;/td&gt;&lt;td&gt;1&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;178.41.1.187&lt;/td&gt;&lt;td&gt;Firefox / Windows&lt;/td&gt;&lt;td&gt;2&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;178.41.1.187&lt;/td&gt;&lt;td&gt;Firefox / Windows&lt;/td&gt;&lt;td&gt;2&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;91.20.5.12&lt;/td&gt;&lt;td&gt;Chrome / Windows&lt;/td&gt;&lt;td&gt;3&lt;/td&gt;&lt;/tr&gt;
&lt;/table&gt;
&lt;p&gt;&lt;i&gt;Rovnaká IP + iný prehliadač = dvaja ľudia (napr. dvaja v jednej domácnosti). Iná IP + rovnaký prehliadač = tiež dvaja (mobil vs. notebook).&lt;/i&gt;&lt;/p&gt;

&lt;div class="thbox thpochop"&gt;&lt;h4&gt;Pochop (princíp, prečo)&lt;/h4&gt;&lt;ul&gt;
&lt;li&gt;&lt;b&gt;Apache log neobsahuje login&lt;/b&gt; — vidíme len IP a User-Agent. Musíme používateľov &lt;i&gt;odhadnúť&lt;/i&gt;.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Munk (prednáška 7):&lt;/b&gt; identifikácia používateľov na základe rôznej verzie internetového prehliadača — štandardný postup vo fáze prípravy dát CRISP-DM.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Triedenie pred grupovaním&lt;/b&gt; nie je nutné pre samotné &lt;code&gt;USER_ID&lt;/code&gt;, ale umožní v ďalšom kroku ľahko hľadať sedenia (kliky v poradí v čase).&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Heuristika, nie pravda:&lt;/b&gt; mobil mení IP, vo firme sedí 20 ľudí za jednou IP — preto je toto len rozumný odhad.&lt;/li&gt;
&lt;/ul&gt;&lt;/div&gt;

&lt;div class="thbox thnabif"&gt;&lt;h4&gt;Nabif (vzorce, čísla, idiómy)&lt;/h4&gt;&lt;ul&gt;
&lt;li&gt;&lt;b&gt;Pravidlo:&lt;/b&gt; 1 používateľ ⇔ 1 unikátna dvojica (IP, Agent).&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Pandas idióm:&lt;/b&gt; &lt;code&gt;df.groupby([...]).ngroup() + 1&lt;/code&gt; — priradí poradové číslo skupine od 1.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Triedenie:&lt;/b&gt; &lt;code&gt;sort_values(["IP","Agent","UNIXTIME"])&lt;/code&gt; — chronologicky v rámci používateľa.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Vstup → výstup:&lt;/b&gt; &lt;code&gt;cleaned_log4_unixtime.csv&lt;/code&gt; → &lt;code&gt;cleaned_log4_users.csv&lt;/code&gt; (pribudol stĺpec &lt;code&gt;USER_ID&lt;/code&gt;).&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Očakávaný počet:&lt;/b&gt; ~&lt;b&gt;4040&lt;/b&gt; (zadanie) / reálne &lt;b&gt;4096&lt;/b&gt; unikátnych používateľov.&lt;/li&gt;
&lt;/ul&gt;&lt;/div&gt;`,
    '03': `&lt;h2&gt;Krok 03 — vypocet length&lt;/h2&gt;
&lt;p class="thintro"&gt;V tomto kroku zistíme, &lt;b&gt;ako dlho user pozeral každú stránku&lt;/b&gt;. Server zapíše len čas príchodu — odchod si musíme dopočítať z času ďalšieho kliknutia.&lt;/p&gt;

&lt;h3&gt;Ako sme to robili v projekte&lt;/h3&gt;
&lt;p&gt;Pre každého usera zoradíme jeho kliky podľa času. Pre každý klik sa pozrieme na &lt;b&gt;čas predchádzajúceho kliku toho istého usera&lt;/b&gt; a odčítame ho od aktuálneho. Výsledok v sekundách je &lt;code&gt;Length&lt;/code&gt; — koľko user strávil na predošlej stránke. Ak je medzera väčšia ako 60 minút, predpokladáme, že user dávno odišiel, a hodnotu vymažeme (NaN).&lt;/p&gt;
&lt;pre&gt;&lt;code&gt;df["PREV_UNIXTIME"] = df.groupby("USER_ID")["UNIXTIME"].shift(1)
df["Length"] = df["UNIXTIME"] - df["PREV_UNIXTIME"]
df.loc[df["Length"] &gt;= 3600, "Length"] = None&lt;/code&gt;&lt;/pre&gt;

&lt;h3&gt;Vizuálne&lt;/h3&gt;
&lt;table class="thtable"&gt;
&lt;tr&gt;&lt;th&gt;USER&lt;/th&gt;&lt;th&gt;UNIXTIME&lt;/th&gt;&lt;th&gt;PREV&lt;/th&gt;&lt;th&gt;Length (s)&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;A&lt;/td&gt;&lt;td&gt;1000&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;&lt;i&gt;NaN&lt;/i&gt; (prvý klik)&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;A&lt;/td&gt;&lt;td&gt;1120&lt;/td&gt;&lt;td&gt;1000&lt;/td&gt;&lt;td&gt;120&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;A&lt;/td&gt;&lt;td&gt;1300&lt;/td&gt;&lt;td&gt;1120&lt;/td&gt;&lt;td&gt;180&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;A&lt;/td&gt;&lt;td&gt;6000&lt;/td&gt;&lt;td&gt;1300&lt;/td&gt;&lt;td&gt;&lt;i&gt;NaN&lt;/i&gt; (4700 s &gt; 1 h)&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;B&lt;/td&gt;&lt;td&gt;1050&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;&lt;i&gt;NaN&lt;/i&gt; (iný user)&lt;/td&gt;&lt;/tr&gt;
&lt;/table&gt;

&lt;div class="thbox thpochop"&gt;&lt;h4&gt;Pochop (princíp, prečo)&lt;/h4&gt;&lt;ul&gt;
&lt;li&gt;Apache log zapíše len &lt;b&gt;čas príchodu&lt;/b&gt;, nie odchodu — preto dĺžku odhadujeme z ďalšieho kliku.&lt;/li&gt;
&lt;li&gt;&lt;code&gt;groupby("USER_ID")&lt;/code&gt; zabezpečí, že neporovnáme dvoch rôznych userov — každý má vlastnú časovú os.&lt;/li&gt;
&lt;li&gt;Prvý klik usera nemá od čoho odčítať → &lt;b&gt;NaN&lt;/b&gt;. To je správne, nie chyba.&lt;/li&gt;
&lt;li&gt;Medzera &gt; 60 min znamená, že user medzitým odišiel; tú „nečinnú“ dobu nemôžeme považovať za čítanie stránky.&lt;/li&gt;
&lt;/ul&gt;&lt;/div&gt;

&lt;div class="thbox thnabif"&gt;&lt;h4&gt;Nabif (vzorce, čísla, idiómy)&lt;/h4&gt;&lt;ul&gt;
&lt;li&gt;&lt;b&gt;Vzorec:&lt;/b&gt; &lt;code&gt;Length = UNIXTIME − PREV_UNIXTIME&lt;/code&gt; (v sekundách).&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Hranica:&lt;/b&gt; 3600 s = 60 min — STT (session timeout threshold) podľa zadania.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Idióm:&lt;/b&gt; &lt;code&gt;groupby(...).shift(1)&lt;/code&gt; = posun o riadok v rámci skupiny.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Očakávaný priemer:&lt;/b&gt; ~150 s podľa zadania, reálne ≈ &lt;b&gt;147.2 s&lt;/b&gt; (medián 5 s — silne pravostranne šikmé rozdelenie).&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Prednáška 7 (Munk):&lt;/b&gt; Length má &lt;i&gt;exponenciálne rozdelenie&lt;/i&gt;, hranicu τ možno odhadnúť kvantilovou funkciou &lt;code&gt;τ = −ln(1−p)/λ&lt;/code&gt;. Tu používame fixných 60 min; presný odhad robíme až v cv3/projekte.&lt;/li&gt;
&lt;/ul&gt;&lt;/div&gt;`,
    '04': `&lt;h2&gt;Krok 04 — stt mean&lt;/h2&gt;
&lt;p class="thintro"&gt;Z dlhej postupnosti klikov potrebujeme zistiť, kde končí jedna návšteva (sedenie) a kde začína ďalšia. V tomto kroku použijeme &lt;b&gt;priemerný čas&lt;/b&gt; strávený na stránke ako hranicu: keď klik trval dlhšie ako priemer, predpokladáme, že používateľ odišiel.&lt;/p&gt;

&lt;h3&gt;Ako sme to robili v projekte&lt;/h3&gt;
&lt;p&gt;Načítame vyčistený log z úlohy 03, ktorý už má stĺpec &lt;code&gt;Length&lt;/code&gt; (koľko sekúnd používateľ zostal na danej stránke). Vypočítame &lt;b&gt;priemer&lt;/b&gt; všetkých Length hodnôt — to je náš prah &lt;code&gt;STT_MEAN&lt;/code&gt;. Pre každý riadok rozhodneme: ak je Length prázdny (prvý klik používateľa) alebo väčší/rovný priemeru, je to &lt;b&gt;začiatok nového sedenia&lt;/b&gt;. Tieto True/False hodnoty potom &lt;b&gt;kumulatívne sčítame&lt;/b&gt; (True=1, False=0) a vznikne nám rastúce číslo sedenia &lt;code&gt;SESSION_ID&lt;/code&gt;.&lt;/p&gt;
&lt;pre&gt;&lt;code&gt;stt_mean = df["Length"].mean()
df["NEW_SESSION"] = (df["Length"].isna()) | (df["Length"] &amp;gt;= stt_mean)
df["SESSION_ID"]  = df["NEW_SESSION"].cumsum()&lt;/code&gt;&lt;/pre&gt;

&lt;h3&gt;Vizuálne&lt;/h3&gt;
&lt;table class="thtable"&gt;
&lt;tr&gt;&lt;th&gt;USER&lt;/th&gt;&lt;th&gt;Length (s)&lt;/th&gt;&lt;th&gt;vs priemer&lt;/th&gt;&lt;th&gt;NEW?&lt;/th&gt;&lt;th&gt;SESSION_ID&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;A&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;NaN (prvý)&lt;/td&gt;&lt;td&gt;True&lt;/td&gt;&lt;td&gt;&lt;b&gt;1&lt;/b&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;A&lt;/td&gt;&lt;td&gt;42&lt;/td&gt;&lt;td&gt;&amp;lt; priemer&lt;/td&gt;&lt;td&gt;False&lt;/td&gt;&lt;td&gt;1&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;A&lt;/td&gt;&lt;td&gt;88&lt;/td&gt;&lt;td&gt;&amp;lt; priemer&lt;/td&gt;&lt;td&gt;False&lt;/td&gt;&lt;td&gt;1&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;A&lt;/td&gt;&lt;td&gt;1850&lt;/td&gt;&lt;td&gt;&amp;gt;= priemer&lt;/td&gt;&lt;td&gt;True&lt;/td&gt;&lt;td&gt;&lt;b&gt;2&lt;/b&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;A&lt;/td&gt;&lt;td&gt;15&lt;/td&gt;&lt;td&gt;&amp;lt; priemer&lt;/td&gt;&lt;td&gt;False&lt;/td&gt;&lt;td&gt;2&lt;/td&gt;&lt;/tr&gt;
&lt;/table&gt;

&lt;div class="thbox thpochop"&gt;&lt;h4&gt;Pochop (princíp, prečo)&lt;/h4&gt;&lt;ul&gt;
&lt;li&gt;&lt;b&gt;Sedenie&lt;/b&gt; = súvislá séria klikov jedného používateľa počas jednej návštevy. Bez rozlíšenia sedení sa nedá analyzovať správanie na webe.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Intuícia priemeru:&lt;/b&gt; ak typický používateľ strávi na stránke ~30 s, tak medzera 30 minút znamená, že medzitým zatvoril prehliadač.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Prečo "prázdny Length = nové sedenie":&lt;/b&gt; posledný klik používateľa nemá nasledujúci klik na výpočet času, čiže prvý klik každej osoby logicky štartuje nové sedenie.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Trik s cumsum:&lt;/b&gt; True=1, False=0; postupné sčítanie automaticky čísluje sedenia (1,1,1,2,2,3,...) bez cyklov.&lt;/li&gt;
&lt;/ul&gt;&lt;/div&gt;

&lt;div class="thbox thnabif"&gt;&lt;h4&gt;Nabif (vzorce, čísla, idiómy)&lt;/h4&gt;&lt;ul&gt;
&lt;li&gt;&lt;b&gt;Prah:&lt;/b&gt; &lt;code&gt;STT_MEAN = priemer(Length)&lt;/code&gt;. Pandas &lt;code&gt;.mean()&lt;/code&gt; automaticky preskakuje NaN.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Pravidlo:&lt;/b&gt; nové sedenie ak &lt;code&gt;Length.isna()&lt;/code&gt; ALEBO &lt;code&gt;Length &amp;gt;= STT_MEAN&lt;/code&gt;.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Idióm:&lt;/b&gt; v pandas používame &lt;code&gt;|&lt;/code&gt; (nie &lt;code&gt;or&lt;/code&gt;) pre logické OR cez celý stĺpec.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Číslovanie sedení:&lt;/b&gt; &lt;code&gt;SESSION_ID = NEW_SESSION.cumsum()&lt;/code&gt; — kumulatívny súčet.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Munk (predn. 7):&lt;/b&gt; ak Length má &lt;i&gt;exponenciálne rozdelenie&lt;/i&gt; (väčšina krátkych, zopár dlhých), priemer NIE JE robustný odhad — vtedy je lepšie použiť &lt;code&gt;STT_Q&lt;/code&gt; (Q3 + 1.5·IQR) alebo kvantil z exp. rozdelenia &lt;code&gt;RLength&lt;/code&gt;.&lt;/li&gt;
&lt;/ul&gt;&lt;/div&gt;`,
    '05': `&lt;h2&gt;Krok 05 — STT_Q (rozdelenie na sedenia podľa kvartilov)&lt;/h2&gt;
&lt;p class="thintro"&gt;Každého používateľa rozdelíme na samostatné &lt;b&gt;sedenia&lt;/b&gt; (návštevy). Hranicu, kedy je pauza medzi klikmi „už primálo“, neurčíme od oka, ale vypočítame ju z dát pomocou &lt;b&gt;kvartilov&lt;/b&gt; — odhad, ktorý sa nedá pokaziť pár extrémne dlhými pauzami.&lt;/p&gt;

&lt;h3&gt;Ako sme to robili v projekte&lt;/h3&gt;
&lt;p&gt;Zo súboru z úlohy 03 máme pri každom kliku stĺpec &lt;code&gt;Length&lt;/code&gt; — koľko sekúnd uplynulo od predošlého kliku toho istého používateľa. Z týchto pauz spočítame &lt;b&gt;Q1&lt;/b&gt; (25 % pauz je kratších), &lt;b&gt;Q3&lt;/b&gt; (75 % je kratších) a &lt;b&gt;IQR = Q3 − Q1&lt;/b&gt; (šírka „stredného 50 %“ pauz). Prah dostaneme zo vzorca &lt;b&gt;STT_Q = Q3 + 1,5·IQR&lt;/b&gt;. Ak je pauza ≥ prah, povieme „používateľ odišiel“ a začneme mu nové sedenie; rovnako pri jeho úplne prvom kliku (Length je prázdne). Číslo sedenia priradíme trikom &lt;code&gt;cumsum()&lt;/code&gt; nad príznakom „začiatok sedenia“.&lt;/p&gt;
&lt;pre&gt;&lt;code&gt;q1  = df["Length"].quantile(0.25)
q3  = df["Length"].quantile(0.75)
iqr = q3 - q1
stt_q = q3 + 1.5 * iqr
df["NEW_SESSION"] = df["Length"].isna() | (df["Length"] &gt;= stt_q)
df["SESSION_ID"]  = df["NEW_SESSION"].cumsum()&lt;/code&gt;&lt;/pre&gt;

&lt;h3&gt;Vizuálne&lt;/h3&gt;
&lt;table class="thtable"&gt;
&lt;tr&gt;&lt;th&gt;USER&lt;/th&gt;&lt;th&gt;Length (s)&lt;/th&gt;&lt;th&gt;Prah?&lt;/th&gt;&lt;th&gt;NEW&lt;/th&gt;&lt;th&gt;SESSION_ID&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;A&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;prvý klik&lt;/td&gt;&lt;td&gt;T&lt;/td&gt;&lt;td&gt;&lt;b&gt;1&lt;/b&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;A&lt;/td&gt;&lt;td&gt;42&lt;/td&gt;&lt;td&gt;&lt; STT_Q&lt;/td&gt;&lt;td&gt;F&lt;/td&gt;&lt;td&gt;1&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;A&lt;/td&gt;&lt;td&gt;120&lt;/td&gt;&lt;td&gt;&lt; STT_Q&lt;/td&gt;&lt;td&gt;F&lt;/td&gt;&lt;td&gt;1&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;A&lt;/td&gt;&lt;td&gt;&lt;b&gt;3600&lt;/b&gt;&lt;/td&gt;&lt;td&gt;&lt;b&gt;≥ STT_Q&lt;/b&gt;&lt;/td&gt;&lt;td&gt;T&lt;/td&gt;&lt;td&gt;&lt;b&gt;2&lt;/b&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;A&lt;/td&gt;&lt;td&gt;15&lt;/td&gt;&lt;td&gt;&lt; STT_Q&lt;/td&gt;&lt;td&gt;F&lt;/td&gt;&lt;td&gt;2&lt;/td&gt;&lt;/tr&gt;
&lt;/table&gt;
&lt;p&gt;&lt;code&gt;cumsum&lt;/code&gt; pripočíta 1 vždy, keď nastane T → každé nové sedenie dostane vyššie číslo, kliky v jednom sedení zdieľajú to isté.&lt;/p&gt;

&lt;div class="thbox thpochop"&gt;&lt;h4&gt;Pochop (princíp, prečo)&lt;/h4&gt;&lt;ul&gt;
&lt;li&gt;&lt;b&gt;Sedenie&lt;/b&gt; = súvislá návšteva. Munk hovorí: dva po sebe idúce kliky patria do iného sedenia, ak je pauza medzi nimi väčšia ako odhadnutý prah δ.&lt;/li&gt;
&lt;li&gt;Prečo &lt;b&gt;kvartily&lt;/b&gt; a nie priemer: jedna pauza cez noc (8 hodín) potiahne priemer hore o stovky sekúnd a prah by bol nezmyselne veľký. Kvartily takéto extrémy ignorujú — sú &lt;i&gt;robustné&lt;/i&gt;.&lt;/li&gt;
&lt;li&gt;Prednáška 8 to formuluje: &lt;i&gt;ak premenná nemá exponenciálne rozdelenie, na odhad časového okna môžeme použiť kvartilový odhad δ = Q3 + 1,5·IQR&lt;/i&gt;. Je to ten istý vzorec, akým štatistici označujú „odľahlé hodnoty“ v boxplote.&lt;/li&gt;
&lt;li&gt;Analógia: keď sledujeme rozostupy autobusov, „dlhý“ rozostup nepočítame od priemeru (ten skreslí jeden nočný výpadok), ale od typického rozsahu počas dňa.&lt;/li&gt;
&lt;/ul&gt;&lt;/div&gt;

&lt;div class="thbox thnabif"&gt;&lt;h4&gt;Nabif (vzorce, čísla, idiómy)&lt;/h4&gt;&lt;ul&gt;
&lt;li&gt;&lt;b&gt;STT&lt;/b&gt; = Session Timeout Threshold; &lt;b&gt;STT_Q&lt;/b&gt; = jeho variant odhadnutý z &lt;b&gt;Q&lt;/b&gt;uartilov.&lt;/li&gt;
&lt;li&gt;Vzorec: &lt;code&gt;STT_Q = Q3 + 1.5 · (Q3 − Q1)&lt;/code&gt;.&lt;/li&gt;
&lt;li&gt;Nové sedenie začíname keď: &lt;code&gt;Length is NaN&lt;/code&gt; (prvý klik usera) &lt;b&gt;alebo&lt;/b&gt; &lt;code&gt;Length ≥ STT_Q&lt;/code&gt;.&lt;/li&gt;
&lt;li&gt;Pandas idióm: &lt;code&gt;cumsum()&lt;/code&gt; nad bool stĺpcom = automatické číslovanie skupín 1, 2, 3…&lt;/li&gt;
&lt;li&gt;Zadanie cv2 očakáva &lt;b&gt;cca 7500 sedení&lt;/b&gt; (kontrola cez &lt;code&gt;df['SESSION_ID'].nunique()&lt;/code&gt;), reálny výstup je &lt;b&gt;7097&lt;/b&gt;.&lt;/li&gt;
&lt;/ul&gt;&lt;/div&gt;`,
    '06': `&lt;h2&gt;Krok 06 — slength.py (Identifikácia sedení)&lt;/h2&gt;
&lt;p class="thintro"&gt;V tomto kroku rozdelíme kliky používateľov do tzv. &lt;b&gt;sedení&lt;/b&gt; — súvislých návštev webu. Metóda &lt;b&gt;SLength&lt;/b&gt; hovorí: keď celkový čas strávený v sedení prekročí 10 minút, otvoríme nové sedenie.&lt;/p&gt;

&lt;h3&gt;Ako sme to robili v projekte&lt;/h3&gt;
&lt;p&gt;Načítame log z predošlej úlohy, ktorý už má stĺpec &lt;code&gt;Length&lt;/code&gt; (čas strávený na každej stránke). Postupne ideme klik po kliku a &lt;b&gt;sčítavame čas&lt;/b&gt; v aktuálnom sedení. Keď nový používateľ začne (Length je prázdny) — otvoríme nové sedenie. Keď by súčet prekročil &lt;b&gt;600 sekúnd&lt;/b&gt; (10 minút) — tiež otvoríme nové sedenie. Inak len pripočítame čas a pokračujeme. Každý klik dostane svoje &lt;code&gt;SESSION_ID&lt;/code&gt;.&lt;/p&gt;
&lt;pre&gt;&lt;code&gt;if pd.isna(row["Length"]):
    session_id += 1; cumulative_time = 0
elif cumulative_time + row["Length"] &amp;gt;= 600:
    session_id += 1; cumulative_time = row["Length"]
else:
    cumulative_time += row["Length"]&lt;/code&gt;&lt;/pre&gt;

&lt;h3&gt;Vizuálne&lt;/h3&gt;
&lt;table class="thtable"&gt;
&lt;tr&gt;&lt;th&gt;Klik&lt;/th&gt;&lt;th&gt;Length (s)&lt;/th&gt;&lt;th&gt;Súčet&lt;/th&gt;&lt;th&gt;SESSION_ID&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;1&lt;/td&gt;&lt;td&gt;NaN (nový user)&lt;/td&gt;&lt;td&gt;0&lt;/td&gt;&lt;td&gt;&lt;b&gt;1&lt;/b&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;2&lt;/td&gt;&lt;td&gt;120&lt;/td&gt;&lt;td&gt;120&lt;/td&gt;&lt;td&gt;1&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;3&lt;/td&gt;&lt;td&gt;300&lt;/td&gt;&lt;td&gt;420&lt;/td&gt;&lt;td&gt;1&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;4&lt;/td&gt;&lt;td&gt;250&lt;/td&gt;&lt;td&gt;420+250=670 &amp;gt; 600&lt;/td&gt;&lt;td&gt;&lt;b&gt;2&lt;/b&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;5&lt;/td&gt;&lt;td&gt;NaN (nový user)&lt;/td&gt;&lt;td&gt;0&lt;/td&gt;&lt;td&gt;&lt;b&gt;3&lt;/b&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;/table&gt;

&lt;div class="thbox thpochop"&gt;&lt;h4&gt;Pochop (princíp, prečo)&lt;/h4&gt;&lt;ul&gt;
&lt;li&gt;&lt;b&gt;Sedenie = súvislá návšteva&lt;/b&gt;. Ak človek odíde a vráti sa o hodinu, je to už nová návšteva — iný kontext, iné správanie.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;SLength = dĺžka sedenia&lt;/b&gt;. Pozeráme &lt;i&gt;celkový čas&lt;/i&gt; od začiatku sedenia, nie čas medzi dvoma klikmi (to robí metóda STT).&lt;/li&gt;
&lt;li&gt;Munk (prednáška 8): &lt;i&gt;„Ak máme odhad dĺžky času sedenia τ, tak sedenie je sekvencia navštívených stránok... ďalšie záznamy s časom väčším než t1+τ patria do ďalšieho sedenia.“&lt;/i&gt;&lt;/li&gt;
&lt;li&gt;Hranica 10 minút je dohovor — analogicky ako keď v obchode pokladňa po 10 minútach nečinnosti zatvorí účet zákazníka.&lt;/li&gt;
&lt;/ul&gt;&lt;/div&gt;

&lt;div class="thbox thnabif"&gt;&lt;h4&gt;Nabif (vzorce, čísla, idiómy)&lt;/h4&gt;&lt;ul&gt;
&lt;li&gt;&lt;b&gt;Limit:&lt;/b&gt; &lt;code&gt;slength = 600&lt;/code&gt; s (10 minút).&lt;/li&gt;
&lt;li&gt;&lt;b&gt;3 prípady:&lt;/b&gt; (1) NaN Length → nový user → nové sedenie; (2) súčet + Length ≥ 600 → nové sedenie; (3) inak → pokračuj.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Očakávaný výsledok:&lt;/b&gt; ~&lt;b&gt;6700&lt;/b&gt; sedení zo zadania, reálne &lt;b&gt;7075&lt;/b&gt; (tolerancia ±5 %).&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Rozdiel SLength vs STT:&lt;/b&gt; SLength meria &lt;i&gt;sumu&lt;/i&gt; časov v sedení, STT meria &lt;i&gt;medzeru medzi dvoma klikmi&lt;/i&gt;.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Vstup→výstup:&lt;/b&gt; &lt;code&gt;cleaned_log4_length.csv&lt;/code&gt; → &lt;code&gt;cleaned_log4_slength.csv&lt;/code&gt; (+ stĺpec &lt;code&gt;SESSION_ID&lt;/code&gt;).&lt;/li&gt;
&lt;/ul&gt;&lt;/div&gt;`,
    '07': `&lt;h2&gt;Krok 07 — KS test exponenciálneho rozdelenia&lt;/h2&gt;&lt;p class="thintro"&gt;V predošlom kroku sme spočítali &lt;code&gt;Length&lt;/code&gt; — koľko sekúnd používateľ strávil na stránke. Teraz overujeme, či tieto časy majú &lt;b&gt;exponenciálne rozdelenie&lt;/b&gt; (veľa krátkych, málo dlhých — ako čakanie na autobus).&lt;/p&gt;&lt;h3&gt;Ako sme to robili v projekte&lt;/h3&gt;&lt;p&gt;Načítali sme stĺpec &lt;code&gt;Length&lt;/code&gt;, vyhodili prázdne hodnoty (posledný klik usera nemá ďalší čas), spočítali priemer, medián a smerodajnú odchýlku. Potom sme spustili &lt;b&gt;Kolmogorov-Smirnov test&lt;/b&gt; proti exp. rozdeleniu, kde scale = priemer dát. Nakoniec sme nakreslili histogram s teoretickou krivkou a QQ-plot do &lt;code&gt;out/rlength_exp.png&lt;/code&gt;.&lt;/p&gt;&lt;pre&gt;&lt;code&gt;length_data = df["Length"].dropna()
ks_stat, p_value = kstest(length_data, "expon",
                          args=(0, length_data.mean()))
if p_value &amp;lt; 0.05: # data NIE su exponencialne
    print("Zamietame H0")&lt;/code&gt;&lt;/pre&gt;&lt;h3&gt;Vizuálne&lt;/h3&gt;&lt;table class="thtable"&gt;&lt;tr&gt;&lt;th&gt;Indícia&lt;/th&gt;&lt;th&gt;Čo to znamená&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;priemer ≈ std&lt;/td&gt;&lt;td&gt;typický znak exp. rozdelenia&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;medián ≈ 0.693 × priemer&lt;/td&gt;&lt;td&gt;exp. má dlhý chvost vpravo&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;p &amp;lt; 0.05&lt;/td&gt;&lt;td&gt;zamietame H0 → NIE je exponenciálne&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;p ≥ 0.05&lt;/td&gt;&lt;td&gt;nezamietame → môže byť exponenciálne&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;p&gt;&lt;b&gt;QQ-plot:&lt;/b&gt; body na červenej diagonále = perfektná zhoda. Ohyb hore = naše chvosty sú dlhšie ako teória čaká.&lt;/p&gt;&lt;div class="thbox thpochop"&gt;&lt;h4&gt;Pochop (princíp, prečo)&lt;/h4&gt;&lt;ul&gt;&lt;li&gt;&lt;b&gt;Prečo exp. rozdelenie?&lt;/b&gt; Munk v prednáške 7 hovorí: ak &lt;code&gt;Length&lt;/code&gt; má exp. rozdelenie, hraničný čas sedenia (STT) vieme odhadnúť cez kvantilovú funkciu &lt;code&gt;STT = -ln(1-q)/λ&lt;/code&gt;. Inak musíme siahnuť po Q3+1.5·IQR.&lt;/li&gt;&lt;li&gt;&lt;b&gt;Intuícia:&lt;/b&gt; čakacie časy (autobus, klik) majú zvyčajne tvar „veľa krátkych, pár dlhých" — to je exp. rozdelenie riadené jedným číslom &lt;code&gt;λ&lt;/code&gt; (intenzita udalostí).&lt;/li&gt;&lt;li&gt;&lt;b&gt;KS test:&lt;/b&gt; porovná empirickú kumulatívnu funkciu (graf nameraných dát) s teoretickou krivkou. Vráti najväčšiu vertikálnu medzeru a šancu, že ju vidíme náhodou.&lt;/li&gt;&lt;li&gt;&lt;b&gt;Anti-konzervatívny bias:&lt;/b&gt; KS test predpokladá &lt;b&gt;známu&lt;/b&gt; λ. My ju ale odhadujeme z tých istých dát (&lt;code&gt;length_data.mean()&lt;/code&gt;), takže test je &lt;i&gt;systematicky striktnejší&lt;/i&gt; — p-hodnoty sú podhodnotené. Pre korektný test by sa použila &lt;b&gt;Lillieforsova korekcia&lt;/b&gt;. U nás aj tak p≈0, ale pojem treba poznať.&lt;/li&gt;&lt;li&gt;&lt;b&gt;Prečo aj graf, keď máme p-hodnotu?&lt;/b&gt; Test povie len áno/nie. Histogram a QQ-plot ukážu &lt;i&gt;kde&lt;/i&gt; sa data od teórie líšia (krátke časy? dlhý chvost?).&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;div class="thbox thnabif"&gt;&lt;h4&gt;Nabif (vzorce, čísla, idiómy)&lt;/h4&gt;&lt;ul&gt;&lt;li&gt;Hustota exp.: &lt;code&gt;f(x) = λ·e^(-λx)&lt;/code&gt;, CDF: &lt;code&gt;F(x) = 1 - e^(-λx)&lt;/code&gt; pre &lt;code&gt;x ≥ 0&lt;/code&gt;.&lt;/li&gt;&lt;li&gt;Maximálne vierohodný odhad: &lt;code&gt;λ̂ = 1/x̄&lt;/code&gt; (jedna delená priemerom).&lt;/li&gt;&lt;li&gt;Kvantilová funkcia (Munk): &lt;code&gt;STT = F⁻¹(q) = -ln(1-q)/λ&lt;/code&gt; pre &lt;code&gt;0 ≤ q &amp;lt; 1&lt;/code&gt;.&lt;/li&gt;&lt;li&gt;&lt;code&gt;scipy.stats.kstest(data, "expon", args=(0, mean))&lt;/code&gt; — prvé 0 = loc (začiatok v nule), druhé = scale = 1/λ = priemer.&lt;/li&gt;&lt;li&gt;Pravidlo: &lt;b&gt;p &amp;lt; 0.05 ⇒ zamietame H0&lt;/b&gt;. Ak data nie sú exp., v ďalšom kroku padne &lt;i&gt;kvartilový&lt;/i&gt; odhad STT.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;`,
    '08': `&lt;h2&gt;Krok 08 — rlength&lt;/h2&gt;
&lt;p class="thintro"&gt;Rozdelíme dlhý log klikov na &lt;b&gt;sedenia&lt;/b&gt; — skupinky klikov, ktoré pravdepodobne urobil ten istý človek počas jednej návštevy webu. Hranicu medzi sedeniami nájdeme cez čas strávený na stránke.&lt;/p&gt;

&lt;h3&gt;Ako sme to robili v projekte&lt;/h3&gt;
&lt;p&gt;Najprv spočítame &lt;b&gt;priemerný čas&lt;/b&gt; ktorý ľudia trávia na stránke (zo stĺpca &lt;code&gt;Length&lt;/code&gt;). Predpokladáme, že 40 % stránok sú len rýchle navigačné prekliky a 60 % je skutočné čítanie. Z toho cez vzorec spočítame &lt;b&gt;časový prah&lt;/b&gt; (asi 75 sekúnd). Ak je &lt;code&gt;Length&lt;/code&gt; väčší ako prah (alebo prázdny, t.j. posledný klik), označíme klik ako &lt;b&gt;začiatok nového sedenia&lt;/b&gt;. Sedenia očíslujeme cez kumulatívny súčet príznakov.&lt;/p&gt;
&lt;pre&gt;&lt;code&gt;p = 0.4
mean_length = df["Length"].mean()
rlength = -np.log(1 - p) * mean_length   # ~75 s

df["NEW_SESSION"] = df["Length"].isna() | (df["Length"] &gt;= rlength)
df["SESSION_ID"] = df["NEW_SESSION"].cumsum()&lt;/code&gt;&lt;/pre&gt;

&lt;h3&gt;Vizuálne&lt;/h3&gt;
&lt;table class="thtable"&gt;
&lt;tr&gt;&lt;th&gt;USER&lt;/th&gt;&lt;th&gt;Length (s)&lt;/th&gt;&lt;th&gt;NEW?&lt;/th&gt;&lt;th&gt;SESSION_ID&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;A&lt;/td&gt;&lt;td&gt;NaN (prvý)&lt;/td&gt;&lt;td&gt;True&lt;/td&gt;&lt;td&gt;1&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;A&lt;/td&gt;&lt;td&gt;12&lt;/td&gt;&lt;td&gt;False&lt;/td&gt;&lt;td&gt;1&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;A&lt;/td&gt;&lt;td&gt;30&lt;/td&gt;&lt;td&gt;False&lt;/td&gt;&lt;td&gt;1&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;A&lt;/td&gt;&lt;td&gt;180 (&gt; 75)&lt;/td&gt;&lt;td&gt;True&lt;/td&gt;&lt;td&gt;2&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;A&lt;/td&gt;&lt;td&gt;8&lt;/td&gt;&lt;td&gt;False&lt;/td&gt;&lt;td&gt;2&lt;/td&gt;&lt;/tr&gt;
&lt;/table&gt;
&lt;p&gt;Na vstupe máme cca &lt;b&gt;~20 666 záznamov&lt;/b&gt; (po cv2 anti-bot filtri) a na výstupe vznikne &lt;b&gt;~7 558 sedení&lt;/b&gt; (zadanie ~8 000).&lt;/p&gt;

&lt;div class="thbox thpochop"&gt;
&lt;h4&gt;Pochop (princíp, prečo)&lt;/h4&gt;
&lt;ul&gt;
&lt;li&gt;&lt;b&gt;Sedenie&lt;/b&gt; = jedna návšteva webu jedným človekom. Keď človek odíde a o hodinu sa vráti, je to už &lt;i&gt;iné&lt;/i&gt; sedenie, aj keď je to ten istý používateľ.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Prečo čas?&lt;/b&gt; Keď človek odíde z webu, neoznámi to. Vidíme len dlhú medzeru medzi klikmi — tá medzera je signál, že nasledujúci klik patrí už do novej návštevy.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Analógia s autobusmi:&lt;/b&gt; čakanie medzi klikmi sa správa ako čakanie medzi príchodmi autobusov — väčšina krátkych, občas dlhá pauza. To je presne exponenciálne rozdelenie z Munkovej prednášky 7.&lt;/li&gt;
&lt;li&gt;Munk: 40 % stránok býva &lt;i&gt;navigačných&lt;/i&gt; (rýchle prekliky), zvyšok sú &lt;i&gt;obsahové&lt;/i&gt;. Prah teda hľadáme tam, kde končí spodných 40 % najkratších časov.&lt;/li&gt;
&lt;/ul&gt;
&lt;/div&gt;

&lt;div class="thbox thnabif"&gt;
&lt;h4&gt;Nabif (vzorce, čísla, idiómy)&lt;/h4&gt;
&lt;ul&gt;
&lt;li&gt;&lt;b&gt;Vzorec prahu:&lt;/b&gt; &lt;code&gt;τ = -ln(1 - p) · μ&lt;/code&gt;, kde &lt;code&gt;p = 0.4&lt;/code&gt; a &lt;code&gt;μ&lt;/code&gt; je priemerný čas na stránke.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Odkiaľ vzorec:&lt;/b&gt; kvantilová funkcia exponenciálneho rozdelenia &lt;code&gt;F⁻¹(p) = -ln(1-p)/λ&lt;/code&gt; a &lt;code&gt;λ = 1/μ&lt;/code&gt; (maximálne vierohodný odhad intenzity).&lt;/li&gt;
&lt;li&gt;&lt;b&gt;ln&lt;/b&gt; = prirodzený logaritmus (so základom &lt;i&gt;e&lt;/i&gt; ≈ 2,718).&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Idióm na číslovanie:&lt;/b&gt; &lt;code&gt;cumsum()&lt;/code&gt; nad booleanom — každé &lt;code&gt;True&lt;/code&gt; pridá 1, &lt;code&gt;False&lt;/code&gt; nepridá nič, takže všetky kliky v jednom sedení dostanú rovnaké číslo.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Posledný klik používateľa&lt;/b&gt; má &lt;code&gt;Length = NaN&lt;/code&gt; → automaticky štartuje nové sedenie.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Porovnanie prahov:&lt;/b&gt; RLength prah ≈ 75 s je nižší než STT_MEAN ≈ 176 s. Nižší prah trhá log na viac sedení → ~8 000 (RLength) vs ~7 500 (STT_MEAN). RLength je teda "prísnejšia" metóda.&lt;/li&gt;
&lt;/ul&gt;
&lt;/div&gt;`,
    '09': `&lt;h2&gt;Krok 09 — h-ref (identifikácia sedení)&lt;/h2&gt;
&lt;p class="thintro"&gt;V tomto kroku rozdelíme kliky každého používateľa na &lt;b&gt;sedenia&lt;/b&gt; — jedno sedenie = jedna súvislá návšteva webu. Keď človek odíde a vráti sa neskôr, je to už nové sedenie.&lt;/p&gt;

&lt;h3&gt;Ako sme to robili v projekte&lt;/h3&gt;
&lt;p&gt;Pre každý klik sa rozhodneme, či ním začína nové sedenie. Stačí, aby platilo &lt;b&gt;jedno&lt;/b&gt; z troch pravidiel (operátor &lt;code&gt;|&lt;/code&gt; = "alebo"). Potom tieto True/False hodnoty postupne sčítavame cez &lt;code&gt;cumsum()&lt;/code&gt; — každé True zvýši poradové číslo sedenia o 1. Tak dostaneme stĺpec &lt;code&gt;SESSION_ID&lt;/code&gt;.&lt;/p&gt;
&lt;pre&gt;&lt;code&gt;mean_length = df["Length"].mean()
df["NEW_SESSION"] = (
    (df["Length"].isna())              # 1) prvy klik usera
    | (df["Length"] &amp;gt;= mean_length)    # 2) dlha pauza
    | (df["Referrer"] == "-")          # 3) prisiel zvonku
)
df["SESSION_ID"] = df["NEW_SESSION"].cumsum()&lt;/code&gt;&lt;/pre&gt;
&lt;p&gt;Výsledok ukladáme do &lt;code&gt;out/cleaned_log4_href.csv&lt;/code&gt;. Zadanie očakáva &lt;b&gt;~7200 sedení&lt;/b&gt;, reálne &lt;b&gt;8180&lt;/b&gt; (tolerancia v jednotkách %).&lt;/p&gt;

&lt;h3&gt;Vizuálne&lt;/h3&gt;
&lt;table class="thtable"&gt;
&lt;tr&gt;&lt;th&gt;Čas&lt;/th&gt;&lt;th&gt;URL&lt;/th&gt;&lt;th&gt;Referrer&lt;/th&gt;&lt;th&gt;Length&lt;/th&gt;&lt;th&gt;Nové sedenie?&lt;/th&gt;&lt;th&gt;SESSION_ID&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;12:00&lt;/td&gt;&lt;td&gt;A&lt;/td&gt;&lt;td&gt;-&lt;/td&gt;&lt;td&gt;NaN&lt;/td&gt;&lt;td&gt;&lt;b&gt;ÁNO&lt;/b&gt; (prvý)&lt;/td&gt;&lt;td&gt;1&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;12:01&lt;/td&gt;&lt;td&gt;B&lt;/td&gt;&lt;td&gt;A&lt;/td&gt;&lt;td&gt;60s&lt;/td&gt;&lt;td&gt;nie&lt;/td&gt;&lt;td&gt;1&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;13:00&lt;/td&gt;&lt;td&gt;A&lt;/td&gt;&lt;td&gt;-&lt;/td&gt;&lt;td&gt;3540s&lt;/td&gt;&lt;td&gt;&lt;b&gt;ÁNO&lt;/b&gt; (Ref="-")&lt;/td&gt;&lt;td&gt;2&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;13:04&lt;/td&gt;&lt;td&gt;E&lt;/td&gt;&lt;td&gt;D&lt;/td&gt;&lt;td&gt;240s&lt;/td&gt;&lt;td&gt;nie&lt;/td&gt;&lt;td&gt;2&lt;/td&gt;&lt;/tr&gt;
&lt;/table&gt;

&lt;div class="thbox thpochop"&gt;&lt;h4&gt;Pochop (princíp, prečo)&lt;/h4&gt;
&lt;ul&gt;
&lt;li&gt;&lt;b&gt;Referrer = z akej stránky som sem klikol.&lt;/b&gt; Keď je &lt;code&gt;"-"&lt;/code&gt;, používateľ &lt;i&gt;nezačal&lt;/i&gt; navigáciu na našom webe — napísal URL ručne, prišiel z Google, alebo klikol na záložku. To je &lt;b&gt;jednoznačný začiatok&lt;/b&gt; novej návštevy.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Length = pauza pred týmto klikom.&lt;/b&gt; Keď je nezvyčajne dlhá (väčšia ako priemer), používateľ pravdepodobne medzitým odišiel od počítača. Tak vznikne ďalšie sedenie.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Munk prednáška 8:&lt;/b&gt; ak máme Extended Log (so stĺpcom Referrer), môžeme použiť h-ref — heuristiku podľa štruktúry navigácie. Bez Referrera by sme museli ísť čisto cez čas (metóda STT).&lt;/li&gt;
&lt;li&gt;Naša verzia je &lt;b&gt;zjednodušená&lt;/b&gt;: plná h-ref by tiež trhala sedenie, keď Referrer nesúhlasí s predošlou navštívenou URL. My kontrolujeme len prázdny Referrer.&lt;/li&gt;
&lt;/ul&gt;&lt;/div&gt;

&lt;div class="thbox thnabif"&gt;&lt;h4&gt;Nabif (vzorce, čísla, idiómy)&lt;/h4&gt;
&lt;ul&gt;
&lt;li&gt;&lt;b&gt;3 pravidlá &lt;u&gt;OR&lt;/u&gt;:&lt;/b&gt; &lt;code&gt;Length.isna() | Length &amp;gt;= mean | Referrer == "-"&lt;/code&gt;&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Idióm cumsum&lt;/b&gt; na booleovskom stĺpci: &lt;code&gt;[T,F,F,T,F] → [1,1,1,2,2]&lt;/code&gt; — elegantný spôsob ako z "začiatkov" urobiť poradové čísla skupín.&lt;/li&gt;
&lt;li&gt;Časový prah = &lt;b&gt;priemer Length&lt;/b&gt; (&lt;code&gt;.mean()&lt;/code&gt; ignoruje NaN). Munk ako presnejší odhad odporúča &lt;b&gt;kvartilový&lt;/b&gt; vzorec &lt;code&gt;Q3 + 1.5·IQR&lt;/code&gt;.&lt;/li&gt;
&lt;li&gt;Vstup: &lt;code&gt;cleaned_log4_length.csv&lt;/code&gt;. Výstup: &lt;code&gt;cleaned_log4_href.csv&lt;/code&gt; + nový stĺpec &lt;code&gt;SESSION_ID&lt;/code&gt;.&lt;/li&gt;
&lt;li&gt;Kontrolné číslo: &lt;b&gt;~7200 sedení&lt;/b&gt; zo zadania, reálne &lt;b&gt;8180&lt;/b&gt; pri ~20 666 záznamoch po cv2 anti-bot čistení.&lt;/li&gt;
&lt;/ul&gt;&lt;/div&gt;`,
    'overview': `&lt;h2&gt;Téma 3 — Identifikácia (prehľad)&lt;/h2&gt;
&lt;p class="thintro"&gt;Z očisteného logu (po téme 2) máme len &lt;b&gt;riadky&lt;/b&gt; — IP, čas, URL. Ešte stále nevieme, &lt;i&gt;kto&lt;/i&gt; návštevu spravil ani &lt;i&gt;kedy končí jedna návšteva a začína ďalšia&lt;/i&gt;. Téma 3 to dokončí: každý riadok dostane &lt;code&gt;User_ID&lt;/code&gt; (kto sedel pri počítači) a &lt;code&gt;Session_ID&lt;/code&gt; (jedno sedenie = súvislé prehliadanie webu).&lt;/p&gt;

&lt;h3&gt;Ako to funguje&lt;/h3&gt;
&lt;p&gt;Postupujeme v dvoch krokoch. &lt;b&gt;Najprv&lt;/b&gt; identifikujeme používateľa — keďže žiadne prihlásenie nemáme, vezmeme &lt;b&gt;IP adresu + User-Agent&lt;/b&gt; (typ prehliadača) ako "odtlačok": rovnaká dvojica = ten istý človek. &lt;b&gt;Potom&lt;/b&gt; jeho riadky rozdelíme na sedenia — používateľ si dá kávu, odíde od počítača a vráti sa za hodinu, to už nie je to isté sedenie. Hranicu zistíme z &lt;b&gt;času&lt;/b&gt; (časové okno) alebo zo &lt;b&gt;štruktúry&lt;/b&gt; (vrátil sa cez vyhľadávač = nové sedenie). Na to potrebujeme jednotný čas, preto najprv všetko prevedieme na &lt;b&gt;UNIXTIME&lt;/b&gt; (počet sekúnd od 1.1.1970).&lt;/p&gt;

&lt;h3&gt;Vizuálne&lt;/h3&gt;
&lt;pre&gt;&lt;code&gt;[1] UNIXTIME            čas ako číslo (sekundy)
[2] User_ID             IP + User-Agent → osoba (~4040 zadanie / 4096 reálne)
[3] Length              čas na stránke = t(n+1) - t(n)
[4-5] STT_MEAN / STT_Q  odhad hranice (priemer / kvartil)
[6] SLength = 10 min    klasická hranica → ~6700 zadanie / 7075 reálne
[7-8] RLength           heuristika cez ln(1-π) → ~8000 zadanie / 7558 reálne
[9] h-ref               nový referer = nové sedenie → ~7200 zadanie / 8180 reálne&lt;/code&gt;&lt;/pre&gt;
&lt;table class="thtable"&gt;&lt;tr&gt;&lt;th&gt;Vstup&lt;/th&gt;&lt;th&gt;Výstup&lt;/th&gt;&lt;th&gt;Pridáme stĺpec&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;~20 666 × 7 stĺpcov (z cv2)&lt;/td&gt;&lt;td&gt;~20 666 × 11 stĺpcov&lt;/td&gt;&lt;td&gt;UNIXTIME, USER_ID, Length, SESSION_ID&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td colspan="3"&gt;&lt;small&gt;Pozn.: 257k = raw Apache log z cv1, 31.5k = medzistav v cv2. V téme 3 sa &lt;b&gt;počet riadkov nemení&lt;/b&gt; — iba pridávame stĺpce.&lt;/small&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;

&lt;div class="thbox thpochop"&gt;&lt;h4&gt;Pochop (princíp, prečo)&lt;/h4&gt;&lt;ul&gt;
&lt;li&gt;&lt;b&gt;Prečo IP + User-Agent?&lt;/b&gt; Samotná IP nestačí — za jednou IP (napr. školský NAT) sedí veľa ľudí s rôznymi prehliadačmi. Kombinácia rozlíši Chrome od Firefoxu na tej istej IP.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Sedenie ≠ používateľ.&lt;/b&gt; Jeden človek má za týždeň 5 sedení. Sedenie je jedna "návšteva v kuse" — preto sa najprv robí User_ID, potom Session_ID.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Prečo viac metód?&lt;/b&gt; Munk v prednáške ukazuje, že "kde rozseknúť sedenie" je odhad — preto pevné 10 min (SLength), štatistický odhad z dát (STT, RLength) aj odkaz-podľa-štruktúry (h-ref). Každá dá iný počet sedení a iné výsledky pri ďalšej analýze.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Prečo UNIXTIME?&lt;/b&gt; Aby sa rozdiely "kedy ďalší klik" počítali jednoducho ako &lt;code&gt;t2 - t1&lt;/code&gt; v sekundách, bez parsovania dátumov.&lt;/li&gt;
&lt;/ul&gt;&lt;/div&gt;

&lt;div class="thbox thnabif"&gt;&lt;h4&gt;Nabif (vzorce, čísla, idiómy)&lt;/h4&gt;&lt;ul&gt;
&lt;li&gt;&lt;b&gt;Identifikácia v CRISP-DM:&lt;/b&gt; patrí do fázy &lt;i&gt;Príprava dát&lt;/i&gt; (Data Preparation) — Munk, prednáška 7.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Length:&lt;/b&gt; &lt;code&gt;t(n+1) − t(n)&lt;/code&gt; ak ten istý User a rozdiel &lt; 3600 s; inak &lt;code&gt;None&lt;/code&gt;. Priemer ≈ 150 s.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;STT_Q (kvartilový odhad):&lt;/b&gt; &lt;code&gt;Q3 + 1.5·(Q3−Q1)&lt;/code&gt; — Tukeyho hranica outlierov aplikovaná na Length.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;RLength (exponenciálne rozdelenie):&lt;/b&gt; &lt;code&gt;τ = −(1/λ)·ln(1−π)&lt;/code&gt;, kde π = podiel navigačných stránok (~0.4) a &lt;code&gt;1/λ&lt;/code&gt; = priemerná Length.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Očakávané počty (zadanie / reálne):&lt;/b&gt; STT_MEAN 7500/7097, STT_Q 7500/7873, SLength 6700/7075, RLength 8000/7558, h-ref 7200/8180 sedení; používateľov 4040/4096.&lt;/li&gt;
&lt;/ul&gt;&lt;/div&gt;`,
  },
  4: {
    '01': `&lt;h2&gt;Krok 01 — doplnenie ciest (vstup STT_MEAN)&lt;/h2&gt;
&lt;p class="thintro"&gt;V tomto kroku &lt;b&gt;dopĺňame chýbajúce kliky&lt;/b&gt; do logu. Prehliadač totiž tlačidlo „späť" alebo stránky z pamäte neposiela na server — v logu tak vznikajú „skoky", medzi ktorými reálne chýba 1 medzistránka.&lt;/p&gt;

&lt;h3&gt;Ako sme to robili v projekte&lt;/h3&gt;
&lt;p&gt;Vstup je &lt;code&gt;cleaned_log4_stt_mean.csv&lt;/code&gt; — log so sedeniami z cv2 (metóda STT_MEAN). Načítame &lt;b&gt;mapu webu&lt;/b&gt; (Excel od vyučujúceho), kde pre každú stránku poznáme jej &lt;i&gt;rodiča&lt;/i&gt; (odkiaľ sa na ňu dá prirodzene dostať). Odrežeme doménu &lt;code&gt;https://www.ukf.sk&lt;/code&gt;, aby cesty sedeli s logom. Potom prechádzame log po riadkoch a kde vidíme dvojicu &lt;code&gt;A → B&lt;/code&gt; v rámci jedného sedenia, pričom &lt;b&gt;A nie je v mape&lt;/b&gt; a &lt;b&gt;B áno&lt;/b&gt; — vložíme medzi ne rodiča stránky B.&lt;/p&gt;
&lt;pre&gt;&lt;code&gt;if url_from not in map_paths and url_to in map_paths:
    ref_page = parent.get(url_to)
    if ref_page and ref_page != url_from:
        new_row = curr.to_dict()
        new_row["URL"] = ref_page
        new_rows.append(new_row)&lt;/code&gt;&lt;/pre&gt;
&lt;p&gt;Očakávame doplniť približne &lt;b&gt;750 záznamov&lt;/b&gt; (podľa zadania).&lt;/p&gt;

&lt;h3&gt;Vizuálne&lt;/h3&gt;
&lt;table class="thtable"&gt;
&lt;tr&gt;&lt;th&gt;Log pred&lt;/th&gt;&lt;th&gt;Mapa webu&lt;/th&gt;&lt;th&gt;Log po doplnení&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;A → X&lt;/td&gt;&lt;td&gt;rodič(X) = B&lt;/td&gt;&lt;td&gt;A → &lt;b&gt;B&lt;/b&gt; → X&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;/ → /studium/programy&lt;/td&gt;&lt;td&gt;rodič = /studium&lt;/td&gt;&lt;td&gt;/ → &lt;b&gt;/studium&lt;/b&gt; → /studium/programy&lt;/td&gt;&lt;/tr&gt;
&lt;/table&gt;
&lt;p&gt;&lt;i&gt;Pozn.:&lt;/i&gt; prednáška 8 (Munk) ukazuje &lt;b&gt;úplný backtrack&lt;/b&gt; — celý reťazec rodičov až po spoločného predka (príklad &lt;code&gt;ABCDX → A B C D C B A X&lt;/code&gt;). My robíme &lt;b&gt;zjednodušenú variantu&lt;/b&gt; — dopĺňame iba JEDNÉHO rodiča cieľa. Výpočtovo lacnejšie a na našom datasete to stačí.&lt;/p&gt;

&lt;div class="thbox thpochop"&gt;&lt;h4&gt;Pochop (princíp, prečo)&lt;/h4&gt;&lt;ul&gt;
&lt;li&gt;&lt;b&gt;Prečo skoky vznikajú:&lt;/b&gt; prehliadač má cache + tlačidlo „späť" — tieto kliky server nevidí, takže log má diery.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Prečo mapa webu:&lt;/b&gt; je to „mapa mesta" — vie, ktorá zastávka susedí s ktorou. Keď v logu chýba zastávka, doplníme ju z mapy.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Prečo iba v rámci sedenia:&lt;/b&gt; medzi dvomi sedeniami môže byť iný používateľ alebo dlhá pauza — dopĺňať tam medzistránku nemá zmysel.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Prečo rodič cieľa:&lt;/b&gt; ak človek skončil na B, najpravdepodobnejšie sa tam dostal cez rodiča B (priamy link z navigácie).&lt;/li&gt;
&lt;/ul&gt;&lt;/div&gt;

&lt;div class="thbox thnabif"&gt;&lt;h4&gt;Nabif (vzorce, čísla, idiómy)&lt;/h4&gt;&lt;ul&gt;
&lt;li&gt;&lt;b&gt;Podmienka doplnenia:&lt;/b&gt; &lt;code&gt;url_from ∉ mapa ∧ url_to ∈ mapa ∧ rodič(url_to) ≠ url_from&lt;/code&gt;.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Slovník rodičov:&lt;/b&gt; &lt;code&gt;parent = dict(zip(mapa.path, mapa.ref_path))&lt;/code&gt; — hľadanie rodiča je O(1).&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Doména:&lt;/b&gt; odrežeme &lt;code&gt;https://www.ukf.sk&lt;/code&gt;; prázdny string nahradíme za &lt;code&gt;/&lt;/code&gt; (hlavná stránka).&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Očakávaný prírastok:&lt;/b&gt; ~&lt;b&gt;750&lt;/b&gt; doplnených riadkov (zadanie).&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Výstup:&lt;/b&gt; &lt;code&gt;out/cleaned_log4_doplnene.csv&lt;/code&gt; — pôvodný log + vložené medzistránky, časová značka kopíruje aktuálny riadok.&lt;/li&gt;
&lt;/ul&gt;&lt;/div&gt;`,
    '02': `&lt;h2&gt;Krok 02 — Doplnenie ciest (verzia STT_Q)&lt;/h2&gt;
&lt;p class="thintro"&gt;Server nevidí, keď používateľ klikne v prehliadači &lt;b&gt;"Späť"&lt;/b&gt; — stránka sa načíta z pamäte prehliadača a v logu zostane diera. Tu tieto diery &lt;b&gt;dohádame&lt;/b&gt; pomocou mapy webu (zoznam stránok a ich rodičov). Tento variant pracuje so sedeniami rozdelenými metódou &lt;code&gt;STT_Q&lt;/code&gt; (kvantilový odhad časového okna).&lt;/p&gt;

&lt;h3&gt;Ako sme to robili v projekte&lt;/h3&gt;
&lt;p&gt;Načítame log so sedeniami (&lt;code&gt;cleaned_log4_stt_q.csv&lt;/code&gt;) a mapu webu (&lt;code&gt;mapa_webu.xlsx&lt;/code&gt;). Z mapy si spravíme &lt;b&gt;slovník {stránka: rodič}&lt;/b&gt; — rýchle vyhľadanie rodiča. Potom kráčame logom &lt;b&gt;po dvojiciach susedných riadkov&lt;/b&gt; v rámci toho istého sedenia. Keď vidíme preskok zo stránky &lt;code&gt;A&lt;/code&gt; na &lt;code&gt;B&lt;/code&gt; a &lt;b&gt;A nie je v mape, ale B áno&lt;/b&gt;, vložíme medzi ne rodiča stránky &lt;code&gt;B&lt;/code&gt; — to je tá chýbajúca medzistránka, na ktorú sa používateľ vrátil cez "Späť".&lt;/p&gt;
&lt;pre&gt;&lt;code&gt;if url_from not in map_paths and url_to in map_paths:
    ref_page = parent.get(url_to)
    if ref_page and ref_page != url_from:
        new_row = curr.to_dict()
        new_row["URL"] = ref_page   # domyslena medzistranka
        new_rows.append(new_row)&lt;/code&gt;&lt;/pre&gt;

&lt;h3&gt;Vizuálne&lt;/h3&gt;
&lt;table class="thtable"&gt;
&lt;tr&gt;&lt;th&gt;Pôvodný log&lt;/th&gt;&lt;th&gt;Po doplnení&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;A → B → C → &lt;b&gt;D&lt;/b&gt; → &lt;b&gt;X&lt;/b&gt;&lt;/td&gt;&lt;td&gt;A → B → C → D → &lt;b&gt;C&lt;/b&gt; → &lt;b&gt;B&lt;/b&gt; → &lt;b&gt;A&lt;/b&gt; → X&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;X &lt;i&gt;nie je v mape&lt;/i&gt;&lt;/td&gt;&lt;td&gt;medzi D a X chýbali tlačidlá "Späť"&lt;/td&gt;&lt;/tr&gt;
&lt;/table&gt;
&lt;p&gt;&lt;b&gt;Pravidlo:&lt;/b&gt; &lt;code&gt;url_from ∉ mapa ∧ url_to ∈ mapa&lt;/code&gt; ⇒ vlož &lt;code&gt;parent(url_to)&lt;/code&gt;.&lt;/p&gt;

&lt;div class="thbox thpochop"&gt;&lt;h4&gt;Pochop (princíp, prečo)&lt;/h4&gt;&lt;ul&gt;
&lt;li&gt;&lt;b&gt;Prečo to robíme:&lt;/b&gt; HTTP log zachytí len požiadavky, ktoré reálne odišli na server. Klik "Späť" alebo "Dopredu" v prehliadači ich nevyvolá — stránka sa vykreslí z cache.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Logika:&lt;/b&gt; ak nasledujúca stránka existuje v mape, ale predošlá nie, používateľ sa musel niekde "stratiť" — najpravdepodobnejšie sa vrátil na &lt;b&gt;rodiča&lt;/b&gt; cieľa a odtiaľ klikol ďalej.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Hranice sedení sa nemiešajú:&lt;/b&gt; medzi dvoma rôznymi sedeniami je prirodzená medzera (používateľ odišiel), žiadne doplnenie tam nedáva zmysel.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Munk, prednáška 8:&lt;/b&gt; doplnenie ciest je &lt;i&gt;štvrtá fáza prípravy dát&lt;/i&gt; (po čistení, identifikácii používateľov a sedení). Bez nej by analýza navigácie bola dieravá.&lt;/li&gt;
&lt;/ul&gt;&lt;/div&gt;

&lt;div class="thbox thnabif"&gt;&lt;h4&gt;Nabif (vzorce, čísla, idiómy)&lt;/h4&gt;&lt;ul&gt;
&lt;li&gt;&lt;b&gt;STT_Q&lt;/b&gt; = Session Timeout Threshold určený &lt;b&gt;Tukeyho pravidlom&lt;/b&gt; (1977) pre detekciu outlierov: &lt;code&gt;τ = Q3 + 1.5·IQR&lt;/code&gt;, kde Q3 = 75. percentil Length a IQR = Q3 − Q1 (interkvartilové rozpätie). V projekte: Q3 ≈ 31 s, IQR ≈ 30 s → &lt;b&gt;τ ≈ 76 s&lt;/b&gt;. (Vzorec &lt;code&gt;τ = −ln(1−q)/λ&lt;/code&gt; patrí RLength v kroku 03 — tu nepatrí, je to bola chyba v staršej verzii materiálov.)&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Mapa webu&lt;/b&gt; = slovník &lt;code&gt;{path → ref_path}&lt;/code&gt;. Pred porovnaním orežeme &lt;code&gt;https://www.ukf.sk&lt;/code&gt; a prázdny reťazec premapujeme na &lt;code&gt;"/"&lt;/code&gt; (hlavná stránka).&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Idiómy:&lt;/b&gt; &lt;code&gt;parent.get(url_to)&lt;/code&gt; (bezpečné, vráti &lt;code&gt;None&lt;/code&gt; namiesto KeyError); &lt;code&gt;set(map_paths)&lt;/code&gt; pre O(1) lookup; iterujeme cez &lt;code&gt;new_rows.append(curr.to_dict())&lt;/code&gt; a vkladáme medzi ne.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Poistka proti duplikátu:&lt;/b&gt; &lt;code&gt;ref_page != url_from&lt;/code&gt; — keby rodič bola tá istá stránka, z ktorej sme prišli, pridali by sme zbytočný riadok.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Očakávaný výsledok:&lt;/b&gt; zadanie počítalo s cca &lt;b&gt;750 doplnenými záznamami&lt;/b&gt;, reálne ~&lt;b&gt;735&lt;/b&gt; (STT_Q variant). Pôvodný log sa rozšíri, žiadny riadok sa nemaže.&lt;/li&gt;
&lt;/ul&gt;&lt;/div&gt;`,
    '03': `&lt;h2&gt;Krok 03 — Doplnenie ciest (verzia RLength)&lt;/h2&gt;
&lt;p class="thintro"&gt;Server zaznamenáva iba stránky, ktoré si prehliadač naozaj vyžiadal. Keď používateľ klikne &lt;b&gt;Späť&lt;/b&gt; alebo prehliadač zoberie stránku z pamäte (&lt;i&gt;cache&lt;/i&gt;), v logu vzniknú &lt;b&gt;diery&lt;/b&gt; — chýbajúce medzistránky. Tento krok ich vyplní podľa &lt;b&gt;mapy webu&lt;/b&gt; na sedení rozdelenom metódou RLength (kvartilový odhad z cv2).&lt;/p&gt;

&lt;h3&gt;Ako sme to robili v projekte&lt;/h3&gt;
&lt;p&gt;Načítame log s rozdelenými sedeniami (&lt;code&gt;cleaned_log4_rlength.csv&lt;/code&gt;) a &lt;b&gt;mapu webu&lt;/b&gt; UKF (Excel), kde pre každú stránku poznáme jej &lt;b&gt;rodiča&lt;/b&gt; — stránku, cez ktorú sa na ňu dá dostať. Z mapy si urobíme rýchly slovník &lt;code&gt;parent[stranka] = rodic&lt;/code&gt;. Potom prechádzame log po dvojiciach susedných klikov &lt;i&gt;v tom istom sedení&lt;/i&gt;. Ak &lt;b&gt;aktuálna stránka nie je v mape&lt;/b&gt; ale &lt;b&gt;ďalšia áno&lt;/b&gt;, vložíme medzi ne rodiča tej ďalšej — to je tá chýbajúca spojka. Skopírujeme aktuálny riadok (IP, čas, USER_ID, SESSION_ID) a prepíšeme len URL.&lt;/p&gt;
&lt;pre&gt;&lt;code&gt;if url_from not in map_paths and url_to in map_paths:
    ref_page = parent.get(url_to)
    if ref_page and ref_page != url_from:
        new_row = curr.to_dict()
        new_row["URL"] = ref_page
        new_rows.append(new_row)
        added_count += 1&lt;/code&gt;&lt;/pre&gt;

&lt;h3&gt;Vizuálne&lt;/h3&gt;
&lt;p&gt;Príklad z prednášky 8 — používateľ klikol &lt;i&gt;A → X&lt;/i&gt;, ale skutočná cesta v strome je &lt;i&gt;A → B → C → D → X&lt;/i&gt;:&lt;/p&gt;
&lt;table class="thtable"&gt;
&lt;tr&gt;&lt;th&gt;Log (čo videl server)&lt;/th&gt;&lt;th&gt;Po doplnení ciest&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;A&lt;/td&gt;&lt;td&gt;A&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;X&lt;/td&gt;&lt;td&gt;&lt;b&gt;B&lt;/b&gt; (doplnené)&lt;br&gt;&lt;b&gt;C&lt;/b&gt; (doplnené)&lt;br&gt;&lt;b&gt;D&lt;/b&gt; (doplnené)&lt;br&gt;X&lt;/td&gt;&lt;/tr&gt;
&lt;/table&gt;
&lt;p&gt;Náš skript rieši &lt;b&gt;jednu úroveň&lt;/b&gt; tejto reťaze: keď je medzi dvoma klikmi presne jeden chýbajúci rodič.&lt;/p&gt;

&lt;div class="thbox thpochop"&gt;&lt;h4&gt;Pochop (princíp, prečo)&lt;/h4&gt;&lt;ul&gt;
&lt;li&gt;&lt;b&gt;Prečo log klame:&lt;/b&gt; keď používateľ klikne Späť, prehliadač stránku ukáže z vlastnej pamäte a server nepošle nový záznam — cesta je teda v logu &lt;i&gt;skrátená&lt;/i&gt;.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Mapa webu ako pravda:&lt;/b&gt; mapa hovorí, ktorá stránka je rodičom inej. Ak vieme z čoho ide používateľ a kam, dopočítame chýbajúci most.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Doplnenie len v rámci sedenia:&lt;/b&gt; keď sa zmení &lt;code&gt;SESSION_ID&lt;/code&gt;, je to už iný používateľ alebo iná návšteva — preskakovať medzi nimi by bola hlúposť.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;RLength verzia:&lt;/b&gt; hranice sedení v tomto vstupe sme určili &lt;b&gt;exponenciálnym kvantilom&lt;/b&gt; (cv2 úloha 08, prednáška 7): &lt;code&gt;τ = −ln(1−p)·μ&lt;/code&gt; pre p = 0.4 = podiel "navigačných" stránok (rýchle prekliknutia s krátkou pauzou — ~40 % všetkých klikov v typickom WUM logu).&lt;/li&gt;
&lt;/ul&gt;&lt;/div&gt;

&lt;div class="thbox thnabif"&gt;&lt;h4&gt;Nabif (vzorce, čísla, idiómy)&lt;/h4&gt;&lt;ul&gt;
&lt;li&gt;&lt;b&gt;Podmienka vloženia:&lt;/b&gt; &lt;code&gt;url_from ∉ mapa AND url_to ∈ mapa&lt;/code&gt; → vlož &lt;code&gt;parent[url_to]&lt;/code&gt;.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Strážka cyklu:&lt;/b&gt; nevkladáme ak &lt;code&gt;ref_page == url_from&lt;/code&gt; (predišlo by sa A → A → B).&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Čakaný počet:&lt;/b&gt; v projekte reálne &lt;b&gt;~776 doplnených záznamov&lt;/b&gt; (zadanie hovorí ~850 — drž sa nižšieho čísla pre samokontrolu).&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Príprava mapy:&lt;/b&gt; odrezať &lt;code&gt;https://www.ukf.sk&lt;/code&gt;, prázdny path nahradiť &lt;code&gt;"/"&lt;/code&gt; (koreň).&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Munk (prednáška 8):&lt;/b&gt; "Doplnenie záznamov logovacieho súboru" je posledný krok prípravy dát v CRISP-DM — bez neho by sekvenčná analýza navigácie videla skoky, ktoré sa reálne nestali.&lt;/li&gt;
&lt;/ul&gt;&lt;/div&gt;`,
    '04': `&lt;h2&gt;Krok 04 — Doplnenie chýbajúcich stránok (metóda h-ref)&lt;/h2&gt;
&lt;p class="thintro"&gt;V logu zo servera nám občas chýbajú stránky, ktoré používateľ reálne videl (napr. preto, že si ich prehliadač vytiahol z &lt;b&gt;cache&lt;/b&gt; alebo použil tlačidlo &lt;i&gt;späť&lt;/i&gt;). V tomto kroku tieto „diery“ doplníme pomocou &lt;b&gt;mapy webu&lt;/b&gt;.&lt;/p&gt;

&lt;h3&gt;Ako sme to robili v projekte&lt;/h3&gt;
&lt;p&gt;Načítame vyčistený log (&lt;code&gt;cleaned_log4_href.csv&lt;/code&gt;) a &lt;b&gt;mapu webu&lt;/b&gt; (&lt;code&gt;mapa_webu.xlsx&lt;/code&gt;) — excel, kde je pri každej stránke uvedená jej &lt;b&gt;odkazujúca stránka&lt;/b&gt; (rodič). Z mapy si urobíme rýchly slovník &lt;code&gt;parent[B] = A&lt;/code&gt;. Potom prejdeme log po dvojiciach susedných riadkov v rámci jedného sedenia. Ak zdroj &lt;b&gt;A&lt;/b&gt; nie je v mape, ale cieľ &lt;b&gt;B&lt;/b&gt; je, vložíme medzi nich rodiča stránky B (predpokladaná medzistanica). Rovnaké stránky (refresh) a hranice sedení preskočíme.&lt;/p&gt;
&lt;pre&gt;&lt;code&gt;if url_from not in map_paths and url_to in map_paths:
    ref_page = parent.get(url_to)
    if ref_page and ref_page != url_from:
        # vlozime rodica B medzi A a B
        new_rows.append({...&quot;URL&quot;: ref_page})&lt;/code&gt;&lt;/pre&gt;

&lt;h3&gt;Vizuálne&lt;/h3&gt;
&lt;table class="thtable"&gt;
&lt;tr&gt;&lt;th&gt;Pôvodný log&lt;/th&gt;&lt;th&gt;Po doplnení&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;A → &lt;b&gt;?&lt;/b&gt; → B&lt;/td&gt;&lt;td&gt;A → &lt;b&gt;rodič(B)&lt;/b&gt; → B&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;code&gt;/neznama&lt;/code&gt; → &lt;code&gt;/univerzita/kontakt&lt;/code&gt;&lt;/td&gt;&lt;td&gt;&lt;code&gt;/neznama&lt;/code&gt; → &lt;code&gt;/univerzita&lt;/code&gt; → &lt;code&gt;/univerzita/kontakt&lt;/code&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;/table&gt;
&lt;p&gt;Výsledok: do logu pribudne &lt;b&gt;~690 doplnených záznamov&lt;/b&gt; podľa zadania, reálne &lt;b&gt;706&lt;/b&gt;.&lt;/p&gt;

&lt;div class="thbox thpochop"&gt;&lt;h4&gt;Pochop (princíp, prečo)&lt;/h4&gt;&lt;ul&gt;
&lt;li&gt;Server vidí len to, čo si prehliadač skutočne pýta. &lt;b&gt;Cache&lt;/b&gt; (rýchla pamäť prehliadača) a tlačidlo &lt;i&gt;späť&lt;/i&gt; nechajú stránku v logu „neviditeľnú“.&lt;/li&gt;
&lt;li&gt;Mapa webu je ako &lt;b&gt;mapa metra&lt;/b&gt;: hovorí, ktoré stanice (stránky) susedia. Ak vidíme skok A→B a vieme, že B sa dá dosiahnuť iba cez X, X tam &lt;i&gt;musel&lt;/i&gt; byť.&lt;/li&gt;
&lt;li&gt;Doplnenie robíme len v rámci &lt;b&gt;jedného sedenia&lt;/b&gt; — inak by sme „prepojili“ dvoch rôznych používateľov.&lt;/li&gt;
&lt;li&gt;Prednáška 8 (Munk) volá rodiča „&lt;b&gt;odkazujúca stránka&lt;/b&gt;“ (Reference Page) a uvádza úplný backtrack až po spoločného predka — my robíme zjednodušenú verziu: doplníme len jedného rodiča.&lt;/li&gt;
&lt;/ul&gt;&lt;/div&gt;

&lt;div class="thbox thnabif"&gt;&lt;h4&gt;Nabif (vzorce, čísla, idiómy)&lt;/h4&gt;&lt;ul&gt;
&lt;li&gt;Podmienka doplnenia: &lt;code&gt;A ∉ mapa ∧ B ∈ mapa ∧ parent[B] ≠ A&lt;/code&gt;.&lt;/li&gt;
&lt;li&gt;Normalizácia URL: orež doménu &lt;code&gt;https://www.ukf.sk&lt;/code&gt;, prázdny reťazec nahraď &lt;code&gt;/&lt;/code&gt; (hlavná stránka).&lt;/li&gt;
&lt;li&gt;Použi &lt;code&gt;set()&lt;/code&gt; na &lt;b&gt;map_paths&lt;/b&gt; — overenie „je v mape?“ je v O(1), pri státisícoch riadkov rozdiel medzi sekundami a hodinami.&lt;/li&gt;
&lt;li&gt;Zbieraj riadky do &lt;code&gt;list[dict]&lt;/code&gt; a až na konci &lt;code&gt;pd.DataFrame(new_rows)&lt;/code&gt; — pridávanie po jednom do DataFrame je veľmi pomalé.&lt;/li&gt;
&lt;li&gt;Očakávaný výstup: cca &lt;b&gt;690 doplnených&lt;/b&gt; zo zadania, reálne &lt;b&gt;706&lt;/b&gt; v &lt;code&gt;out/cleaned_log4_doplnene.csv&lt;/code&gt;.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Prečo h-ref doplní MENEJ než RLength (~776)?&lt;/b&gt; h-ref delí log na nové sedenie pri 3 OR podmienkach (&lt;code&gt;Length.isna() | Length≥μ | Referrer=='-'&lt;/code&gt;) → &lt;b&gt;viac kratších&lt;/b&gt; sedení (~7 200 vs ~8 000 RLength). Kratšie sedenia = menej susedných dvojíc = menej príležitostí na vloženie medzistránky → ~690 vs ~776.&lt;/li&gt;
&lt;/ul&gt;&lt;/div&gt;`,
    'overview': `&lt;h2&gt;Téma 4 — Doplnenie ciest (prehľad)&lt;/h2&gt;

&lt;p class="thintro"&gt;Webový log nezaznamenáva všetky kliknutia — keď používateľ stlačí tlačidlo &lt;b&gt;Späť&lt;/b&gt; v prehliadači, stránka sa načíta z cache a server o tom nevie. &lt;b&gt;Doplnenie ciest&lt;/b&gt; je rekonštrukcia týchto chýbajúcich krokov pomocou mapy webu a referer hlavičky.&lt;/p&gt;

&lt;h3&gt;Ako to funguje&lt;/h3&gt;
