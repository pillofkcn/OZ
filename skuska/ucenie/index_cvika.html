    {type:`flash`,q:`Aké tri kľúčové metriky charakterizujú asociačné pravidlo X&rArr;Y?`,a:`<b>Support</b> = P(X&cup;Y) – frekvencia spoločného výskytu. <b>Confidence</b> = P(Y|X) = support(X&cup;Y)/support(X) – spoľahlivosť implikácie. <b>Lift</b> = confidence/P(Y) – koľkokrát viac sa Y vyskytuje s X oproti náhode.`,step:'overview'},
    {type:`quiz`,q:`Čo znamená princíp anti-monotónie pri algoritme Apriori?`,options:[`Ak nadmnožina nesplní support, jej podmnožiny ho tiež nesplnia`,`Ak itemset nesplní min_support, žiadna jeho nadmnožina ho nesplní (umožňuje prunning)`,`Pravidlá s vyšším confidence majú vyšší lift`,`Support sa zvyšuje s veľkosťou itemsetu`],correct:1,explain:`Anti-monotónia: ak itemset I nesplní min_support, žiadny superset obsahujúci I ho nemôže splniť – preto sa pri bottom-up generovaní kandidátov dajú orezať celé vetvy.`,step:'overview'},
    {type:`match`,prompt:`Priraď koncepty k ich definíciám/vzorcom`,pairs:[[`support(X&rArr;Y)`,`P(X&cup;Y) – frekvencia spoločného výskytu`],[`confidence(X&rArr;Y)`,`P(Y|X) = support(X&cup;Y)/support(X)`],[`lift(X&rArr;Y)`,`confidence/P(Y); >1 = pozitívna korelácia`],[`Cochranova Q`,`Test rovnosti pravdepodobnosti výskytu v k závislých binárnych vzorkách`],[`Kendallovo W`,`Koeficient konkordancie z [0,1]; 0=žiadna zhoda, 1=perfektná zhoda`]],step:'overview'},
    {type:`flash`,q:`📍 Úloha 01: priprava_transakcii.py`,a:`Z logs5.csv vytvorí pre <b>každý rok 2009-2012</b> jeden CSV s košíkmi: groupby('frame'), unikátne kategórie v sedení spojené cez ';', zachované len košíky s &ge;2 položkami. Výstup: transakcie_{rok}.csv.`,step:'01'},
    {type:`quiz`,q:`Prečo má transakcia (košík) obsahovať aspoň 2 kategórie, inak sa vyhadzuje?`,options:[`Inak pandas vyhodí chybu pri to_csv`,`Pre asociačné pravidlo A&rArr;B sú potrebné minimálne 2 položky; z 1 položky nevznikne žiadna dvojica`,`Apriori vyžaduje aspoň 2 itemy v dataframe`,`Inak by sa nenačítal CSV správne`],correct:1,explain:`Pravidlo A&rArr;B vyžaduje minimálne 2 rôzne položky v transakcii. Košík s 1 kategóriou nemôže prispieť k žiadnemu pravidlu, preto sa filtruje cez str.contains(';').`,step:'01'},
    {type:`order`,prompt:`Usporiadaj kroky skriptu priprava_transakcii.py`,items:[`Načítanie logs5.csv s sep=';' a low_memory=False`,`Projekcia stĺpcov [frame, anonIP, category, year, yearQuartal]`,`Dropna(subset=['category']) – odstránenie záznamov bez kategórie`,`Iterácia cez roky, groupby('frame') a join unikátnych kategórií`,`Filter transakcií so >=2 položkami cez str.contains(';')`,`Uloženie transakcie_{rok}.csv pre každý rok`],step:'01'},
    {type:`flash`,q:`Prečo sa pri tvorbe stringu kategórií používa sorted(set(x))?`,a:`<b>set(x)</b> zaručí unikátne kategórie v košíku, <b>sorted(...)</b> robí poradie deterministickým – 'A;B' a 'B;A' budú vždy rovnaký reťazec. Bez toho by Apriori dostal nedeterministický vstup a matica vzorov by zlučovala identické pravidlá ako rôzne.`,step:'01'},
    {type:`fill`,text:`Pre rok 2009 skript vyprodukuje ___ transakcií s aspoň 2 kategóriami (najviac zo všetkých rokov).`,answer:`37734`,alts:[],step:'01'},
    {type:`flash`,q:`Prečo skript volá <code>to_csv('transakcie_2009.csv', index=False)</code> a nie len <code>to_csv(...)</code>?`,a:`Bez <b>index=False</b> by pandas zapísalo do CSV aj <b>RangeIndex</b> ako prvý stĺpec (typicky 'Unnamed: 0' pri ďalšom načítaní). Pri reťazení skriptov (úl. 01 &rarr; 02) by sa to pri každom čítaní/zápise zduplikovalo a TransactionEncoder by dostal smeti. Index je len pomocná pandas štruktúra, nie dáta.`,step:'01'},
    {type:`quiz`,q:`Prečo skript pri tvorbe košíka používa <code>sorted(set(x))</code> a tým <b>vedome stráca poradie</b> navštívených kategórií?`,options:[`set() je rýchlejší ako list pre veľké košíky`,`Apriori je transakčný (množinový) algoritmus — ignoruje poradie; pre sekvencie by sa použil PrefixSpan/GSP`,`Pandas vyžaduje set ako vstup pre groupby`,`TransactionEncoder nepodporuje duplicitné hodnoty v košíku`],correct:1,explain:`Apriori je transakčný algoritmus — pracuje s množinami (košíkmi), nie so sekvenciami. Pre asociačné pravidlo A&rArr;B nie je dôležité, či user navštívil A pred B alebo opačne, len že obe sú v jednom sedení. Ak by nás zaujímalo poradie (A potom B), použili by sme sekvenčné algoritmy ako PrefixSpan alebo GSP, ktoré majú iný matematický základ.`,step:'01'},
    {type:`flash`,q:`📍 Úloha 02: apriori_pravidla.py`,a:`Pre každý rok: načíta transakcie, prevedie ich cez <b>TransactionEncoder</b> na binárnu maticu, spustí <b>apriori</b> s min_support=0.05, vygeneruje pravidlá cez <b>association_rules</b> s metric='confidence' min_threshold=0.5 a uloží pravidla_{rok}.csv.`,step:'02'},
    {type:`quiz`,q:`Aký je vstupný formát pre algoritmus apriori v knižnici mlxtend?`,options:[`List stringov oddelených ';'`,`Pandas DataFrame s binárnou (one-hot) maticou (riadky=transakcie, stĺpce=itemy)`,`CSV súbor s transakciami`,`Slovník {transakcia: [itemy]}`],correct:1,explain:`Apriori v mlxtend pracuje s 2D bool maticou T&times;I, kde bunka(t,i)=True ak transakcia t obsahuje item i. TransactionEncoder robí tento prevod.`,step:'02'},
    {type:`fill`,text:`V asociačných pravidlách: pravidlo X&rArr;Y má lift = 1 práve vtedy, keď sú X a Y štatisticky ___ .`,answer:`nezavisle`,alts:[`nezávislé`,`nezavisle`,`nezávisle`,`nezavisle`],step:'02'},
    {type:`match`,prompt:`Priraď hyperparametre Apriori k ich významu`,pairs:[[`min_support=0.05`,`Itemset musí byť v >=5% transakcií, inak je pruned`],[`min_threshold=0.5 (confidence)`,`Pravidlo X&rArr;Y platí, ak P(Y|X) >= 50%`],[`use_colnames=True`,`Itemsety obsahujú reálne názvy kategórií namiesto indexov`],[`metric='confidence'`,`Filter pravidiel podľa P(Y|X), nie podľa lift/support`]],step:'02'},
    {type:`quiz`,q:`Prečo skript po vygenerovaní pravidiel konvertuje antecedents/consequents z frozenset na ';'-separated string?`,options:[`frozenset sa nedá serializovať do CSV vôbec`,`Pre čitateľnosť CSV, hashovanie ako string ID v ďalšom kroku a stabilné poradie cez sorted()`,`Apriori vyžaduje string výstup`,`Pre kompatibilitu so scipy`],correct:1,explain:`Frozenset je neusporiadaný; po sorted+join vznikne deterministický string-id, ktorý sa dá použiť ako kľúč v matici vzorov (úloha 03) a je čitateľný v Exceli.`,step:'02'},
    {type:`fill`,text:`Počet pravidiel pre rok 2012 je iba ___ , pretože v tomto roku dominujú dve dvojice kategórií (Pillar3 disclosure;Pillar3 related a Business Conditions;Pricing List spolu ~54% transakcií) a iné kombinácie nedosiahnu min_support 5%.`,answer:`17`,alts:[],step:'02'},
    {type:`flash`,q:`Aký je algoritmický postup Apriori bottom-up?`,a:`<b>L1</b> = všetky 1-itemsety so support &ge; min_support. <b>Lk</b> = kandidáti z Lk-1 &times; Lk-1, prerezané podľa anti-monotónie (každý (k-1)-podset musí byť v Lk-1). Stop ak Lk je prázdne.`,step:'02'},
    {type:`quiz`,q:`Ak má pravidlo A&rArr;B hodnotu <b>lift = 1</b>, čo to štatisticky znamená pre A a B?`,options:[`A implikuje B s 100% spoľahlivosťou`,`A a B sú štatisticky nezávislé — P(B|A) = P(B)`,`A a B majú rovnaký support`,`Pravidlo má zanedbateľnú confidence`],correct:1,explain:`Lift = confidence(A&rArr;B) / P(B) = P(B|A) / P(B). Ak lift = 1, tak P(B|A) = P(B) — výskyt A nemení pravdepodobnosť B, čo je presne definícia štatistickej nezávislosti. Lift > 1 = pozitívna korelácia (A 'priťahuje' B), lift &lt; 1 = negatívna korelácia. To je rovnaká logika ako pri chí-kvadrát teste nezávislosti pre kontingenčné tabuľky.`,step:'02'},
    {type:`flash`,q:`Ktoré stĺpce skript ponecháva vo výstupe <code>pravidla_{rok}.csv</code> a ktoré <b>zahadzuje</b> z výstupu <code>association_rules</code>?`,a:`Ponecháva len <b>5 stĺpcov</b>: <code>antecedents, consequents, support, confidence, lift</code>. Zahadzuje pomocné metriky <code>leverage</code> (P(X&cup;Y) - P(X)&middot;P(Y)) a <code>conviction</code> ((1-P(Y))/(1-confidence)) — pre úlohu 03 (matica) ich nepotrebujeme, kľúčový je len <b>string ID</b> pravidla a 3 hlavné metriky.`,step:'02'},
    {type:`flash`,q:`📍 Úloha 03: matica_pravidiel.py`,a:`Spojí pravidlá zo všetkých 4 rokov do jednej <b>binárnej matice</b> tvaru (pravidlo &times; obdobie): riadky = 450 unikátnych pravidiel, stĺpce O1_2009..O4_2012 majú 0/1 podľa výskytu pravidla v danom roku. Pridáva stĺpec pocet_obdobi.`,step:'03'},
    {type:`quiz`,q:`Prečo skript používa set() namiesto list pre pravidla_po_obdobiach[rok]?`,options:[`Set zaberá menej pamäte ako list`,`Pre O(1) membership test ('je toto pravidlo v X?') a automatickú deduplikáciu`,`Pandas vyžaduje set ako vstup`,`List by zlyhal pri sorted()`],correct:1,explain:`V kroku 4 sa pre každé pravidlo testuje 'p in pravidla_po_obdobiach[rok]'. Set má O(1) lookup, list by mal O(N). Idiomaticky správny prístup pre membership.`,step:'03'},
    {type:`order`,prompt:`Usporiadaj kroky úlohy 03 (matica pravidiel)`,items:[`Načítanie 4 CSV (pravidla_2009..2012)`,`Vytvorenie string-key 'antecedents => consequents' pre každé pravidlo`,`Zjednotenie cez set().union(*) – ~450 unikátnych pravidiel`,`Pre každé obdobie stĺpec O{i}_{rok} s 1/0 podľa výskytu`,`Sum(axis=1) → stĺpec pocet_obdobi (1-4)`,`Export matica_pravidiel.csv`],step:'03'},
    {type:`fill`,text:`Výsledná matica má tvar (___, 6): unikátnych pravidiel cez 4 roky &times; stĺpce [pravidlo, O1_2009, O2_2010, O3_2011, O4_2012, pocet_obdobi].`,answer:`450`,alts:[],step:'03'},
    {type:`quiz`,q:`Čo znamená hodnota pocet_obdobi = 4 pre konkrétne pravidlo?`,options:[`Pravidlo má 4 antecedents`,`Pravidlo sa vyskytlo vo všetkých 4 sledovaných rokoch (stabilný vzor)`,`Pravidlo má lift > 4`,`Pravidlo bolo testované 4-krát`],correct:1,explain:`pocet_obdobi = sum(axis=1) po stĺpcoch O1..O4 = počet rokov, v ktorých pravidlo bolo extrahované. 4 = univerzálne/stabilné pravidlo, 1 = epizodické.`,step:'03'},
    {type:`flash`,q:`Aké riziko vzniká pri string-konkatenácii 'antecedents + " => " + consequents'?`,a:`Ak by predchádzajúci skript zoradil položky <b>rôzne medzi rokmi</b> (napr. 'A;B' vs 'B;A' pre rovnakú množinu), brali by sme ich ako 2 rôzne pravidlá &rarr; nadhodnotenie unikátnych vzorov. V úlohe 02 to rieši sorted() pred join.`,step:'03'},
    {type:`fill`,text:`Pre distribúciu počtu pravidiel podľa <code>pocet_obdobi</code> skript volá <code>matica['pocet_obdobi'].___().sort_index()</code> — najprv zráta výskyty hodnôt 1..4, potom zoradí podľa hodnoty (nie podľa frekvencie).`,answer:`value_counts`,alts:[`value_counts()`],step:'03'},
    {type:`flash`,q:`📍 Úloha 04: cochran_kendall_test.py`,a:`Načíta maticu pravidiel, spustí <b>Cochranov Q test</b> (H0: rovnaká p výskytu v 4 obdobiach), dopočíta <b>Kendallovo W = Q/(n&middot;(k-1))</b>, vypíše popisné štatistiky (počty na obdobie: 341/405/205/17, 15 stabilných vo všetkých 4 a 119 unikátnych pre 1 obdobie) a uloží 2-panelový bar graf.`,step:'04'},
    {type:`quiz`,q:`Aké sú predpoklady Cochranovho Q testu?`,options:[`Nezávislé vzorky a spojité premenné`,`Závislé (rovnaké subjekty) binárne (0/1) vzorky a dostatočná veľkosť n >= 4&middot;k`,`Normálne rozdelenie a rovnaké rozptyly`,`Iba dva binárne stĺpce`],correct:1,explain:`Cochranov Q = neparametrický test pre k>=2 ZÁVISLÝCH BINÁRNYCH vzoriek (tie isté pravidlá merané v k obdobiach). Štatistika Q ~ chi&sup2; s df=k-1. Pre k=2 je ekvivalentný McNemarovmu testu.`,step:'04'},
    {type:`fill`,text:`Vzorec pre Kendallovo W z Cochranovho Q pri binárnych dátach: W = Q / (n &middot; (k - ___)), kde n je počet pravidiel a k počet období.`,answer:`1`,alts:[],step:'04'},
    {type:`match`,prompt:`Priraď hodnoty Kendallovho W k interpretácii`,pairs:[[`W < 0.3`,`Slabá zhoda – pravidlá sa medzi obdobiami výrazne líšia`],[`0.3 <= W < 0.5`,`Stredná zhoda – čiastočne stabilné, čiastočne odlišné`],[`0.5 <= W < 0.7`,`Silnejšia zhoda – prevažne stabilné naprieč obdobiami`],[`W >= 0.7`,`Silná/perfektná zhoda – pravidlá konzistentné v čase`]],step:'04'},
    {type:`quiz`,q:`Aké je rozhodovacie pravidlo pre Cochranov Q test pri α=0.05?`,options:[`Q > 0.05 → zamietame H0`,`p < 0.05 → zamietame H0, existujú rozdiely medzi obdobiami`,`p > 0.05 → existujú rozdiely`,`Q < 0.05 → prijímame H1`],correct:1,explain:`Ak p-value < α (typicky 0.05), zamietame H0 (rovnaká pravdepodobnosť výskytu) → existujú signifikantné rozdiely medzi obdobiami. Inak nemôžeme zamietnuť H0.`,step:'04'},
    {type:`flash`,q:`Čo Cochranov Q nepovie a prečo treba aj Kendallovo W?`,a:`Cochran Q hovorí <b>IBA</b> či rozdiely existujú (áno/nie). Nepovie <b>kde</b> sú ani <b>aké sú silné</b>. Kendallovo W &isin; [0,1] kvantifikuje <b>mieru zhody</b> medzi obdobiami – komplementárna informácia o veľkosti efektu.`,step:'04'},
    {type:`fill`,text:`Pre identifikáciu 'unikátnych pravidiel pre obdobie c' skript testuje masku: matica[c]==1 AND matica[others].sum(axis=___) == 0 (sčítanie po riadkoch).`,answer:`1`,alts:[],step:'04'},
    {type:`cat`,prompt:`Roztrieď charakteristiky podľa testu`,groups:{"Cochran Q":[`Test rovnosti pravdepodobnosti výskytu`,`Binárne dáta 0/1`,`Štatistika ~ chi&sup2; s df=k-1`,`Hovorí ČI existujú rozdiely`],"Kendall W":[`Koeficient konkordancie`,`Hodnoty v intervale [0,1]`,`Vzorec W = Q/(n&middot;(k-1))`,`Hovorí AKO silná je zhoda`]},step:'04'},
    {type:`flash`,q:`Aký výstup produkuje 2-panelový graf v analyza.png?`,a:`<b>Panel 0 (steelblue)</b>: bar plot počtov pravidiel po obdobiach (O1..O4) – ukazuje 'bohatosť' obdobia (O1=341, O2=405, O3=205, O4=17 pravidiel). <b>Panel 1 (coral)</b>: distribúcia pravidiel podľa pocet_obdobi (1-4) – ukazuje 'stabilitu': koľko pravidiel je univerzálnych (4) vs. epizodických (1).`,step:'04'},
    {type:`order`,prompt:`Usporiadaj celú pipeline Témy 6 (od logu po záver)`,items:[`logs5.csv → transakcie_{rok}.csv`,`Apriori + association_rules → pravidla_{rok}.csv`,`Zjednotenie do matica_pravidiel.csv (450&times;6)`,`Cochran Q test + Kendallovo W`,`Sumarizácia + bar plot analyza.png`],step:'04'},
    {type:`fill`,text:`Pre 4 obdobia sú stupne voľnosti Cochranovho Q testu df = k - 1 = ___ .`,answer:`3`,alts:[],step:'04'},
    {type:`quiz`,q:`Prečo skript vyberá O-stĺpce dynamicky cez <code>[c for c in matica.columns if c.startswith('O')]</code> namiesto pevného zoznamu <code>['O1_2009','O2_2010','O3_2011','O4_2012']</code>?`,options:[`startswith() je rýchlejší ako list lookup`,`Aby skript fungoval aj pri rozšírení o ďalšie obdobia bez zmeny kódu (extensibility)`,`Hardcoded zoznam padá pri pandas verzii > 2.0`,`Cochran Q vyžaduje deterministické usporiadanie stĺpcov`],correct:1,explain:`Dynamický výber robí skript <b>rozšíriteľným</b>: ak by sme pridali roky 2013/2014, stačí prerobiť úlohu 03 a úloha 04 funguje bez zmeny. Hardcoded zoznam by si vyžadoval ručnú údržbu kódu pri každej zmene rozsahu rokov. Konvencia prefixu 'O_' je kontrakt medzi úl. 03 a 04.`,step:'04'},
    {type:`flash`,q:`Ako skript pridá <b>číselné popisky nad stĺpce</b> v bar grafe (napr. 'O1_2009 = 268')?`,a:`Cyklom cez hodnoty: <code>for i, v in enumerate(values): ax.text(i, v+5, str(v), ha='center')</code>. Súradnica <b>i</b> je x-pozícia stĺpca, <b>v+5</b> je y mierne nad jeho vrcholom, <b>ha='center'</b> centruje text horizontálne nad stĺpcom. Bez týchto anotácií by sa musel divák pozerať na os Y a odhadovať hodnoty.`,step:'04'},
    {type:`quiz`,q:`Skript dáva <b>Q = 724.3, p &lt; 0.001, W &asymp; 0.54</b>. Ako tieto čísla súčasne interpretovať?`,options:[`Test zlyhal — Q a W si protirečia, treba viac dát`,`p &lt; 0.001 zamieta H0 (rozdiely existujú), no W=0.54 ukazuje že efekt je len stredne silný — Q je citlivý na veľké n`,`W=0.54 znamená perfektnú zhodu, p je len artefakt softvéru`,`Q a W merajú nezávislé veci, preto sa nedajú spolu interpretovať`],correct:1,explain:`Zdá sa rozporné: p&lt;0.001 hovorí 'rozdiely SÚ', ale W=0.54 hovorí 'zhoda je stredná až silnejšia'. Riešenie: Q test je <b>citlivý na n</b> (n=450 pravidiel) — pri veľkom n zachytí aj malé rozdiely ako signifikantné. W ako effect size hovorí pravdivejšie 'rozdiely existujú, ale nie sú obrovské — väčšina pravidiel je naprieč obdobiami konzistentná'. To je presne dôvod, prečo treba aj W, nielen Q.`,step:'04'}
]},
{num:7,label:`Projekt`,name:`Téma 7: Projekt — celý pipeline (00–10)`,reading:`<h2>Téma 7: Projekt — celý pipeline (00–10)</h2><p class="lead"><b>Pridelené obdobie: 17.–23.12.2017</b> (Martin Studený, 7 dní). Pipeline 10 krokov: 00 extrakcia týždňa → 01 čistenie + 02 robot IPs → 03 filter robotov → 04 UNIXTIME → 05 USER_ID → 06 Length → 07 RLength / 08 h-ref → 09/10 doplnenie ciest.</p><p class="lead">📚 <b>V každej úlohe je tlačidlo „Teória k tomuto kroku" — otvorí popup s jednoduchým vysvetlením, vzorcami a tým, čo si treba pochopiť a čo nabiflit.</b> Nemusíš čítať dlhý úvod, klikni keď budeš potrebovať.</p>`,tasks:[    {type:`quiz`,q:`Aký je predpoklad exponenciálneho rozdelenia v kontexte Length?`,options:[`User pristupuje ku stránkam ako Poissonov proces (nezávislé udalosti s konštantnou intenzitou)`,`Length je normálna`,`Length je uniformná`,`Length je gamma`],correct:0,explain:`Čas medzi nezávislými udalosťami v Poissonovom procese má exp. rozdelenie.`,step:'overview'},
    {type:`quiz`,q:`Aký pandas idiom je vektorizovaný ekvivalent for row: if NEW_SESSION: counter += 1; SESSION_ID = counter?`,options:[`NEW_SESSION.cumsum()`,`NEW_SESSION.cumcount()`,`groupby.ngroup()`,`NEW_SESSION.shift()`],correct:0,explain:`cumsum nad bool je vektorizovaný 'session counter' — každé True (začiatok sedenia) inkrementuje pocítadlo o 1.`,step:'overview'},

    {type:`quiz`,q:`Prečo prevádzame DateTime ("17/Dec/2017:06:25:47") na UNIX číslo, namiesto použitia datetime objektu?`,options:[`UNIX čísla zaberajú menej miesta v CSV`,`Z čísla rozdiel = sekundy (žiadne riešenie polnoci/mesiacov); datetime objekt by vyžadoval knižnicu na každé porovnanie`,`datetime objekt nepodporuje pandas`,`UNIX je rýchlejší na disk`],correct:1,explain:`Hlavná výhoda: rozdiel dvoch UNIX čísel = počet sekúnd. Bez parsovania, bez timezone, bez prestupných sekúnd. To je presne čo úloha 06 (Length) potrebuje — odpočítať predošlý čas.`,step:'04'},
    {type:`quiz`,q:`Náš to_unixtime() vytvára <code>datetime(year, month, day, h, m, s)</code> BEZ tzinfo parametra (= "naive datetime"). Aký je dôsledok?`,options:[`Python crashne pri .timestamp()`,`UNIXTIME bude nesprávne o 1 hodinu`,`.timestamp() interpretuje čas v LOKÁLNEJ TZ systému, čo môže posunúť hodnoty na inom serveri. Pre Length to nevadí (rozdiely sa nemenia), ale absolútna hodnota je závislá od TZ.`,`UNIXTIME bude vždy správne`],correct:2,explain:`Naive datetime nemá info o pásme. .timestamp() použije systémovú TZ. Pre náš projekt (rozdiely Length) to nevadí, ale je to dôležité vedieť. Oprava: <code>datetime(..., tzinfo=timezone(timedelta(hours=1)))</code>. Prednáška Munka o čase to spomína.`,step:'04'},

    {type:`quiz`,q:`Prečo úloha 04 (a aj ďalšie) volá <code>pd.read_csv(..., low_memory=False)</code>?`,options:[`Zrýchli to čítanie`,`Načíta stĺpec celý naraz, určí konzistentný dtype a potlačí <code>DtypeWarning: mixed types</code>`,`Vypne to NaN handling`,`Pandas to vyžaduje pre veľké súbory`],correct:1,explain:`Pandas pri default <code>low_memory=True</code> číta CSV po chunkoch a každý chunk parsuje samostatne. Ak ten istý stĺpec má v rôznych chunkoch rôzne odvodené typy (napr. niekde int, inde string), vyhodí <code>DtypeWarning: Columns have mixed types</code>. <code>low_memory=False</code> načíta stĺpec celý naraz, určí konzistentný typ a varovanie zmizne — za cenu vyššej spotreby pamäte.`,step:'04'},

    {type:`quiz`,q:`Prečo Length\_i závisí LEN od UNIXTIME\_(i-1), nie od celej histórie kliknutí používateľa?`,options:[`Length je definovaný ako rozdiel dvoch po sebe idúcich časov — to je Markov-like vlastnosť (závisí len od predošlého stavu)`,`Pandas nepodporuje viac-stĺpcové výpočty`,`groupby.shift(1) je rýchlejší ako shift(N)`,`Munk to tak prikázal`],correct:0,explain:`Markov-like = "stav závisí len od predošlého, nie od celej minulosti". Pre Length to platí lebo nás zaujíma "ako dlho user pozeral TÚTO stránku" = rozdiel od predošlého kliku. Celá história nie je potrebná. Toto je dôležitý princíp pre WUM.`,step:'06'},

    {type:`flash`,q:`Úloha 07: sedenia_rlength.py`,a:`Identifikuje sedenia metódou RLength (s STT_Q fallbackom podľa KS testu). Prah delí navigačné od cieľových stránok; pridelí SESSION_ID cez cumsum nad NEW_SESSION.`,step:'07'},
    {type:`flash`,q:`Kedy sa použije RLength a kedy STT_Q fallback?`,a:`<b>KS test p ≥ 0.05</b> → data majú exp. rozdelenie → <b>RLength</b>.<br><b>KS test p < 0.05</b> → nemajú → <b>STT_Q = Q3 + 1.5·IQR</b>.`,step:'07'},
    {type:`quiz`,q:`Aké hypotézy KS testu pre exponenciálne rozdelenie?`,options:[`H0: data NEmajú exp. / H1: majú`,`H0: data majú exp. rozdelenie / H1: nemajú`,`H0: priemer = 0 / H1: priemer != 0`,`H0: D=0 / H1: D!=0`],correct:1,explain:`KS test: H0: data ~ Exp(scale=mean). p<0.05 zamietame H0.`,step:'07'},
    {type:`fill`,text:`V kstest(length_data, 'expon', args=(0, mean_length)) je scale parameter = ___ (= 1/lambda).`,answer:`mean_length`,alts:[`mean`,`priemer`],step:'07'},
    {type:`flash`,q:`Odkiaľ pochádza vzorec RLength = <code>-ln(1-p)·μ</code>? (Hint: nepríde z neba, je derivovaný)`,a:`Exponenciálne rozdelenie má kumulatívnu funkciu (CDF): <b>F(t) = 1 - e<sup>-t/μ</sup></b>. Munk v prednáške 7 hovorí, že chceme najsť t také, že p % všetkých časov je pod ním. Riešime <b>F(t) = p</b>:<br>1 - e<sup>-t/μ</sup> = p<br>e<sup>-t/μ</sup> = 1 - p<br>-t/μ = ln(1-p)<br><b>t = -μ·ln(1-p)</b><br><br>Pre p=0.4 (40 % navigačných stránok): t ≈ 0.51·μ. To je presne to čo robí <code>sedenia_rlength.py:139</code>: <code>-np.log(1 - p) * mean_length</code>. <code>np.log</code> je <b>ln</b> (prirodzený logaritmus, lebo e nájdete v CDF).`,step:'07'},
    {type:`order`,prompt:`Derivuj vzorec RLength krok-za-krokom od CDF exponenciály:`,items:[`Exponenciálne rozdelenie: F(t) = 1 - e^(-t/μ)`,`Chceme t také, že p % časov je pod ním → F(t) = p`,`1 - e^(-t/μ) = p`,`e^(-t/μ) = 1 - p`,`-t/μ = ln(1-p)`,`t = -μ · ln(1-p)`],step:'07'},
    {type:`quiz`,q:`Prečo np.log a nie np.log10 v RLength vzorci?`,options:[`log10 je pomalý`,`Vzorec vyžaduje PRIRODZENÝ logaritmus (ln) z definície CDF exp. rozdelenia`,`log10 nefunguje na floatoch`,`Numpy odporúča np.log`],correct:1,explain:`CDF(t) = 1 - exp(-t/mean). Inverzia: t = -mean·ln(1-p). Prirodzený log.`,step:'07'},
    {type:`quiz`,q:`Aká je intuícia pre p=0.4 v RLength?`,options:[`Predpoklad že 40% prístupov sú navigačné (krátky čas, len preklik)`,`40% je magické číslo`,`40% userov má bot`,`p=0.4 je default v scipy`],correct:0,explain:`Navigačné stránky majú krátky Length (cieľové dlhý). 40% určuje hranicu.`,step:'07'},
    {type:`flash`,q:`Čo robí cumsum() nad boolean Series?`,a:`Sčítava True ako 1, False ako 0. <b>Každé True inkrementuje pocítadlo o 1.</b> Riadky medzi 2 True majú rovnaký SESSION_ID. Príklad: [T,F,F,T,F,T] → cumsum [1,1,1,2,2,3].`,step:'07'},
    {type:`order`,prompt:`Usporiadaj logiku úlohy 07:`,items:[`dropna() Length pre testovanie`,`kstest(length, 'expon', args=(0, mean))`,`ak p>=0.05: RLength = -ln(1-0.4)*mean`,`ak p<0.05: STT_Q = Q3 + 1.5*IQR`,`NEW_SESSION = isna(Length) | (Length >= prah)`,`SESSION_ID = NEW_SESSION.cumsum()`],step:'07'},
    {type:`cat`,prompt:`Krok 07 — pri prahu STT_Q=76s roztrieď Length hodnoty:`,groups:{"Nové sedenie (Length≥76s alebo NaN)":[`Length=80s`,`Length=NaN`,`Length=200s`],"Pokračuje v sedení (Length<76s)":[`Length=5s`,`Length=50s`]},step:'07'},
    {type:`fill`,text:`STT_Q fallback prah sa v úlohe 07 počíta ako <code>Q3 = df[&#39;Length&#39;].quantile(___)</code>, <code>Q1 = df[&#39;Length&#39;].quantile(0.25)</code>, <code>STT_Q = Q3 + 1.5 * (Q3 - Q1)</code>.`,answer:`0.75`,alts:[`0.75`,`.75`],step:'07'},
    {type:`flash`,q:`Úloha 08: sedenia_href.py`,a:`Identifikuje sedenia metódou h-ref (heuristic referrer): NaN Length OR Length>=mean OR Referrer=='-'. Pridelí SESSION_ID cumsumom.`,step:'08'},
    {type:`quiz`,q:`Aké 3 OR podmienky vyvolajú nové sedenie v h-ref?`,options:[`Length<0 OR Length>mean OR URL=='-'`,`Length.isna() OR Length>=mean OR Referrer=='-'`,`UNIXTIME==0 OR IP==Agent OR len(URL)==0`,`NaN UNIXTIME OR same IP OR new day`],correct:1,explain:`Tri nezávislé signály: nový user (NaN), prekročený priemer, priamy vstup.`,step:'08'},
    {type:`quiz`,q:`Cooleyho plná h-ref hovorí: nové sedenie ak <code>Referrer != URL_(i-1)</code> používateľa (prerušenie navigačného reťazca). Naša verzia kontroluje len <code>Referrer == "-"</code>. Aký kompromis robíme?`,options:[`Naša verzia je presnejšia`,`Naša verzia detekuje LEN externý vstup (zvonku); plná Cooley detekuje aj vnútorné prerušenia (skok medzi nesúvisiacimi stránkami). Strácame teda jemnejšiu segmentáciu, ale je to dostatočné pre tento projekt.`,`Plná Cooley nefunguje na pandas`,`Munk to tak prikázal`],correct:1,explain:`Naša 3. podmienka <code>Referrer=="-"</code> je len špeciálny prípad plnej h-ref. Plná Cooley by porovnávala Referrer s predošlým URL ten istý user. Pre náš dataset je zjednodušenie OK, ale je dobré vedieť rozdiel. Prednáška 8 popisuje plnú variantu.`,step:'08'},
    {type:`fill`,text:`V (df['Length'] >= mean_length) | (df['Referrer'] == '-') sú zátvorky okolo podmienok ___ , lebo | má vyššiu prioritu ako == a >=.`,answer:`nutné`,alts:[`nutne`,`povinne`,`povinné`],step:'08'},
    {type:`cat`,prompt:`Krok 08 — h-ref pravidlá (priemer Length=173.59s). Roztrieď dvojice (Length, Referrer):`,groups:{"H-ref nové sedenie":[`Length=NaN, Referrer=/uvod (NaN)`,`Length=200s, Referrer=/uvod (≥ priemer)`,`Length=10s, Referrer=- (priamy vstup)`],"H-ref pokračuje":[`Length=50s, Referrer=/uvod`,`Length=100s, Referrer=/blog`]},step:'08'},
    {type:`flash`,q:`Úloha 09: doplnenie_rlength.py`,a:`Path completion pre RLength sedenia — doplní chýbajúce medzistránky cez mapu webu postavenú z dvojíc (Referrer, URL) v logu. <b>~4 032 doplnených záznamov</b>.`,step:'09'},
    {type:`quiz`,q:`Prečo treba doplnenie ciest (path completion) vo WUM?`,options:[`Aby DataFrame nemal NaN`,`Browser cache / proxy nepošle request na server pri back-buttone — chýbajú medzikroky v navigácii`,`Pretože regex je pomalý`,`Pre zarovnanie do CSV`],correct:1,explain:`Cache/back-button maskuje skutočné prístupy. Bez completion sa Apriori a sekvenčné vzory pozerajú na neúplnú cestu.`,step:'09'},
    {type:`quiz`,q:`Prečo urlparse(url).path na Referrer ale nie na URL?`,options:[`URL je vždy plný path, Referrer býva plná URL (http://www.ukf.sk/foo) — treba kanonizovať na cestu`,`Pre rýchlosť`,`urlparse nefunguje na URL stĺpci`,`Náhodne`],correct:0,explain:`Apache loguje URL ako '/foo' (relativna), Referrer ako 'http://ukf.sk/foo'. Potrebné normalizovať pre porovnanie.`,step:'09'},
    {type:`flash`,q:`Ako sa stavia mapa webu v úlohe 09?`,a:`Z dvojíc (Referrer, URL) v logu. Filter: Referrer obsahuje 'ukf.sk' (interné). Pre každú URL <b>najčastejší referrer</b> = kanonický rodič:<br><code>groupby('URL')['ref_path'].agg(lambda x: x.value_counts().idxmax())</code>`,step:'09'},
    {type:`quiz`,q:`Prečo to_dict('records') namiesto iterrows() v úlohe 09/10?`,options:[`iterrows nefunguje na veľkých DataFrame`,`iterrows vyrobí Series objekt v každom kroku — dict iterácia je 10-20× rýchlejšia (pri 74k riadkoch sek vs minúty)`,`Pre čitateľnosť`,`Iterrows neudrží poradie`],correct:1,explain:`Series má overhead. Dict je raw Python — optimum pre manuálnu iteráciu.`,step:'09'},
    {type:`quiz`,q:`Mapa webu má pre URL <code>/clanok</code> tieto referrer-y: <code>/blog</code> 3×, <code>/uvod</code> 1×, <code>/facebook</code> 1×. Aký bude <code>parent["/clanok"]</code>?`,options:[`/blog (najčastejší)`,`/facebook (posledný)`,`/uvod (skrátka)`,`/blog;/uvod;/facebook (všetky)`],correct:0,explain:`<code>value_counts().idxmax()</code> vráti index s najvyšším počtom = najčastejší referrer. Pre /clanok je to /blog (3 výskyty). Pandas: <code>groupby("URL")["ref_path"].agg(lambda x: x.value_counts().idxmax())</code>. To je presne tá kanonická "cesta cez ktorú ľudia obvykle prichádzajú".`,step:'09'},
    {type:`quiz`,q:`Naša path completion vkladá medzistránku ak <code>url_from NOT IN mapa AND url_to IN mapa</code>. Prečo membership v mape, a nie kontrola hrán grafu (existuje hrana url_from → url_to)?`,options:[`Hrany sa nedajú stavať z logu`,`Membership-based prístup: predpokladáme že stránka NIE V mape = nikto na ňu nikdy externe neodkázal = "izolovaná" = treba ju spojiť cez kanonického rodiča cieľa. Je to AUDIT MAJOR: klasika kontroluje hrany.`,`Hrany sú pomalšie`,`Munk to tak prikázal`],correct:1,explain:`Náš prístup je INVERZNÝ voči klasike. Klasika: "neexistuje hrana A→C? Vlož B." Naša: "A nie je v mape vôbec? Vlož parent(C)." Funguje pre náš dataset (4032 doplnení), ale je to zjednodušenie. Detail v skripte <code>doplnenie_rlength.py</code>.`,step:'09'},
    {type:`match`,prompt:`Krok 09 — path completion (mapa: parent[/clanok]=/blog, parent[/kontakt]=/uvod). Spáruj dvojice (curr, next) s výsledkom:`,pairs:[[`(/blog, /clanok)`,`Nič netreba — /blog je referrer /clanok v mape (priamy prechod)`],[`(/index, /clanok)`,`Vloží sa medzistránka /blog (kanonický parent[/clanok])`],[`(/uvod, /kontakt)`,`Nič netreba — /uvod je parent[/kontakt]`],[`(/uvod, /clanok)`,`Vloží sa medzistránka /blog (parent[/clanok])`]],step:'09'},
    {type:`match`,prompt:`Krok 09 — spáruj edge-case kontrolu v doplnení s dôvodom, prečo sa daný pár (curr, next) preskočí:`,pairs:[[`url_from == url_to`,`Refresh stránky (F5) — žiadny prechod, netreba medzistránku`],[`curr.SESSION_ID != next.SESSION_ID`,`Rôzne sedenia — doplnenie len v rámci jedného SESSION_ID`],[`ref_page == url_from`,`Cyklus &#39;from → from → to&#39; — duplikát by skreslil cestu`],[`url_to NOT IN map`,`Cieľ nie je v mape webu — nevieme priradiť rodiča`]],step:'09'},
    {type:`flash`,q:`Prečo úloha 09 volá <code>dropna(subset=[&#39;ref_path&#39;])</code> pred stavbou mapy webu?`,a:`Po <code>url_to_path() = urlparse(url).path</code> môže pre malformované Referrery (prázdny string, čisto query, neparsovateľná URL) vzniknúť None / prázdny path. Ak by takéto riadky ostali, <code>groupby(&#39;URL&#39;)[&#39;ref_path&#39;].agg(value_counts().idxmax())</code> by mohol pre niektorú URL vrátiť <b>None</b> ako kanonického rodiča, čo by ďalej v podmienke <code>url_from NOT IN map AND url_to IN map</code> spôsobilo vloženie záznamu s <code>URL=None</code>. <code>dropna</code> mapu očistí ešte pred agregáciou.`,step:'09'},
    {type:`flash`,q:`Úloha 10: doplnenie_href.py`,a:`Path completion pre h-ref sedenia — rovnaký algoritmus ako 09, len iný vstup (08_sedenia_href.csv). Menej doplnení (~0.19%) lebo h-ref produkuje kratšie sedenia.`,step:'10'},
    {type:`flash`,q:`Aký je rozdiel medzi úlohou 09 a úlohou 10?`,a:`<b>Rovnaký algoritmus</b>, len iný vstupný CSV (úloha 09 berie z 07_sedenia_rlength.csv, úloha 10 z 08_sedenia_href.csv). Úloha 10 doplní <b>menej</b> záznamov (~0,19 %) lebo h-ref produkuje kratšie sedenia → menej dvojíc (curr, next) v rámci toho istého SESSION_ID → menej príležitostí na doplnenie.`,step:'10'},
    {type:`quiz`,q:`Čo zdedí doplnená medzistránka od curr v úlohe 09/10?`,options:[`Len SESSION_ID`,`VŠETKO okrem URL — UNIXTIME, USER_ID, SESSION_ID, IP, Agent, Length sa zdedia, mení sa LEN URL`,`Len Length`,`Random hodnoty`],correct:1,explain:`doplneny = curr.copy(); doplneny['URL'] = ref_page. Length sa zdedí od curr a NEPREPOČÍTAVA sa pre vloženú medzistránku — audit pripomienka.`,step:'10'},
    {type:`quiz`,q:`Prečo úloha 10 doplní menej záznamov ako úloha 09?`,options:[`Iný regex`,`h-ref má 3 OR podmienky → kratšie sedenia → menej dvojíc v 1 sedení → menej príležitostí na doplnenie`,`Bug v skripte`,`Iný zdroj`],correct:1,explain:`h-ref láme sedenia častejšie (3 podmienky), takže path completion má menej rovnakých-SESSION dvojíc.`,step:'10'}
]}
];

/* ===== rozcestník + pokrok (v pamäti, navyše localStorage) ===== */
const PROG={};
TOPICS.forEach(t=>{ try{ const v=JSON.parse(localStorage.getItem('oz_cvika_'+t.num)||'null'); if(v) PROG[t.num]=v; }catch(e){} });
function saveProg(num,obj){ PROG[num]=obj; try{ localStorage.setItem('oz_cvika_'+num, JSON.stringify(obj)); }catch(e){} }
const roz=document.getElementById('roz'), testDiv=document.getElementById('test'), grid=document.getElementById('grid');
function renderGrid(){
  grid.innerHTML='';
  TOPICS.forEach(t=>{
    const o=PROG[t.num]||null;
    const n=o&&o.n?o.n:t.tasks.length;
    const answered=o?(o.answered!=null?o.answered:(o.done?n:0)):0;
    const touched=o?(o.touched!=null?o.touched:answered):0;
    const best=o?(o.best!=null?o.best:0):0;
    const barPct=o?Math.round(touched/n*100):0;
    let label;
    if(!o||touched===0) label='zatiaľ neskúšané';
    else if(o.done) label='dokončené · najlepšie '+best+'%';
    else label='rozpracované '+touched+'/'+n+(best?(' · najlepšie '+best+'%'):'');
    const b=el('button','tile');
    b.innerHTML='<div class="tnum">TÉMA '+t.num+'</div>'
      +(best===100?'<div class="badge">🏆</div>':'')
      +'<div class="tname">'+t.label+'</div>'
      +'<div class="pbar"><div class="pfill" style="width:'+barPct+'%"></div></div>'
      +'<div class="pct">'+label+'</div>';
    b.onclick=()=>openTopic(t);
    grid.appendChild(b);
  });
}
function openTopic(t){ roz.style.display='none'; testDiv.style.display='block'; testDiv.innerHTML=''; window.scrollTo(0,0); runTest(t,testDiv,backToGrid,saveProg); }
function backToGrid(){ testDiv.style.display='none'; testDiv.innerHTML=''; roz.style.display='block'; renderGrid(); window.scrollTo(0,0); }
document.getElementById('reset').onclick=()=>{ if(confirm('Vynulovať pokrok vo všetkých témach?')){ TOPICS.forEach(t=>{ delete PROG[t.num]; try{localStorage.removeItem('oz_cvika_'+t.num);}catch(e){} }); renderGrid(); } };
renderGrid();
</script>
