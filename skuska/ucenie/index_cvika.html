 {type:`quiz`,q:`Prečo skript NEPOUŽÍVA pd.to_datetime() ale ručný parser cez datetime.datetime(...).timestamp()?`,options:[`pd.to_datetime nepozná Apache formát`,`Zadanie explicitne predpisuje datetime.datetime(...).timestamp()`,`datetime.datetime je rýchlejšia ako pd.to_datetime`,`Apache log obsahuje neviditeľné znaky`],correct:1,explain:`Zadanie tento idiom explicitne predpisuje. pd.to_datetime by bola rýchlejšia (vektorizovaná v C), ale nesplnila by literu zadania.`},
 {type:`flash`,q:`Aké je riziko ignorovania TZ offsetu ' +0100' v unixtime.py?`,a:`Funkcia vytvára <b>NAIVE datetime</b>, ktoré .timestamp() interpretuje ako lokálny čas systému. Výstup je správny iba ak je TZ stroja zhodná s TZ logu (Europe/Bratislava v zime = +0100). Inak vzniká posun. Pre dataset 19/Feb/2020 a CET stroj to vychádza zhodne.`},
 {type:`flash`,q:`📍 Úloha 02: identifikacia_userov.py`,a:`Zoradí log podľa <b>(IP, Agent, UNIXTIME)</b>, resetuje index, a cez <code>groupby(['IP','Agent']).ngroup() + 1</code> priradí každej unikátnej dvojici (IP, Agent) sekvenčné USER_ID. Očakávaných ~4040 userov.`},
 {type:`quiz`,q:`Prečo sa pred priradením USER_ID volá sort_values(by=['IP','Agent','UNIXTIME'])?`,options:[`Aby boli všetky záznamy jedného usera v súvislom bloku a v chronologickom poradí (predpoklad pre Length/shift)`,`Aby sa zmenšil počet riadkov`,`Aby pandas vedel zaokrúhliť UNIXTIME`,`sort_values nie je potrebný, len kvôli rýchlosti`],correct:0,explain:`Po sorte sú všetky záznamy 1 usera v bloku => ngroup() vyrobí pekné ID. A chronologické poradie (UNIXTIME) je nutné pre fázy sessionizácie (shift sa spolieha na poradie).`},
 {type:`quiz`,q:`Čo konkrétne robí groupby(['IP','Agent']).ngroup() + 1?`,options:[`Spočíta počet skupín`,`Priradí každému riadku INTEGER ID jeho skupiny (0..N-1), +1 prejde na 1-indexované`,`Vyhodí NaN riadky`,`Vykoná inner join`],correct:1,explain:`ngroup() vráti Series rovnakej dĺžky ako df, každý riadok má ID svojej skupiny v poradí prvého výskytu. +1 prejde na 1-indexed (človečejšie číslovanie userov).`},
 {type:`quiz`,q:`Prečo autor uprednostnil hardkódovaný dict mesiacov pred locale-based parsovaním?`,options:[`Locale je rýchlejšie`,`Locale je závislé od nastavenia OS (EN_US vs SK_SK), nedeterministické; dict je explicitný, prenositeľný, O(1) lookup`,`Dict má menší pamäťový footprint`,`Locale nepodporuje 'Feb'`],correct:1,explain:`Apache log VŽDY používa EN skratky bez ohľadu na locale servera. Locale-based parsing by zlyhalo na SK_SK stroji.`},
 {type:`flash`,q:`Aká je limitácia identifikácie cez IP+Agent?`,a:`<b>Dynamické IP</b> (DHCP/mobilná sieť) rozdelí toho istého usera pod rôzne USER_ID. <b>Zdieľaný počítač</b> (knižnica) zlúči rôznych ľudí pod jedno USER_ID. Lepší prístup: cookies / session ID / login — Apache log ich však neposkytuje.`},
 {type:`cat`,prompt:`Roztrieď tvrdenia podľa typu chyby pri identifikácii userov`,groups:{"False positive (rôzne USER_ID, ten istý človek)":[`Dynamické IP (DHCP/mobilná sieť)`,`Používateľ zmenil prehliadač`,`Používateľ presadol na iné zariadenie`],"False negative (jedno USER_ID, viac ľudí)":[`Rodina za NAT-om s rovnakým prehliadačom`,`Zdieľaný počítač v knižnici`,`Verejná WiFi s 1 default prehliadačom`]}},
 {type:`flash`,q:`📍 Úloha 03: vypocet_length.py`,a:`Pre každého usera spočíta <b>Length = UNIXTIME - predchádzajúci UNIXTIME</b> cez <code>groupby('USER_ID')['UNIXTIME'].shift(1)</code>. Rozdiely ≥ 3600 s nahrádza None. Priemer Length ~150 s.`},
 {type:`quiz`,q:`Čo vráti groupby('USER_ID')['UNIXTIME'].shift(1) pre PRVÝ záznam každého usera?`,options:[`0`,`NaN`,`Posledný UNIXTIME predchádzajúceho usera`,`Vlastný UNIXTIME`],correct:1,explain:`shift(1) NEPREKONÁVA hranice skupín — prvý záznam každej skupiny dostane NaN. To je presne to, čo chceme (NaN = neznámy / začiatok sedenia).`},
 {type:`fill`,text:`Pre Length ≥ 3600 s nahrádzame hodnotu cez df.loc[mask, 'Length'] = None — pandas to v numerickom stĺpci konvertuje na ___ (float64).`,answer:`NaN`,alts:[`nan`]},
 {type:`quiz`,q:`Aký je teoretický význam Length?`,options:[`Počet kliknutí usera`,`Aproximácia času stráveného na stránke = čas medzi 2 po sebe idúcimi prístupmi rovnakého usera`,`Počet bajtov v odpovedi`,`Počet sedení usera`],correct:1,explain:`Apache server zaznamenáva len PRÍCHOD na URL, nie odchod. Predpoklad: kliknutie na ďalší link ukončilo čítanie predchádzajúcej stránky.`},
 {type:`quiz`,q:`Čo sa stane keď je rozdiel UNIXTIME presne 3600 (hodina)?`,options:[`Length sa zachová`,`Length sa nahradí None (podmienka je >= 3600)`,`Length sa nastaví na 3599`,`Length zostane NaN z predchádzajúceho kroku`],correct:1,explain:`Hranica je INKLUZÍVNA pre None (>= 3600), EXKLUZÍVNA pre platnú hodnotu (< 3600) — presne podľa zadania.`},
 {type:`flash`,q:`Čo je teoretická motivácia 60 min prahu pri Length?`,a:`<b>Catledge-Pitkow heuristika (1995)</b> — 30–60 min nečinnosti = typický prah pre koniec sedenia. Ak rozdiel ≥ 3600 s, user pravdepodobne odišiel a vrátil sa neskôr — pôvodná stránka už nebola aktívne čítaná, Length nemá reálny význam → zapíše sa None.`},
 {type:`flash`,q:`📍 Úloha 04: stt_mean.py`,a:`Identifikuje sedenia metódou <b>STT_MEAN</b>: prah = priemer všetkých Length. Každý záznam s <code>Length is NaN OR Length >= mean</code> označí ako štart nového sedenia a cumsum-uje boolean masku na SESSION_ID. Očakávaných ~7500 sedení.`},
 {type:`quiz`,q:`Prečo musíme osobitne ošetriť NaN cez .isna() namiesto spolu s '>= mean'?`,options:[`NaN >= číslo vracia False v pandas — bez .isna() by sa NaN riadky 'preskočili' do predchádzajúceho sedenia`,`NaN je rýchlejšie spracovať samostatne`,`isna je vyžadované zadaním`,`NaN by spadlo cumsum`],correct:0,explain:`NumPy/pandas sémantika: NaN >= číslo = False. Bez explicitného .isna() by prvý záznam usera (NaN Length) nebol označený ako štart nového sedenia.`},
 {type:`order`,prompt:`Usporiadaj kroky STT_MEAN algoritmu`,items:[`Načítaj log s Length`,`Vypočítaj prah stt_mean = df['Length'].mean()`,`Vytvor boolean NEW_SESSION = Length.isna() | Length >= stt_mean`,`SESSION_ID = NEW_SESSION.cumsum()`,`Drop NEW_SESSION a ulož CSV`]},
 {type:`fill`,text:`Idiom 'boolean Series .cumsum()' funguje tak, že True sa cast-uje na 1, False na 0; výsledok je monotónne ___ celé číslo = SESSION_ID.`,answer:`rastuce`,alts:[`rastúce`,`narastajuce`,`narastajúce`]},
 {type:`quiz`,q:`Čo je nevýhoda STT_MEAN oproti STT_Q?`,options:[`Je pomalšia`,`Priemer je citlivý na outliers — 1 veľmi dlhá Length potiahne celú štatistiku`,`Nepočíta NaN`,`Vyžaduje numpy`],correct:1,explain:`Length má typicky ťažký pravý chvost (pár páuz hodín/dní). Priemer + std je citlivý na extrémne hodnoty, kvartily (STT_Q) sú robustné.`},
 {type:`flash`,q:`📍 Úloha 05: stt_q.py`,a:`Sedenia cez <b>kvartilový odhad časového okna</b>: <code>STT_Q = Q3 + 1.5 * IQR</code> (Tukeyho pravidlo outliers). Length sa počíta cez quantile(0.25) a quantile(0.75). Rovnaký cumsum trik ako STT_MEAN.`},
 {type:`quiz`,q:`Čo je IQR (Interquartile Range)?`,options:[`Q3 - Q1, šírka stredného 50 % rozdelenia`,`Q1 + Q3`,`Q3 / Q1`,`priemer + std`],correct:0,explain:`IQR = Q3 - Q1 = šírka 'stredného 50 %' rozdelenia. Q1 je 25. percentil, Q3 je 75. percentil.`},
 {type:`fill`,text:`Tukeyho pravidlo: hodnota je 'extrémny outlier' ak je väčšia ako Q3 + ___ * IQR.`,answer:`1.5`,alts:[`1,5`]},
 {type:`match`,prompt:`Priraď koncepty STT_Q metódy k ich významu`,pairs:[[`Q1`,`25. percentil — pod ním leží 25 % hodnôt`],[`Q3`,`75. percentil — pod ním leží 75 % hodnôt`],[`IQR`,`Q3 - Q1, šírka stredného 50 % dát`],[`STT_Q`,`Q3 + 1.5 * IQR, časový prah outlier-ov`]]},
 {type:`flash`,q:`Prečo prednáška 8 hovorí, že 'odhady strednej hodnoty sa používajú, ale nie sú vhodné'?`,a:`Pre Length s <b>ťažkým pravým chvostom</b> (pár veľmi dlhých páuz) priemer aj std výrazne posunú outliers. <b>Kvartily (Q3+1.5*IQR) sú robustné</b> — nereagujú na okrajové hodnoty. Preto sa pre Length odporúča STT_Q (prípadne RLength ak Length ~ Exp).`},
 {type:`flash`,q:`Prečo quantile() ignoruje NaN automaticky?`,a:`Pandas <code>Series.quantile()</code> má default <b>skipna=True</b> — NaN-y (z prvých záznamov userov) sa nezahrnú do výpočtu kvartilov. Inak by skreslili Q1/Q3 a posunuli prah.`},
 {type:`flash`,q:`📍 Úloha 06: slength.py`,a:`Sedenia metódou <b>SLength</b>: pevný limit 600 s (10 min) na <b>CELÚ dĺžku sedenia</b> (nie na čas medzi prístupmi). Iteruje cez iterrows(), kumuluje Length; keď kumulatív+Length ≥ 600 alebo Length NaN → nové sedenie. ~6700 sedení.`},
 {type:`quiz`,q:`V čom sa líši SLength od STT_MEAN/STT_Q?`,options:[`SLength používa 600s prah na CELKOVÚ dĺžku sedenia, STT používa prah na čas MEDZI prístupmi`,`SLength nepoužíva Length`,`SLength používa kvartily`,`Nijako, sú to synonymá`],correct:0,explain:`SLength = limit na celkové trvanie sedenia (10 min). STT_* metódy = limit na čas medzi 2 po sebe idúcimi prístupmi.`},
 {type:`quiz`,q:`Prečo SLength nepoužíva vektorizovaný cumsum ale iterrows()?`,options:[`iterrows() je rýchlejší`,`cumsum() je monotónny — nevie sa RESETOVAŤ pri prekročení prahu`,`iterrows() je idiomatický pandas`,`Aby pandas hádzal warningy`],correct:1,explain:`Štandardný cumsum nevie 'vynulovať' pri dosiahnutí prahu. Pre kumulatív s resetom potrebujeme buď triky alebo explicitnú iteráciu (jednoduchšia čítačka).`},
 {type:`quiz`,q:`Keď podmienka cumulative_time + Length >= 600 zakopne, AKO sa resetuje kumulatív pre nový session?`,options:[`cumulative_time = 0`,`cumulative_time = row['Length'] (zachová konzistenciu s else vetvou)`,`cumulative_time = 600`,`cumulative_time = NaN`],correct:1,explain:`Length[i] reprezentuje čas od predchádzajúceho prístupu. V else vetve sa Length pripočítava — pri prahu sa preto Length stane PRVÝM príspevkom do kumulatívu nového sedenia. Inak by sa čas stratil.`},
 {type:`flash`,q:`📍 Úloha 07: ks_test_exp_rozdelenia.py`,a:`Overuje hypotézu, že <b>Length ~ Exp(λ)</b>: spustí <code>scipy.stats.kstest(length, 'expon', args=(0, mean))</code>, vykreslí histogram + teoretickú PDF a QQ plot. Výstup: KS štatistika, p-hodnota, rozhodnutie pri alpha=0.05.`},
 {type:`quiz`,q:`Čo je nulová hypotéza H0 KS testu?`,options:[`Dáta NEMAJÚ exp. rozdelenie`,`Dáta POCHÁDZAJÚ z exponenciálneho rozdelenia (F_data = F_expon)`,`Priemer = 0`,`Std = 1`],correct:1,explain:`H0: F_data(x) = F_expon(x; loc=0, scale=mean) pre všetky x. Test štatistika D_n = sup |F_data - F_expon|. Ak p < 0.05, zamietame H0.`},
 {type:`fill`,text:`KS test štatistika D_n je najväčšia ___ vzdialenosť medzi empirickou a teoretickou CDF.`,answer:`vertikalna`,alts:[`vertikálna`,`zvisla`,`zvislá`]},
 {type:`quiz`,q:`Aká je teoretická identita pre priemer exponenciálneho rozdelenia?`,options:[`E[X] = lambda`,`E[X] = 1 / lambda`,`E[X] = lambda^2`,`E[X] = ln(lambda)`],correct:1,explain:`Pre Exp(lambda): E[X] = 1/lambda, Median = ln(2)/lambda ≈ 0.693 * E[X], Std = 1/lambda (variačný koeficient = 1).`},
 {type:`quiz`,q:`Prečo je KS test s odhadnutým parametrom z dát (scale=mean(Length)) 'anti-konzervatívny'?`,options:[`P-hodnota je nižšia ako reálna`,`P-hodnota je VYŠŠIA ako reálna — riziko je NEZAMIETNUŤ H0 keď by sa mala`,`Test sa nedá spustiť`,`KS test ignoruje parametre`],correct:1,explain:`Štandardný KS predpokladá plne špecifikované parametre. Odhad zo vzorky robí test menej prísnym. Korektnejšie: Lilliefors test alebo bootstrap KS.`},
 {type:`flash`,q:`Čo znázorňuje QQ plot a ako sa interpretuje?`,a:`Os x = <b>teoretické kvantily</b> (expon ppf), os y = <b>empirické kvantily</b> (sorted Length). Ak dáta pochádzajú z teoretického rozdelenia, body ležia na priamke y=x. <b>Body nad čiarou = ťažšie chvosty, pod čiarou = ľahšie chvosty</b> ako exponenciálne.`},
 {type:`fill`,text:`Pre KS test používame parameter args=(0, mean) — loc=0 lebo Length nemôže byť záporná, scale=mean lebo scale = 1/___ je odhad metódou momentov.`,answer:`lambda`,alts:[`λ`]},
 {type:`flash`,q:`📍 Úloha 08: rlength.py`,a:`Sedenia heuristikou <b>RLength</b> (Reference Length): prah <code>rlength = -ln(1-p) * mean(Length)</code> pre p=0.4 (40 % navigačných stránok). Vychádza z predpokladu Exp rozdelenia. Výsledok ~75 s — NIŽŠÍ prah ako STT_MEAN → VIAC sedení (~8000).`},
 {type:`quiz`,q:`Aký je vzorec pre RLength prah?`,options:[`mean / lambda`,`Q3 + 1.5*IQR`,`-ln(1-p) * mean(Length)`,`p * mean(Length)`],correct:2,explain:`Inverzná CDF Exp rozdelenia: F^-1(p) = -ln(1-p) / lambda = -ln(1-p) * mean. Pre p=0.4 dostaneme -ln(0.6) ≈ 0.5108 * mean.`},
 {type:`fill`,text:`Vychádzame z CDF Exp(lambda): F(t) = 1 - exp(-t/mean). Riešime F(t) = p: t = -___(1-p) * mean.`,answer:`ln`,alts:[`log`]},
 {type:`flash`,q:`Čo je teoretická interpretácia parametra p = 0.4 pri RLength?`,a:`<b>p = relatívna početnosť navigačných stránok</b> = 40 % stránok sú navigačné (user len klikol a išiel ďalej, nepreciital). Prah rlength oddeľuje 40 % najkratších časov (navigačné) od 60 % dlhších (číta obsah → možné ukončenie sedenia).`},
 {type:`flash`,q:`📍 Úloha 09: h_ref.py`,a:`Sedenia <b>kombináciou h-ref + STT</b>: NEW_SESSION = OR z 3 podmienok: <code>Length.isna() | Length >= mean | Referrer == '-'</code>. Pridáva heuristiku 'externý/priamy prístup' (prázdny referrer) k časovému prahu. ~7200 sedení.`},
 {type:`quiz`,q:`Čo znamená Referrer == '-' v Apache logu?`,options:[`Stránka neexistuje`,`HTTP hlavička Referer chýba: priame zadanie URL, záložka, externý odkaz`,`Bot`,`Stratenie spojenia`],correct:1,explain:`Apache log zapisuje '-' keď HTTP hlavička Referer chýba — užívateľ prišiel zvonku (priama URL, záložka, externý link). Jasný signál pre ŠTART NOVÉHO SEDENIA.`},
 {type:`fill`,text:`V pandas musíme použiť ___ (bitwise OR) namiesto 'or' lebo 'or' nepodporuje Series — vyhodil by ValueError 'ambiguous truth value'.`,answer:`|`,alts:[`pipe`]},
 {type:`cat`,prompt:`Roztrieď heuristiky identifikácie sedení podľa typu prahu`,groups:{"Dynamický prah (z dát)":[`STT_MEAN (priemer Length)`,`STT_Q (Q3+1.5*IQR)`,`RLength (kvantil Exp rozdelenia)`],"Pevný prah (zo zadania)":[`SLength (600 s na celé sedenie)`,`Length filter (3600 s medzi prístupmi)`],"Kombinačná (čas + štruktúra)":[`h-ref (priemer Length + Referrer == '-')`]}},
 {type:`quiz`,q:`Aký je teoretický dôvod, prečo h-ref pridáva podmienku Referrer == '-' k časovému prahu?`,options:[`Zrýchlenie behu`,`Časový prah sám o sebe nezachytí situáciu, keď user prišiel zvonku po krátkej pauze`,`Aby sa zhodoval počet sedení s STT_MEAN`,`Referrer je vždy '-'`],correct:1,explain:`Klasické STT delí podľa času. Ak user otvorí novú záložku externou URL po 30 s, STT to neoznačí ako nové sedenie. Referrer == '-' to správne identifikuje.`},
 {type:`quiz`,q:`Prečo cumsum() trik funguje aj pre prechod medzi userami?`,options:[`Pandas to detekuje automaticky`,`Lebo prvý záznam každého usera má Length=NaN (zo shift v úlohe 03), takže isna() == True a SESSION_ID sa inkrementuje`,`cumsum() má parameter group`,`Iba ak je dataframe zoradený`],correct:1,explain:`Pre úspešnú segmentáciu sedení cez cumsum sa SPOLIEHAME na to, že úloha 03 vyrobila NaN Length pre prvý záznam každého usera. Vďaka tomu prechod medzi userami AUTOMATICKY vyvolá NEW_SESSION=True.`},
 {type:`match`,prompt:`Priraď očakávané počty sedení k metódam (podľa zadanie.txt)`,pairs:[[`STT_MEAN`,`~7500`],[`STT_Q`,`~7500`],[`SLength`,`~6700`],[`RLength`,`~8000`],[`h-ref`,`~7200`]]},
 {type:`order`,prompt:`Usporiadaj WUM fázy identifikácie podľa závislosti`,items:[`UNIXTIME (numerická reprezentácia času)`,`USER_ID (groupby IP+Agent)`,`Length (groupby USER_ID + shift)`,`Výber metódy session prahu (STT_MEAN / STT_Q / SLength / RLength / h-ref)`,`SESSION_ID (cumsum boolean masky)`]}
]},
{num:4,label:`Doplnenie ciest`,name:`Doplnenie ciest (path completion)`,reading:`<h2>Téma 4: Doplnenie ciest (Path Completion)</h2>
<p class="lead">Apache log nevidí kliky cez tlačidlo Back ani návštevy z cache prehliadača. Doplnenie ciest tieto diery zalepí — vloží medzi dva skoky pravdepodobnú medzistránku z mapy webu.</p>

<h3>Prečo to vôbec robíme</h3>
<p>Server zaznamenáva len požiadavky, ktoré k nemu prišli. Keď klikneš na tlačidlo Back, prehliadač vytiahne stránku z cache a server o tom nevie. V logu tak vidíš skok z <code>/fakulta</code> rovno na <code>/studium</code>, hoci v strome webu medzi nimi leží <code>/univerzita</code>.</p>
<p>Bez doplnenia by neskoršia analýza vzorov našla pravidlo "fakulta ⇒ studium" namiesto skutočného "fakulta ⇒ univerzita ⇒ studium". Doplnenie teda dvíha kvalitu vstupu pre Apriori a sekvenčné pravidlá.</p>

<h3>Spoločný princíp všetkých 4 úloh</h3>
<p>Vstupom je očistený log so SESSION_ID a mapa webu <code>mapa_webu.xlsx</code>. Skript prejde log po dvojiciach susedných riadkov. Pre každú dvojicu (curr, next) v tom istom sedení testuje:</p>
<pre><code>ak url_from NIE JE v mape AND url_to JE v mape:
    vlož medzistránku = parent(url_to)</code></pre>
<p>Symboly: <code>url_from</code> je URL z aktuálneho riadku, <code>url_to</code> z nasledujúceho, <code>parent(x)</code> je rodičovská stránka <code>x</code> v strome webu (stĺpec ReferencePage).</p>

<h3>Úloha 01: doplnenie_stt_mean.py</h3>
<p><strong>Čo robí:</strong> Doplní medzistránky v logu, kde sedenia spravila metóda STT_Mean (prah = priemer Length).</p>
<p><strong>Prečo:</strong> Bez tohto kroku by sekvencie navigácie mali diery. Apriori by potom našiel skreslené pravidlá.</p>
<p><strong>Ako:</strong> 1) Načíta log a mapu webu. 2) Z mapy postaví <code>parent</code> dict a <code>map_paths</code> set. 3) Prejde log po dvojiciach a vloží <code>parent(url_to)</code> ak url_from chýba v mape.</p>
<p><strong>Kde to nájdeš:</strong> <code>04_doplnanie_ciest/scripts/01_doplnanie_STT_MEAN/doplnenie_stt_mean.py</code></p>
<p><strong>Príklad:</strong> Log má dvojicu <code>/stary-odkaz</code> → <code>/fakulty/fpvai</code>. <code>/stary-odkaz</code> nie je v mape, ale <code>/fakulty/fpvai</code> áno. Skript vloží medzi ne <code>/fakulty</code> (rodič cieľa).</p>
<p><strong>Číslo na zapamätanie:</strong> cca <strong>750</strong> doplnených záznamov.</p>

<h3>Úloha 02: doplnenie_stt_q.py</h3>
<p><strong>Čo robí:</strong> Rovnaký algoritmus, ale vstup má sedenia zo STT_Q (kvantilový prah Q3+1.5×IQR pre neexponenciálne dáta).</p>
<p><strong>Prečo:</strong> STT_Q sa použije keď Length nemá exponenciálne rozdelenie. Doplnenie ciest funguje rovnako bez ohľadu na to, ako vznikli sedenia.</p>
<p><strong>Ako:</strong> Skript je takmer kópia úlohy 01, mení sa len názov vstupného CSV. Kľúčový idiom: zbieraj riadky do <code>list</code>, na konci urob jediný <code>pd.DataFrame(list)</code>.</p>
<p><strong>Kde to nájdeš:</strong> <code>04_doplnanie_ciest/scripts/02_doplnanie_STT_Q/doplnenie_stt_q.py</code></p>
<p><strong>Príklad:</strong> Vstup má ~20 667 riadkov, výstup ~21 402.</p>
<p><strong>Číslo na zapamätanie:</strong> ~<strong>735 doplnených</strong> (zadanie hovorí cca 750).</p>

<h3>Úloha 03: doplnenie_rlength.py</h3>
<p><strong>Čo robí:</strong> Doplnenie ciest pre log, kde sedenia identifikovala metóda RLength.</p>
<p><strong>Prečo:</strong> RLength odvodzuje časový prah z exponenciálneho rozdelenia Length. Doplnenie ciest aj tu zaceluje diery, aby vzory boli kompletné.</p>
<p><strong>Ako:</strong> Vzorec pre prah:</p>
<pre><code>prah = -ln(1-p) · mean(Length)</code></pre>
<p>Tu <code>ln</code> je prirodzený logaritmus, <code>p</code> je podiel "navigačných" stránok (typicky 0.4), <code>mean(Length)</code> je priemerný čas medzi prístupmi. Pre p=0.4 vyjde prah ~0.5108 × mean.</p>
<p><strong>Kde to nájdeš:</strong> <code>04_doplnanie_ciest/scripts/03_doplnanie_RLength/doplnenie_rlength.py</code></p>
<p><strong>Príklad:</strong> Skript vyprodukuje 776 doplnených záznamov.</p>
<p><strong>Číslo na zapamätanie:</strong> očakávaných ~<strong>850</strong>, skutočne 776 (~9 % pod cieľom — akceptovateľné).</p>

<h3>Úloha 04: doplnenie_href.py</h3>
<p><strong>Čo robí:</strong> Doplnenie ciest pre log so sedeniami z metódy h-ref.</p>
<p><strong>Prečo:</strong> h-ref pridáva navrch STT_Mean tretiu podmienku: nové sedenie aj keď Referrer='-' (priamy prístup, napríklad zo záložky). Vzniká viac, ale kratších sedení.</p>
<p><strong>Ako:</strong> Algoritmus doplnenia je identický s úlohou 01. Mení sa len názov vstupného CSV (<code>cleaned_log4_href.csv</code>).</p>
<p><strong>Kde to nájdeš:</strong> <code>04_doplnanie_ciest/scripts/04_doplnanie_h_ref/doplnenie_href.py</code></p>
<p><strong>Príklad:</strong> Krátke sedenia majú málo skokov v navigácii. Preto h-ref doplní menej záznamov ako RLength.</p>
<p><strong>Číslo na zapamätanie:</strong> ~<strong>690</strong> doplnených záznamov.</p>

<h3>Kľúčové dátové štruktúry</h3>
<p>Vo všetkých štyroch skriptoch sa opakuje rovnaký súbor:</p>
<ul>
<li><code>parent</code> je dict <code>{URL: ReferencePage}</code>. Lookup je O(1). Stavia sa idiómom <code>dict(zip(mapa['path'], mapa['ref_path']))</code>.</li>
<li><code>map_paths</code> je set všetkých URL z mapy. Test <code>x in map_paths</code> je O(1) vďaka hashtable. Bez setu by sme robili pomalý O(n) scan pri každej iterácii.</li>
<li><code>new_rows</code> je list dictov. Na <code>list.append()</code> je O(1) amortizovane. Na konci <code>pd.DataFrame(new_rows)</code> raz vyrobí výstupnú tabuľku.</li>
</ul>

<h3>Edge cases ktoré skripty zachytávajú</h3>
<p>Skript preskočí doplnenie ak:</p>
<ul>
<li>Sme na poslednom riadku logu (nie je s čím porovnať).</li>
<li><code>curr.SESSION_ID</code> sa líši od <code>next_row.SESSION_ID</code> — medzi sedeniami nie je navigácia, len hranica.</li>
<li><code>url_from == url_to</code> — refresh stránky (F5), netreba medzistránku.</li>
<li><code>url_from</code> je v mape — heuristika sa neuplatní (pokrýva len prípad "url_from chýba").</li>
<li><code>ref_page == url_from</code> — zabraňuje cyklu "from → from → to".</li>
</ul>

<h3>Príprava mapy webu</h3>
<p>Mapa je v Exceli, preto <code>pd.read_excel</code> (nie <code>read_csv</code>). Po načítaní:</p>
<ol>
<li>Premenuje stĺpce na <code>idx, URL, Root, ReferencePage</code>.</li>
<li><code>mapa.iloc[1:]</code> zahodí prvý riadok ako druhú hlavičku.</li>
<li><code>str.replace('https://www.ukf.sk', '', regex=False)</code> oreže doménu. Parameter <code>regex=False</code> robí doslovnú substitúciu — rýchlejšiu a bezpečnejšiu.</li>
<li>Prázdny reťazec po orezaní nahradí <code>/</code> (koreň webu).</li>
</ol>

<p>Skript dopĺňa LEN jednu medzistránku medzi dvojicou a LEN keď url_from chýba v mape. Ak by chýbala dlhšia cesta (napríklad tri úrovne), korektný Path Completion by rekonštruoval celý reťazec. Tu sa to nerieši — autor vedome akceptuje miernu stratu presnosti.</p>

{num:5,label:`Prieskum dát`,name:`Prieskum dát (deskriptívne štatistiky, vzťahy)`,reading:`<h2>Téma 5: Prieskum dát (deskriptívne štatistiky, vzťahy)</h2>
<p class="lead">Prieskum dát (EDA) je prvá fáza po vyčistení logov. Cieľom je zorientovať sa v datasete logs5.csv pred ďalšími úlohami (Apriori, klasifikácia). Bez prieskumu netušíme čo dataset obsahuje.</p>

<h3>Skupiny premenných</h3>
<p>Dataset banky má premenné rozdelené do 4 skupín. <b>DV (vysvetľované, obsah)</b>: category, webPart, urlExt — z URL. <b>IV (vysvetľujúce, čas)</b>: year, quartal, yearQuartal, week, crisis — z časovej známky. <b>User</b>: anonIP, agent, userAgent. <b>Other</b>: length (čas na stránke), internal (interný traffic), frame (session ID).</p>
<p>Zadanie hovorí: <em>do analýzy zahrň aspoň jednu premennú z každej skupiny a analyzuj vzťahy medzi nimi</em>.</p>

<h3>Úloha 04: vztahy_premennych.py</h3>
<p><strong>Čo robí:</strong> štatistické testy sily závislosti medzi premennými — 3× chi² test nezávislosti + 1× ANOVA.</p>
<p><strong>Prečo:</strong> chi² hovorí ČI závislosť existuje (p-hodnota). Cramerovo V hovorí AKÁ silná je (0-1). Bez Cramerovho V by sme pri n=2M tvrdili, že všetko závisí od všetkého — chi² rastie s n.</p>
<p><strong>Ako:</strong> pre dve kategorické premenné postav crosstab a zavolaj chi2_contingency. Pre numerickú vs kategorickú premennú spusti f_oneway nad listom polí (jedno pole na kategóriu).</p>
<p><strong>Kde to nájdeš:</strong> <code>05_prieskum_dat/scripts/04_vztahy_premennych/vztahy_premennych.py</code></p>
<p><strong>Vzorec Cramerovho V:</strong></p>
<pre><code>V = sqrt(chi2 / (n * (min(r,c) - 1)))</code></pre>
<p>kde <code>chi2</code> je hodnota zo scipy, <code>n</code> je celkový počet pozorovaní, <code>r</code> a <code>c</code> sú rozmery kontingenčnej tabuľky. Delenie <code>n*(min(r,c)-1)</code> je maximum, ktoré môže chi² dosiahnuť pri perfektnej závislosti — preto V padne do [0, 1].</p>
<p><strong>Interpretácia V:</strong> < 0.1 veľmi slabá, 0.1-0.3 slabá, 0.3-0.5 stredná, >= 0.5 silná.</p>
<p><strong>ANOVA (F-test):</strong> porovnáva priemery K skupín. H0: všetky priemery sú rovnaké. F = rozptyl MEDZI skupinami / rozptyl VNÚTRI skupín. Predpoklady: normalita, homoskedasticita, nezávislosť.</p>
<p><strong>Výstup chi2_contingency:</strong> tuple <code>(chi2, p, dof, expected)</code> — štatistika, p-hodnota, stupne voľnosti a tabuľka očakávaných frekvencií.</p>

<h3>Bežné technické triky v skriptoch</h3>
<p><b>low_memory=False</b> — vypne chunk-by-chunk type inference. Pri mixed-type stĺpcoch (raz NaN, raz string) by inak pandas vyhodil DtypeWarning a hádal dtype podľa kúskov.</p>
<p><b>errors='coerce'</b> v to_datetime — nevalidné hodnoty sa zmenia na NaT namiesto vyhodenia výnimky. NaT potom padne v groupby ako NaN a riadok vypadne.</p>
<p><b>unstack(fill_value=0)</b> — presunie poslednú úroveň MultiIndexu na stĺpce, chýbajúce kombinácie dostanú 0 namiesto NaN. Bez toho by sa čiary v line plote prerušovali.</p>
<p><b>astype(str) na roky</b> v bar grafe — aby matplotlib bral roky ako kategorické labely, nie spojitú os.</p>

<h3>Intuícia: prečo Cramerovo V a nie chi²?</h3>
<p>Predstav si, že vážiš jablká na dvoch rôznych váhach: jedna ukazuje gramy, druhá libry. Číslo bude vždy iné, hoci jablko je rovnaké. Chi² je presne takéto „surové číslo“ — rastie s veľkosťou vzorky <code>n</code> a s rozmermi tabuľky <code>r × c</code>. Pri 2 miliónoch logov banky vyjde chi² obrovské aj vtedy, keď je závislosť triviálna. Preto potrebujeme <b>normalizáciu</b> — rovnakú váhu pre malý aj veľký dataset.</p>
<p>Derivácia: pri perfektnej závislosti medzi dvomi kategorickými premennými môže chi² dosiahnuť nanajvýš <code>n · (min(r,c) - 1)</code>. Keď chi² delíme týmto maximom, dostaneme <code>phi²</code> v intervale <b>[0, 1]</b>. Odmocnina prevedie na lineárnu škálu (analógia: <code>r²</code> vs <code>r</code> pri korelácii):</p>
<pre><code>V = sqrt( chi² / ( n · (min(r,c) - 1) ) )</code></pre>
<p><b>Interpretácia podľa Cohena:</b> V < 0.1 = veľmi slabá, 0.1-0.3 = slabá, 0.3-0.5 = stredná, V &ge; 0.5 = silná závislosť. Výhoda: <b>nezávisí od n</b>, takže porovnávaš jablká s jablkami medzi rôznymi datasetmi.</p>

<h3>Prepojenie typov premenných s testom (Munka, prednáška 9)</h3>
<p>Výber štatistického testu nie je voľný — diktujú ho <b>typy</b> dvoch premenných, ktorých vzťah skúmaš. Toto je zlaté pravidlo EDA:</p>
<table class="thtable">
  <tr><th>Premenná A</th><th>Premenná B</th><th>Test</th><th>Miera sily efektu</th></tr>
  <tr><td>kategorická</td><td>kategorická</td><td>chi² test nezávislosti</td><td>Cramerovo V</td></tr>
  <tr><td>numerická</td><td>kategorická (k skupín)</td><td>ANOVA F-test (f_oneway)</td><td>eta² alebo omega²</td></tr>
  <tr><td>numerická</td><td>numerická</td><td>Pearson / Spearman korelácia</td><td>r alebo &rho;</td></tr>
</table>
<p>V skripte <code>vztahy_premennych.py</code> sú 3× chi² (category × crisis, category × internal, category × year — všetko kategorická × kategorická) a 1× ANOVA (length × category — numerická × kategorická). Korelácia tu nie je, lebo v datasete máme len jeden numerický stĺpec <code>length</code>.</p>

<h3>EDA pipeline: prečo popisné štatistiky PRED testami</h3>
<p>John Tukey (otec EDA) hovoril: <em>„first look, then test“</em> — najskôr sa pozri, potom testuj. Prečo nestačí rovno spustiť chi² a ANOVA?</p>
<ul>
  <li><b>Popisné štatistiky odhalia degenerované rozdelenia.</b> Ak má kategória 99 % jednu hodnotu, chi² vyjde nezmyselne (stupne voľnosti sa zrútia). Bez <code>value_counts</code> to nezistíš.</li>
  <li><b>describe() preveruje predpoklady ANOVA.</b> Mean >> median signalizuje pravostranne šikmé rozdelenie — ANOVA má potom nadhodnotenú F-štatistiku. Treba zvážiť log-transformáciu alebo Kruskal-Wallis test.</li>
  <li><b>Časová agregácia (úloha 02) a heatmapy (úloha 03) sú „mid-look“</b> — vidíš trendy, ktoré štatistické testy iba kvantifikujú. Bez nich tvoja interpretácia p-hodnoty visí vo vzduchu.</li>
</ul>
<p>Logický tok témy 5: <b>(1) pochop dáta</b> (popisné, frekvencie) → <b>(2) vidím trendy v čase a kategóriách</b> (návštevnosť, length na stránkach) → <b>(3) testuj hypotézy</b> (chi², ANOVA) → <b>(4) interpretuj veľkosť efektu</b> (Cramer V, slovná interpretácia). Bez tohto poradia sú výsledky štatisticky správne, ale prakticky neinterpretovateľné.</p>

{num:6,label:`Extrakcia vzorov`,name:`Extrakcia vzorov (Apriori + Cochran Q + Kendall W)`,reading:`<h2>Téma 6: Extrakcia vzorov (Apriori + Cochran Q + Kendall W)</h2>
<p class="lead">Z čistých logov banky (2009-2012) vytiahneme asociačné pravidlá typu "ak user navštívi kategóriu A, navštívi aj B". Potom štatisticky overíme, či sa tieto vzory medzi rokmi menia, alebo zostávajú rovnaké.</p>

<h3>Úloha 01: priprava_transakcii.py</h3>
<p><strong>Čo robí:</strong> Pre každý rok vyrobí CSV s "košíkmi" — zoznamom kategórií, ktoré user navštívil v jednom sedení.</p>
<p><strong>Prečo:</strong> Apriori algoritmus pracuje s košíkmi. Bez tohto kroku by sme nemali z čoho hľadať pravidlá. Košík s jednou kategóriou je nanič — z 1 položky nevznikne žiadna dvojica A⇒B.</p>
<p><strong>Ako:</strong> 1) Načítaj logs5.csv. 2) Pre každý rok zoskup podľa <code>frame</code> (sedenie), zlej unikátne kategórie do reťazca "A;B;C". 3) Vyhoď košíky s menej ako 2 kategóriami.</p>
<p><strong>Kde to nájdeš:</strong> <code>06_extrakcia_vzorov/scripts/01_priprava_dat/priprava_transakcii.py</code></p>
<p><strong>Príklad:</strong> sedenie frame=42 navštívi /uvod, /produkty, /uvod → košík = "produkty;uvod" (set zmaže duplikát, sorted zoradí abecedne).</p>
<p><strong>Číslo na zapamätanie:</strong> rok 2009 má 37 734 transakcií (najviac zo všetkých rokov), po <code>dropna(category)</code> ostáva ~102 481 záznamov.</p>

<h3>Úloha 02: apriori_pravidla.py</h3>
<p><strong>Čo robí:</strong> Spustí Apriori algoritmus na každom roku zvlášť a vygeneruje asociačné pravidlá X⇒Y so support, confidence a lift.</p>
<p><strong>Prečo:</strong> Asociačné pravidlo nám povie "ak user navštívi X, s pravdepodobnosťou P% navštívi aj Y". To je užitočné pre odporúčania a optimalizáciu navigácie webu.</p>
<p><strong>Ako:</strong> 1) <code>TransactionEncoder</code> prevedie zoznam košíkov na binárnu maticu T×I (riadky=košíky, stĺpce=kategórie, bunka=True ak košík obsahuje kategóriu). 2) <code>apriori</code> nájde itemsety so support ≥ 5%. 3) <code>association_rules</code> z nich vyrobí pravidlá s confidence ≥ 50%.</p>
<p><strong>Kde to nájdeš:</strong> <code>06_extrakcia_vzorov/scripts/02_asociacne_pravidla/apriori_pravidla.py</code></p>
<p><strong>Vzorce metrík:</strong></p>
<pre><code>support(X⇒Y)    = P(X ∪ Y)              -- ako často sa X aj Y vyskytujú spolu
confidence(X⇒Y) = P(Y|X) = sup(X∪Y)/sup(X)  -- ako spoľahlivá je implikácia
lift(X⇒Y)       = confidence / P(Y)        -- koľkokrát viac sa Y vyskytne s X oproti náhode</code></pre>
<p>Lift > 1 znamená pozitívnu koreláciu, lift = 1 nezávislosť, lift < 1 negatívnu koreláciu.</p>
<p><strong>Princíp anti-monotónie:</strong> Ak itemset {A,B} nesplní minimálny support, žiadna jeho nadmnožina {A,B,C}, {A,B,D}... ho tiež nesplní. To umožňuje "prerezať" celé vetvy stromu kandidátov a Apriori je vďaka tomu rýchly.</p>
<p><strong>Číslo na zapamätanie:</strong> 2009 = 341 pravidiel, 2010 = 405, 2011 = 205, 2012 = iba 17 pravidiel (najmenej, lebo má málo transakcií pri rovnakom prahu).</p>

<h3>Úloha 03: matica_pravidiel.py</h3>
<p><strong>Čo robí:</strong> Zlúči pravidlá zo všetkých 4 rokov do jednej binárnej matice. Riadky = unikátne pravidlá, stĺpce = obdobia O1_2009 až O4_2012, hodnoty = 0/1 podľa výskytu.</p>
<p><strong>Prečo:</strong> Aby sme mohli štatisticky porovnať obdobia, potrebujeme všetky pravidlá v jednej tabuľke. Pravidlo identifikujeme ako reťazec "antecedents => consequents".</p>
<p><strong>Ako:</strong> 1) Pre každý rok načítaj CSV, vyrob set string-ID pravidiel. 2) <code>set().union(*sets)</code> dá univerzálnu množinu (~450 unikátnych). 3) Pre každé pravidlo a každé obdobie zapíš 1 ak je tam, inak 0. 4) Spočítaj <code>pocet_obdobi = sum(axis=1)</code>.</p>
<p><strong>Kde to nájdeš:</strong> <code>06_extrakcia_vzorov/scripts/03_matica_pravidiel/matica_pravidiel.py</code></p>
<p><strong>Príklad:</strong> pravidlo "uvod => blog" sa objavilo v 2009 aj 2010, ale nie v 2011 a 2012 → riadok [1, 1, 0, 0], pocet_obdobi = 2.</p>
<p><strong>Číslo na zapamätanie:</strong> matica má tvar 450 × 6 (450 unikátnych pravidiel, 6 stĺpcov: pravidlo + O1 + O2 + O3 + O4 + pocet_obdobi).</p>

<h3>Úloha 04: cochran_kendall_test.py</h3>
<p><strong>Čo robí:</strong> Štatisticky overí, či sa pravidlá medzi obdobiami líšia (Cochran Q test) a kvantifikuje silu zhody (Kendallovo W).</p>
<p><strong>Prečo:</strong> Cochran Q nám povie "áno/nie sú rozdiely" ale nepovie aké veľké. Kendall W pridá číslo medzi 0 (žiadna zhoda) a 1 (perfektná zhoda).</p>
<p><strong>Ako:</strong> 1) Načítaj maticu, ber len O-stĺpce. 2) Spusti <code>cochrans_q</code> na binárnej matici. 3) Dopočítaj W zo vzorca. 4) Vykresli 2-panelový bar graf.</p>
<p><strong>Kde to nájdeš:</strong> <code>06_extrakcia_vzorov/scripts/04_statisticka_analyza/cochran_kendall_test.py</code></p>
<p><strong>Vzorec pre Kendallovo W:</strong></p>
<pre><code>W = Q / (n · (k - 1))</code></pre>
<p>Q je Cochranova štatistika, n je počet pravidiel (450), k je počet období (4). Pre náš dataset: W = 724.3 / (450 · 3) ≈ 0.54 → silnejšia zhoda.</p>
<p><strong>Predpoklady Cochran Q:</strong> závislé vzorky (tie isté pravidlá merané v k obdobiach), binárne hodnoty (0/1), n ≥ 4·k. Štatistika Q sa približne riadi rozdelením χ² s df = k - 1 = 3.</p>
<p><strong>Rozhodovacie pravidlo:</strong> ak p < 0.05 → zamietame H0 → existujú signifikantné rozdiely medzi obdobiami.</p>
<p><strong>Interpretácia W:</strong> <0.3 slabá zhoda, 0.3-0.5 stredná, 0.5-0.7 silnejšia, ≥0.7 silná.</p>
<p><strong>Číslo na zapamätanie:</strong> Q = 724.3, p < 0.001 → existujú rozdiely. 15 pravidiel je stabilných (vo všetkých 4 obdobiach), 119 je unikátnych len pre 1 obdobie.</p>

 {type:`fill`,text:`V pandas | je ___-wise OR nad boolean Series; or by hodil ValueError 'truth value ambiguous'.`,answer:`element`,alts:[`element`],step:'04'},
 {type:`quiz`,q:`Prečo prevádzame DateTime ("17/Dec/2017:06:25:47") na UNIX číslo, namiesto použitia datetime objektu?`,options:[`UNIX čísla zaberajú menej miesta v CSV`,`Z čísla rozdiel = sekundy (žiadne riešenie polnoci/mesiacov); datetime objekt by vyžadoval knižnicu na každé porovnanie`,`datetime objekt nepodporuje pandas`,`UNIX je rýchlejší na disk`],correct:1,explain:`Hlavná výhoda: rozdiel dvoch UNIX čísel = počet sekúnd. Bez parsovania, bez timezone, bez prestupných sekúnd. To je presne čo úloha 06 (Length) potrebuje — odpočítať predošlý čas.`,step:'04'},
 {type:`quiz`,q:`Náš to_unixtime() vytvára <code>datetime(year, month, day, h, m, s)</code> BEZ tzinfo parametra (= "naive datetime"). Aký je dôsledok?`,options:[`Python crashne pri .timestamp()`,`UNIXTIME bude nesprávne o 1 hodinu`,`.timestamp() interpretuje čas v LOKÁLNEJ TZ systému, čo môže posunúť hodnoty na inom serveri. Pre Length to nevadí (rozdiely sa nemenia), ale absolútna hodnota je závislá od TZ.`,`UNIXTIME bude vždy správne`],correct:2,explain:`Naive datetime nemá info o pásme. .timestamp() použije systémovú TZ. Pre náš projekt (rozdiely Length) to nevadí, ale je to dôležité vedieť. Oprava: <code>datetime(..., tzinfo=timezone(timedelta(hours=1)))</code>. Prednáška Munka o čase to spomína.`,step:'04'},

 {type:`quiz`,q:`Prečo Length\_i závisí LEN od UNIXTIME\_(i-1), nie od celej histórie kliknutí používateľa?`,options:[`Length je definovaný ako rozdiel dvoch po sebe idúcich časov — to je Markov-like vlastnosť (závisí len od predošlého stavu)`,`Pandas nepodporuje viac-stĺpcové výpočty`,`groupby.shift(1) je rýchlejší ako shift(N)`,`Munk to tak prikázal`],correct:0,explain:`Markov-like = "stav závisí len od predošlého, nie od celej minulosti". Pre Length to platí lebo nás zaujíma "ako dlho user pozeral TÚTO stránku" = rozdiel od predošlého kliku. Celá história nie je potrebná. Toto je dôležitý princíp pre WUM.`,step:'06'},

 {type:`match`,prompt:`Krok 06 — spáruj situáciu s výslednou hodnotou Length:`,pairs:[[`Prvý záznam usera (žiadny predošlý UNIXTIME)`,`Length = NaN`],[`UNIXTIME_predošlý=1513488000, terajší=1513488030`,`Length = 30s`],[`UNIXTIME_predošlý=1513488000, terajší=1513488180`,`Length = 180s`],[`UNIXTIME_predošlý=1513488000, terajší=1513491700 (rozdiel 3700s)`,`Length = NaN (≥ 3600s, prepíše sa)`]],step:'06'},
 {type:`flash`,q:`Úloha 07: sedenia_rlength.py`,a:`Identifikuje sedenia metódou RLength (s STT_Q fallbackom podľa KS testu). Prah delí navigačné od cieľových stránok; pridelí SESSION_ID cez cumsum nad NEW_SESSION.`,step:'07'},
 {type:`flash`,q:`Kedy sa použije RLength a kedy STT_Q fallback?`,a:`<b>KS test p ≥ 0.05</b> → data majú exp. rozdelenie → <b>RLength</b>.<br><b>KS test p < 0.05</b> → nemajú → <b>STT_Q = Q3 + 1.5·IQR</b>.`,step:'07'},
 {type:`quiz`,q:`Aké hypotézy KS testu pre exponenciálne rozdelenie?`,options:[`H0: data NEmajú exp. / H1: majú`,`H0: data majú exp. rozdelenie / H1: nemajú`,`H0: priemer = 0 / H1: priemer != 0`,`H0: D=0 / H1: D!=0`],correct:1,explain:`KS test: H0: data ~ Exp(scale=mean). p<0.05 zamietame H0.`,step:'07'},
 {type:`fill`,text:`V kstest(length_data, 'expon', args=(0, mean_length)) je scale parameter = ___ (= 1/lambda).`,answer:`mean_length`,alts:[`mean`,`priemer`],step:'07'},
 {type:`flash`,q:`Odkiaľ pochádza vzorec RLength = <code>-ln(1-p)·μ</code>? (Hint: nepríde z neba, je derivovaný)`,a:`Exponenciálne rozdelenie má kumulatívnu funkciu (CDF): <b>F(t) = 1 - e<sup>-t/μ</sup></b>. Munk v prednáške 7 hovorí, že chceme najsť t také, že p % všetkých časov je pod ním. Riešime <b>F(t) = p</b>:<br>1 - e<sup>-t/μ</sup> = p<br>e<sup>-t/μ</sup> = 1 - p<br>-t/μ = ln(1-p)<br><b>t = -μ·ln(1-p)</b><br><br>Pre p=0.4 (40 % navigačných stránok): t ≈ 0.51·μ. To je presne to čo robí <code>sedenia_rlength.py:139</code>: <code>-np.log(1 - p) * mean_length</code>. <code>np.log</code> je <b>ln</b> (prirodzený logaritmus, lebo e nájdete v CDF).`,step:'07'},
 {type:`order`,prompt:`Derivuj vzorec RLength krok-za-krokom od CDF exponenciály:`,items:[`Exponenciálne rozdelenie: F(t) = 1 - e^(-t/μ)`,`Chceme t také, že p % časov je pod ním → F(t) = p`,`1 - e^(-t/μ) = p`,`e^(-t/μ) = 1 - p`,`-t/μ = ln(1-p)`,`t = -μ · ln(1-p)`],step:'07'},
 {type:`quiz`,q:`Prečo np.log a nie np.log10 v RLength vzorci?`,options:[`log10 je pomalý`,`Vzorec vyžaduje PRIRODZENÝ logaritmus (ln) z definície CDF exp. rozdelenia`,`log10 nefunguje na floatoch`,`Numpy odporúča np.log`],correct:1,explain:`CDF(t) = 1 - exp(-t/mean). Inverzia: t = -mean·ln(1-p). Prirodzený log.`,step:'07'},
 {type:`quiz`,q:`Aká je intuícia pre p=0.4 v RLength?`,options:[`Predpoklad že 40% prístupov sú navigačné (krátky čas, len preklik)`,`40% je magické číslo`,`40% userov má bot`,`p=0.4 je default v scipy`],correct:0,explain:`Navigačné stránky majú krátky Length (cieľové dlhý). 40% určuje hranicu.`,step:'07'},

 {type:`quiz`,q:`Aké 3 OR podmienky vyvolajú nové sedenie v h-ref?`,options:[`Length<0 OR Length>mean OR URL=='-'`,`Length.isna() OR Length>=mean OR Referrer=='-'`,`UNIXTIME==0 OR IP==Agent OR len(URL)==0`,`NaN UNIXTIME OR same IP OR new day`],correct:1,explain:`Tri nezávislé signály: nový user (NaN), prekročený priemer, priamy vstup.`,step:'08'},
 {type:`quiz`,q:`Cooleyho plná h-ref hovorí: nové sedenie ak <code>Referrer != URL_(i-1)</code> používateľa (prerušenie navigačného reťazca). Naša verzia kontroluje len <code>Referrer == "-"</code>. Aký kompromis robíme?`,options:[`Naša verzia je presnejšia`,`Naša verzia detekuje LEN externý vstup (zvonku); plná Cooley detekuje aj vnútorné prerušenia (skok medzi nesúvisiacimi stránkami). Strácame teda jemnejšiu segmentáciu, ale je to dostatočné pre tento projekt.`,`Plná Cooley nefunguje na pandas`,`Munk to tak prikázal`],correct:1,explain:`Naša 3. podmienka <code>Referrer=="-"</code> je len špeciálny prípad plnej h-ref. Plná Cooley by porovnávala Referrer s predošlým URL ten istý user. Pre náš dataset je zjednodušenie OK, ale je dobré vedieť rozdiel. Prednáška 8 popisuje plnú variantu.`,step:'08'},

 {type:`quiz`,q:`Prečo to_dict('records') namiesto iterrows() v úlohe 09/10?`,options:[`iterrows nefunguje na veľkých DataFrame`,`iterrows vyrobí Series objekt v každom kroku — dict iterácia je 10-20× rýchlejšia (pri 74k riadkoch sek vs minúty)`,`Pre čitateľnosť`,`Iterrows neudrží poradie`],correct:1,explain:`Series má overhead. Dict je raw Python — optimum pre manuálnu iteráciu.`,step:'09'},

 {type:`flash`,q:`Úloha 10: doplnenie_href.py`,a:`Path completion pre h-ref sedenia — rovnaký algoritmus ako 09, len iný vstup (08_sedenia_href.csv). Menej doplnení (~0.19%) lebo h-ref produkuje kratšie sedenia.`,step:'10'},
 {type:`flash`,q:`Aký je rozdiel medzi úlohou 09 a úlohou 10?`,a:`<b>Rovnaký algoritmus</b>, len iný vstupný CSV (úloha 09 berie z 07_sedenia_rlength.csv, úloha 10 z 08_sedenia_href.csv). Úloha 10 doplní <b>menej</b> záznamov (~0,19 %) lebo h-ref produkuje kratšie sedenia → menej dvojíc (curr, next) v rámci toho istého SESSION_ID → menej príležitostí na doplnenie.`,step:'10'},

 {type:`quiz`,q:`Aký je predpoklad exponenciálneho rozdelenia v kontexte Length?`,options:[`User pristupuje ku stránkam ako Poissonov proces (nezávislé udalosti s konštantnou intenzitou)`,`Length je normálna`,`Length je uniformná`,`Length je gamma`],correct:0,explain:`Čas medzi nezávislými udalosťami v Poissonovom procese má exp. rozdelenie.`,step:'overview'},

 {type:`match`,prompt:`Priraď vzorec/koncept k jeho významu:`,pairs:[[`-ln(1-p)*mean`,`RLength prah (p=0.4 navigačné)`],[`Q3 + 1.5*IQR`,`STT_Q (Tukeyho horná ohrada, fallback)`],[`UNIXTIME_i - UNIXTIME_(i-1)`,`Length (čas na stránke)`],[`groupby(IP,Agent).ngroup()+1`,`USER_ID`],[`NEW_SESSION.cumsum()`,`SESSION_ID`]],step:'overview'},

/* ===== rozcestník + pokrok (v pamäti, navyše localStorage) ===== */
const PROG={};
TOPICS.forEach(t=>{ try{ const v=JSON.parse(localStorage.getItem('oz_cvika_'+t.num)||'null'); if(v) PROG[t.num]=v; }catch(e){} });
function saveProg(num,obj){ PROG[num]=obj; try{ localStorage.setItem('oz_cvika_'+num, JSON.stringify(obj)); }catch(e){} }
const roz=document.getElementById('roz'), testDiv=document.getElementById('test'), grid=document.getElementById('grid');
function renderGrid(){
  grid.innerHTML='';
  TOPICS.forEach(t=>{
    const o=PROG[t.num]||null;
    const n=o&&o.n?o.n:t.tasks.length;
    const answered=o?(o.answered!=null?o.answered:(o.done?n:0)):0;
    const touched=o?(o.touched!=null?o.touched:answered):0;
    const best=o?(o.best!=null?o.best:0):0;
    const barPct=o?Math.round(touched/n*100):0;
    let label;
    if(!o||touched===0) label='zatiaľ neskúšané';
    else if(o.done) label='dokončené · najlepšie '+best+'%';
    else label='rozpracované '+touched+'/'+n+(best?(' · najlepšie '+best+'%'):'');
    const b=el('button','tile');
    b.innerHTML='<div class="tnum">TÉMA '+t.num+'</div>'
      +(best===100?'<div class="badge">🏆</div>':'')
      +'<div class="tname">'+t.label+'</div>'
      +'<div class="pbar"><div class="pfill" style="width:'+barPct+'%"></div></div>'
      +'<div class="pct">'+label+'</div>';
    b.onclick=()=>openTopic(t);
    grid.appendChild(b);
  });
}
function openTopic(t){ roz.style.display='none'; testDiv.style.display='block'; testDiv.innerHTML=''; window.scrollTo(0,0); runTest(t,testDiv,backToGrid,saveProg); }
function backToGrid(){ testDiv.style.display='none'; testDiv.innerHTML=''; roz.style.display='block'; renderGrid(); window.scrollTo(0,0); }
document.getElementById('reset').onclick=()=>{ if(confirm('Vynulovať pokrok vo všetkých témach?')){ TOPICS.forEach(t=>{ delete PROG[t.num]; try{localStorage.removeItem('oz_cvika_'+t.num);}catch(e){} }); renderGrid(); } };
renderGrid();
</script>
