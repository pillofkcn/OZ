&lt;p&gt;Predstav si, že vidíš človeka na stránke &lt;code&gt;A&lt;/code&gt;, potom &lt;code&gt;B&lt;/code&gt;, &lt;code&gt;C&lt;/code&gt;, &lt;code&gt;D&lt;/code&gt; a zrazu skočí na &lt;code&gt;X&lt;/code&gt;, ktorá je odkazovaná iba zo stránky &lt;code&gt;A&lt;/code&gt;. Z logu to vyzerá ako teleport, ale v skutočnosti sa vrátil cez &lt;b&gt;Späť&lt;/b&gt;: &lt;code&gt;D → C → B → A → X&lt;/code&gt;. Tieto medzikroky doplníme do logu, aby sekvencia bola súvislá. Pred doplnením je vstupom log so sedeniami (výstup témy 3); na konci máme &lt;b&gt;kompletné cesty&lt;/b&gt; pripravené pre prieskum dát (téma 5) a hľadanie vzorov (téma 6).&lt;/p&gt;

&lt;h3&gt;Vizuálne — pipeline WUM&lt;/h3&gt;
&lt;pre&gt;&lt;code&gt;[T1 Zdroje] → [T2 Čistenie] → [T3 Identifikácia (user+session)]
                                          ↓
                            [T4 DOPLNENIE CIEST]  ← si tu
                                          ↓
                        [T5 Prieskum] → [T6 Vzory]&lt;/code&gt;&lt;/pre&gt;

&lt;p&gt;Štyri úlohy v rámci témy 4 — každá používa iný odhad &lt;b&gt;časového limitu sedenia&lt;/b&gt; alebo dĺžky:&lt;/p&gt;
&lt;table class="thtable"&gt;
&lt;tr&gt;&lt;th&gt;Úloha&lt;/th&gt;&lt;th&gt;Metóda&lt;/th&gt;&lt;th&gt;Princíp&lt;/th&gt;&lt;th&gt;~doplnené&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;01&lt;/td&gt;&lt;td&gt;&lt;b&gt;STT_Mean&lt;/b&gt;&lt;/td&gt;&lt;td&gt;hranica sedenia = priemerný čas medzi klikmi&lt;/td&gt;&lt;td&gt;~750 / &lt;b&gt;855&lt;/b&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;02&lt;/td&gt;&lt;td&gt;&lt;b&gt;STT_Q&lt;/b&gt;&lt;/td&gt;&lt;td&gt;hranica = horný kvartil + 1,5×IQR (robustné voči outlierom)&lt;/td&gt;&lt;td&gt;~750 / &lt;b&gt;735&lt;/b&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;03&lt;/td&gt;&lt;td&gt;&lt;b&gt;RLength&lt;/b&gt;&lt;/td&gt;&lt;td&gt;exponenciálny odhad cez navigačné stránky&lt;/td&gt;&lt;td&gt;~776&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;04&lt;/td&gt;&lt;td&gt;&lt;b&gt;h-ref&lt;/b&gt;&lt;/td&gt;&lt;td&gt;rovnaký mapa+parent algoritmus ako STT/RLength; iný len INPUT (sedenia z h-ref)&lt;/td&gt;&lt;td&gt;~690 / &lt;b&gt;706&lt;/b&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;/table&gt;

&lt;div class="thbox thpochop"&gt;&lt;h4&gt;Pochop (princíp, prečo)&lt;/h4&gt;&lt;ul&gt;
&lt;li&gt;&lt;b&gt;Prečo doplňujeme?&lt;/b&gt; Bez doplnenia by analýza správania ukázala nezmyselné skoky (A → X) a vzory by boli skreslené. Skutočná cesta používateľa cez &lt;b&gt;Späť&lt;/b&gt; chýba, lebo prehliadač ukazuje stránku z cache bez požiadavky na server.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Dva nástroje:&lt;/b&gt; (a) &lt;b&gt;mapa webu&lt;/b&gt; — graf kto na koho odkazuje, (b) &lt;b&gt;referer&lt;/b&gt; — políčko v logu, ktoré hovorí „prišiel som z tejto stránky&quot;. Keď mapa povie, že na X sa dá iba z A, tak medzikroky musia viesť späť cez A.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Munk (prednáška 8):&lt;/b&gt; doplnenie ciest je posledný krok &lt;i&gt;prípravy dát&lt;/i&gt; v CRISP-DM. Predchádza mu identifikácia sedení — bez správneho rozdelenia sedení by sme „doplňovali&quot; cestu medzi dvoma rôznymi návštevami toho istého človeka.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Štyri metódy, tá istá úloha:&lt;/b&gt; všetky vracajú podobný počet doplnených záznamov (reálne: STT_Mean 855, STT_Q 735, RLength 776, h-ref 706), líšia sa v odhade kde končí jedno sedenie. Porovnanie ukáže, ktorá metóda lepšie zodpovedá realite webu.&lt;/li&gt;
&lt;/ul&gt;&lt;/div&gt;

&lt;div class="thbox thnabif"&gt;&lt;h4&gt;Nabif (vzorce, čísla, idiómy)&lt;/h4&gt;&lt;ul&gt;
&lt;li&gt;&lt;b&gt;STT&lt;/b&gt; = Session Timeout Threshold (časový limit medzi dvoma klikmi v rámci jedného sedenia).&lt;/li&gt;
&lt;li&gt;&lt;b&gt;STT_Q vzorec:&lt;/b&gt; &lt;code&gt;τ = Q3 + 1.5 · IQR&lt;/code&gt; — to isté pravidlo, ktoré sa používa na detekciu outlierov v boxplote.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;RLength vzorec:&lt;/b&gt; &lt;code&gt;τ = −(1/λ) · ln(1 − q)&lt;/code&gt;, kde &lt;code&gt;λ = 1/priemer&lt;/code&gt; a &lt;code&gt;q&lt;/code&gt; je podiel navigačných stránok. Vychádza z exponenciálneho rozdelenia času medzi klikmi.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Doplnenie ciest = rovnaký algoritmus pre všetky 4 metódy:&lt;/b&gt; pre každú dvojicu susedných klikov v sedení skontroluj &lt;code&gt;url_from ∉ mapa ∧ url_to ∈ mapa&lt;/code&gt; → vlož &lt;code&gt;parent[url_to]&lt;/code&gt;. Rozdiel medzi 4 metódami je &lt;b&gt;iba INPUT&lt;/b&gt; (rôzne sedenia z STT_MEAN / STT_Q / RLength / h-ref), nie samotný algoritmus.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Vstup → výstup:&lt;/b&gt; sedenia (téma 3) → log so vsunutými „pseudo-záznamami&quot; navštívení cez &lt;b&gt;Späť&lt;/b&gt;, označenými ako doplnené (príznak v stĺpci).&lt;/li&gt;
&lt;/ul&gt;&lt;/div&gt;`,
  },
  5: {
    '01': `&lt;h2&gt;Krok 01 — Popisné štatistiky&lt;/h2&gt;
&lt;p class="thintro"&gt;Toto je &lt;b&gt;prvý pohľad na dáta&lt;/b&gt; po ich vyčistení. Skôr než budeme niečo modelovať, chceme vedieť: &lt;i&gt;koľko&lt;/i&gt; toho máme, &lt;i&gt;čo&lt;/i&gt; v tom je a &lt;i&gt;ako sa to rozkladá&lt;/i&gt;. Bez tohto prehľadu by sme išli „naslepo“.&lt;/p&gt;

&lt;h3&gt;Ako sme to robili v projekte&lt;/h3&gt;
&lt;p&gt;Vstupom je &lt;code&gt;logs5.csv&lt;/code&gt; — &lt;b&gt;bankový log&lt;/b&gt; (UniCredit Bank Slovakia, obdobie 2009–2012, &lt;b&gt;~2 071 235 raw záznamov&lt;/b&gt;). Po filtri &lt;code&gt;length &amp;gt; 0&lt;/code&gt; ostáva &lt;b&gt;~748 496&lt;/b&gt; zmysluplných záznamov pre analýzu. Pozor: NIE je to cv1-cv3 anti-bot log (~31,5k) — to je iný dataset. Postup:&lt;/p&gt;
&lt;ol&gt;
  &lt;li&gt;Načítam CSV cez pandas (&lt;code&gt;read_csv&lt;/code&gt; s &lt;code&gt;sep=";"&lt;/code&gt;).&lt;/li&gt;
  &lt;li&gt;Pre každú &lt;b&gt;kategorickú&lt;/b&gt; premennú (category, year, crisis, internal) spočítam &lt;code&gt;value_counts()&lt;/code&gt; — frekvenčnú tabuľku.&lt;/li&gt;
  &lt;li&gt;Pre &lt;b&gt;číselnú&lt;/b&gt; premennú &lt;code&gt;length&lt;/code&gt; (čas na stránke) spustím &lt;code&gt;describe()&lt;/code&gt; — počet, priemer, medián, kvartily, min/max.&lt;/li&gt;
  &lt;li&gt;Spočítam unikátnych používateľov (&lt;code&gt;anonIP.nunique()&lt;/code&gt;) a sedení (&lt;code&gt;frame.nunique()&lt;/code&gt;).&lt;/li&gt;
  &lt;li&gt;Vykreslím 4 grafy do jedného PNG (kategórie, roky, kvartály, histogram času).&lt;/li&gt;
&lt;/ol&gt;
&lt;pre&gt;&lt;code&gt;cat_counts = df["category"].value_counts()
length_clean = df[df["length"] &amp;gt; 0]["length"]
print(length_clean.describe())
n_users = df["anonIP"].nunique()
n_sessions = df["frame"].nunique()&lt;/code&gt;&lt;/pre&gt;

&lt;h3&gt;Vizuálne&lt;/h3&gt;
&lt;table class="thtable"&gt;
  &lt;tr&gt;&lt;th&gt;Typ premennej&lt;/th&gt;&lt;th&gt;Príklad&lt;/th&gt;&lt;th&gt;Metóda&lt;/th&gt;&lt;th&gt;Výstup&lt;/th&gt;&lt;/tr&gt;
  &lt;tr&gt;&lt;td&gt;Kategorická (DV — čo)&lt;/td&gt;&lt;td&gt;category, webPart&lt;/td&gt;&lt;td&gt;&lt;code&gt;value_counts&lt;/code&gt;&lt;/td&gt;&lt;td&gt;tabuľka + barh graf&lt;/td&gt;&lt;/tr&gt;
  &lt;tr&gt;&lt;td&gt;Kategorická (IV — kedy)&lt;/td&gt;&lt;td&gt;year, quartal, crisis&lt;/td&gt;&lt;td&gt;&lt;code&gt;value_counts&lt;/code&gt;&lt;/td&gt;&lt;td&gt;stĺpcový graf&lt;/td&gt;&lt;/tr&gt;
  &lt;tr&gt;&lt;td&gt;Číselná&lt;/td&gt;&lt;td&gt;length (sekundy)&lt;/td&gt;&lt;td&gt;&lt;code&gt;describe&lt;/code&gt;&lt;/td&gt;&lt;td&gt;5 čísel + histogram&lt;/td&gt;&lt;/tr&gt;
  &lt;tr&gt;&lt;td&gt;Identifikátor&lt;/td&gt;&lt;td&gt;anonIP, frame&lt;/td&gt;&lt;td&gt;&lt;code&gt;nunique&lt;/code&gt;&lt;/td&gt;&lt;td&gt;počet unikátov&lt;/td&gt;&lt;/tr&gt;
&lt;/table&gt;

&lt;div class="thbox thpochop"&gt;&lt;h4&gt;Pochop (princíp, prečo)&lt;/h4&gt;
&lt;ul&gt;
  &lt;li&gt;&lt;b&gt;Munk, prednáška 9 (CRISP-DM)&lt;/b&gt;: pre úlohu typu &lt;i&gt;Deskripcia dát a sumarizácia&lt;/i&gt; sú odporúčané tri metódy — &lt;b&gt;popisná štatistika, vizualizácia dát a OLAP analýza&lt;/b&gt;. Tento krok robí prvé dve.&lt;/li&gt;
  &lt;li&gt;&lt;b&gt;Frekvenčná tabuľka&lt;/b&gt; = pre každú hodnotu zrátaj koľkokrát sa vyskytla. Hneď vidno, či je dataset &lt;i&gt;rovnomerný&lt;/i&gt;, alebo &lt;i&gt;dominovaný&lt;/i&gt; pár hodnotami (napr. jedna kategória berie 60 %).&lt;/li&gt;
  &lt;li&gt;&lt;b&gt;Premenné delíme na DV/IV&lt;/b&gt;: DV = &lt;i&gt;čo&lt;/i&gt; sa pozeralo (obsah), IV = &lt;i&gt;kedy/za akých podmienok&lt;/i&gt; (čas, kríza). Toto delenie pripravuje pôdu pre neskoršie analýzy závislostí.&lt;/li&gt;
  &lt;li&gt;&lt;b&gt;Length filtrujeme &amp;gt; 0&lt;/b&gt;: Apache log nevie, kedy človek odišiel, takže čas na stránke odhadujeme z rozdielu dvoch po sebe idúcich klikov toho istého návštevníka. Posledný klik v návšteve nemá „ďalší“ — preto je length neznámy a vyhadzujeme ho.&lt;/li&gt;
&lt;/ul&gt;&lt;/div&gt;

&lt;div class="thbox thnabif"&gt;&lt;h4&gt;Nabif (vzorce, čísla, idiómy)&lt;/h4&gt;
&lt;ul&gt;
  &lt;li&gt;&lt;b&gt;describe() vracia 8 čísel&lt;/b&gt;: count, mean (priemer), std (smerodajná odchýlka), min, 25 % (Q1), 50 % (medián), 75 % (Q3), max.&lt;/li&gt;
  &lt;li&gt;&lt;b&gt;Medián vs priemer&lt;/b&gt;: ak sa výrazne líšia, rozdelenie je &lt;i&gt;zošikmené&lt;/i&gt; (napr. pár ľudí čítalo článok 30 min, väčšina 20 s → priemer ťahaný hore).&lt;/li&gt;
  &lt;li&gt;&lt;b&gt;Pomer sedenia/používateľ&lt;/b&gt; = &lt;code&gt;n_sessions / n_users&lt;/code&gt; — hovorí, ako často sa ľudia vracajú (1.0 = každý raz, &amp;gt;2 = vracajú sa).&lt;/li&gt;
  &lt;li&gt;&lt;b&gt;anonIP je aproximácia používateľa&lt;/b&gt; — za jednou IP môže byť celá firma (NAT). Presnejšie sa to rieši kombináciou IP+Agent (cv3).&lt;/li&gt;
  &lt;li&gt;&lt;b&gt;Idiómy pandas&lt;/b&gt;: &lt;code&gt;value_counts()&lt;/code&gt; pre kategórie, &lt;code&gt;describe()&lt;/code&gt; pre čísla, &lt;code&gt;nunique()&lt;/code&gt; pre počet unikátnych hodnôt, &lt;code&gt;sort_index()&lt;/code&gt; pre chronologické zoradenie rokov/kvartálov.&lt;/li&gt;
&lt;/ul&gt;&lt;/div&gt;`,
    '02': `&lt;h2&gt;Krok 02 — Navštevnosť v čase&lt;/h2&gt;
&lt;p class="thintro"&gt;Pozeráme sa, ako sa počas rokov &lt;b&gt;2009-2012&lt;/b&gt; menil počet návštev bankových stránok. Porovnávame obdobie krízy vs. po kríze a sledujeme, ktoré kategórie obsahu (účty, úvery, hypotéky) ľudia kedy navštevovali.&lt;/p&gt;

&lt;h3&gt;Ako sme to robili v projekte&lt;/h3&gt;
&lt;p&gt;Z vyčisteného logu &lt;code&gt;logs5.csv&lt;/code&gt; (z cvika 1) si stĺpec &lt;code&gt;time&lt;/code&gt; ako "28.05.2010 14:23:01" prerobíme na skutočný dátum. Potom z dátumu vytiahneme len &lt;b&gt;mesiac+rok&lt;/b&gt; a všetky kliky v rovnakom mesiaci spočítame dohromady. Tak isto rozdelíme dáta podľa stĺpca &lt;code&gt;crisis&lt;/code&gt; (1 = počas krízy, 0 = po krízi, hranica ~koniec 2010) a porovnáme priemery. Nakoniec krížovou tabuľkou &lt;i&gt;kvartál × kategória&lt;/i&gt; zistíme, ktorý obsah žil kedy.&lt;/p&gt;
&lt;pre&gt;&lt;code&gt;df["mesiac"] = df["datum"].dt.to_period("M")
mesacne = df.groupby("mesiac").size()
kat_v_case = df.groupby(["yearQuartal","category"]).size().unstack(fill_value=0)&lt;/code&gt;&lt;/pre&gt;

&lt;h3&gt;Vizuálne&lt;/h3&gt;
&lt;table class="thtable"&gt;
&lt;tr&gt;&lt;th&gt;Vstup&lt;/th&gt;&lt;th&gt;Operácia&lt;/th&gt;&lt;th&gt;Výstup&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;text "28.05.2010 14:23"&lt;/td&gt;&lt;td&gt;to_datetime&lt;/td&gt;&lt;td&gt;dátum 2010-05-28&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;dátum&lt;/td&gt;&lt;td&gt;to_period("M")&lt;/td&gt;&lt;td&gt;mesiac 2010-05&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;mesiace&lt;/td&gt;&lt;td&gt;groupby + size&lt;/td&gt;&lt;td&gt;rad: 2009-01→1234, 2009-02→1500…&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;crisis=1 / crisis=0&lt;/td&gt;&lt;td&gt;split + mean&lt;/td&gt;&lt;td&gt;priemer/mesiac za každé obdobie&lt;/td&gt;&lt;/tr&gt;
&lt;/table&gt;

&lt;div class="thbox thpochop"&gt;&lt;h4&gt;Pochop (princíp, prečo)&lt;/h4&gt;&lt;ul&gt;
&lt;li&gt;&lt;b&gt;Jeden riadok = jeden klik.&lt;/b&gt; Keď ich spočítame v rovnakom časovom okne (mesiac, kvartál), dostaneme jednoduchý ukazovateľ "koľko ľudí to vtedy používalo".&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Časová agregácia = zoom-out.&lt;/b&gt; Z miliónov jednotlivých klikov spravíme pár desiatok bodov, ktoré sa už dajú nakresliť do grafu a očami pochopiť.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Porovnanie kríza vs. po kríze&lt;/b&gt; ukazuje, či sa správanie zákazníkov zmenilo — či po kríze chodili na stránku viac, či menej (rozdiel v %).&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Munk, prednáška 9:&lt;/b&gt; toto je úloha &lt;i&gt;„Deskripcia dát a sumarizácia"&lt;/i&gt; vo fáze Modelovania (CRISP-DM) — odporúčané metódy sú &lt;i&gt;popisná štatistika a vizualizácia dát&lt;/i&gt;, presne to tu robíme.&lt;/li&gt;
&lt;/ul&gt;&lt;/div&gt;

&lt;div class="thbox thnabif"&gt;&lt;h4&gt;Nabif (vzorce, čísla, idiómy)&lt;/h4&gt;&lt;ul&gt;
&lt;li&gt;&lt;code&gt;pd.to_datetime(s, format="%d.%m.%Y %H:%M:%S", errors="coerce")&lt;/code&gt; — &lt;code&gt;coerce&lt;/code&gt; pokazený riadok dá ako NaT, neshodí skript.&lt;/li&gt;
&lt;li&gt;&lt;code&gt;.dt.to_period("M")&lt;/code&gt; vyrobí mesiac, &lt;code&gt;"Q"&lt;/code&gt; kvartál.&lt;/li&gt;
&lt;li&gt;Zmena v %: &lt;code&gt;(po_krize.mean() / kriza.mean() - 1) * 100&lt;/code&gt; — kladné = nárast, záporné = pokles.&lt;/li&gt;
&lt;li&gt;&lt;code&gt;groupby([A,B]).size().unstack(fill_value=0)&lt;/code&gt; = pivot: A v riadkoch, B v stĺpcoch, počty v bunkách; &lt;code&gt;fill_value=0&lt;/code&gt; zabráni dieram v grafe.&lt;/li&gt;
&lt;li&gt;V grafe: &lt;code&gt;axvline(pd.Period("2010-12"))&lt;/code&gt; nakreslí zvislú čiaru kde sa skončila kríza.&lt;/li&gt;
&lt;/ul&gt;&lt;/div&gt;`,
    '03': `&lt;h2&gt;Krok 03 — Čas na stránkach&lt;/h2&gt;
&lt;p class="thintro"&gt;Zisťujeme, &lt;b&gt;ktorá kategória obsahu&lt;/b&gt; na webe banky drží návštevníka najdlhšie a či sa to &lt;b&gt;menilo v čase&lt;/b&gt; (kvartály, kríza vs. po kríze).&lt;/p&gt;

&lt;h3&gt;Ako sme to robili v projekte&lt;/h3&gt;
&lt;p&gt;Najprv sme z logu &lt;b&gt;vyhodili nevalidné časy&lt;/b&gt; — hodnoty &lt;code&gt;-1&lt;/code&gt; (user už nič nestlačil, nevieme kedy odišiel), &lt;code&gt;-2&lt;/code&gt; (zmenila sa mu IP) a &lt;code&gt;0&lt;/code&gt; (robot). Potom sme cez &lt;code&gt;groupby("category")&lt;/code&gt; spočítali pre každú kategóriu &lt;b&gt;priemer, medián, smerodajnú odchýlku a počet&lt;/b&gt;. Cez &lt;code&gt;pivot_table&lt;/code&gt; sme spravili 2D maticu &lt;i&gt;kategória × kvartál&lt;/i&gt; a porovnali sme čas počas krízy vs. po nej. Nakoniec sme to vizualizovali ako &lt;b&gt;heatmapu + boxplot&lt;/b&gt; vedľa seba.&lt;/p&gt;
&lt;pre&gt;&lt;code&gt;df = df[df["length"] &amp;gt; 0].copy()
po_kat = df.groupby("category")["length"]\
   .agg(["mean","median","std","count"]).round(2)
heatmap_data = df.pivot_table(
   index="category", columns="yearQuartal",
   values="length", aggfunc="mean")&lt;/code&gt;&lt;/pre&gt;

&lt;h3&gt;Vizuálne&lt;/h3&gt;
&lt;table class="thtable"&gt;
&lt;tr&gt;&lt;th&gt;length&lt;/th&gt;&lt;th&gt;Význam&lt;/th&gt;&lt;th&gt;Do analýzy?&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&amp;gt; 0&lt;/td&gt;&lt;td&gt;reálny čas čítania&lt;/td&gt;&lt;td&gt;ÁNO&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;-1&lt;/td&gt;&lt;td&gt;už nič nestlačil&lt;/td&gt;&lt;td&gt;nie&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;-2&lt;/td&gt;&lt;td&gt;zmena IP&lt;/td&gt;&lt;td&gt;nie&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;0&lt;/td&gt;&lt;td&gt;robot&lt;/td&gt;&lt;td&gt;nie&lt;/td&gt;&lt;/tr&gt;
&lt;/table&gt;
&lt;pre&gt;&lt;code&gt;kategória \ kvartál  09Q1  09Q2 ... 12Q4
úvery                 42    51        38
účty                  28    30        25
info                  15    14        12  &amp;larr; heatmap bunky&lt;/code&gt;&lt;/pre&gt;

&lt;div class="thbox thpochop"&gt;&lt;h4&gt;Pochop (princíp, prečo)&lt;/h4&gt;&lt;ul&gt;
&lt;li&gt;&lt;b&gt;Čas na stránke je odhad&lt;/b&gt; — nepozná ho server priamo, počíta sa ako rozdiel medzi dvomi po sebe idúcimi klikmi toho istého používateľa. Posledný klik teda nemá čas (preto &lt;code&gt;-1&lt;/code&gt;).&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Priemer vs. medián&lt;/b&gt;: ak jeden človek nechá záložku otvorenú 10 minút, priemer to vyhodí hore. &lt;i&gt;Medián&lt;/i&gt; (stredná hodnota) ukazuje &lt;b&gt;typického&lt;/b&gt; návštevníka — preto rátame oboje.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Heatmapa odhalí trend v čase&lt;/b&gt; — farebná škála (žltá→červená) ukazuje, či záujem o kategóriu rastie alebo klesá medzi kvartálmi. To, čo v stĺpci čísel prehliadneš, na farbe okamžite vidíš.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Prednáška 9 (Munk)&lt;/b&gt;: modelovacia fáza CRISP-DM má typ úlohy &lt;i&gt;Deskripcia dát a sumarizácia&lt;/i&gt; — odporúčané metódy sú &lt;b&gt;popisná štatistika, vizualizácia dát a OLAP analýza&lt;/b&gt;. Presne to tu robíme: priemer/medián + heatmap + pivot tabuľka cez kvartály.&lt;/li&gt;
&lt;/ul&gt;&lt;/div&gt;

&lt;div class="thbox thnabif"&gt;&lt;h4&gt;Nabif (vzorce, čísla, idiómy)&lt;/h4&gt;&lt;ul&gt;
&lt;li&gt;&lt;b&gt;Filter&lt;/b&gt;: &lt;code&gt;df[df["length"] &amp;gt; 0]&lt;/code&gt; — vyhadzuje -1, -2 aj 0 jedným ťahom.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Agregácia&lt;/b&gt;: &lt;code&gt;groupby(col).agg(["mean","median","std","count"])&lt;/code&gt; — štyri štatistiky naraz.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;2D matica&lt;/b&gt;: &lt;code&gt;pivot_table(index=kategória, columns=kvartál, values=length, aggfunc="mean")&lt;/code&gt; — riadky × stĺpce = priemer.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Boxplot ohraničujeme&lt;/b&gt; na &lt;code&gt;length &amp;lt; 100s&lt;/code&gt; — bez orezu by pár extrémov stlačilo krabičky na nulu.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Výstupy&lt;/b&gt;: &lt;code&gt;priemerny_cas_kategorie.csv&lt;/code&gt;, &lt;code&gt;heatmap_kategoria_kvartal.csv&lt;/code&gt;, &lt;code&gt;cas_na_strankach.png&lt;/code&gt;.&lt;/li&gt;
&lt;/ul&gt;&lt;/div&gt;`,
    '04': `&lt;h2&gt;Krok 04 — vztahy_premennych.py&lt;/h2&gt;
&lt;p class="thintro"&gt;Tu sa pýtame: &lt;b&gt;suvisia spolu dve premenne?&lt;/b&gt; Napríklad — čítajú ľudia počas krízy iné kategórie obsahu ako mimo nej? A ak áno, ako &lt;i&gt;silno&lt;/i&gt; to spolu súvisí?&lt;/p&gt;

&lt;h3&gt;Ako sme to robili v projekte&lt;/h3&gt;
&lt;p&gt;Načítame vyčistený dataset z cv1 (&lt;code&gt;logs5.csv&lt;/code&gt;, cca 2 mil. riadkov) a spustíme &lt;b&gt;4 testy&lt;/b&gt;. Pre dvojice kategórií (napr. kategória vs. kríza) použijeme &lt;b&gt;chi-kvadrát test&lt;/b&gt; a doplníme ho &lt;b&gt;Cramerovým V&lt;/b&gt;, ktoré nám povie silu vzťahu na škále 0–1. Pre dvojicu čas vs. kategória použijeme &lt;b&gt;ANOVA&lt;/b&gt; (porovnáva priemery medzi skupinami).&lt;/p&gt;
&lt;pre&gt;&lt;code&gt;tabulka = pd.crosstab(df[col1], df[col2])
chi2, p, dof, _ = chi2_contingency(tabulka)
cv = np.sqrt(chi2 / (n * (min(r,c) - 1)))  # Cramerovo V&lt;/code&gt;&lt;/pre&gt;

&lt;h3&gt;Vizuálne&lt;/h3&gt;
&lt;table class="thtable"&gt;
&lt;tr&gt;&lt;th&gt;Test&lt;/th&gt;&lt;th&gt;Otázka&lt;/th&gt;&lt;th&gt;Metóda&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;1&lt;/td&gt;&lt;td&gt;kategória vs. kríza&lt;/td&gt;&lt;td&gt;chi² + V&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;2&lt;/td&gt;&lt;td&gt;kategória vs. internal&lt;/td&gt;&lt;td&gt;chi² + V&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;3&lt;/td&gt;&lt;td&gt;čas vs. kategória&lt;/td&gt;&lt;td&gt;ANOVA (F-test)&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;4&lt;/td&gt;&lt;td&gt;kategória vs. rok&lt;/td&gt;&lt;td&gt;chi² + V&lt;/td&gt;&lt;/tr&gt;
&lt;/table&gt;
&lt;p&gt;&lt;b&gt;Škála Cramerovho V:&lt;/b&gt; &amp;lt;0.1 veľmi slabá · &amp;lt;0.3 slabá · &amp;lt;0.5 stredná · ≥0.5 silná.&lt;/p&gt;

&lt;div class="thbox thpochop"&gt;&lt;h4&gt;Pochop (princíp, prečo)&lt;/h4&gt;&lt;ul&gt;
&lt;li&gt;&lt;b&gt;Chi-kvadrát&lt;/b&gt; sa pýta: keby premenné spolu nesúviseli, koľko prípadov by sme v každej bunke tabuľky čakali? Ak sa realita líši, premenné súvisia.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Prečo Cramerovo V?&lt;/b&gt; Samotné chi² rastie s veľkosťou vzorky — pri 2 mil. riadkov vyjde obrovské aj pri slabučkom vzťahu. V ho znormuje na rozsah 0–1, aby sme videli &lt;i&gt;silu&lt;/i&gt;, nie len existenciu.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;ANOVA&lt;/b&gt; (analýza rozptylu) sa hodí, keď jedna premenná je číslo (čas v sek.) a druhá kategória — porovná priemery medzi skupinami a zistí, či sa aspoň jedna líši. &lt;b&gt;Predpoklady:&lt;/b&gt; (1) normalita length v každej kategórii, (2) rovnaké rozptyly medzi skupinami (homoscedasticity), (3) nezávislé pozorovania. Pri 2M riadkov a pravostranne šikmom length je (1) porušené — výsledok treba brať s rezervou (zvážiť Kruskal-Wallis ako neparametrickú alternatívu).&lt;/li&gt;
&lt;li&gt;Munk v prednáške 10 spomína &lt;b&gt;„Nezávislosť premenných — vzťahy medzi premennými“&lt;/b&gt; ako jeden z hlavných cieľov fázy vyhodnotenia výsledkov v CRISP-DM.&lt;/li&gt;
&lt;/ul&gt;&lt;/div&gt;

&lt;div class="thbox thnabif"&gt;&lt;h4&gt;Nabif (vzorce, čísla, idiómy)&lt;/h4&gt;&lt;ul&gt;
&lt;li&gt;&lt;b&gt;Chi-kvadrát vzorec:&lt;/b&gt; &lt;code&gt;χ² = Σ (O − E)² / E&lt;/code&gt;, kde &lt;b&gt;O&lt;/b&gt; = pozorovaná frekvencia v bunke kontingenčnej tabuľky a &lt;b&gt;E&lt;/b&gt; = očakávaná pri nezávislosti = &lt;code&gt;(row_sum × col_sum) / total&lt;/code&gt;. Čím väčšie χ², tým viac sa realita odchyľuje od nezávislosti.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Stupne voľnosti:&lt;/b&gt; štatistika χ² má rozdelenie chi-square s &lt;code&gt;df = (r−1)·(c−1)&lt;/code&gt;, kde r a c sú rozmery kontingenčnej tabuľky. Z dvojice (χ², df) odčítame p-hodnotu (scipy to robí automaticky).&lt;/li&gt;
&lt;li&gt;&lt;b&gt;p &amp;lt; 0.05&lt;/b&gt; → premenné spolu &lt;b&gt;suvisia&lt;/b&gt; (zamietame nezávislosť).&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Cramerovo V = √(chi² / (n · (min(r,c) − 1)))&lt;/b&gt; — kde &lt;code&gt;n&lt;/code&gt; je počet riadkov a &lt;code&gt;r, c&lt;/code&gt; rozmery crosstab tabuľky.&lt;/li&gt;
&lt;li&gt;&lt;code&gt;pd.crosstab(a, b)&lt;/code&gt; vyrobí kontingenčnú tabuľku frekvencií; &lt;code&gt;scipy.stats.chi2_contingency&lt;/code&gt; ju otestuje.&lt;/li&gt;
&lt;li&gt;Pred ANOVA odfiltrujeme &lt;code&gt;length &amp;gt; 0&lt;/code&gt; — nuly znamenajú „posledný klik používateľa“ (čas sa nedal zmerať) a stiahli by priemery dole.&lt;/li&gt;
&lt;li&gt;&lt;code&gt;f_oneway(*skupiny)&lt;/code&gt; — hviezdička rozbalí list polí ako samostatné argumenty pre každú kategóriu.&lt;/li&gt;
&lt;/ul&gt;&lt;/div&gt;`,

&lt;pre&gt;&lt;code&gt;transakcie = df["category"].str.split(";").tolist()

    '04': `&lt;h2&gt;Krok 04 — Cochran &amp; Kendall test&lt;/h2&gt;

&lt;tr&gt;&lt;td&gt;A → B&lt;/td&gt;&lt;td&gt;1&lt;/td&gt;&lt;td&gt;1&lt;/td&gt;&lt;td&gt;1&lt;/td&gt;&lt;td&gt;1&lt;/td&gt;&lt;td&gt;4 (stabilne)&lt;/td&gt;&lt;/tr&gt;

&lt;div class="thbox thpochop"&gt;&lt;h4&gt;Pochop (princip, preco)&lt;/h4&gt;&lt;ul&gt;

function openTheory(themeNum, step){
  if(step === undefined){ step = themeNum; themeNum = 7; }
  const m = document.getElementById('theoryModal');
  if(!m) return;
  const body = m.querySelector('.modal-body');
  const theory = (typeof CVIKA_THEORIES !== 'undefined') ? CVIKA_THEORIES[themeNum] : null;
  let content = (theory && theory[step]) || '<p>Pre tento krok zatiaľ nemáme teóriu.</p>';
  content = content.replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>');
  body.innerHTML = content;
  body.scrollTop = 0;
  m.classList.add('open');
}
function closeTheory(){
  const m = document.getElementById('theoryModal');
  if(m) m.classList.remove('open');
}
document.addEventListener('keydown', function(e){
  if(e.key==='Escape'){
    const m = document.getElementById('theoryModal');
    if(m && m.classList.contains('open')){ closeTheory(); e.stopPropagation(); }
  }
}, true);

{num:1,label:`Zdroje dát`,name:`Zdroje dát (crawler + reprezentácia textu)`,reading:`<h2>Téma 1: Zdroje dát (crawler + reprezentácia textu)</h2>
<p class="lead">Téma rieši úplne prvý krok pipeline objavovania znalostí: <b>ako získať text z webu</b> a ako ho premeniť na <b>čísla</b>, aby s ním vedeli pracovať ďalšie algoritmy. Bez tohto kroku nemáme čo analyzovať.</p>

<h3>Úloha 01: crawler.py — sťahovanie článkov z webu</h3>
<p><strong>Čo robí:</strong> Stiahne 5 článkov z webu UKF FPVAI a uloží ich ako 5 textových súborov.</p>
<p><strong>Prečo:</strong> Surové dáta sú prvý krok. Bez nich nemá zmysel robiť žiadne ML. HTML stránka obsahuje veľa balastu (menu, reklamy, CSS, JS). My chceme iba čistý text.</p>
<p><strong>Ako:</strong></p>
<ol>
<li><code>requests.get(url)</code> pošle HTTP GET a vráti HTML ako string.</li>
<li><code>BeautifulSoup(html, "html.parser")</code> postaví DOM-strom. Cez <code>soup.get_text()</code> vyhodí všetky tagy a nechá len textové uzly.</li>
<li>List comprehension <code>[l.strip() for l in text.splitlines() if l.strip()]</code> oreže biele znaky a vyhodí prázdne riadky.</li>
</ol>
<p><strong>Kde to nájdeš:</strong> <code>01_zdroje_dat/scripts/01_prehladavanie_webu/crawler.py</code></p>
<p><strong>Príklad:</strong> Vstup <code>https://fpvai.ukf.sk/.../1996-studenti-...</code> → výstup <code>out/articles/article_5.txt</code> obsahuje len text článku, bez HTML tagov.</p>
<p><strong>Číslo na zapamätanie:</strong> <b>5 článkov → 5 .txt súborov</b>. Encoding pri <code>open()</code> MUSÍ byť <code>utf-8</code>, lebo Windows default cp1250 by spadol na slovenskej diakritike.</p>
<p><strong>Prečo BeautifulSoup, nie regex:</strong> HTML nie je regulárny jazyk (vnorené tagy, komentáre). BeautifulSoup postaví strom, regex by sa zlomil pri prvej vnorenej značke.</p>

<h3>Úloha 02: vahove_schemy_tf_idf.py — vektorová reprezentácia textu</h3>
<p><strong>Čo robí:</strong> Z hotovej DTM matice frekvencií slov vyrobí 4 odvodené reprezentácie (binary, log, idf, tf-idf) a uloží ich do hárkov v jednom Excel súbore.</p>
<p><strong>Prečo:</strong> Algoritmy ML nevedia narábať s textom — potrebujú čísla. DTM (Document-Term Matrix) je tabuľka, kde riadok = dokument, stĺpec = slovo, bunka = počet výskytov. Raw frekvencia ale nie je ideálna: slovo "the" sa vyskytne 100×, ale nenesie informáciu. Preto sa zavádzajú váhové schémy.</p>
<p><strong>Ako (4 schémy):</strong></p>
<pre><code>binary  = 1 ak tf > 0, inak 0
log-tf  = 1 + log10(tf) ak tf > 0, inak 0
idf_t   = log10(N / df_t)
tf-idf  = log-tf × idf</code></pre>
<p>kde <b>tf</b> = počet výskytov slova v dokumente, <b>df_t</b> = v koľkých dokumentoch sa slovo vyskytuje, <b>N</b> = celkový počet dokumentov.</p>
<p><strong>Kde to nájdeš:</strong> <code>01_zdroje_dat/scripts/02_reprezentacia_textu_I/vahove_schemy_tf_idf.py</code></p>
<p><strong>Príklad:</strong> Slovo "the" je v každom dokumente → df=N → idf = log10(N/N) = 0 → vo tf-idf má váhu 0 (potlačené). Slovo "kvantová" je len v 1 dokumente → df=1 → idf = log10(N) = max → vo tf-idf má najvyššiu váhu (dobrý diskriminátor).</p>
<p><strong>Číslo na zapamätanie:</strong> <b>idf = log10(N/df_t)</b>. Konštanta <b>+1</b> v log-tf zabezpečí, že slovo s tf=1 má váhu 1 (nie 0). Numpy trik <code>np.log10(wf, where=wf>0, out=zeros)</code> obíde <code>log10(0) = -inf</code>.</p>

<h3>Úloha 03: lematizacia_textov.py — lematizácia anglických textov</h3>
<p><strong>Čo robí:</strong> Z 5 anglických .txt súborov pomocou knižnice <b>nltk</b> a <b>WordNetLemmatizer</b> vyrobí term-document maticu lem a z nej odvodí 4 reprezentácie (rovnaké schémy ako v úlohe 02).</p>
<p><strong>Prečo:</strong> Bez lematizácie by sme mali stĺpce "run", "running", "ran" ako tri rôzne slová. Lematizácia ich zlúči na základný tvar "run". Tým redukujeme rozmer matice a získame skutočne použiteľný príznak.</p>
<p><strong>Ako (NLP pipeline):</strong></p>
<ol>
<li><code>sent_tokenize(data)</code> rozdelí text na vety (Punkt model vie skratky ako "Dr.").</li>
<li><code>word_tokenize(sentence)</code> rozdelí vetu na slová (oddelí interpunkciu).</li>
<li><code>lemmatizer.lemmatize(word.lower())</code> vráti základný tvar.</li>
<li><code>wf.at[lemma, fname] += 1</code> inkrementuje počítadlo v matici.</li>
</ol>
<p><strong>Kde to nájdeš:</strong> <code>01_zdroje_dat/scripts/03_reprezentacia_textu_II/lematizacia_textov.py</code></p>
<p><strong>Príklad:</strong> Veta "Cats are running" → tokeny ["cats", "are", "running"] → lemy ["cat", "are", "running"]. Pozor: bez POS taggu sa "running" lematizuje ako podstatné meno (default 'n') a ostane "running" — to je vlastne <b>bug</b>, ktorý úloha 04 opraví POS-aware lematizáciou.</p>
<p><strong>Číslo na zapamätanie:</strong> Default POS pre WordNetLemmatizer je <b>'n' (noun)</b>. Lematizácia ≠ stemming: stemming oreže sufix ("running"→"runn"), lematizácia hľadá skutočný tvar v slovníku ("running"→"run").</p>

<h3>Úloha 04: pos_tagging_a_lematizacia.py — morfologická anotácia</h3>
<p><strong>Čo robí:</strong> Pridáva k textu jazykovú vrstvu — každé slovo dostane slovný druh (POS tag), základný tvar a poradie vo vete. Výstup je tabuľka so 7 stĺpcami.</p>
<p><strong>Prečo:</strong> Predchádzajúce úlohy považovali slovo za "token". Tu pridávame gramatický kontext. POS tag rozlíši "lead" ako podstatné meno (kov) vs sloveso (viesť). To umožní napríklad filtrovať len podstatné mená (extrakcia kľúčových slov) alebo robiť POS-aware lematizáciu.</p>
<p><strong>Ako (7-krokový algoritmus):</strong></p>
<ol>
<li><code>sent_tokenize</code> → vety.</li>
<li><code>word_tokenize</code> → slová vrátane interpunkcie.</li>
<li><code>nltk.pos_tag(words)</code> → priradí Penn Treebank tag (NN, VBG, JJ, ...).</li>
<li>Filter interpunkcie: <code>all(c in string.punctuation for c in word)</code>.</li>
<li>Filter stop slov: <code>word.lower() in stop_words</code>.</li>
<li>POS-aware lematizácia: <code>lemmatize(word.lower(), pos=get_wordnet_pos(tag))</code>.</li>
<li>Zápis riadku do tabuľky.</li>
</ol>
<p><strong>Kde to nájdeš:</strong> <code>01_zdroje_dat/scripts/04_reprezentacia_textu_III/pos_tagging_a_lematizacia.py</code></p>
<p><strong>Príklad:</strong> Veta "The cats are using better tools" → po POS taggingu [("The","DT"), ("cats","NNS"), ("are","VBP"), ("using","VBG"), ("better","JJR"), ("tools","NNS")]. Po filtre stop slov a POS-aware lematizácii: cats→cat, using→use, better→good, tools→tool.</p>
<p><strong>Prečo POS tagging PRED filtrovaním:</strong> Tagger potrebuje celú vetu — stop slová a interpunkcia dávajú syntaktický kontext. Ak ich odstránime skôr, tagger urobí horšie rozhodnutia.</p>
<p><strong>Číslo na zapamätanie:</strong> Penn Treebank obsahuje cca 36 POS tagov; WordNet len 4 ('n', 'v', 'a', 'r'). Funkcia <code>get_wordnet_pos</code> v úlohe 04 mapuje prefix (V→v, J→a, R→r, inak n). Výstup obsahuje <b>1990 záznamov</b> (reálny beh) cez všetkých 5 vstupných súborov.</p>

<h3>Úloha 01: parsovanie_a_cistenie.py</h3>
<p><strong>Čo robí:</strong> Z textového Apache logu vyrobí tabuľku (DataFrame) a vyhodí nepotrebné riadky.</p>
<p><strong>Prečo:</strong> Bez tohto kroku máme len text, s ktorým sa nedá nič počítať. A ~80 % riadkov je smetie (obrázky, CSS, JS, neúspešné requesty).</p>
<p><strong>Ako:</strong></p>
<ol>
  <li>Skompiluje regex podľa formátu Apache Combined Log.</li>
  <li>Riadok po riadku rozparsuje IP, DateTime, Method, URL, Status, Referrer, Agent.</li>
  <li>Ponechá len <code>GET</code>, status 200–399 a vyhodí URL s príponami <code>.css .js .png .jpg .woff ...</code></li>
</ol>
<p><strong>Kde to nájdeš:</strong> <code>02_cistenie_dat/scripts/01_cistenie_dat_I/parsovanie_a_cistenie.py</code></p>
<p><strong>Príklad riadku:</strong></p>
<pre><code>193.87.12.30 - - [19/Feb/2020:06:25:50 +0100] "GET / HTTP/1.1" 200 20925 "-" "Mozilla/5.0"</code></pre>
<p>Premení sa na riadok tabuľky so stĺpcami IP, DateTime, RequestMethod=GET, URL=/, StatusCode=200, Referrer="-", Agent="Mozilla/5.0".</p>
<p><strong>Číslo na zapamätanie:</strong> ~257 000 riadkov vstup → ~57 650 výstup (zadanie hovorí "približne 56 500").</p>

<h3>Úloha 02: dalsie_cistenie.py</h3>
<p><strong>Čo robí:</strong> Druhé kolo čistenia nad výstupom Úlohy 01 — vyhodí botov, duplikáty a interné URL.</p>
<p><strong>Prečo:</strong> Po Úlohe 01 ešte stále zostali roboti (Googlebot), duplicitné kliknutia (F5 refresh) a Joomla interné cesty, ktoré nie sú obsahové stránky.</p>
<p><strong>Ako:</strong></p>
<ol>
  <li>Vyhodí riadky, kde User-Agent obsahuje <code>bot|crawl|spider|slurp|curl|wget|...</code></li>
  <li>Vyhodí prístupy na <code>robots.txt</code>, <code>/component/</code>, <code>format=feed</code>, <code>.pdf</code>, obrázky.</li>
  <li>Vyhodí duplikáty podľa trojice <code>(IP, DateTime, URL)</code>.</li>
  <li>Ponechá len status 2xx (úspešné zobrazenie stránky).</li>
</ol>
<p><strong>Kde to nájdeš:</strong> <code>02_cistenie_dat/scripts/02_cistenie_dat_II/dalsie_cistenie.py</code></p>
<p><strong>Príklad:</strong> Riadok s Agent="Mozilla/5.0 (compatible; Googlebot/2.1)" sa zmaže, lebo obsahuje "bot". Riadok s Agent="Mozilla/5.0 Firefox" zostane.</p>
<p><strong>Číslo na zapamätanie:</strong> ~57 650 → ~31 980 záznamov.</p>

<h3>Úloha 03: identifikacia_robot_ip.py</h3>
<p><strong>Čo robí:</strong> Zo <strong>surového</strong> logu vytiahne IP všetkých klientov, ktorí si stiahli súbor <code>robots.txt</code>.</p>
<p><strong>Prečo:</strong> <code>robots.txt</code> je inštrukčný súbor pre crawlerov (Robots Exclusion Protocol). Človek v prehliadači naň nemá odkaz — nikdy ho sám nestiahne. Kto si ho stiahol, je robot.</p>
<p><strong>Ako:</strong></p>
<ol>
  <li>Rovnaký regex na parsovanie ako v Úlohe 01.</li>
  <li>Pre každý riadok skontroluje <code>"robots.txt" in url.lower()</code>.</li>
  <li>Ak áno, uloží IP do zoznamu (duplicity ponechá).</li>
</ol>
<p><strong>Kde to nájdeš:</strong> <code>02_cistenie_dat/scripts/03_cistenie_dat_III_roboti/identifikacia_robot_ip.py</code></p>
<p><strong>Príklad:</strong> IP <code>66.249.66.1</code> (Googlebot) si stiahla <code>/robots.txt</code> 5-krát počas dňa — v zozname bude 5-krát. Výstup CSV má 1 stĺpec <code>IP</code>.</p>
<p><strong>Číslo na zapamätanie:</strong> presne <strong>334 záznamov</strong> (~108 unikátnych IP).</p>

<h3>Úloha 04: filtrovanie_robotov.py</h3>
<p><strong>Čo robí:</strong> Z výstupu Úlohy 01 odstráni 4 typy robotov naraz — kombinuje detekciu cez User-Agent aj cez zoznam IP z Úlohy 03.</p>
<p><strong>Prečo:</strong> User-Agent sa dá ľahko sfalšovať (je to obyčajný textový hlavičkový reťazec). IP zo zoznamu pristupujúcich k <code>robots.txt</code> je tvrdší dôkaz. Kombinácia oboch je robustnejšia.</p>
<p><strong>Ako (4 postupné filtre):</strong></p>
<ol>
  <li>Vyhodí riadky, kde Agent obsahuje <code>bot|crawl|spider</code>.</li>
  <li>Vyhodí Agent obsahujúci <code>cron|curl|wget|libwww|ltx71</code> (automaty).</li>
  <li>Vyhodí Agent presne <code>"-"</code> (Apache zápis pre chýbajúci UA).</li>
  <li>Vyhodí riadky, kde IP je v zozname robotov z Úlohy 03 (<code>.isin()</code>).</li>
</ol>
<p><strong>Kde to nájdeš:</strong> <code>02_cistenie_dat/scripts/04_cistenie_dat_IV_roboti/filtrovanie_robotov.py</code></p>
<p><strong>Príklad:</strong> Riadok s Agent="bingbot/2.0" padne v kroku 1. Riadok s Agent="Mozilla/5.0", ale IP=66.249.66.1 padne v kroku 4 (lebo táto IP je v zozname).</p>
<p><strong>Číslo na zapamätanie:</strong> ~57 650 → <strong>~20 666 riadkov</strong> (finálny vstup pre cv2).</p>

<p class="lead">Apache log obsahuje surové prístupy — kto, kedy, kam. Z týchto prístupov potrebujeme zrekonštruovať <strong>kto je kto</strong> (USER_ID) a <strong>kedy začalo a skončilo jedno „posedenie pri počítači"</strong> (SESSION_ID). Bez toho sa nedá ďalej analyzovať správanie používateľa.</p>

<h3>Úloha 01: unixtime.py</h3>
<p><strong>Čo robí:</strong> Premieňa textový dátum "19/Feb/2020:06:25:49 +0100" na jedno číslo — sekundy od 1.1.1970.</p>
<p><strong>Prečo:</strong> Rozdiel dvoch UNIX timestampov = počet sekúnd medzi nimi. Žiadne parsovanie kalendára, žiadne časové zóny. Toto číslo potrebujeme pre Length aj sedenia.</p>
<p><strong>Ako:</strong> Pre každý riadok rozdelíme dátum cez <code>split(':')</code>, mesiac "Feb" preložíme cez natvrdo napísaný slovník na číslo 2, potom zavoláme <code>datetime.datetime(rok, mesiac, deň, h, m, s).timestamp()</code>.</p>
<p><strong>Kde to nájdeš:</strong> <code>03_identifikacia/scripts/01_UNIXTIME/unixtime.py</code></p>
<p><strong>Príklad:</strong> "19/Feb/2020:06:25:49 +0100" → <code>1582089949.0</code></p>
<p><strong>Číslo na zapamätanie:</strong> Po UNIX konverzii máme 20 666 záznamov (rovnako ako po čistení cv1).</p>

<h3>Úloha 02: identifikacia_userov.py</h3>
<p><strong>Čo robí:</strong> Priraďuje každému unikátnemu páru (IP, User-Agent) sekvenčné USER_ID.</p>
<p><strong>Prečo:</strong> Apache log nemá cookies ani login — jediný spôsob ako rozlíšiť ľudí je predpoklad "rovnaká IP + rovnaký prehliadač = ten istý človek".</p>
<p><strong>Ako:</strong> Zoradíme log podľa (IP, Agent, UNIXTIME), aby všetky záznamy jedného usera boli v súvislom bloku. Potom <code>groupby(['IP','Agent']).ngroup() + 1</code> priradí každej skupine integer 1, 2, 3...</p>
<p><strong>Kde to nájdeš:</strong> <code>03_identifikacia/scripts/02_identifikacia_pouzivatelov/identifikacia_userov.py</code></p>
<p><strong>Príklad:</strong> (178.41.1.187, Firefox) → USER_ID=42 pre všetky riadky s touto dvojicou.</p>
<p><strong>Číslo na zapamätanie:</strong> Identifikovaných <b>4096</b> používateľov (zadanie predpokladalo ~4040).</p>

<h3>Úloha 03: vypocet_length.py</h3>
<p><strong>Čo robí:</strong> Pre každého usera počíta čas medzi po sebe idúcimi prístupmi.</p>
<p><strong>Prečo:</strong> Length aproximuje "ako dlho user pozeral predchádzajúcu stránku". Server zaznamenáva len príchod, nie odchod — predpokladáme, že kliknutie na ďalší link ukončilo čítanie.</p>
<p><strong>Ako:</strong> <code>df.groupby('USER_ID')['UNIXTIME'].shift(1)</code> posunie čas o jeden riadok dole v rámci usera. Rozdiel = Length. Ak je Length ≥ 3600 s (hodina), nahradíme ho None — user pravdepodobne odišiel.</p>
<p><strong>Kde to nájdeš:</strong> <code>03_identifikacia/scripts/03_premenna_Length/vypocet_length.py</code></p>
<p><strong>Príklad:</strong> User klikol o 06:25:49, potom o 06:28:30 — Length = 161 s.</p>
<p><strong>Číslo na zapamätanie:</strong> Priemerná Length 147.2 s, ale medián len 5 s (ťažký pravý chvost). Prvý prístup každého usera má Length = NaN.</p>

<h3>Úloha 04: stt_mean.py (Session Time Threshold — priemer)</h3>
<p><strong>Čo robí:</strong> Rozdeľuje záznamy na sedenia pomocou prahu = priemer všetkých Length.</p>
<p><strong>Prečo:</strong> Ak user na stránke strávil viac ako priemer, pravdepodobne pauzoval — to je koniec sedenia.</p>
<p><strong>Ako:</strong> Označíme každý záznam, kde <code>Length is NaN OR Length >= mean</code>, ako začiatok nového sedenia. Boolean masku cumsum-neme — True sa kastuje na 1, výsledok je rastúce SESSION_ID.</p>
<p><strong>Kde to nájdeš:</strong> <code>03_identifikacia/scripts/04_STT_MEAN/stt_mean.py</code></p>
<p><strong>Príklad:</strong> Length = [NaN, 50, 80, 300, 40] a priemer = 100 → NEW_SESSION = [T, F, F, T, F] → SESSION_ID = [1, 1, 1, 2, 2].</p>
<p><strong>Číslo na zapamätanie:</strong> Reálne <b>7097</b> sedení (zadanie ~7500).</p>

<h3>Úloha 05: stt_q.py (Session Time Threshold — kvartily)</h3>
<p><strong>Čo robí:</strong> Rozdeľuje sedenia pomocou robustnejšieho prahu z kvartilov.</p>
<p><strong>Prečo:</strong> Priemer je citlivý na extrémne dlhé pauzy (1 hodinová pauza potiahne priemer celého datasetu). Kvartily ignorujú okrajové hodnoty — vhodnejšie pre Length s ťažkým pravým chvostom.</p>
<p><strong>Ako:</strong> Vzorec podľa Tukeyho pravidla:</p>
<pre><code>STT_Q = Q3 + 1.5 * IQR
IQR   = Q3 - Q1</code></pre>
<p>Q1 je 25. percentil, Q3 je 75. percentil. Zvyšok algoritmu je rovnaký ako pri STT_MEAN (cumsum trik).</p>
<p><strong>Kde to nájdeš:</strong> <code>03_identifikacia/scripts/05_STT_Q/stt_q.py</code></p>
<p><strong>Číslo na zapamätanie:</strong> Reálne <b>7873</b> sedení (zadanie ~7500), prah je vyšší a robustnejší (Q3+1.5·IQR).</p>

<h3>Úloha 06: slength.py (Session Length — pevný limit 10 minút)</h3>
<p><strong>Čo robí:</strong> Sedenie nesmie celkovo trvať dlhšie ako 600 sekúnd (10 minút).</p>
<p><strong>Prečo:</strong> Iný typ heuristiky — STT_* sleduje čas <em>medzi</em> prístupmi, SLength sleduje <em>kumulatívnu</em> dĺžku sedenia.</p>
<p><strong>Ako:</strong> Cumsum tu nestačí (nevie sa resetovať), preto použijeme <code>iterrows()</code>. Pripočítavame Length do kumulatívu; keď kumulatív + Length ≥ 600, otvoríme nové sedenie a reset kumulatívu na Length tohto riadku.</p>
<p><strong>Kde to nájdeš:</strong> <code>03_identifikacia/scripts/06_SLength/slength.py</code></p>
<p><strong>Príklad:</strong> User klikne 5×, časy [100, 200, 250, 150, 80] — po 4. kliknutí kumulatív = 700 → otvorí sa nové sedenie.</p>
<p><strong>Číslo na zapamätanie:</strong> Reálne <b>7075</b> sedení (zadanie ~6700) — porovnanie so STT závisí od dát.</p>

<h3>Úloha 07: ks_test_exp_rozdelenia.py (overovanie exp. rozdelenia)</h3>
<p><strong>Čo robí:</strong> Overí, či Length pochádza z exponenciálneho rozdelenia pomocou Kolmogorov-Smirnov testu.</p>
<p><strong>Prečo:</strong> Ďalšia úloha (RLength) <em>predpokladá</em> exp. rozdelenie. Najprv treba overiť, či tento predpoklad platí.</p>
<p><strong>Ako:</strong> Spustíme <code>kstest(length, 'expon', args=(0, mean))</code>. Test porovná empirickú CDF s teoretickou. Vykreslí sa aj histogram + PDF a QQ plot.</p>
<p><strong>Kde to nájdeš:</strong> <code>03_identifikacia/scripts/07_RLength_exp/ks_test_exp_rozdelenia.py</code></p>
<p><strong>Číslo na zapamätanie:</strong> Pre Exp(λ) platí <code>E[X] = 1/λ</code>, preto v skripte je <code>scale = mean(Length)</code>.</p>

<h3>Úloha 08: rlength.py (Reference Length — kvantil exp. rozdelenia)</h3>
<p><strong>Čo robí:</strong> Vypočíta časový prah ako kvantil exp. rozdelenia s parametrom p = 0.4 (40 % navigačných stránok).</p>
<p><strong>Prečo:</strong> Ak 40 % stránok sú "len kliknutia" (krátky čas, user neprečítal obsah), prah <code>rlength</code> ich oddelí od reálne čítaných stránok. Dlhé Length = end of session signál.</p>
<p><strong>Ako:</strong> Inverzná CDF exp. rozdelenia:</p>
<pre><code>rlength = -ln(1 - p) * mean(Length)</code></pre>
<p>Pre p = 0.4: <code>-ln(0.6) ≈ 0.5108</code>, takže rlength ≈ 0.5108 × 147.2 ≈ 75 s. Algoritmus potom rovnaký cumsum trik.</p>
<p><strong>Kde to nájdeš:</strong> <code>03_identifikacia/scripts/08_RLength/rlength.py</code></p>
<p><strong>Číslo na zapamätanie:</strong> Reálne <b>7558</b> sedení (zadanie ~8000), nižší prah = viac kratších sedení.</p>

<h3>Úloha 09: h_ref.py (heuristic referrer)</h3>
<p><strong>Čo robí:</strong> Kombinuje časový prah s informáciou o referreri — ak Referrer = "-", je to externý/priamy vstup.</p>
<p><strong>Prečo:</strong> User môže otvoriť novú záložku po krátkej pauze — STT to nezachytí ako nové sedenie, ale Referrer = "-" áno.</p>
<p><strong>Ako:</strong> Tri podmienky cez <strong>bitwise OR</strong> (znak <code>|</code>, nie slovo <code>or</code>):</p>
<pre><code>NEW_SESSION = Length.isna() | Length >= mean | Referrer == '-'</code></pre>
<p>Potom cumsum ako vždy.</p>
<p><strong>Kde to nájdeš:</strong> <code>03_identifikacia/scripts/09_h_ref/h_ref.py</code></p>
<p><strong>Číslo na zapamätanie:</strong> Reálne <b>8180</b> sedení (zadanie ~7200).</p>

    {type:`quiz`,q:`Čo je IQR (Interquartile Range)?`,options:[`Q3 - Q1, šírka stredného 50 % rozdelenia`,`Q1 + Q3`,`Q3 / Q1`,`priemer + std`],correct:0,explain:`IQR = Q3 - Q1 = šírka 'stredného 50 %' rozdelenia. Q1 je 25. percentil, Q3 je 75. percentil.`,step:'05'},
    {type:`fill`,text:`Tukeyho pravidlo: hodnota je 'mierny outlier' ak je väčšia ako Q3 + ___ * IQR (extrémny outlier je až za Q3 + 3·IQR).`,answer:`1.5`,alts:[`1,5`],step:'05'},
    {type:`match`,prompt:`Priraď koncepty STT_Q metódy k ich významu`,pairs:[[`Q1`,`25. percentil — pod ním leží 25 % hodnôt`],[`Q3`,`75. percentil — pod ním leží 75 % hodnôt`],[`IQR`,`Q3 - Q1, šírka stredného 50 % dát`],[`STT_Q`,`Q3 + 1.5 * IQR, časový prah outlier-ov`]],step:'05'},
    {type:`flash`,q:`Prečo prednáška 8 hovorí, že 'odhady strednej hodnoty sa používajú, ale nie sú vhodné'?`,a:`Pre Length s <b>ťažkým pravým chvostom</b> (pár veľmi dlhých páuz) priemer aj std výrazne posunú outliers. <b>Kvartily (Q3+1.5*IQR) sú robustné</b> — nereagujú na okrajové hodnoty. Preto sa pre Length odporúča STT_Q (prípadne RLength ak Length ~ Exp).`,step:'05'},
    {type:`flash`,q:`Prečo quantile() ignoruje NaN automaticky?`,a:`Pandas <code>Series.quantile()</code> má default <b>skipna=True</b> — NaN-y (z prvých záznamov userov) sa nezahrnú do výpočtu kvartilov. Inak by skreslili Q1/Q3 a posunuli prah.`,step:'05'},
    {type:`flash`,q:`📍 Úloha 06: slength.py`,a:`Sedenia metódou <b>SLength</b>: pevný limit 600 s (10 min) na <b>CELÚ dĺžku sedenia</b> (nie na čas medzi prístupmi). Iteruje cez iterrows(), kumuluje Length; keď kumulatív+Length ≥ 600 alebo Length NaN → nové sedenie. Reálne ~7075 sedení (zadanie ~6700).`,step:'06'},
    {type:`quiz`,q:`V čom sa líši SLength od STT_MEAN/STT_Q?`,options:[`SLength používa 600s prah na CELKOVÚ dĺžku sedenia, STT používa prah na čas MEDZI prístupmi`,`SLength nepoužíva Length`,`SLength používa kvartily`,`Nijako, sú to synonymá`],correct:0,explain:`SLength = limit na celkové trvanie sedenia (10 min). STT_* metódy = limit na čas medzi 2 po sebe idúcimi prístupmi.`,step:'06'},
    {type:`quiz`,q:`Prečo SLength nepoužíva vektorizovaný cumsum ale iterrows()?`,options:[`iterrows() je rýchlejší`,`cumsum() je monotónny — nevie sa RESETOVAŤ pri prekročení prahu`,`iterrows() je idiomatický pandas`,`Aby pandas hádzal warningy`],correct:1,explain:`Štandardný cumsum nevie 'vynulovať' pri dosiahnutí prahu. Pre kumulatív s resetom potrebujeme buď triky alebo explicitnú iteráciu (jednoduchšia čítačka).`,step:'06'},
    {type:`quiz`,q:`Keď podmienka cumulative_time + Length >= 600 zakopne, AKO sa resetuje kumulatív pre nový session?`,options:[`cumulative_time = 0`,`cumulative_time = row['Length'] (zachová konzistenciu s else vetvou)`,`cumulative_time = 600`,`cumulative_time = NaN`],correct:1,explain:`Length[i] reprezentuje čas od predchádzajúceho prístupu. V else vetve sa Length pripočítava — pri prahu sa preto Length stane PRVÝM príspevkom do kumulatívu nového sedenia. Inak by sa čas stratil.`,step:'06'},
    {type:`quiz`,q:`Prečo je &lt;code&gt;iterrows()&lt;/code&gt; v slength.py vedome akceptovaný výkonový kompromis?`,options:[`iterrows() je v skutočnosti rýchlejší ako vektorizované operácie`,`iterrows() ide row-by-row v čistom Pythone (O(n) bez SIMD), ale vektorizovaný cumsum nedokáže pri prekročení prahu vynulovať kumulatív — preto sa rýchlosť obetuje za sémantiku resetu`,`iterrows() je nutný kvôli typu Length stĺpca`,`Pandas nemá funkciu cumsum, takže iterrows() je jediná možnosť`],correct:1,explain:`Vektorizované operácie (cumsum) bežia v C — sú rádovo rýchlejšie ako Pythonová slučka cez iterrows(). Lenže cumsum je monotónna funkcia, neumožňuje reset na nulu pri dosiahnutí prahu 600 s. SLength logika vyžaduje práve takýto reset (otvor nové sedenie + kumulatív = Length tohto riadku), preto sa autor vedome vzdal rýchlosti.`,step:'06'},
    {type:`flash`,q:`📍 Úloha 07: ks_test_exp_rozdelenia.py`,a:`Overuje hypotézu, že <b>Length ~ Exp(λ)</b>: spustí <code>scipy.stats.kstest(length, 'expon', args=(0, mean))</code>, vykreslí histogram + teoretickú PDF a QQ plot. Výstup: KS štatistika, p-hodnota, rozhodnutie pri alpha=0.05.`,step:'07'},
    {type:`quiz`,q:`Čo je nulová hypotéza H0 KS testu?`,options:[`Dáta NEMAJÚ exp. rozdelenie`,`Dáta POCHÁDZAJÚ z exponenciálneho rozdelenia (F_data = F_expon)`,`Priemer = 0`,`Std = 1`],correct:1,explain:`H0: F_data(x) = F_expon(x; loc=0, scale=mean) pre všetky x. Test štatistika D_n = sup |F_data - F_expon|. Ak p < 0.05, zamietame H0.`,step:'07'},
    {type:`fill`,text:`KS test štatistika D_n je najväčšia ___ vzdialenosť medzi empirickou a teoretickou CDF.`,answer:`vertikalna`,alts:[`vertikálna`,`zvisla`,`zvislá`],step:'07'},
    {type:`quiz`,q:`Aká je teoretická identita pre priemer exponenciálneho rozdelenia?`,options:[`E[X] = lambda`,`E[X] = 1 / lambda`,`E[X] = lambda^2`,`E[X] = ln(lambda)`],correct:1,explain:`Pre Exp(lambda): E[X] = 1/lambda, Median = ln(2)/lambda ≈ 0.693 * E[X], Std = 1/lambda (variačný koeficient = 1).`,step:'07'},
    {type:`quiz`,q:`Prečo je KS test s odhadnutým parametrom z dát (scale=mean(Length)) 'anti-konzervatívny'?`,options:[`P-hodnota je nižšia ako reálna`,`P-hodnota je VYŠŠIA ako reálna — riziko je NEZAMIETNUŤ H0 keď by sa mala`,`Test sa nedá spustiť`,`KS test ignoruje parametre`],correct:1,explain:`Štandardný KS predpokladá plne špecifikované parametre. Odhad zo vzorky robí test menej prísnym. Korektnejšie: Lilliefors test alebo bootstrap KS.`,step:'07'},
    {type:`flash`,q:`Čo znázorňuje QQ plot a ako sa interpretuje?`,a:`Os x = <b>teoretické kvantily</b> (expon ppf), os y = <b>empirické kvantily</b> (sorted Length). Ak dáta pochádzajú z teoretického rozdelenia, body ležia na priamke y=x. <b>Body nad čiarou = ťažšie chvosty, pod čiarou = ľahšie chvosty</b> ako exponenciálne.`,step:'07'},
    {type:`fill`,text:`Pre KS test používame parameter args=(0, mean) — loc=0 lebo Length nemôže byť záporná, scale=mean lebo scale = 1/___ je odhad metódou momentov.`,answer:`lambda`,alts:[`λ`],step:'07'},
    {type:`fill`,answer:`0.5`,alts:[`0,5`,`1/2`],step:'07'},
    {type:`flash`,q:`📍 Úloha 08: rlength.py`,a:`Sedenia heuristikou <b>RLength</b> (Reference Length): prah <code>rlength = -ln(1-p) * mean(Length)</code> pre p=0.4 (40 % navigačných stránok). Vychádza z predpokladu Exp rozdelenia. Výsledok 0.5108 · 147.2 ≈ 75.2 s — NIŽŠÍ prah ako STT_MEAN → VIAC sedení (reálne ~7558, zadanie ~8000).`,step:'08'},
    {type:`quiz`,q:`Aký je vzorec pre RLength prah?`,options:[`mean / lambda`,`Q3 + 1.5*IQR`,`-ln(1-p) * mean(Length)`,`p * mean(Length)`],correct:2,explain:`Inverzná CDF Exp rozdelenia: F^-1(p) = -ln(1-p) / lambda = -ln(1-p) * mean. Pre p=0.4 dostaneme -ln(0.6) ≈ 0.5108 * mean.`,step:'08'},
    {type:`fill`,text:`Vychádzame z CDF Exp(lambda): F(t) = 1 - exp(-t/mean). Riešime F(t) = p: t = -___(1-p) * mean.`,answer:`ln`,alts:[`log`],step:'08'},
    {type:`flash`,q:`Čo je teoretická interpretácia parametra p = 0.4 pri RLength?`,a:`<b>p = relatívna početnosť navigačných stránok</b> = 40 % stránok sú navigačné (user len klikol a išiel ďalej, nepreciital). Prah rlength oddeľuje 40 % najkratších časov (navigačné) od 60 % dlhších (číta obsah → možné ukončenie sedenia).`,step:'08'},
    {type:`quiz`,q:`Prečo je úloha 07 (KS test exp. rozdelenia) ZARADENÁ PRED úlohu 08 (RLength)?`,options:[`Kvôli abecednému poradiu skriptov v priečinku`,`Vzorec &lt;code&gt;rlength = -ln(1-p) * mean(Length)&lt;/code&gt; je inverzná CDF Exp rozdelenia — ak Length NIE JE exponenciálna, prah nereprezentuje p-tý kvantil dát a sessionizácia stráca štatistický základ; úloha 07 tento predpoklad overuje`,`KS test musí počítať mean(Length) a rlength ho recykluje`,`Úloha 07 generuje súbor, ktorý RLength číta ako vstup`],correct:1,explain:`RLength stojí na predpoklade Length ~ Exp(λ) s λ=1/mean. Iba pri platnosti tohto predpokladu vzorec -ln(1-p)·mean(Length) skutočne vráti p-tý kvantil empirickej Length. Ak rozdelenie nie je exponenciálne (čo KS test zistí), p=0.4 už neoddelí 40 % najkratších časov — prah je len arbitrárne číslo a heuristika 'navigačná vs čítaná stránka' prestáva byť kalibrovaná.`,step:'08'},
    {type:`flash`,q:`📍 Úloha 09: h_ref.py`,a:`Sedenia <b>kombináciou h-ref + STT</b>: NEW_SESSION = OR z 3 podmienok: <code>Length.isna() | Length >= mean | Referrer == '-'</code>. Pridáva heuristiku 'externý/priamy prístup' (prázdny referrer) k časovému prahu. Reálne ~8180 sedení (zadanie ~7200).`,step:'09'},
    {type:`quiz`,q:`Čo znamená Referrer == '-' v Apache logu?`,options:[`Stránka neexistuje`,`HTTP hlavička Referer chýba: priame zadanie URL, záložka, externý odkaz`,`Bot`,`Stratenie spojenia`],correct:1,explain:`Apache log zapisuje '-' keď HTTP hlavička Referer chýba — užívateľ prišiel zvonku (priama URL, záložka, externý link). Jasný signál pre ŠTART NOVÉHO SEDENIA.`,step:'09'},
    {type:`fill`,text:`V pandas musíme použiť ___ (bitwise OR) namiesto 'or' lebo 'or' nepodporuje Series — vyhodil by ValueError 'ambiguous truth value'.`,answer:`|`,alts:[`pipe`],step:'09'},
    {type:`cat`,prompt:`Roztrieď heuristiky identifikácie sedení podľa typu prahu`,groups:{"Dynamický prah (z dát)":[`STT_MEAN (priemer Length)`,`STT_Q (Q3+1.5*IQR)`,`RLength (kvantil Exp rozdelenia)`],"Pevný prah (zo zadania)":[`SLength (600 s na celé sedenie)`,`Length filter (3600 s medzi prístupmi)`],"Kombinačná (čas + štruktúra)":[`h-ref (priemer Length + Referrer == '-')`]},step:'09'},
    {type:`quiz`,q:`Aký je teoretický dôvod, prečo h-ref pridáva podmienku Referrer == '-' k časovému prahu?`,options:[`Zrýchlenie behu`,`Časový prah sám o sebe nezachytí situáciu, keď user prišiel zvonku po krátkej pauze`,`Aby sa zhodoval počet sedení s STT_MEAN`,`Referrer je vždy '-'`],correct:1,explain:`Klasické STT delí podľa času. Ak user otvorí novú záložku externou URL po 30 s, STT to neoznačí ako nové sedenie. Referrer == '-' to správne identifikuje.`,step:'09'},
    {type:`quiz`,q:`Prečo cumsum() trik funguje aj pre prechod medzi userami?`,options:[`Pandas to detekuje automaticky`,`Lebo prvý záznam každého usera má Length=NaN (zo shift v úlohe 03), takže isna() == True a SESSION_ID sa inkrementuje`,`cumsum() má parameter group`,`Iba ak je dataframe zoradený`],correct:1,explain:`Pre úspešnú segmentáciu sedení cez cumsum sa SPOLIEHAME na to, že úloha 03 vyrobila NaN Length pre prvý záznam každého usera. Vďaka tomu prechod medzi userami AUTOMATICKY vyvolá NEW_SESSION=True.`,step:'09'},
    {type:`match`,prompt:`Priraď očakávané počty sedení (zadanie) k metódam. Reálne výstupy: STT_MEAN 7097, STT_Q 7873, SLength 7075, RLength 7558, h-ref 8180.`,pairs:[[`STT_MEAN`,`~7500`],[`STT_Q`,`~7500`],[`SLength`,`~6700`],[`RLength`,`~8000`],[`h-ref`,`~7200`]],step:'09'},
    {type:`order`,prompt:`Usporiadaj WUM fázy identifikácie podľa závislosti`,items:[`UNIXTIME (numerická reprezentácia času)`,`USER_ID (groupby IP+Agent)`,`Length (groupby USER_ID + shift)`,`Výber metódy session prahu (STT_MEAN / STT_Q / SLength / RLength / h-ref)`,`SESSION_ID (cumsum boolean masky)`],step:'09'},
    {type:`order`,prompt:`Usporiadaj WUM fázy v poradí, v akom závisia jedna od druhej (každá potrebuje výstup predošlej).`,items:[`cv1: vyčistený Apache log (filter botov, statických prípon, GET 2xx)`,`unixtime.py: pridanie stĺpca UNIXTIME (sekundy od 1.1.1970)`,`identifikacia_userov.py: priradenie USER_ID cez groupby(IP, Agent)`,`vypocet_length.py: Length = rozdiel UNIXTIME v rámci USER_ID cez shift(1)`,`h_ref.py: SESSION_ID cez OR masku (isna | >= mean | Referrer == '-') + cumsum`],step:'09'}
]},
{num:4,label:`Doplnenie ciest`,name:`Doplnenie ciest (path completion)`,reading:`<h2>Téma 4: Doplnenie ciest (Path Completion)</h2>
<p class="lead">Apache log nevidí kliky cez tlačidlo Back ani návštevy z cache prehliadača. Doplnenie ciest tieto diery zalepí — vloží medzi dva skoky pravdepodobnú medzistránku z mapy webu.</p>

<h3>Prečo to vôbec robíme</h3>
<p>Server zaznamenáva len požiadavky, ktoré k nemu prišli. Keď klikneš na tlačidlo Back, prehliadač vytiahne stránku z cache a server o tom nevie. V logu tak vidíš skok z <code>/fakulta</code> rovno na <code>/studium</code>, hoci v strome webu medzi nimi leží <code>/univerzita</code>.</p>
<p>Bez doplnenia by neskoršia analýza vzorov našla pravidlo "fakulta ⇒ studium" namiesto skutočného "fakulta ⇒ univerzita ⇒ studium". Doplnenie teda dvíha kvalitu vstupu pre Apriori a sekvenčné pravidlá.</p>

<h3>Spoločný princíp všetkých 4 úloh</h3>
<p>Vstupom je očistený log so SESSION_ID a mapa webu <code>mapa_webu.xlsx</code>. Skript prejde log po dvojiciach susedných riadkov. Pre každú dvojicu (curr, next) v tom istom sedení testuje:</p>
<pre><code>ak url_from NIE JE v mape AND url_to JE v mape:
    vlož medzistránku = parent(url_to)</code></pre>
<p>Symboly: <code>url_from</code> je URL z aktuálneho riadku, <code>url_to</code> z nasledujúceho, <code>parent(x)</code> je rodičovská stránka <code>x</code> v strome webu (stĺpec ReferencePage).</p>

<h3>Úloha 01: doplnenie_stt_mean.py</h3>
<p><strong>Čo robí:</strong> Doplní medzistránky v logu, kde sedenia spravila metóda STT_Mean (prah = priemer Length).</p>
<p><strong>Prečo:</strong> Bez tohto kroku by sekvencie navigácie mali diery. Apriori by potom našiel skreslené pravidlá.</p>
<p><strong>Ako:</strong> 1) Načíta log a mapu webu. 2) Z mapy postaví <code>parent</code> dict a <code>map_paths</code> set. 3) Prejde log po dvojiciach a vloží <code>parent(url_to)</code> ak url_from chýba v mape.</p>
<p><strong>Kde to nájdeš:</strong> <code>04_doplnanie_ciest/scripts/01_doplnanie_STT_MEAN/doplnenie_stt_mean.py</code></p>
<p><strong>Príklad:</strong> Log má dvojicu <code>/stary-odkaz</code> → <code>/fakulty/fpvai</code>. <code>/stary-odkaz</code> nie je v mape, ale <code>/fakulty/fpvai</code> áno. Skript vloží medzi ne <code>/fakulty</code> (rodič cieľa).</p>
<p><strong>Číslo na zapamätanie:</strong> zadanie ~<strong>750</strong>, reálne <strong>855</strong> doplnených záznamov.</p>

<h3>Úloha 02: doplnenie_stt_q.py</h3>
<p><strong>Čo robí:</strong> Rovnaký algoritmus, ale vstup má sedenia zo STT_Q (kvantilový prah Q3+1.5×IQR pre neexponenciálne dáta).</p>
<p><strong>Prečo:</strong> STT_Q sa použije keď Length nemá exponenciálne rozdelenie. Doplnenie ciest funguje rovnako bez ohľadu na to, ako vznikli sedenia.</p>
<p><strong>Ako:</strong> Skript je takmer kópia úlohy 01, mení sa len názov vstupného CSV. Kľúčový idiom: zbieraj riadky do <code>list</code>, na konci urob jediný <code>pd.DataFrame(list)</code>.</p>
<p><strong>Kde to nájdeš:</strong> <code>04_doplnanie_ciest/scripts/02_doplnanie_STT_Q/doplnenie_stt_q.py</code></p>
<p><strong>Príklad:</strong> Vstup má 20 666 riadkov, výstup 21 401.</p>
<p><strong>Číslo na zapamätanie:</strong> ~<strong>735 doplnených</strong> (zadanie hovorí cca 750).</p>

<h3>Úloha 03: doplnenie_rlength.py</h3>
<p><strong>Čo robí:</strong> Doplnenie ciest pre log, kde sedenia identifikovala metóda RLength.</p>
<p><strong>Prečo:</strong> RLength odvodzuje časový prah z exponenciálneho rozdelenia Length. Doplnenie ciest aj tu zaceluje diery, aby vzory boli kompletné.</p>
<p><strong>Ako:</strong> Vzorec pre prah:</p>
<pre><code>prah = -ln(1-p) · mean(Length)</code></pre>
<p>Tu <code>ln</code> je prirodzený logaritmus, <code>p</code> je podiel "navigačných" stránok (typicky 0.4), <code>mean(Length)</code> je priemerný čas medzi prístupmi. Pre p=0.4 vyjde prah ~0.5108 × mean.</p>
<p><strong>Kde to nájdeš:</strong> <code>04_doplnanie_ciest/scripts/03_doplnanie_RLength/doplnenie_rlength.py</code></p>
<p><strong>Príklad:</strong> Skript vyprodukuje 776 doplnených záznamov.</p>
<p><strong>Číslo na zapamätanie:</strong> očakávaných ~<strong>850</strong>, skutočne 776 (~9 % pod cieľom — akceptovateľné).</p>

<h3>Úloha 04: doplnenie_href.py</h3>
<p><strong>Čo robí:</strong> Doplnenie ciest pre log so sedeniami z metódy h-ref.</p>
<p><strong>Prečo:</strong> h-ref pridáva navrch STT_Mean tretiu podmienku: nové sedenie aj keď Referrer='-' (priamy prístup, napríklad zo záložky). Vzniká viac, ale kratších sedení.</p>
<p><strong>Ako:</strong> Algoritmus doplnenia je identický s úlohou 01. Mení sa len názov vstupného CSV (<code>cleaned_log4_href.csv</code>).</p>
<p><strong>Kde to nájdeš:</strong> <code>04_doplnanie_ciest/scripts/04_doplnanie_h_ref/doplnenie_href.py</code></p>
<p><strong>Príklad:</strong> Krátke sedenia majú málo skokov v navigácii. Preto h-ref doplní menej záznamov ako RLength.</p>
<p><strong>Číslo na zapamätanie:</strong> zadanie ~<strong>690</strong>, reálne <strong>706</strong> doplnených záznamov.</p>

<h3>Kľúčové dátové štruktúry</h3>
<p>Vo všetkých štyroch skriptoch sa opakuje rovnaký súbor:</p>
<ul>
<li><code>parent</code> je dict <code>{URL: ReferencePage}</code>. Lookup je O(1). Stavia sa idiómom <code>dict(zip(mapa['path'], mapa['ref_path']))</code>.</li>
<li><code>map_paths</code> je set všetkých URL z mapy. Test <code>x in map_paths</code> je O(1) vďaka hashtable. Bez setu by sme robili pomalý O(n) scan pri každej iterácii.</li>
<li><code>new_rows</code> je list dictov. Na <code>list.append()</code> je O(1) amortizovane. Na konci <code>pd.DataFrame(new_rows)</code> raz vyrobí výstupnú tabuľku.</li>
</ul>

<h3>Edge cases ktoré skripty zachytávajú</h3>
<p>Skript preskočí doplnenie ak:</p>
<ul>
<li>Sme na poslednom riadku logu (nie je s čím porovnať).</li>
<li><code>curr.SESSION_ID</code> sa líši od <code>next_row.SESSION_ID</code> — medzi sedeniami nie je navigácia, len hranica.</li>
<li><code>url_from == url_to</code> — refresh stránky (F5), netreba medzistránku.</li>
<li><code>url_from</code> je v mape — heuristika sa neuplatní (pokrýva len prípad "url_from chýba").</li>
<li><code>ref_page == url_from</code> — zabraňuje cyklu "from → from → to".</li>
</ul>

<h3>Príprava mapy webu</h3>
<p>Mapa je v Exceli, preto <code>pd.read_excel</code> (nie <code>read_csv</code>). Po načítaní:</p>
<ol>
<li>Premenuje stĺpce na <code>idx, URL, Root, ReferencePage</code>.</li>
<li><code>mapa.iloc[1:]</code> zahodí prvý riadok ako druhú hlavičku.</li>
<li><code>str.replace('https://www.ukf.sk', '', regex=False)</code> oreže doménu. Parameter <code>regex=False</code> robí doslovnú substitúciu — rýchlejšiu a bezpečnejšiu.</li>
<li>Prázdny reťazec po orezaní nahradí <code>/</code> (koreň webu).</li>
</ol>

{num:5,label:`Prieskum dát`,name:`Prieskum dát (deskriptívne štatistiky, vzťahy)`,reading:`<h2>Téma 5: Prieskum dát (deskriptívne štatistiky, vzťahy)</h2>
<p class="lead">Prieskum dát (EDA) je prvá fáza po vyčistení logov. Cieľom je zorientovať sa v datasete logs5.csv pred ďalšími úlohami (Apriori, klasifikácia). Bez prieskumu netušíme čo dataset obsahuje.</p>

<h3>Skupiny premenných</h3>
<p>Dataset banky má premenné rozdelené do 4 skupín. <b>DV (vysvetľované, obsah)</b>: category, webPart, urlExt — z URL. <b>IV (vysvetľujúce, čas)</b>: year, quartal, yearQuartal, week, crisis — z časovej známky. <b>User</b>: anonIP, agent, userAgent. <b>Other</b>: length (čas na stránke), internal (interný traffic), frame (session ID).</p>

<h3>Úloha 04: vztahy_premennych.py</h3>
<p><strong>Čo robí:</strong> štatistické testy sily závislosti medzi premennými — 3× chi² test nezávislosti + 1× ANOVA.</p>
<p><strong>Prečo:</strong> chi² hovorí ČI závislosť existuje (p-hodnota). Cramerovo V hovorí AKÁ silná je (0-1). Bez Cramerovho V by sme pri n=2M tvrdili, že všetko závisí od všetkého — chi² rastie s n.</p>
<p><strong>Ako:</strong> pre dve kategorické premenné postav crosstab a zavolaj chi2_contingency. Pre numerickú vs kategorickú premennú spusti f_oneway nad listom polí (jedno pole na kategóriu).</p>
<p><strong>Kde to nájdeš:</strong> <code>05_prieskum_dat/scripts/04_vztahy_premennych/vztahy_premennych.py</code></p>
<p><strong>Vzorec Cramerovho V:</strong></p>
<pre><code>V = sqrt(chi2 / (n * (min(r,c) - 1)))</code></pre>
<p>kde <code>chi2</code> je hodnota zo scipy, <code>n</code> je celkový počet pozorovaní, <code>r</code> a <code>c</code> sú rozmery kontingenčnej tabuľky. Delenie <code>n*(min(r,c)-1)</code> je maximum, ktoré môže chi² dosiahnuť pri perfektnej závislosti — preto V padne do [0, 1].</p>
<p><strong>Interpretácia V:</strong> < 0.1 veľmi slabá, 0.1-0.3 slabá, 0.3-0.5 stredná, >= 0.5 silná.</p>
<p><strong>ANOVA (F-test):</strong> porovnáva priemery K skupín. H0: všetky priemery sú rovnaké. F = rozptyl MEDZI skupinami / rozptyl VNÚTRI skupín. Predpoklady: normalita, homoskedasticita, nezávislosť.</p>
<p><strong>Výstup chi2_contingency:</strong> tuple <code>(chi2, p, dof, expected)</code> — štatistika, p-hodnota, stupne voľnosti a tabuľka očakávaných frekvencií.</p>

<h3>Bežné technické triky v skriptoch</h3>
<p><b>low_memory=False</b> — vypne chunk-by-chunk type inference. Pri mixed-type stĺpcoch (raz NaN, raz string) by inak pandas vyhodil DtypeWarning a hádal dtype podľa kúskov.</p>
<p><b>errors='coerce'</b> v to_datetime — nevalidné hodnoty sa zmenia na NaT namiesto vyhodenia výnimky. NaT potom padne v groupby ako NaN a riadok vypadne.</p>
<p><b>unstack(fill_value=0)</b> — presunie poslednú úroveň MultiIndexu na stĺpce, chýbajúce kombinácie dostanú 0 namiesto NaN. Bez toho by sa čiary v line plote prerušovali.</p>
<p><b>astype(str) na roky</b> v bar grafe — aby matplotlib bral roky ako kategorické labely, nie spojitú os.</p>

<h3>Intuícia: prečo Cramerovo V a nie chi²?</h3>
<p>Predstav si, že vážiš jablká na dvoch rôznych váhach: jedna ukazuje gramy, druhá libry. Číslo bude vždy iné, hoci jablko je rovnaké. Chi² je presne takéto „surové číslo“ — rastie s veľkosťou vzorky <code>n</code> a s rozmermi tabuľky <code>r × c</code>. Pri 2 miliónoch logov banky vyjde chi² obrovské aj vtedy, keď je závislosť triviálna. Preto potrebujeme <b>normalizáciu</b> — rovnakú váhu pre malý aj veľký dataset.</p>
<p>Derivácia: pri perfektnej závislosti medzi dvomi kategorickými premennými môže chi² dosiahnuť nanajvýš <code>n · (min(r,c) - 1)</code>. Keď chi² delíme týmto maximom, dostaneme <code>phi²</code> v intervale <b>[0, 1]</b>. Odmocnina prevedie na lineárnu škálu (analógia: <code>r²</code> vs <code>r</code> pri korelácii):</p>
<pre><code>V = sqrt( chi² / ( n · (min(r,c) - 1) ) )</code></pre>
<p><b>Interpretácia podľa Cohena:</b> V < 0.1 = veľmi slabá, 0.1-0.3 = slabá, 0.3-0.5 = stredná, V &ge; 0.5 = silná závislosť. Výhoda: <b>nezávisí od n</b>, takže porovnávaš jablká s jablkami medzi rôznymi datasetmi.</p>

<h3>Prepojenie typov premenných s testom (Munka, prednáška 9)</h3>
<p>Výber štatistického testu nie je voľný — diktujú ho <b>typy</b> dvoch premenných, ktorých vzťah skúmaš. Toto je zlaté pravidlo EDA:</p>
<table class="thtable">
  <tr><th>Premenná A</th><th>Premenná B</th><th>Test</th><th>Miera sily efektu</th></tr>
  <tr><td>kategorická</td><td>kategorická</td><td>chi² test nezávislosti</td><td>Cramerovo V</td></tr>
  <tr><td>numerická</td><td>kategorická (k skupín)</td><td>ANOVA F-test (f_oneway)</td><td>eta² alebo omega²</td></tr>
  <tr><td>numerická</td><td>numerická</td><td>Pearson / Spearman korelácia</td><td>r alebo &rho;</td></tr>
</table>
<p>V skripte <code>vztahy_premennych.py</code> sú 3× chi² (category × crisis, category × internal, category × year — všetko kategorická × kategorická) a 1× ANOVA (length × category — numerická × kategorická). Korelácia tu nie je, lebo v datasete máme len jeden numerický stĺpec <code>length</code>.</p>

<h3>EDA pipeline: prečo popisné štatistiky PRED testami</h3>
<p>John Tukey (otec EDA) hovoril: <em>„first look, then test“</em> — najskôr sa pozri, potom testuj. Prečo nestačí rovno spustiť chi² a ANOVA?</p>
<ul>
  <li><b>Popisné štatistiky odhalia degenerované rozdelenia.</b> Ak má kategória 99 % jednu hodnotu, chi² vyjde nezmyselne (stupne voľnosti sa zrútia). Bez <code>value_counts</code> to nezistíš.</li>
  <li><b>describe() preveruje predpoklady ANOVA.</b> Mean >> median signalizuje pravostranne šikmé rozdelenie — ANOVA má potom nadhodnotenú F-štatistiku. Treba zvážiť log-transformáciu alebo Kruskal-Wallis test.</li>
  <li><b>Časová agregácia (úloha 02) a heatmapy (úloha 03) sú „mid-look“</b> — vidíš trendy, ktoré štatistické testy iba kvantifikujú. Bez nich tvoja interpretácia p-hodnoty visí vo vzduchu.</li>
</ul>
<p>Logický tok témy 5: <b>(1) pochop dáta</b> (popisné, frekvencie) → <b>(2) vidím trendy v čase a kategóriách</b> (návštevnosť, length na stránkach) → <b>(3) testuj hypotézy</b> (chi², ANOVA) → <b>(4) interpretuj veľkosť efektu</b> (Cramer V, slovná interpretácia). Bez tohto poradia sú výsledky štatisticky správne, ale prakticky neinterpretovateľné.</p>

{num:6,label:`Extrakcia vzorov`,name:`Extrakcia vzorov (Apriori + Cochran Q + Kendall W)`,reading:`<h2>Téma 6: Extrakcia vzorov (Apriori + Cochran Q + Kendall W)</h2>
<p class="lead">Z čistých logov banky (2009-2012) vytiahneme asociačné pravidlá typu "ak user navštívi kategóriu A, navštívi aj B". Potom štatisticky overíme, či sa tieto vzory medzi rokmi menia, alebo zostávajú rovnaké.</p>

<h3>Úloha 01: priprava_transakcii.py</h3>
<p><strong>Čo robí:</strong> Pre každý rok vyrobí CSV s "košíkmi" — zoznamom kategórií, ktoré user navštívil v jednom sedení.</p>
<p><strong>Prečo:</strong> Apriori algoritmus pracuje s košíkmi. Bez tohto kroku by sme nemali z čoho hľadať pravidlá. Košík s jednou kategóriou je nanič — z 1 položky nevznikne žiadna dvojica A⇒B.</p>
<p><strong>Ako:</strong> 1) Načítaj logs5.csv. 2) Pre každý rok zoskup podľa <code>frame</code> (sedenie), zlej unikátne kategórie do reťazca "A;B;C". 3) Vyhoď košíky s menej ako 2 kategóriami.</p>
<p><strong>Kde to nájdeš:</strong> <code>06_extrakcia_vzorov/scripts/01_priprava_dat/priprava_transakcii.py</code></p>
<p><strong>Príklad:</strong> sedenie frame=42 navštívi /uvod, /produkty, /uvod → košík = "produkty;uvod" (set zmaže duplikát, sorted zoradí abecedne).</p>
<p><strong>Číslo na zapamätanie:</strong> rok 2009 má 37 734 transakcií (najviac zo všetkých rokov), po <code>dropna(category)</code> ostáva ~102 481 záznamov.</p>

<h3>Úloha 02: apriori_pravidla.py</h3>
<p><strong>Čo robí:</strong> Spustí Apriori algoritmus na každom roku zvlášť a vygeneruje asociačné pravidlá X⇒Y so support, confidence a lift.</p>
<p><strong>Prečo:</strong> Asociačné pravidlo nám povie "ak user navštívi X, s pravdepodobnosťou P% navštívi aj Y". To je užitočné pre odporúčania a optimalizáciu navigácie webu.</p>
<p><strong>Ako:</strong> 1) <code>TransactionEncoder</code> prevedie zoznam košíkov na binárnu maticu T×I (riadky=košíky, stĺpce=kategórie, bunka=True ak košík obsahuje kategóriu). 2) <code>apriori</code> nájde itemsety so support ≥ 5%. 3) <code>association_rules</code> z nich vyrobí pravidlá s confidence ≥ 50%.</p>
<p><strong>Kde to nájdeš:</strong> <code>06_extrakcia_vzorov/scripts/02_asociacne_pravidla/apriori_pravidla.py</code></p>
<p><strong>Vzorce metrík:</strong></p>
<pre><code>support(X⇒Y)    = P(X ∪ Y)              -- ako často sa X aj Y vyskytujú spolu
confidence(X⇒Y) = P(Y|X) = sup(X∪Y)/sup(X)  -- ako spoľahlivá je implikácia
lift(X⇒Y)       = confidence / P(Y)        -- koľkokrát viac sa Y vyskytne s X oproti náhode</code></pre>
<p>Lift > 1 znamená pozitívnu koreláciu, lift = 1 nezávislosť, lift < 1 negatívnu koreláciu.</p>
<p><strong>Princíp anti-monotónie:</strong> Ak itemset {A,B} nesplní minimálny support, žiadna jeho nadmnožina {A,B,C}, {A,B,D}... ho tiež nesplní. To umožňuje "prerezať" celé vetvy stromu kandidátov a Apriori je vďaka tomu rýchly.</p>
<p><strong>Číslo na zapamätanie:</strong> 2009 = 341 pravidiel, 2010 = 405, 2011 = 205, 2012 = iba 17 pravidiel (najmenej, lebo má najkoncentrovanejšiu štruktúru — dve dvojice kategórií dominujú a ostatné kombinácie nepresiahnu 5% prah).</p>

<h3>Úloha 03: matica_pravidiel.py</h3>
<p><strong>Čo robí:</strong> Zlúči pravidlá zo všetkých 4 rokov do jednej binárnej matice. Riadky = unikátne pravidlá, stĺpce = obdobia O1_2009 až O4_2012, hodnoty = 0/1 podľa výskytu.</p>
<p><strong>Prečo:</strong> Aby sme mohli štatisticky porovnať obdobia, potrebujeme všetky pravidlá v jednej tabuľke. Pravidlo identifikujeme ako reťazec "antecedents => consequents".</p>
<p><strong>Ako:</strong> 1) Pre každý rok načítaj CSV, vyrob set string-ID pravidiel. 2) <code>set().union(*sets)</code> dá univerzálnu množinu (presne 450 unikátnych pravidiel). 3) Pre každé pravidlo a každé obdobie zapíš 1 ak je tam, inak 0. 4) Spočítaj <code>pocet_obdobi = sum(axis=1)</code>.</p>
<p><strong>Kde to nájdeš:</strong> <code>06_extrakcia_vzorov/scripts/03_matica_pravidiel/matica_pravidiel.py</code></p>
<p><strong>Príklad:</strong> pravidlo "uvod => blog" sa objavilo v 2009 aj 2010, ale nie v 2011 a 2012 → riadok [1, 1, 0, 0], pocet_obdobi = 2.</p>
<p><strong>Číslo na zapamätanie:</strong> matica má tvar 450 × 6 (450 unikátnych pravidiel, 6 stĺpcov: pravidlo + O1 + O2 + O3 + O4 + pocet_obdobi).</p>

<h3>Úloha 04: cochran_kendall_test.py</h3>
<p><strong>Čo robí:</strong> Štatisticky overí, či sa pravidlá medzi obdobiami líšia (Cochran Q test) a kvantifikuje silu zhody (Kendallovo W).</p>
<p><strong>Prečo:</strong> Cochran Q nám povie "áno/nie sú rozdiely" ale nepovie aké veľké. Kendall W pridá číslo medzi 0 (žiadna zhoda) a 1 (perfektná zhoda).</p>
<p><strong>Ako:</strong> 1) Načítaj maticu, ber len O-stĺpce. 2) Spusti <code>cochrans_q</code> na binárnej matici. 3) Dopočítaj W zo vzorca. 4) Vykresli 2-panelový bar graf.</p>
<p><strong>Kde to nájdeš:</strong> <code>06_extrakcia_vzorov/scripts/04_statisticka_analyza/cochran_kendall_test.py</code></p>
<p><strong>Vzorec pre Kendallovo W:</strong></p>
<pre><code>W = Q / (n · (k - 1))</code></pre>
<p>Q je Cochranova štatistika, n je počet pravidiel (450), k je počet období (4). Pre náš dataset: W = 724.3 / (450 · 3) ≈ 0.54 → silnejšia zhoda.</p>
<p><strong>Predpoklady Cochran Q:</strong> závislé vzorky (tie isté pravidlá merané v k obdobiach), binárne hodnoty (0/1), n ≥ 4·k. Štatistika Q sa približne riadi rozdelením χ² s df = k - 1 = 3.</p>
<p><strong>Rozhodovacie pravidlo:</strong> ak p < 0.05 → zamietame H0 → existujú signifikantné rozdiely medzi obdobiami.</p>
<p><strong>Interpretácia W:</strong> <0.3 slabá zhoda, 0.3-0.5 stredná, 0.5-0.7 silnejšia, ≥0.7 silná.</p>
<p><strong>Číslo na zapamätanie:</strong> Q = 724.3, p < 0.001 → existujú rozdiely. 15 pravidiel je stabilných (vo všetkých 4 obdobiach), 119 je unikátnych len pre 1 obdobie.</p>

  <h3>TLDR</h3>
  <ul>
    <li><strong>Pipeline témy 6:</strong> logs5.csv → transakcie_{rok}.csv (úl. 01) → pravidla_{rok}.csv (úl. 02) → matica_pravidiel.csv (úl. 03) → Cochran Q + Kendall W (úl. 04).</li>
    <li><strong>Tri metriky asociačných pravidiel:</strong> support (frekvencia), confidence (spoľahlivosť implikácie), lift (oproti náhode).</li>
    <li><strong>Apriori funguje vďaka anti-monotónii:</strong> ak itemset nesplní support, jeho nadmnožiny ho nemôžu splniť → prerezávanie celých vetiev.</li>
    <li><strong>Cochran Q hovorí ČI sú rozdiely, Kendall W hovorí AKO veľké.</strong> Q je test (binárny závery), W je miera efektu medzi 0 a 1.</li>
    <li><strong>V banke 2009-2012:</strong> 450 unikátnych pravidiel, p < 0.001 (rozdiely existujú), iba 15 stabilných pravidiel → správanie sa medzi rokmi menilo.</li>
  </ul>
