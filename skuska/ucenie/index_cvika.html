<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OZ Cvika – Interaktívne učenie</title>
<style>
  *{box-sizing:border-box;}
  body{font-family:'Segoe UI',Calibri,Arial,sans-serif;margin:0;background:#0f1b2d;color:#e8eef7;padding:18px;
       display:flex;flex-direction:column;align-items:center;min-height:100vh;}
  /* rozcestník */
  #roz{width:100%;max-width:900px;}
  #roz h1{font-size:24px;margin:0 0 4px;color:#fff;text-align:center;}
  .sub{color:#8fa6c4;font-size:14px;text-align:center;margin-bottom:22px;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;}
  .tile{display:block;text-align:left;text-decoration:none;background:#16243a;border:1px solid #28406a;border-radius:14px;
        padding:16px 16px 14px;color:#e8eef7;transition:.13s;position:relative;overflow:hidden;cursor:pointer;font-family:inherit;width:100%;}
  .tile:hover{transform:translateY(-2px);border-color:#3a82c9;background:#1a2c48;}
  .tnum{font-size:13px;color:#6f9bd6;font-weight:700;}
  .tname{font-size:16.5px;font-weight:700;margin:4px 0 10px;line-height:1.25;color:#fff;}
  .pbar{height:8px;background:#0f1b2d;border-radius:8px;overflow:hidden;border:1px solid #28406a;}
  .pfill{height:100%;width:0;background:linear-gradient(90deg,#36c98b,#2ea3e6);}
  .pct{font-size:12px;color:#9db4d2;margin-top:5px;}
  .badge{position:absolute;top:10px;right:12px;font-size:18px;}
  .foot{text-align:center;color:#6c829e;font-size:12.5px;margin-top:22px;}
  .reset{background:none;border:1px solid #34507a;color:#9db4d2;border-radius:8px;padding:6px 12px;cursor:pointer;font-family:inherit;font-size:12.5px;}
  .pdf{color:#7fc1ff;text-decoration:none;}
  /* test (engine) */
  #test{width:100%;max-width:760px;}
  .top{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
  .home{color:#7fc1ff;text-decoration:none;font-size:13px;white-space:nowrap;cursor:pointer;background:none;border:none;font-family:inherit;}
  .th{font-size:19px;margin:0;color:#fff;flex:1;font-weight:700;}
  .progwrap{width:100%;background:#16243a;border-radius:20px;height:12px;overflow:hidden;border:1px solid #283d5e;margin-bottom:6px;}
  .prog{height:100%;width:0;background:linear-gradient(90deg,#36c98b,#2ea3e6);transition:width .3s;}
  .meta{font-size:12.5px;color:#9db4d2;margin-bottom:8px;text-align:center;}
  .palette{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:2px 0 14px;}
  .pbtn{min-width:32px;height:32px;border-radius:8px;border:1px solid #34507a;background:#16243a;color:#cfe0f5;font-weight:700;cursor:pointer;font-size:13px;padding:0 6px;font-family:inherit;}
  .pbtn:hover{filter:brightness(1.18);}
  .pbtn.cur{outline:3px solid #ffd166;outline-offset:1px;}
  .pbtn.ok{background:#2bbf80;color:#06281b;border-color:#2bbf80;}
  .pbtn.bad{background:#ef6b5b;color:#3a0b05;border-color:#ef6b5b;}
  .pbtn.seen{background:#274063;}
  .pbtn.sub{background:#2ea3e6;color:#06283b;border:none;}
  .stage{background:#fbfdff;color:#16263d;border-radius:16px;box-shadow:0 12px 30px rgba(0,0,0,.4);padding:24px 22px;min-height:240px;}
  .kind{font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:#2c5fa0;margin-bottom:12px;}
  .q{font-size:20px;font-weight:700;line-height:1.35;margin-bottom:6px;}
  .ahint{color:#5a6b82;font-size:13px;margin-bottom:12px;}
  .answer{font-size:17px;line-height:1.5;color:#1d3a2a;background:#e9f8ef;border-left:4px solid #36c98b;padding:12px 14px;border-radius:0 6px 6px 0;margin-top:14px;display:none;}
  .answer.show{display:block;} .answer b{color:#15633f;}
  .fillline{font-size:19px;line-height:1.7;}
  .fillinp{font-size:18px;padding:6px 10px;border:2px solid #9db8de;border-radius:7px;min-width:140px;background:#fff;color:#16263d;}
  .fillinp.ok{border-color:#36c98b;background:#eafaf1;} .fillinp.bad{border-color:#ef6b5b;background:#fdecea;}
  .opts{display:flex;flex-direction:column;gap:10px;margin-top:8px;}
  .opt{text-align:left;background:#eef3fb;border:2px solid #cfdcef;border-radius:10px;padding:12px 14px;font-size:16px;cursor:pointer;color:#16263d;transition:.1s;font-family:inherit;}
  .opt:hover{background:#e2ecfa;} .opt.ok{background:#e3f8ed;border-color:#36c98b;} .opt.bad{background:#fdecea;border-color:#ef6b5b;} .opt.dim{opacity:.55;}
  .pool{display:flex;flex-wrap:wrap;gap:9px;margin:6px 0 16px;min-height:20px;}
  .chip{background:#2e5496;color:#fff;border-radius:9px;padding:9px 13px;font-size:15px;cursor:grab;user-select:none;border:2px solid transparent;}
  .chip.sel{border-color:#ffd166;box-shadow:0 0 0 2px #ffd16655;} .chip.dragging{opacity:.5;}
  .zones{display:flex;flex-direction:column;gap:10px;}
  .zone{display:flex;align-items:center;gap:10px;background:#eef3fb;border:2px dashed #9db8de;border-radius:10px;padding:10px 12px;min-height:48px;}
  .zone.over{background:#dcebff;border-color:#2ea3e6;}
  .zlabel{font-size:14.5px;color:#26405f;flex:1;}
  .zslot{display:flex;flex-wrap:wrap;gap:7px;min-width:120px;min-height:40px;align-items:center;padding:4px;border-radius:8px;}
  .zone.ok{border-style:solid;border-color:#36c98b;background:#eafaf1;} .zone.bad{border-style:solid;border-color:#ef6b5b;background:#fdecea;}
  .catbox{flex-direction:column;align-items:stretch;} .catbox .zslot{min-height:54px;}
  .controls{display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap;}
  .btn{cursor:pointer;border:none;padding:13px 20px;border-radius:10px;font-weight:600;font-size:15px;font-family:inherit;transition:.12s;}
  .btn:hover{filter:brightness(1.08);}
  .btn-pri{background:#2ea3e6;color:#06283b;} .btn-ok{background:#36c98b;color:#06281b;} .btn-bad{background:#ef6b5b;color:#3a0b05;} .btn-ghost{background:#1b2c45;color:#cfe0f5;border:1px solid #34507a;}
  .fb{text-align:center;font-weight:700;font-size:16px;margin-top:14px;min-height:22px;}
  .fb.good{color:#2bbf80;} .fb.no{color:#ff8a7a;}
  .center{text-align:center;} .big{font-size:46px;font-weight:800;margin:6px 0;}
  .kbd{display:inline-block;background:#22354f;border:1px solid #3a5680;border-radius:5px;padding:1px 7px;font-size:12px;color:#cfe0f5;}
  .qfig{margin:4px 0 14px;text-align:center;background:#f3f7fc;border:1px solid #d8e3f1;border-radius:10px;padding:12px 8px;overflow-x:auto;}
  .qfig svg{max-width:100%;height:auto;}
  .qfig img{max-width:100%;max-height:300px;border-radius:6px;}
  .qfig table{border-collapse:collapse;margin:2px;}
  .qfig td{border:1px solid #9db8de;min-width:24px;height:24px;text-align:center;font-size:12.5px;color:#16263d;padding:0 2px;}
  .qfig .xcell{background:#fff3b0;font-weight:bold;color:#9a7b00;}
  .qfig .fcell{background:#e3ecfb;}
  .convrow{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;}
  .convrow .op{font-size:20px;font-weight:bold;color:#2c5fa0;}
  .convrow .cap{font-size:11px;color:#5a6b82;display:block;margin-top:3px;}

  .reading{background:#fbfdff;color:#16263d;border-radius:14px;padding:24px 28px;
    max-width:760px;margin:0 auto 18px;line-height:1.55;font-size:15.5px;
    box-shadow:0 8px 22px rgba(0,0,0,.25);}
  .reading h2{color:#1f3864;margin:0 0 10px;font-size:22px;border-bottom:2px solid #cfdcef;padding-bottom:6px;}
  .reading h3{color:#2c5fa0;margin:18px 0 6px;font-size:17px;}
  .reading p{margin:6px 0 10px;}
  .reading p.lead{font-size:16px;color:#26405f;font-style:italic;}
  .reading ul,.reading ol{margin:4px 0 10px 24px;padding:0;}
  .reading li{margin:3px 0;}
  .reading code{background:#eef3fb;border:1px solid #d8e3f1;padding:1px 5px;
    border-radius:3px;font-family:Consolas,'Courier New',monospace;font-size:13.5px;color:#c0392b;}
  .reading pre{background:#eef3fb;border-left:4px solid #2c5fa0;padding:8px 12px;
    border-radius:0 6px 6px 0;overflow-x:auto;margin:8px 0;}
  .reading pre code{background:none;border:none;color:#1f3864;padding:0;font-size:13px;}
  .reading strong{color:#1f3864;}
  .reading em{color:#2c5fa0;font-style:italic;}
  .reading .summary{background:#e3f8ed;border-left:4px solid #36c98b;padding:10px 14px;
    border-radius:0 6px 6px 0;margin-top:18px;}
  .reading .summary h3{color:#15633f;margin-top:0;}
  /* ===== Modal popup pre teóriu krokov projektu (téma 7) ===== */
  .modal{position:fixed;inset:0;display:none;z-index:9999;}
  .modal.open{display:block;}
  .modal-back{position:absolute;inset:0;background:rgba(15,30,55,0.6);}
  .modal-card{position:absolute;top:5vh;left:50%;transform:translateX(-50%);
    width:min(900px,92vw);max-height:90vh;overflow-y:auto;
    background:#fff;border-radius:14px;box-shadow:0 18px 60px rgba(0,0,0,.25);
    padding:24px 28px;color:#16263d;}
  .modal-close{position:absolute;top:10px;right:14px;width:34px;height:34px;
    border:none;background:#f0f4fa;border-radius:50%;font-size:20px;cursor:pointer;color:#1f3864;}
  .modal-close:hover{background:#dde6f3;}
  .modal-body h2{color:#1f3864;margin:0 0 10px;font-size:22px;border-bottom:2px solid #cfdcef;padding-bottom:6px;}
  .modal-body h3{color:#2c5fa0;margin:18px 0 6px;font-size:16px;}
  .modal-body h4{color:#1f3864;margin:0 0 6px;font-size:14px;}
  .modal-body p{margin:6px 0 10px;line-height:1.55;}
  .modal-body p.thintro{font-size:15px;color:#26405f;font-style:italic;background:#eef3fb;
    padding:8px 12px;border-radius:6px;border-left:4px solid #2c5fa0;}
  .modal-body pre{background:#f4f7fc;border-left:3px solid #2c5fa0;padding:8px 12px;
    border-radius:0 6px 6px 0;overflow-x:auto;font-size:13px;margin:8px 0;}
  .modal-body code{background:#eef3fb;border:1px solid #d8e3f1;padding:1px 5px;
    border-radius:4px;font-size:13px;color:#1f3864;}
  .modal-body pre code{background:none;border:none;padding:0;}
  .thbox{margin:14px 0;padding:12px 16px;border-radius:8px;border-left:5px solid #aaa;}
  .thbox h4{margin-top:0;}
  .thbox ul{margin:6px 0 0 18px;padding:0;}
  .thbox li{margin:3px 0;line-height:1.5;}
  .thpochop{background:#fff7e3;border-left-color:#e6a23c;}
  .thpochop h4{color:#8a5a00;}
  .thnabif{background:#e3f8ed;border-left-color:#36c98b;}
  .thnabif h4{color:#15633f;}
  .thtable{width:100%;border-collapse:collapse;margin:8px 0;font-size:13px;}
  .thtable th,.thtable td{border:1px solid #d8e3f1;padding:5px 8px;text-align:left;vertical-align:top;}
  .thtable th{background:#eef3fb;color:#1f3864;font-weight:bold;}
  .thtable td code{font-size:12px;}
  .theory-btn{display:inline-flex;align-items:center;gap:6px;background:#eef3fb;
    color:#1f3864;border:1px solid #d8e3f1;padding:6px 12px;border-radius:18px;
    cursor:pointer;font-size:13px;margin-bottom:10px;font-weight:600;}
  .theory-btn:hover{background:#dde6f3;}
</style>
</head>
<body>
<div id="roz">
  <h1>📊 Cvičenia + Projekt — interaktívne učenie</h1>
  <div class="sub">7 tém · chronologicky po úlohách. Klikni na tému → prečítaj si návod → spusti test. Pokrok sa ukladá samostatne.</div>
  <div class="grid" id="grid"></div>
  <div class="foot">
    <button class="reset" id="reset">Vynulovať pokrok</button><br><br>
    🔄 Alternatíva: <a class="pdf" href="index_prednasky.html">Učenie po prednáškach (10 tém z PDF slidov)</a> · 📄 <a class="pdf" href="../poznamky/">PDF poznámky</a> · <a class="pdf" href="../prednasky/">PDF prednášky</a>.
  </div>
</div>
<div id="test" style="display:none"></div>

<div id="theoryModal" class="modal" aria-hidden="true">
  <div class="modal-back" onclick="closeTheory()"></div>
  <div class="modal-card">
    <button class="modal-close" onclick="closeTheory()" aria-label="Zavrieť">×</button>
    <div class="modal-body"></div>
  </div>
</div>

<script>
/* ===== helpers ===== */
function el(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
function norm(s){return (s||'').toString().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]/g,'');}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

/* ===== engine: jeden test do kontajnera ===== */
function runTest(T, root, onExit, onProgress){
  const N=T.tasks.length;
  root.innerHTML='';
  const wrap=el('div');
  const top=el('div','top');
  const home=el('button','home','‹ Rozcestník');
  const th=el('div','th', T.num+'. '+T.name);
  top.append(home, th);
  const progwrap=el('div','progwrap'); const prog=el('div','prog'); progwrap.appendChild(prog);
  const meta=el('div','meta'); const palette=el('div','palette'); const stageHost=el('div');
  const controls=el('div','controls'); const fb=el('div','fb');
  wrap.append(top,progwrap,meta,palette,stageHost,fb,controls);
  root.appendChild(wrap);

  let state=new Array(N).fill('todo'), cells=new Array(N), cur=null, pos=0;
  function score(){return state.filter(s=>s==='ok').length;}
  function todoCount(){return state.filter(s=>s==='todo').length;}
  function touchedCount(){let n=0;for(let i=0;i<N;i++){if(cells[i]&&(cells[i].touched||cells[i].done))n++;}return n;}
  function setControls(bs){controls.innerHTML='';bs.forEach(b=>{if(!b)return;const x=el('button','btn '+(b.cls||'btn-ghost'),b.label);x.onclick=b.on;controls.appendChild(x);});}
  function setFB(t,g){fb.textContent=t||'';fb.className='fb '+(t?(g?'good':'no'):'');}
  function saveProgress(){
    const answered=N-todoCount(), correct=score(), touched=touchedCount(), pct=N?Math.round(correct/N*100):0;
    let best=pct; const prev=(PROG&&PROG[T.num])||null; if(prev) best=Math.max(pct, prev.best!=null?prev.best:0);
    onProgress(T.num, {n:N,answered:answered,correct:correct,touched:touched,pct:pct,best:best,done:answered===N});
  }
  function markTouched(c){if(c&&!c.touched){c.touched=true;saveProgress();renderNav();}}
  function navButtons(extra){
    const arr=[{label:'‹ Späť',cls:'btn-ghost',on:()=>goTo(pos-1)}];
    (extra||[]).forEach(e=>arr.push(e));
    if(pos<N-1) arr.push({label:'Ďalej ›',cls:'btn-ghost',on:()=>goTo(pos+1)});
    else arr.push({label:'Vyhodnotiť ▸',cls:'btn-pri',on:results});
    setControls(arr);
  }
  function renderNav(){
    palette.innerHTML='';
    for(let i=0;i<N;i++){const seen=cells[i]&&state[i]==='todo';
      const cls='pbtn'+(state[i]==='ok'?' ok':state[i]==='bad'?' bad':(seen?' seen':''))+(i===pos?' cur':'');
      const b=el('button',cls,String(i+1));b.onclick=()=>goTo(i);palette.appendChild(b);}
    const sub=el('button','pbtn sub','✓ Vyhodnotiť');sub.onclick=results;palette.appendChild(sub);
    prog.style.width=Math.round((pos+1)/N*100)+'%';
    meta.textContent='Otázka '+(pos+1)+' / '+N+'   •   správne '+score()+(todoCount()?('   •   nezodp. '+todoCount()):'');
  }
  function show(node){while(stageHost.firstChild)stageHost.removeChild(stageHost.firstChild);stageHost.appendChild(node);}
  function goTo(i){clearSel();dragged=null;pos=Math.max(0,Math.min(N-1,i));cur=cells[pos]||buildCell(pos);show(cur.el);
    setFB(cur.fb?cur.fb.txt:'',cur.fb?cur.fb.good:false);cur.refreshControls();renderNav();
    if(cur._focus&&!cur.done){setTimeout(cur._focus,20);}}
  function record(c,ok){if(c.done)return;c.done=true;c.touched=true;state[c.idx]=ok?'ok':'bad';
    c.fb={txt:ok?'✓ Správne':'✗ Nesprávne',good:ok};saveProgress();renderNav();
    if(c===cur){setFB(c.fb.txt,c.fb.good);c.refreshControls();}}
  function buildCell(i){const cell={idx:i,done:false,touched:false,revealed:false,fb:null,isFlash:false,_check:null,_reveal:null,_focus:null,autoEval:null,refreshControls:()=>navButtons([])};
    const host=el('div','stage');cell.el=host;
    if(T.tasks[i].step && typeof CVIKA_THEORIES!=='undefined' && CVIKA_THEORIES[T.num] && CVIKA_THEORIES[T.num][T.tasks[i].step]){
      const tb=el('button','theory-btn','📚 Teória k tomuto kroku');
      tb.onclick=()=>openTheory(T.num, T.tasks[i].step);
      host.appendChild(tb);
    }
    RENDER[T.tasks[i].type](T.tasks[i],cell,host);
    if(T.tasks[i].fig){const f=el('figure','qfig');f.innerHTML=T.tasks[i].fig;const a=host.querySelector('.q')||host.querySelector('.kind');if(a){if(a.nextSibling)host.insertBefore(f,a.nextSibling);else host.appendChild(f);}else host.insertBefore(f,host.firstChild);}
    cells[i]=cell;return cell;}
  function startTest(){state=new Array(N).fill('todo');cells=new Array(N);pos=0;goTo(0);}
  function startIntro(){
    const best=(PROG&&PROG[T.num])||null;
    palette.innerHTML='';prog.style.width='0%';meta.textContent='';
    const s=el('div');
    const hdr=el('div','stage');
    hdr.style.marginBottom='10px';
    hdr.innerHTML='<div class="center"><div class="kind">T\u00e9ma '+T.num+' \u2014 '+N+' ot\u00e1zok</div>'
      +'<div class="q" style="margin-top:6px">'+T.name+'</div>'
      +(best?'<p style="color:#2c8f63;font-weight:700;margin:6px 0 0">Najlep\u0161ie: '+(best.best!=null?best.best:0)+'%</p>':'')
      +'<p style="font-size:13px;color:#7a8ba3;margin:8px 0 0">\ud83d\udcd6 Najprv si pre\u010d\u00edtaj n\u00e1vod, potom spusti test. Kl\u00e1vesy: <span class="kbd">Enter</span> skontrolova\u0165 \u00b7 <span class="kbd">\u2190</span>/<span class="kbd">\u2192</span> ot\u00e1zky \u00b7 <span class="kbd">medzern\u00edk</span> karti\u010dka.</p></div>';
    s.appendChild(hdr);
    if(T.reading){
      const r=el('div','reading');
      r.innerHTML=T.reading;
      s.appendChild(r);
    }
    show(s);setFB('');
    setControls([{label:'\u25b6 Spusti\u0165 test',cls:'btn-pri',on:startTest}]);
  }
  function results(){
    for(let i=0;i<N;i++){if(cells[i]&&cells[i].autoEval)cells[i].autoEval();}
    const sc=score(),un=todoCount(),pct=Math.round(sc/N*100);saveProgress();
    let emo=pct===100?'🏆':pct>=80?'🎉':pct>=50?'💪':'📚';
    const s=el('div','stage');
    s.innerHTML='<div class="center"><div class="big">'+emo+' '+pct+'%</div>'
      +'<p style="font-size:17px;color:#26405f">Správne '+sc+' z '+N+'.'+(un?(' Nezodpovedané: '+un+'.'):'')+'</p>'
      +(sc<N?'<p style="color:#7a8ba3;font-size:14px">V navigácii hore klikni na <b>červené</b> čísla a oprav si ich.</p>':'<p style="color:#2c8f63;font-weight:700">Bez chyby! 👏</p>')+'</div>';
    show(s);setFB('');renderNav();meta.textContent='Vyhodnotenie';prog.style.width='100%';
    const btns=[];const fw=state.findIndex(s2=>s2==='bad');
    if(fw>=0)btns.push({label:'↦ Na prvú nesprávnu',cls:'btn-bad',on:()=>goTo(fw)});
    btns.push({label:'↻ Skúsiť znova',cls:'btn-ghost',on:startTest});
    btns.push({label:'‹ Späť na otázky',cls:'btn-ghost',on:()=>goTo(pos)});
    setControls(btns);
  }
  /* DnD */
  let dragged=null,selected=null;
  function poolOf(node){return node.closest('.stage').querySelector('.pool');}
  function makeChip(val,data){const c=el('span','chip',val);c.draggable=true;if(data)Object.keys(data).forEach(k=>c.dataset[k]=data[k]);
    c.addEventListener('dragstart',e=>{dragged=c;c.classList.add('dragging');e.dataTransfer.setData('text','x');});
    c.addEventListener('dragend',()=>{c.classList.remove('dragging');dragged=null;});
    c.addEventListener('click',()=>{if(c.parentElement&&c.parentElement.classList.contains('zslot')){poolOf(c).appendChild(c);markTouched(cur);clearSel();return;}
      if(selected===c){clearSel();}else{clearSel();selected=c;c.classList.add('sel');}});
    return c;}
  function clearSel(){if(selected){selected.classList.remove('sel');selected=null;}}
  function makeSlot(zone,single){const slot=el('div','zslot');slot.dataset.single=single?'1':'';
    zone.addEventListener('dragover',e=>{e.preventDefault();zone.classList.add('over');});
    zone.addEventListener('dragleave',()=>zone.classList.remove('over'));
    zone.addEventListener('drop',e=>{e.preventDefault();zone.classList.remove('over');if(dragged){placeIn(slot,dragged);markTouched(cur);}});
    zone.addEventListener('click',()=>{if(selected){placeIn(slot,selected);markTouched(cur);clearSel();}});
    return slot;}
  function placeIn(slot,chip){if(!chip||chip.closest('.stage')!==slot.closest('.stage'))return;if(slot.dataset.single==='1'&&slot.children.length){poolOf(slot).appendChild(slot.children[0]);}slot.appendChild(chip);}
  /* renderers */
  const RENDER={
    flash(t,cell,host){
      host.appendChild(el('div','kind','Kartička — vybav si z hlavy'));
      host.appendChild(el('div','q',t.q));
      host.appendChild(el('div','ahint','Klikni „Ukázať odpoveď" (alebo medzerník), potom sa ohodnoť.'));
      const ans=el('div','answer',t.a);host.appendChild(ans);cell.isFlash=true;
      cell._reveal=function(){if(cell.done)return;cell.revealed=true;markTouched(cell);ans.classList.add('show');cell.refreshControls();};
      cell.refreshControls=function(){if(cell.done)navButtons([]);
        else if(cell.revealed)navButtons([{label:'✗ Nevedel',cls:'btn-bad',on:()=>record(cell,false)},{label:'✓ Vedel',cls:'btn-ok',on:()=>record(cell,true)}]);
        else navButtons([{label:'Ukázať odpoveď (medzerník)',cls:'btn-pri',on:cell._reveal}]);};
    },
    fill(t,cell,host){
      host.appendChild(el('div','kind','Doplňovačka — napíš chýbajúce slovo'));
      const parts=t.text.split('___');const line=el('div','fillline');
      line.appendChild(document.createTextNode(parts[0]||''));
      const inp=el('input','fillinp');inp.type='text';inp.autocomplete='off';inp.spellcheck=false;line.appendChild(inp);
      line.appendChild(document.createTextNode(parts[1]||''));host.appendChild(line);
      cell._focus=()=>inp.focus();
      inp.addEventListener('input',()=>markTouched(cell));
      inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();check();}});
      function check(){if(cell.done)return;const good=[t.answer].concat(t.alts||[]).some(a=>norm(a)===norm(inp.value));
        inp.classList.add(good?'ok':'bad');inp.disabled=true;
        if(!good){host.appendChild(el('div','answer show','Správne: <b>'+t.answer+'</b>'));}record(cell,good);}
      cell._check=check;cell.autoEval=function(){if(!cell.done&&inp.value.trim()!=='')check();};
      cell.refreshControls=function(){if(cell.done)navButtons([]);
        else navButtons([{label:'Skontrolovať (Enter)',cls:'btn-pri',on:check},{label:'Ukáž',cls:'btn-ghost',on:()=>{inp.value=t.answer;markTouched(cell);}}]);};
    },
    quiz(t,cell,host){
      host.appendChild(el('div','kind','Kvíz — vyber správnu odpoveď'));
      host.appendChild(el('div','q',t.q));const opts=el('div','opts');
      shuffle(t.options.map((o,i)=>({o,i}))).forEach(({o,i})=>{const b=el('button','opt',o);b.onclick=()=>pick(i,b);opts.appendChild(b);});
      host.appendChild(opts);cell.refreshControls=function(){navButtons([]);};
      function pick(i,b){if(cell.done)return;[...opts.children].forEach(c=>c.classList.add('dim'));b.classList.remove('dim');
        if(i===t.correct){b.classList.add('ok');record(cell,true);}
        else{b.classList.add('bad');[...opts.children].forEach(c=>{if(c.textContent===t.options[t.correct]){c.classList.remove('dim');c.classList.add('ok');}});record(cell,false);}
        if(t.explain)host.appendChild(el('div','answer show',t.explain));}
    },
    match(t,cell,host){dndTask(t,'match',cell,host);},
    order(t,cell,host){dndTask(t,'order',cell,host);},
    cat(t,cell,host){dndTask(t,'cat',cell,host);}
  };
  function dndTask(t,mode,cell,host){
    const kind=mode==='order'?'Drag &amp; drop — usporiadaj do správneho poradia':mode==='cat'?'Drag &amp; drop — roztrieď do skupín':'Drag &amp; drop — priraď k sebe';
    host.appendChild(el('div','kind',kind));host.appendChild(el('div','q',t.prompt));
    host.appendChild(el('div','ahint','Ťahaj kartičky myšou — alebo klikni kartičku a potom cieľ.'));
    const pool=el('div','pool');const zones=el('div','zones');let chips=[];
    if(mode==='order'){const items=t.items.map((v,i)=>({v,i}));shuffle(items).forEach(it=>chips.push(makeChip(it.v,{idx:it.i})));
      t.items.forEach((_,i)=>{const z=el('div','zone');z.dataset.slot=i;z.appendChild(el('div','zlabel',(i+1)+'.'));z.appendChild(makeSlot(z,true));zones.appendChild(z);});}
    else if(mode==='match'){shuffle(t.pairs.map(p=>p[0])).forEach(term=>chips.push(makeChip(term,{})));
      shuffle(t.pairs.slice()).forEach(p=>{const z=el('div','zone');z.dataset.correct=p[0];z.appendChild(el('div','zlabel',p[1]));z.appendChild(makeSlot(z,true));zones.appendChild(z);});}
    else{const groups=Object.keys(t.groups);let all=[];groups.forEach(g=>t.groups[g].forEach(v=>all.push({v,g})));
      shuffle(all).forEach(it=>chips.push(makeChip(it.v,{grp:it.g})));
      groups.forEach(g=>{const z=el('div','zone catbox');z.dataset.group=g;z.appendChild(el('div','zlabel','<b>'+g+'</b>'));z.appendChild(makeSlot(z,false));zones.appendChild(z);});}
    chips.forEach(c=>pool.appendChild(c));host.appendChild(pool);host.appendChild(zones);
    function check(silent){if(cell.done)return;if(pool.children.length){if(!silent)setFB('Najprv umiestni všetky kartičky.',false);return;}
      let ok=true;[...zones.children].forEach(z=>{const ch=z.querySelector('.zslot').children;let zok=true;
        if(mode==='order'){zok=ch.length===1&&(+ch[0].dataset.idx===+z.dataset.slot);}
        else if(mode==='match'){zok=ch.length===1&&(ch[0].textContent===z.dataset.correct);}
        else{zok=[...ch].every(c=>c.dataset.grp===z.dataset.group);if(!ch.length)zok=true;}
        z.classList.add(zok?'ok':'bad');if(!zok)ok=false;});
      if(!ok){host.appendChild(el('div','answer show',solutionText(t,mode)));}record(cell,ok);}
    cell._check=()=>check(false);cell.autoEval=function(){if(!cell.done&&!pool.children.length)check(true);};
    cell.refreshControls=function(){if(cell.done)navButtons([]);else navButtons([{label:'Skontrolovať (Enter)',cls:'btn-pri',on:()=>check(false)}]);};
  }
  function solutionText(t,mode){
    if(mode==='order')return '<b>Správne poradie:</b> '+t.items.map((v,i)=>(i+1)+') '+v).join('  ·  ');
    if(mode==='match')return '<b>Správne dvojice:</b><br>'+t.pairs.map(p=>'• '+p[0]+' → '+p[1]).join('<br>');
    return '<b>Správne zaradenie:</b><br>'+Object.keys(t.groups).map(g=>'• <b>'+g+':</b> '+t.groups[g].join(', ')).join('<br>');
  }
  /* klávesnica — aktívna len počas tohto testu */
  function keyHandler(e){
    const typing=document.activeElement&&(document.activeElement.tagName==='INPUT'||document.activeElement.tagName==='TEXTAREA');
    if(!cur)return;
    if(e.key==='Enter'){if(cur._check){e.preventDefault();cur._check();}else if(cur.isFlash&&!cur.revealed){e.preventDefault();cur._reveal&&cur._reveal();}return;}
    if(typing)return;
    if(e.key==='ArrowRight'){goTo(pos+1);}else if(e.key==='ArrowLeft'){goTo(pos-1);}
    else if(e.code==='Space'&&cur.isFlash&&!cur.revealed){e.preventDefault();cur._reveal&&cur._reveal();}
  }
  document.addEventListener('keydown',keyHandler);
  function exit(){document.removeEventListener('keydown',keyHandler);onExit&&onExit();}
  home.onclick=exit;
  startIntro();
}
