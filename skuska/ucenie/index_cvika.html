&lt;h3&gt;Vizuálne (surový riadok → CSV)&lt;/h3&gt;
&lt;pre&gt;RAW:  193.87.12.30 - - [17/Dec/2017:06:28:17 +0100]
      "GET /index.html HTTP/1.1" 200 12345 "-" "Mozilla/5.0..."
                              ↓ regex + filter
CSV:  IP | DateTime | Method | URL | Status | Bytes | Referrer | Agent&lt;/pre&gt;
&lt;table class="thtable"&gt;&lt;tr&gt;&lt;th&gt;Filter&lt;/th&gt;&lt;th&gt;Pravidlo&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Method&lt;/td&gt;&lt;td&gt;iba &lt;code&gt;GET&lt;/code&gt; (POST = formulár, HEAD = skript)&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Status&lt;/td&gt;&lt;td&gt;&lt;code&gt;200–399&lt;/code&gt; (úspech + presmerovanie)&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;URL&lt;/td&gt;&lt;td&gt;vyhoď &lt;code&gt;.jpg .png .css .js .woff .ico ...&lt;/code&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;
&lt;div class="thbox thpochop"&gt;&lt;h4&gt;Pochop (princíp, prečo)&lt;/h4&gt;&lt;ul&gt;
&lt;li&gt;Jedna HTML stránka s 30 obrázkami = 31 riadkov v logu. Bez filtra by sa "počet stránok na sedenie" 30× nadhodnotil.&lt;/li&gt;
&lt;li&gt;Regex namiesto &lt;code&gt;read_csv&lt;/code&gt;, lebo úvodzovkové polia (URL, Referrer, Agent) obsahujú medzery a &lt;code&gt;read_csv&lt;/code&gt; by ich rozsekal na nesprávnych miestach.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Prečo vyhodiť POST&lt;/b&gt; (Method ≠ GET): POST znamená, že človek nepozeral novú stránku, ale &lt;b&gt;odosielal formulár&lt;/b&gt; (napr. prihlásil sa, poslal komentár). Vo WUM nás zaujímajú &lt;b&gt;cesty po webe&lt;/b&gt; — kde človek klikal. POST nie je klik na nový obsah, je to akcia. Keby sme ho nechali, v sekvenciách by sa objavila "stránka" /login-submit, ktorá ale nezobrazila nič — len spracovala dáta a presmerovala. Analógia: v košíku zákazníka v obchode sledujeme, &lt;b&gt;kam išiel pre tovar&lt;/b&gt;, nie keď podpisuje doklad pri kase.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Prečo vyhodiť 4xx/5xx&lt;/b&gt; (Status mimo 200–399): kód 4xx (typicky 404 = stránka neexistuje) znamená, že &lt;b&gt;server nič nezobrazil&lt;/b&gt; — používateľ dostal chybovú hlášku, nie obsah. Keby sme to nechali, do "navštívené stránky" by sa zaratávali aj URL, ktoré nikto nikdy reálne nevidel. Kód 5xx = server zlyhal, používateľ tiež nič nedostal. Analógia: ak zákazník v obchode siahne po polici, kde je len cenovka ale nie tovar, do "čo si pozrel" to nepatrí.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Prečo vyhodiť statiku&lt;/b&gt; (.jpg, .css, .js, .woff, .ico, .png...): tieto súbory si prehliadač sťahuje &lt;b&gt;sám automaticky&lt;/b&gt; ako súčasť stránky — používateľ na ne nekliknul. Munk v prednáške 5 to ukazuje na príklade UKF: jedno otvorenie hlavnej stránky vygeneruje desiatky riadkov typu &lt;code&gt;/templates/.../template.css&lt;/code&gt; alebo &lt;code&gt;/images/ukf_budova_jesen.jpg&lt;/code&gt; — to nie sú navigácie, to je "obal" stránky. Keby sme to nechali, &lt;b&gt;každá analýza by bola skreslená 20–30× viac riadkami&lt;/b&gt;, ktoré nepatria ľudskému správaniu. Analógia: keď človek nastúpi do autobusu, neevidujeme každú skrutku v autobuse — evidujeme len jeho samotný nástup.&lt;/li&gt;
&lt;li&gt;Súhrn: cieľ filtrov = nechať len &lt;b&gt;jeden riadok = jedno reálne zobrazenie stránky človekom&lt;/b&gt;. Všetko ostatné by skreslilo počty, sedenia aj asociačné pravidlá vo fáze 2.&lt;/li&gt;
&lt;/ul&gt;&lt;/div&gt;
&lt;div class="thbox thnabif"&gt;&lt;h4&gt;Nabif (vzorce, čísla, idiómy)&lt;/h4&gt;&lt;ul&gt;
&lt;li&gt;Pred: &lt;b&gt;909 828&lt;/b&gt; → Po: &lt;b&gt;211 313&lt;/b&gt; (zníženie o &lt;b&gt;77 %&lt;/b&gt;).&lt;/li&gt;
&lt;li&gt;Prípony: &lt;code&gt;bmp|jpe?g|png|gif|css|flv|ico|swf|rss|xml|cur|js|json|svg|woff2?|eot|ttf|otf&lt;/code&gt;.&lt;/li&gt;
&lt;li&gt;Koniec prípony: &lt;code&gt;(?:\\?|$)&lt;/code&gt; — aby sa nezachytilo &lt;code&gt;/some.css.html&lt;/code&gt;.&lt;/li&gt;
&lt;li&gt;Status filter: &lt;code&gt;200 &amp;lt;= code &amp;lt;= 399&lt;/code&gt;.&lt;/li&gt;
&lt;/ul&gt;&lt;/div&gt;`,
  '02': `&lt;h2&gt;Krok 02 — IP adresy robotov&lt;/h2&gt;
&lt;p class="thintro"&gt;Nájdeme IP adresy, ktoré si stiahli &lt;code&gt;robots.txt&lt;/code&gt;. Bežný používateľ ten súbor nikdy nevidí — kto si ho stiahol, je takmer určite robot.&lt;/p&gt;
&lt;h3&gt;Ako sme to robili v projekte&lt;/h3&gt;
&lt;p&gt;Prejdeme znova surový logový týždeň. Pre rýchlosť najprv hľadáme &lt;b&gt;substringom&lt;/b&gt; reťazec "robots.txt" (regex je drahý). Až keď je tam, spustíme regex (riadky 48–56 v skripte), vytiahneme IP (skupina 1) a URL (skupina 4) a overíme, že URL skutočne obsahuje &lt;code&gt;robots.txt&lt;/code&gt; (riadok 92). Tým vylúčime prípady, keď sa reťazec "robots.txt" objavil len v User-Agente (napr. "robots.txt-checker"). IP uložíme do CSV pre úlohu 03; duplikáty necháme — odstráni ich nasledujúci krok.&lt;/p&gt;
&lt;pre&gt;&lt;code&gt;if "robots.txt" not in line.lower(): continue   # lacný predfilter (riadok 80)
m = pattern.match(line)                          # drahý regex (riadok 84)
if m and "robots.txt" in m.group(4).lower():     # overenie že je v URL (riadok 92)
    rows.append(m.group(1))                      # uložíme IP&lt;/code&gt;&lt;/pre&gt;
&lt;h3&gt;Vizuálne — logika&lt;/h3&gt;
&lt;svg width="380" height="80" xmlns="http://www.w3.org/2000/svg"&gt;
&lt;rect x="5" y="20" width="100" height="40" fill="#eef" stroke="#557"/&gt;
&lt;text x="55" y="45" text-anchor="middle" font-size="11"&gt;log (216 MB)&lt;/text&gt;
&lt;text x="135" y="45" font-size="14"&gt;→&lt;/text&gt;
&lt;rect x="155" y="20" width="120" height="40" fill="#fed" stroke="#a52"/&gt;
&lt;text x="215" y="38" text-anchor="middle" font-size="11"&gt;match "robots.txt"&lt;/text&gt;
&lt;text x="215" y="54" text-anchor="middle" font-size="10"&gt;v URL poli&lt;/text&gt;
&lt;text x="290" y="45" font-size="14"&gt;→&lt;/text&gt;
&lt;rect x="305" y="20" width="70" height="40" fill="#dfd" stroke="#262"/&gt;
&lt;text x="340" y="38" text-anchor="middle" font-size="11"&gt;250 IP&lt;/text&gt;
&lt;text x="340" y="54" text-anchor="middle" font-size="10"&gt;robotov&lt;/text&gt;
&lt;/svg&gt;
&lt;h3&gt;Čo je vlastne &lt;code&gt;robots.txt&lt;/code&gt; (RFC 9309 — Robot Exclusion Protocol)&lt;/h3&gt;
&lt;p&gt;&lt;b&gt;Robot Exclusion Protocol&lt;/b&gt; je &lt;b&gt;formálny štandard&lt;/b&gt; (od roku 2022 zachytený ako &lt;b&gt;RFC 9309&lt;/b&gt;) — dohoda medzi prevádzkovateľmi webov a tvorcami crawlerov. Hovorí: &lt;i&gt;„Slušný robot si pred prechádzaním stránky stiahne súbor &lt;code&gt;/robots.txt&lt;/code&gt; z koreňa domény a prečíta si v ňom, čo smie a čo nesmie navštíviť.“&lt;/i&gt;&lt;/p&gt;
&lt;ul&gt;
&lt;li&gt;&lt;b&gt;Kde sa nachádza?&lt;/b&gt; Vždy na rovnakej, pevnej adrese: &lt;code&gt;https://stránka.sk/robots.txt&lt;/code&gt;.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Kto si ho pýta?&lt;/b&gt; &lt;b&gt;Iba roboti&lt;/b&gt; (Googlebot, Bingbot, archivátori…). Bežný používateľ si ho &lt;b&gt;nikdy ručne nepýta&lt;/b&gt;, lebo na neho neexistuje odkaz na žiadnej stránke. Ani prehliadač (Chrome, Firefox…) si ho sám od seba &lt;b&gt;nesťahuje&lt;/b&gt; — nepotrebuje ho na zobrazenie stránky.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Dôsledok pre nás:&lt;/b&gt; ak v logu vidíme prístup na &lt;code&gt;/robots.txt&lt;/code&gt;, ten klient sa &lt;b&gt;sám prezradil&lt;/b&gt; — robí presne to, čo robí len robot.&lt;/li&gt;
&lt;/ul&gt;
&lt;p&gt;Munk v prednáške 5 uvádza tri spôsoby identifikácie robotov: (1) podľa User-Agent alebo IP, (2) &lt;b&gt;podľa prístupu k súboru robots.txt&lt;/b&gt; a (3) podľa prístupu na skrytý odkaz (honeypot). My v tomto kroku používame práve druhý, najsilnejší spôsob — nedá sa naň „klamať“ v User-Agente.&lt;/p&gt;
&lt;div class="thbox thpochop"&gt;&lt;h4&gt;Pochop (princíp, prečo)&lt;/h4&gt;&lt;ul&gt;
&lt;li&gt;&lt;code&gt;robots.txt&lt;/code&gt; = inštrukčný súbor pre crawlery, definovaný štandardom &lt;b&gt;RFC 9309&lt;/b&gt;. Neexistuje naň odkaz na stránke — človek ho nemá ako otvoriť.&lt;/li&gt;
&lt;li&gt;Prehliadač bežnému človeku tento súbor &lt;b&gt;automaticky nesťahuje&lt;/b&gt;. Preto platí jednoduché pravidlo: &lt;b&gt;kto si ho stiahol = robot&lt;/b&gt;.&lt;/li&gt;
&lt;li&gt;Toto je &lt;b&gt;najsilnejší&lt;/b&gt; signál robota — nezávisí od toho, ako sa robot pomenuje v User-Agent (môže klamať), ani od IP zoznamu (môže byť neúplný).&lt;/li&gt;
&lt;li&gt;Analógia: zoznam mien zamestnancov visí len v kancelárii personalistky. Kto si po neho príde, je personalista — turistu by nenapadlo si po neho pýtať.&lt;/li&gt;
&lt;li&gt;Substring match pred regexom šetrí čas — väčšina riadkov sa odfiltruje hneď (lacný &lt;code&gt;in&lt;/code&gt; → drahý &lt;code&gt;re.match&lt;/code&gt;).&lt;/li&gt;
&lt;/ul&gt;&lt;/div&gt;
&lt;div class="thbox thnabif"&gt;&lt;h4&gt;Nabif (vzorce, čísla, idiómy)&lt;/h4&gt;&lt;ul&gt;
&lt;li&gt;Štandard: &lt;b&gt;RFC 9309 — Robot Exclusion Protocol&lt;/b&gt; (2022). Súbor je vždy v &lt;code&gt;/robots.txt&lt;/code&gt; koreňa domény.&lt;/li&gt;
&lt;li&gt;Záznamov s &lt;code&gt;robots.txt&lt;/code&gt;: &lt;b&gt;2 354&lt;/b&gt;.&lt;/li&gt;
&lt;li&gt;Unikátnych IP robotov: &lt;b&gt;250&lt;/b&gt;.&lt;/li&gt;
&lt;li&gt;Idiom: dvojstupňový filter (lacný substring → drahý regex).&lt;/li&gt;
&lt;li&gt;Idiom: &lt;code&gt;if "robots.txt" in m.group(4).lower()&lt;/code&gt; — kontrola, že je v URL, nie v User-Agente.&lt;/li&gt;
&lt;li&gt;Výstup: &lt;code&gt;02_robot_ips.csv&lt;/code&gt; so stĺpcom &lt;code&gt;IP&lt;/code&gt; (s duplikátmi — odstránia sa v ďalšom kroku).&lt;/li&gt;
&lt;/ul&gt;&lt;/div&gt;`,
  '03': `&lt;h2&gt;Krok 03 — Filter robotov&lt;/h2&gt;
&lt;p class="thintro"&gt;Z očisteného logu (z úlohy 01) odstránime všetky prístupy robotov — 4 postupné filtre podľa User-Agent a podľa IP zoznamu z úlohy 02.&lt;/p&gt;

&lt;h3&gt;Prečo práve 4 vrstvy? (Munk, P5)&lt;/h3&gt;
&lt;p&gt;Munk v prednáške 5 uvádza, že robota vieme identifikovať &lt;b&gt;štyrmi spôsobmi&lt;/b&gt;: podľa &lt;b&gt;User-Agent&lt;/b&gt;, podľa &lt;b&gt;IP adresy&lt;/b&gt; (zoznam známych robotov), podľa &lt;b&gt;prístupu k súboru robots.txt&lt;/b&gt; (ten si v prehliadači nikto nedáva ručne — pýta si ho len robot) a podľa &lt;b&gt;prístupu ku skrytému odkazu&lt;/b&gt; (link, ktorý človek nevidí, lebo je zámerne ukrytý CSS-kou — kto naň klikne, je crawler).&lt;/p&gt;
&lt;p&gt;Naše 4 filtre pokrývajú &lt;b&gt;prvé tri Munkove metódy&lt;/b&gt;:&lt;/p&gt;
&lt;table class="thtable"&gt;&lt;tr&gt;&lt;th&gt;Munkova metóda&lt;/th&gt;&lt;th&gt;Náš filter&lt;/th&gt;&lt;th&gt;Riadok skriptu&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;1) User-Agent (slovo bot/crawl/spider)&lt;/td&gt;&lt;td&gt;Filter 1&lt;/td&gt;&lt;td&gt;r. 66–67&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;1) User-Agent (automat. nástroje cron/curl/wget…)&lt;/td&gt;&lt;td&gt;Filter 2&lt;/td&gt;&lt;td&gt;r. 80–81&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;1) User-Agent (prázdny "-")&lt;/td&gt;&lt;td&gt;Filter 3&lt;/td&gt;&lt;td&gt;r. 90&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;2) IP zoznam + 3) prístup k robots.txt&lt;/td&gt;&lt;td&gt;Filter 4&lt;/td&gt;&lt;td&gt;r. 103&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;4) Skrytý odkaz&lt;/td&gt;&lt;td&gt;&lt;i&gt;nepoužité&lt;/i&gt; (UKF stránka taký odkaz nemá)&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;
&lt;p&gt;Filter 4 je vlastne &lt;b&gt;2 metódy v jednom&lt;/b&gt;: zoznam IP z úlohy 02 vznikol presne tak, že sme našli IP, ktoré si vyžiadali &lt;code&gt;/robots.txt&lt;/code&gt; (Munkova metóda č. 3). Tým ich aj &lt;b&gt;blacklistujeme ako IP&lt;/b&gt; (metóda č. 2).&lt;/p&gt;

&lt;h3&gt;Ako sme to robili v projekte&lt;/h3&gt;
&lt;p&gt;Načítame CSV z úlohy 01 a CSV zoznam IP robotov z úlohy 02. Postupne odstraňujeme: (1) klasické boty podľa kľúčových slov v User-Agent, (2) automatizované skripty (curl, wget), (3) prázdne User-Agent (znak "-"), (4) všetky IP, ktoré sú v zozname robotov.&lt;/p&gt;
&lt;pre&gt;&lt;code&gt;df = df[~df["Agent"].str.contains(r"bot|crawl|spider", case=False)]
df = df[~df["Agent"].str.contains(r"cron|curl|wget|libwww|ltx71", case=False)]
df = df[df["Agent"] != "-"]
df = df[~df["IP"].isin(robot_ips)]&lt;/code&gt;&lt;/pre&gt;

&lt;h3&gt;Vizuálne — odpadanie po filtroch&lt;/h3&gt;
&lt;table class="thtable"&gt;&lt;tr&gt;&lt;th&gt;Filter&lt;/th&gt;&lt;th&gt;Zostalo&lt;/th&gt;&lt;th&gt;Ubudlo&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Štart&lt;/td&gt;&lt;td&gt;211 313&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;1) &lt;code&gt;bot|crawl|spider&lt;/code&gt;&lt;/td&gt;&lt;td&gt;154 333&lt;/td&gt;&lt;td&gt;−56 980&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;2) &lt;code&gt;cron|curl|wget|libwww|ltx71&lt;/code&gt;&lt;/td&gt;&lt;td&gt;95 096&lt;/td&gt;&lt;td&gt;−59 237&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;3) prázdny agent &lt;code&gt;"-"&lt;/code&gt;&lt;/td&gt;&lt;td&gt;78 592&lt;/td&gt;&lt;td&gt;−16 504&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;4) IP zo zoznamu (02)&lt;/td&gt;&lt;td&gt;&lt;b&gt;73 927&lt;/b&gt;&lt;/td&gt;&lt;td&gt;−4 665&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;

&lt;div class="thbox thpochop"&gt;&lt;h4&gt;Pochop (princíp, prečo)&lt;/h4&gt;&lt;ul&gt;
&lt;li&gt;Roboti by skreslili všetko: priemerný čas, počet stránok, sedenia. Treba ich preč.&lt;/li&gt;
&lt;li&gt;Žiadny jediný filter nezachytí všetkých — preto &lt;b&gt;kombinujeme 4&lt;/b&gt; (Agent text + IP zoznam).&lt;/li&gt;
&lt;li&gt;Filter Agent &lt;b&gt;OR&lt;/b&gt; IP, lebo niektorí roboti klamú v User-Agent, iní zase nikdy nepristúpia k robots.txt.&lt;/li&gt;
&lt;li&gt;Analógia 4 vrstiev: ako bezpečnostná kontrola na letisku — &lt;b&gt;detektor kovov + RTG + pes + manuálna prehliadka&lt;/b&gt;. Každá zachytí inú vec, žiadna sama nestačí.&lt;/li&gt;
&lt;li&gt;Munkove 4 metódy = 3 zdroje informácie: &lt;b&gt;hlavička HTTP&lt;/b&gt; (User-Agent, prvý filter), &lt;b&gt;identita klienta&lt;/b&gt; (IP, štvrtý filter), &lt;b&gt;jeho správanie&lt;/b&gt; (siaha na robots.txt alebo na skrytý odkaz — to využíva úloha 02, ktorá nám zoznam IP pripravila).&lt;/li&gt;
&lt;/ul&gt;&lt;/div&gt;

&lt;div class="thbox thnabif"&gt;&lt;h4&gt;Nabif (vzorce, čísla, idiómy)&lt;/h4&gt;&lt;ul&gt;
&lt;li&gt;Pred: &lt;b&gt;211 313&lt;/b&gt; → Po: &lt;b&gt;73 927&lt;/b&gt; (úbytok &lt;b&gt;65 %&lt;/b&gt;).&lt;/li&gt;
&lt;li&gt;Idiom: &lt;code&gt;df = df[~df["Agent"].str.contains(..., case=False, na=False)]&lt;/code&gt;&lt;/li&gt;
&lt;li&gt;Idiom: &lt;code&gt;df = df[~df["IP"].isin(robot_ips)]&lt;/code&gt;&lt;/li&gt;
&lt;li&gt;Kľúčové slová: &lt;code&gt;bot&lt;/code&gt;, &lt;code&gt;crawl&lt;/code&gt;, &lt;code&gt;spider&lt;/code&gt; + &lt;code&gt;curl&lt;/code&gt;, &lt;code&gt;wget&lt;/code&gt;, &lt;code&gt;libwww&lt;/code&gt;.&lt;/li&gt;
&lt;li&gt;Munk P5 — &lt;b&gt;4 metódy detekcie robotov&lt;/b&gt;: User-Agent, IP, prístup k robots.txt, prístup ku skrytému odkazu. Pokrývame prvé tri.&lt;/li&gt;
&lt;/ul&gt;&lt;/div&gt;`,
  '04': `&lt;h2&gt;Krok 04 — Obdobie + UNIXTIME&lt;/h2&gt;
&lt;p class="thintro"&gt;Záznamy filtrujeme na pridelených 7 dní (17.–23.12.2017) a textový dátum prevedieme na &lt;b&gt;jedno celé číslo&lt;/b&gt; — počet sekúnd od 1.1.1970 (tzv. UNIX epoch).&lt;/p&gt;
&lt;h3&gt;Ako sme to robili v projekte&lt;/h3&gt;
&lt;p&gt;Najprv ponecháme len riadky, ktorých &lt;code&gt;DateTime&lt;/code&gt; sa začína niektorým zo 7 dátumov (riadky 42–51 skriptu, &lt;code&gt;str.startswith&lt;/code&gt; pre každý deň, spojené operátorom &lt;code&gt;|&lt;/code&gt; = "alebo"). Potom pre každý reťazec typu &lt;code&gt;"17/Dec/2017:06:28:17 +0100"&lt;/code&gt; vyparsujeme deň, mesiac, rok, hodinu, minútu, sekundu, postavíme &lt;code&gt;datetime&lt;/code&gt; objekt a zavoláme &lt;code&gt;.timestamp()&lt;/code&gt; (funkcia &lt;code&gt;to_unixtime&lt;/code&gt;, riadky 63–82). Výsledok je sekundové číslo — náš nový stĺpec &lt;code&gt;UNIXTIME&lt;/code&gt; (riadok 88).&lt;/p&gt;
&lt;pre&gt;&lt;code&gt;datetime(year, months[mon], day, hh, mm, ss).timestamp()
# "17/Dec/2017:06:28:17 +0100"  →  1 513 488 497&lt;/code&gt;&lt;/pre&gt;
&lt;h3&gt;Vizuálne — prevod času&lt;/h3&gt;
&lt;pre&gt;"17/Dec/2017:06:28:17 +0100"  →  1 513 488 497
"17/Dec/2017:06:30:42 +0100"  →  1 513 488 642
                                 ────────────────
                                 rozdiel = 145 s&lt;/pre&gt;
&lt;table class="thtable"&gt;&lt;tr&gt;&lt;th&gt;Stĺpec pred&lt;/th&gt;&lt;th&gt;Stĺpec po&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;code&gt;17/Dec/2017:06:28:17 +0100&lt;/code&gt;&lt;/td&gt;&lt;td&gt;&lt;code&gt;1513488497&lt;/code&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;
&lt;h3&gt;Prečo &lt;u&gt;jedno číslo&lt;/u&gt; namiesto dátumu? (derivácia)&lt;/h3&gt;
&lt;p&gt;Predstav si, že chceš zistiť, koľko sekúnd uplynulo medzi dvomi návštevami. Máš &lt;b&gt;dva textové reťazce&lt;/b&gt; (napr. &lt;code&gt;"31/Dec/2017:23:59:58"&lt;/code&gt; a &lt;code&gt;"01/Jan/2018:00:00:05"&lt;/code&gt;). Skús to spraviť rukou:&lt;/p&gt;
&lt;ol&gt;
&lt;li&gt;Sekundy: 5 − 58 = záporné → musíš si "požičať" minútu.&lt;/li&gt;
&lt;li&gt;Minúty: 0 − 59 = záporné → požičiavaš hodinu.&lt;/li&gt;
&lt;li&gt;Hodiny: 0 − 23 = záporné → požičiavaš deň.&lt;/li&gt;
&lt;li&gt;Dni: 1 − 31 = záporné → požičiavaš mesiac. Ale &lt;b&gt;koľko dní má december?&lt;/b&gt; 31. A január? Tiež 31. Február? 28 alebo 29 (priestupný rok!).&lt;/li&gt;
&lt;li&gt;Mesiac sa pretočil → musíš zmeniť rok.&lt;/li&gt;
&lt;li&gt;Časové pásmo (&lt;code&gt;+0100&lt;/code&gt;) — ak by jedna bola v Londýne a druhá v Bratislave, musíš ešte korigovať o hodinu.&lt;/li&gt;
&lt;/ol&gt;
&lt;p&gt;Toto je &lt;b&gt;klbko podmienok&lt;/b&gt; (požičiavanie, dĺžky mesiacov, priestupné roky, pásma). Knižnica &lt;code&gt;datetime&lt;/code&gt; to vie, ale stojí to čas — pre každú dvojicu spustí celý parser.&lt;/p&gt;
&lt;p&gt;&lt;b&gt;Trik UNIXu&lt;/b&gt;: prečísluj si časovú os od jedného pevného bodu (1.1.1970 00:00:00 UTC) a meraj ju &lt;b&gt;v sekundách&lt;/b&gt;. Každý okamih dostane jedno celé číslo. Rozdiel dvoch okamihov potom nie je 6-krokový algoritmus, ale &lt;b&gt;jedno odčítanie&lt;/b&gt;:&lt;/p&gt;
&lt;pre&gt;1 514 764 805 − 1 514 764 798 = 7 s&lt;/pre&gt;
&lt;p&gt;&lt;b&gt;Analógia (autobusy):&lt;/b&gt; predstav si, že namiesto cestovných poriadkov v tvare "odchod 14:23, príchod 15:07" by všetky autobusy mali len jedno číslo — &lt;b&gt;minútu od polnoci&lt;/b&gt;. Aký dlhý je spoj? 907 − 863 = 44 minút. Hotovo. Žiadne "1 hodina a 7 mínus 23 = ...". UNIXTIME robí to isté pre celé dejiny — len v sekundách a od roku 1970.&lt;/p&gt;
&lt;p&gt;Preto v ďalšej úlohe (06 Length) stačí &lt;code&gt;UNIXTIME[i] − UNIXTIME[i−1]&lt;/code&gt; — a máme dĺžku návštevy stránky bez jediného &lt;code&gt;if&lt;/code&gt;-u na priestupný rok.&lt;/p&gt;
&lt;div class="thbox thpochop"&gt;&lt;h4&gt;Pochop (princíp, prečo)&lt;/h4&gt;&lt;ul&gt;
&lt;li&gt;Z textového dátumu sa rozdiel počíta zle: požičiavanie sekúnd/minút/hodín, rôzne dĺžky mesiacov, priestupné roky, časové pásma. Z čísla je to &lt;b&gt;jedno odčítanie&lt;/b&gt;.&lt;/li&gt;
&lt;li&gt;UNIX timestamp = počet sekúnd od 1.1.1970 UTC. Pevný nulový bod + jednotná jednotka (sekunda) = jednoznačné, nezávislé od pásma.&lt;/li&gt;
&lt;li&gt;Munk (prednáška 6) ukazuje sedenia ako sekvencie stránok s &lt;b&gt;časovou známkou&lt;/b&gt; a porovnáva rozdiely &lt;code&gt;tᵢ₊₁ − tᵢ&lt;/code&gt; s hraničným časom δ. Toto porovnanie je čisté odčítanie — &lt;b&gt;len ak&lt;/b&gt; sú časy čísla. Preto UNIXTIME pripravujeme &lt;i&gt;teraz&lt;/i&gt;, aby kroky 06 a 07 mohli ďalej fungovať bez parsovania.&lt;/li&gt;
&lt;li&gt;Tento krok je &lt;b&gt;predpoklad&lt;/b&gt; pre úlohu 06 (Length cez odčítanie časov) aj 07 (sedenia podľa časového prahu).&lt;/li&gt;
&lt;/ul&gt;&lt;/div&gt;
&lt;div class="thbox thnabif"&gt;&lt;h4&gt;Nabif (vzorce, čísla, idiómy)&lt;/h4&gt;&lt;ul&gt;
&lt;li&gt;Epoch: &lt;b&gt;1.1.1970 00:00:00 UTC&lt;/b&gt;.&lt;/li&gt;
&lt;li&gt;Po filtri obdobia: &lt;b&gt;73 927&lt;/b&gt; riadkov (vstup = výstup úlohy 03).&lt;/li&gt;
&lt;li&gt;Idiom prevodu: &lt;code&gt;datetime(y, m, d, hh, mm, ss).timestamp()&lt;/code&gt; (riadky 80–82).&lt;/li&gt;
&lt;li&gt;Idiom aplikácie na celý stĺpec: &lt;code&gt;df["UNIXTIME"] = df["DateTime"].apply(to_unixtime)&lt;/code&gt; (riadok 88).&lt;/li&gt;
&lt;li&gt;Mapa mesiacov: &lt;code&gt;months = {"Jan":1, "Feb":2, ..., "Dec":12}&lt;/code&gt; (riadky 57–60).&lt;/li&gt;
&lt;li&gt;Rozdiel dvoch UNIX časov = &lt;b&gt;sekundy medzi udalosťami&lt;/b&gt; — bez parsovania, bez pásiem, bez priestupných rokov.&lt;/li&gt;
&lt;/ul&gt;&lt;/div&gt;`,
  '05': `&lt;h2&gt;Krok 05 — Identifikácia používateľov&lt;/h2&gt;
&lt;p class="thintro"&gt;HTTP je bezstavový — server nevie, ktoré 2 požiadavky sú od toho istého človeka. Aproximujeme používateľa ako dvojicu &lt;b&gt;(IP, User-Agent)&lt;/b&gt;.&lt;/p&gt;
&lt;h3&gt;Ako sme to robili v projekte&lt;/h3&gt;
&lt;p&gt;Najprv zoradíme tabuľku podľa IP, Agent a UNIXTIME — záznamy jedného používateľa budú vedľa seba a chronologicky (skript &lt;code&gt;priradenie_user_id.py&lt;/code&gt;, r. 51). Potom použijeme pandas &lt;code&gt;groupby&lt;/code&gt; a metódu &lt;code&gt;ngroup()&lt;/code&gt;, ktorá každej unikátnej dvojici (IP, Agent) pridelí číslo. Pripočítame +1, aby ID začínalo od 1 (r. 71).&lt;/p&gt;
&lt;pre&gt;&lt;code&gt;df = df.sort_values(["IP","Agent","UNIXTIME"]).reset_index(drop=True)
df["USER_ID"] = df.groupby(["IP","Agent"]).ngroup() + 1&lt;/code&gt;&lt;/pre&gt;
&lt;h3&gt;Odvodenie vzorca &lt;code&gt;groupby([IP, Agent]).ngroup() + 1&lt;/code&gt; krok po kroku&lt;/h3&gt;
&lt;p&gt;Predstav si, že máš kôš plný lístkov a každý lístok má napísanú &lt;b&gt;IP&lt;/b&gt; a &lt;b&gt;prehliadač&lt;/b&gt;. Chceš ich roztriediť tak, aby každý "jeden človek" dostal svoju vlastnú nálepku s číslom.&lt;/p&gt;
&lt;ul&gt;
&lt;li&gt;&lt;b&gt;Krok A — &lt;code&gt;groupby(["IP","Agent"])&lt;/code&gt;:&lt;/b&gt; je to ako keby si rozdal lístky do &lt;b&gt;košíkov&lt;/b&gt; podľa toho, aká dvojica (IP, prehliadač) je na nich napísaná. Všetky lístky s &lt;i&gt;(1.2.3.4, Chrome)&lt;/i&gt; idú do jedného košíka, všetky s &lt;i&gt;(1.2.3.4, Firefox)&lt;/i&gt; do druhého, atď. Toto je len rozdelenie — žiadne čísla zatiaľ nie sú.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Krok B — &lt;code&gt;.ngroup()&lt;/code&gt;:&lt;/b&gt; každý košík dostane &lt;b&gt;poradové číslo&lt;/b&gt;: prvý košík dostane 0, druhý 1, tretí 2... Potom pandas vráti pre každý riadok pôvodnej tabuľky číslo košíka, do ktorého patril. Takže riadky s &lt;i&gt;(1.2.3.4, Chrome)&lt;/i&gt; všetky dostanú 0, riadky s &lt;i&gt;(1.2.3.4, Firefox)&lt;/i&gt; všetky dostanú 1, atď.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Krok C — &lt;code&gt;+ 1&lt;/code&gt;:&lt;/b&gt; ku každému číslu pripočítame 1, aby sme začínali od &lt;b&gt;1, 2, 3...&lt;/b&gt; namiesto &lt;b&gt;0, 1, 2...&lt;/b&gt; Toto je čisto kozmetika — pre ľudí je krajšie, keď používateľ č. 1 je naozaj prvý.&lt;/li&gt;
&lt;/ul&gt;
&lt;p&gt;&lt;b&gt;Analógia s autobusmi:&lt;/b&gt; predstav si zástavku, na ktorú prídu autobusy rôznych liniek. &lt;code&gt;groupby&lt;/code&gt; rozdelí cestujúcich podľa toho, do akého autobusu nastúpili (linka = dvojica IP+Agent). &lt;code&gt;ngroup&lt;/code&gt; očísluje autobusy podľa toho, v akom poradí prišli na zastávku (0, 1, 2...). &lt;code&gt;+1&lt;/code&gt; znamená, že prvý autobus má číslo 1, nie 0.&lt;/p&gt;
&lt;h3&gt;Vizuálne — prečo (IP, Agent)&lt;/h3&gt;
&lt;table class="thtable"&gt;&lt;tr&gt;&lt;th&gt;IP&lt;/th&gt;&lt;th&gt;Agent&lt;/th&gt;&lt;th&gt;ngroup()&lt;/th&gt;&lt;th&gt;USER_ID (+1)&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;1.2.3.4&lt;/td&gt;&lt;td&gt;Chrome&lt;/td&gt;&lt;td&gt;0&lt;/td&gt;&lt;td&gt;1&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;1.2.3.4&lt;/td&gt;&lt;td&gt;Firefox&lt;/td&gt;&lt;td&gt;1&lt;/td&gt;&lt;td&gt;2 &lt;i&gt;(iný browser = iný user)&lt;/i&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;5.6.7.8&lt;/td&gt;&lt;td&gt;Chrome&lt;/td&gt;&lt;td&gt;2&lt;/td&gt;&lt;td&gt;3&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;
&lt;h3&gt;Prednáška Munka — kde to zapadá&lt;/h3&gt;
&lt;p&gt;Munk vo svojej prednáške (Prednáška 7, fázy procesu WUM) hovorí, že &lt;b&gt;identifikácia používateľov&lt;/b&gt; je samostatná fáza prípravy dát hneď po čistení od robotov. Robí sa "na základe rôznej verzie internetového prehliadača" — presne to robíme aj my: ak má dvojica rovnakú IP, ale iný prehliadač/verziu, považujeme to za &lt;b&gt;iného človeka&lt;/b&gt;. Munk pripomína, že je to len &lt;i&gt;odhad&lt;/i&gt; — bez cookies alebo prihlásenia sa nedá zistiť pravda. Tento krok je predposlednou prípravou pred identifikáciou sedení (kroky 07, 08).&lt;/p&gt;
&lt;div class="thbox thpochop"&gt;&lt;h4&gt;Pochop (princíp, prečo)&lt;/h4&gt;&lt;ul&gt;
&lt;li&gt;Samotná IP nestačí: NAT, DHCP, mobilný operátor zdieľa IP medzi stovkami ľudí.&lt;/li&gt;
&lt;li&gt;Dvaja ľudia za NAT-om majú zriedka úplne rovnaký prehliadač + verziu + OS — preto Agent ako tiebreaker.&lt;/li&gt;
&lt;li&gt;Slabosť: jeden človek s Chrome aj Firefox bude počítaný ako &lt;b&gt;2 useri&lt;/b&gt;. To akceptujeme.&lt;/li&gt;
&lt;li&gt;&lt;code&gt;groupby&lt;/code&gt; = rozdeľ do košíkov, &lt;code&gt;ngroup&lt;/code&gt; = očísluj košíky od 0, &lt;code&gt;+1&lt;/code&gt; = posuň na 1, 2, 3...&lt;/li&gt;
&lt;/ul&gt;&lt;/div&gt;
&lt;div class="thbox thnabif"&gt;&lt;h4&gt;Nabif (vzorce, čísla, idiómy)&lt;/h4&gt;&lt;ul&gt;
&lt;li&gt;Počet identifikovaných používateľov: &lt;b&gt;14 563&lt;/b&gt;.&lt;/li&gt;
&lt;li&gt;Idiom: &lt;code&gt;df.groupby(["IP","Agent"]).ngroup() + 1&lt;/code&gt;.&lt;/li&gt;
&lt;li&gt;Význam častí: &lt;code&gt;groupby&lt;/code&gt; = košíky, &lt;code&gt;ngroup()&lt;/code&gt; = poradové číslo košíka (0..N-1), &lt;code&gt;+1&lt;/code&gt; = posun na 1..N.&lt;/li&gt;
&lt;li&gt;Sort PRED groupby: &lt;code&gt;sort_values(["IP","Agent","UNIXTIME"])&lt;/code&gt; (r. 51 skriptu).&lt;/li&gt;
&lt;li&gt;HTTP = &lt;b&gt;bezstavový&lt;/b&gt; protokol — to je dôvod celého problému.&lt;/li&gt;
&lt;/ul&gt;&lt;/div&gt;`,
  '06': `&lt;h2&gt;Krok 06 — Premenná Length&lt;/h2&gt;
&lt;p class="thintro"&gt;Aproximácia času stráveného na stránke. Apache log ho nemá — server nevie, kedy user odišiel. Použijeme &lt;b&gt;rozdiel s predošlým prístupom&lt;/b&gt; toho istého používateľa.&lt;/p&gt;
&lt;h3&gt;Ako sme to robili v projekte&lt;/h3&gt;
&lt;p&gt;V rámci skupiny &lt;code&gt;USER_ID&lt;/code&gt; vezmeme čas &lt;b&gt;predošlého riadku&lt;/b&gt; (&lt;code&gt;shift(1)&lt;/code&gt; posunie stĺpec o 1 dolu — riadok 51 v skripte). Length je rozdiel: aktuálny čas mínus predošlý (riadok 57). Prvý riadok každého usera nemá predchodcu, takže má &lt;code&gt;NaN&lt;/code&gt;. Ak je Length ≥ 3600 sekúnd (60 minút), prepíšeme ho na NaN (riadok 63).&lt;/p&gt;
&lt;pre&gt;&lt;code&gt;df["PREV"] = df.groupby("USER_ID")["UNIXTIME"].shift(1)
df["Length"] = df["UNIXTIME"] - df["PREV"]
df.loc[df["Length"] &gt;= 3600, "Length"] = None&lt;/code&gt;&lt;/pre&gt;
&lt;h3&gt;Vizuálne — výpočet pre jedného usera&lt;/h3&gt;
&lt;pre&gt;UNIXTIME:  [100, 110, 125, 4000, 4030]
shift(1):  [NaN, 100, 110,  125, 4000]
           ─────────────────────────────
Length:    [NaN,  10,  15, 3875,   30]
                              ↓ ≥ 3600
Final:     [NaN,  10,  15, None,   30]&lt;/pre&gt;
&lt;h3&gt;Markov-like vlastnosť — prečo stačí pozerať len 1 krok dozadu&lt;/h3&gt;
&lt;p&gt;Vzorec &lt;code&gt;Length[i] = UNIXTIME[i] − UNIXTIME[i−1]&lt;/code&gt; má jednu krásnu vlastnosť: na výpočet Length pre &lt;b&gt;tento&lt;/b&gt; klik potrebujeme &lt;b&gt;len predošlý&lt;/b&gt; klik. Nepozeráme sa na všetky kliky usera od začiatku — stačí ten najbližší. Tomu sa hovorí &lt;b&gt;Markov vlastnosť&lt;/b&gt;: &amp;quot;budúcnosť závisí len od prítomnosti, nie od celej minulosti&amp;quot;.&lt;/p&gt;
&lt;p&gt;&lt;b&gt;Analógia autobusov:&lt;/b&gt; predstav si, že čakáš na zastávke a chceš vedieť, &amp;quot;ako dlho som tu&amp;quot;. Stačí ti čas, kedy si prišiel — nepotrebuješ vedieť, čo si robil pred týždňom. Length je presne to isté: rozdiel medzi &amp;quot;teraz&amp;quot; a &amp;quot;naposledy&amp;quot;.&lt;/p&gt;
&lt;p&gt;Munk v prednáške 7 hovorí o sedeniach ako sekvenciách stránok s časovými známkami, kde sa pozeráme na rozdiel &lt;code&gt;t[i] − t[i−1]&lt;/code&gt; — &lt;b&gt;dvojica susedných záznamov&lt;/b&gt;, nie celá história. Toto je základný princíp Web Usage Mining: ak by sme museli pre každý klik prejsť celú minulosť usera, výpočet by bol kvadratický (O(n²)). Vďaka Markov-like vlastnosti je lineárny (O(n)) — pandas vie &lt;code&gt;shift(1)&lt;/code&gt; spraviť jedným prechodom.&lt;/p&gt;
&lt;table class="thtable"&gt;&lt;tr&gt;&lt;th&gt;Vlastnosť&lt;/th&gt;&lt;th&gt;Length[i]&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Závisí od&lt;/td&gt;&lt;td&gt;len UNIXTIME[i] a UNIXTIME[i−1]&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Nezávisí od&lt;/td&gt;&lt;td&gt;UNIXTIME[i−2], [i−3], ... [0]&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Princíp&lt;/td&gt;&lt;td&gt;&lt;b&gt;Markov-like (1-kroková závislosť)&lt;/b&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Dôsledok&lt;/td&gt;&lt;td&gt;rýchly výpočet cez &lt;code&gt;shift(1)&lt;/code&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;
&lt;div class="thbox thpochop"&gt;&lt;h4&gt;Pochop (princíp, prečo)&lt;/h4&gt;&lt;ul&gt;
&lt;li&gt;Server nevidí scrolling ani zatvorenie taba — nemôžeme merať čas priamo, musíme ho odhadnúť.&lt;/li&gt;
&lt;li&gt;60-min STT zabraňuje &amp;quot;stránke, na ktorej user strávil 8 hodín&amp;quot;.&lt;/li&gt;
&lt;li&gt;Predošlý čas berieme &lt;b&gt;v rámci toho istého usera&lt;/b&gt; — inak by sme miešali ľudí.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Markov vlastnosť:&lt;/b&gt; Length závisí LEN od predošlého kliku, nie od celej histórie. Analógia: chceš vedieť, ako dlho si na zastávke — stačí čas príchodu, netreba celý deň.&lt;/li&gt;
&lt;li&gt;WUM princíp (Munk, prednáška 7): sedenie je sekvencia párov &lt;code&gt;(stránka, čas)&lt;/code&gt; a hranicu počítame z dvojice susedných záznamov — &lt;b&gt;1-kroková závislosť stačí&lt;/b&gt;.&lt;/li&gt;
&lt;/ul&gt;&lt;/div&gt;
&lt;div class="thbox thnabif"&gt;&lt;h4&gt;Nabif (vzorce, čísla, idiómy)&lt;/h4&gt;&lt;ul&gt;
&lt;li&gt;Vzorec: &lt;code&gt;Length[i] = UNIXTIME[i] − UNIXTIME[i−1]&lt;/code&gt; (v rámci USER_ID).&lt;/li&gt;
&lt;li&gt;STT prah: &lt;b&gt;3600 s = 60 min&lt;/b&gt;.&lt;/li&gt;
&lt;li&gt;Priemer Length: &lt;b&gt;174 s&lt;/b&gt;. Medián: &lt;b&gt;5 s&lt;/b&gt; (rozdiel ukazuje šikmé rozdelenie).&lt;/li&gt;
&lt;li&gt;Idiom: &lt;code&gt;groupby("USER_ID")["UNIXTIME"].shift(1)&lt;/code&gt;.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Markov-like:&lt;/b&gt; &lt;code&gt;P(Length[i] | celá história) = P(Length[i] | UNIXTIME[i−1])&lt;/code&gt; — len 1 krok dozadu.&lt;/li&gt;
&lt;li&gt;Zložitosť: vďaka 1-krokovej závislosti je výpočet &lt;b&gt;O(n)&lt;/b&gt;, nie O(n²).&lt;/li&gt;
&lt;/ul&gt;&lt;/div&gt;`,
  '07': `&lt;h2&gt;Krok 07 — Sedenia RLength (s STT_Q fallbackom)&lt;/h2&gt;
&lt;p class="thintro"&gt;Sedenie = súvislá návšteva jedného usera. Hranicu novej session počítame z exponenciálneho rozdelenia (RLength). Ak KS test povie, že dáta exponenciálne nie sú, ideme na fallback STT_Q.&lt;/p&gt;
&lt;h3&gt;Ako sme to robili v projekte&lt;/h3&gt;
&lt;p&gt;Najprv spustíme KS test, ktorý porovná naše dáta s teoretickou exponenciálnou krivkou. Ak p ≥ 0.05, použijeme RLength = &lt;code&gt;−ln(1−0.4) × priemer&lt;/code&gt;. Ak p &amp;lt; 0.05 (ako u nás), použijeme &lt;b&gt;STT_Q = Q3 + 1.5×IQR&lt;/b&gt;. Záznam je začiatok novej session, ak je Length NaN alebo prekročí prah. Globálne SESSION_ID získame ako kumulatívny súčet boolean stĺpca. (Skript &lt;code&gt;sedenia_rlength.py&lt;/code&gt; r. 125 KS test, r. 139 RLength, r. 154 STT_Q, r. 171–181 NEW_SESSION + cumsum.)&lt;/p&gt;
&lt;pre&gt;&lt;code&gt;ks, p = kstest(length_data, "expon", args=(0, mean))
prah = -np.log(0.6)*mean if p &gt;= 0.05 else Q3 + 1.5*IQR
df["NEW"] = df["Length"].isna() | (df["Length"] &gt;= prah)
df["SESSION_ID"] = df["NEW"].cumsum()&lt;/code&gt;&lt;/pre&gt;
&lt;h3&gt;Odkiaľ sa vzal vzorec −ln(1−p)·μ (derivácia krok po kroku)&lt;/h3&gt;
&lt;p&gt;Munk na prednáške hovorí: čas medzi klikmi pokladáme za exponenciálne rozdelený. Hľadáme prah &lt;code&gt;t&lt;/code&gt; taký, aby &lt;b&gt;p % všetkých pauz bolo kratších ako t&lt;/b&gt; (tých p % berieme ako rýchle "navigačné" preklikávanie). Matematicky: hľadáme inverziu (kvantilovú funkciu) k CDF.&lt;/p&gt;
&lt;pre&gt;1) CDF exponenciály (μ = priemerná pauza):
       F(t) = 1 − e^(−t/μ)
   F(t) = "akú časť všetkých pauz tvoria pauzy kratšie ako t"

2) Chceme aby táto časť bola p (u nás 0.4):
       1 − e^(−t/μ) = p

3) Osamostatníme exponenciálu (prehodíme strany):
       e^(−t/μ) = 1 − p

4) Logaritmus oboch strán (ln zruší e):
       −t/μ = ln(1 − p)

5) Vynásobíme −μ a hotovo:
       t = −μ · ln(1 − p)

DOSADENIE p = 0.4:
       ln(1 − 0.4) = ln(0.6) ≈ −0.5108
       t = −μ · (−0.5108) = 0.5108 · μ
       → prah ≈ 0.51 × priemer pauz&lt;/pre&gt;
&lt;p&gt;V skripte je to doslova &lt;code&gt;prah = -np.log(1 - p) * mean_length&lt;/code&gt; (r. 139). &lt;code&gt;np.log&lt;/code&gt; je prirodzený logaritmus (ln), nie dekadický.&lt;/p&gt;
&lt;h3&gt;Analógia — autobusy na zastávke&lt;/h3&gt;
&lt;p&gt;Predstav si zastávku, kde priemerná medzera medzi autobusmi je μ = 10 minút. Exponenciálne rozdelenie hovorí: &lt;b&gt;krátke čakanie je časté, dlhé čakanie je vzácne&lt;/b&gt;. Ak chceš nájsť hranicu &lt;b&gt;t&lt;/b&gt; tak, že 40 % všetkých čakaní je kratších ako t, dostaneš t ≈ 5,1 minúty. To isté robíme s pauzami medzi klikmi: 40 % najkratších pauz = rýchle preklikávanie (navigačné stránky), zvyšok = čítanie obsahu, a všetko nad t pokladáme za "nové sedenie".&lt;/p&gt;
&lt;h3&gt;Vizuálne — cumsum na boolean&lt;/h3&gt;
&lt;pre&gt;NEW_SESSION:  T  F  F  T  F  T
ako čísla:    1  0  0  1  0  1
cumsum:       1  1  1  2  2  3   ← SESSION_ID&lt;/pre&gt;
&lt;table class="thtable"&gt;&lt;tr&gt;&lt;th&gt;Metóda&lt;/th&gt;&lt;th&gt;Vzorec&lt;/th&gt;&lt;th&gt;Charakter&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;RLength&lt;/td&gt;&lt;td&gt;&lt;code&gt;−ln(1−p)·μ&lt;/code&gt;&lt;/td&gt;&lt;td&gt;predpokladá exp. rozdelenie&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;STT_Q&lt;/b&gt;&lt;/td&gt;&lt;td&gt;&lt;code&gt;Q3 + 1.5·IQR&lt;/code&gt;&lt;/td&gt;&lt;td&gt;&lt;b&gt;neparametrická, robustná&lt;/b&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;
&lt;div class="thbox thpochop"&gt;&lt;h4&gt;Pochop (princíp, prečo)&lt;/h4&gt;&lt;ul&gt;
&lt;li&gt;Predpoklad: krátke pauzy sú časté, dlhé zriedkavé — to je &lt;b&gt;exponenciálne&lt;/b&gt; rozdelenie (Poissonov proces, prednáška Munka).&lt;/li&gt;
&lt;li&gt;CDF &lt;code&gt;F(t) = 1 − e^(−t/μ)&lt;/code&gt; hovorí "podiel pauz kratších ako t". &lt;b&gt;Vzorec RLength je len jej obrátená verzia&lt;/b&gt; — z podielu p vrátim t.&lt;/li&gt;
&lt;li&gt;KS test = najväčšia vertikálna vzdialenosť empirickej a teoretickej CDF. Nízke p = dáta exponenciálne nie sú.&lt;/li&gt;
&lt;li&gt;Reálny log je špinavý → KS zlyhá → STT_Q je &lt;b&gt;robustný fallback&lt;/b&gt;, lebo Q3 a IQR neovplyvnia extrémne hodnoty.&lt;/li&gt;
&lt;li&gt;Maximálne vierohodný odhad parametra λ je &lt;code&gt;λ = 1/μ&lt;/code&gt; (priemer pauz) — preto vo vzorci vystupuje priamo priemer (Munk, prednáška 7).&lt;/li&gt;
&lt;/ul&gt;&lt;/div&gt;
&lt;div class="thbox thnabif"&gt;&lt;h4&gt;Nabif (vzorce, čísla, idiómy)&lt;/h4&gt;&lt;ul&gt;
&lt;li&gt;CDF exponenciály: &lt;code&gt;F(t) = 1 − e^(−t/μ)&lt;/code&gt;.&lt;/li&gt;
&lt;li&gt;Derivácia prahu: &lt;code&gt;1 − e^(−t/μ) = p  →  e^(−t/μ) = 1−p  →  −t/μ = ln(1−p)  →  t = −μ·ln(1−p)&lt;/code&gt;.&lt;/li&gt;
&lt;li&gt;Vzorec RLength: &lt;code&gt;−ln(1−p) × μ&lt;/code&gt;, pre p=0.4 vychádza &lt;b&gt;0.51 × μ&lt;/b&gt; (lebo ln(0.6) ≈ −0.5108).&lt;/li&gt;
&lt;li&gt;STT_Q v projekte: &lt;b&gt;Q3=31, IQR=30 → prah = 31 + 1.5·30 = 76 s&lt;/b&gt;.&lt;/li&gt;
&lt;li&gt;KS výsledok: &lt;b&gt;D = 0.5985, p ≈ 0&lt;/b&gt; → použila sa STT_Q.&lt;/li&gt;
&lt;li&gt;Počet sedení: &lt;b&gt;33 496&lt;/b&gt;.&lt;/li&gt;
&lt;li&gt;Idiom: &lt;code&gt;df["NEW"].cumsum()&lt;/code&gt; = globálne SESSION_ID.&lt;/li&gt;
&lt;/ul&gt;&lt;/div&gt;`,
  '08': `&lt;h2&gt;Krok 08 — Sedenia h-ref&lt;/h2&gt;
&lt;p class="thintro"&gt;Iný princíp ako RLength: kombinuje &lt;b&gt;čas + odkiaľ user prišiel&lt;/b&gt;. Nové sedenie aj vtedy, keď Referrer je prázdny ("-") — to znamená priamy prístup zvonku.&lt;/p&gt;
&lt;h3&gt;Ako sme to robili v projekte&lt;/h3&gt;
&lt;p&gt;Vypočítame priemer Length. Riadok je začiatok nového sedenia, ak platí ľubovoľná z 3 podmienok (OR): Length je NaN, alebo Length ≥ priemer, alebo Referrer = "-". SESSION_ID cez kumulatívny súčet.&lt;/p&gt;
&lt;pre&gt;&lt;code&gt;mean = df["Length"].mean()
df["NEW"] = (df["Length"].isna()
           | (df["Length"] &gt;= mean)
           | (df["Referrer"] == "-"))
df["SESSION_ID"] = df["NEW"].cumsum()&lt;/code&gt;&lt;/pre&gt;
&lt;p&gt;Konkrétne riadky v skripte: &lt;code&gt;59–63&lt;/code&gt; OR-klauzula s tromi indikátormi, &lt;code&gt;73&lt;/code&gt; cumsum (každé &lt;code&gt;True&lt;/code&gt; pripočíta 1 → vzniká nové číslo sedenia).&lt;/p&gt;
&lt;h3&gt;Vizuálne — 3 podmienky (OR)&lt;/h3&gt;
&lt;svg width="380" height="120" xmlns="http://www.w3.org/2000/svg"&gt;
&lt;rect x="5" y="10" width="120" height="30" fill="#fed" stroke="#a52"/&gt;
&lt;text x="65" y="29" text-anchor="middle" font-size="11"&gt;Length je NaN?&lt;/text&gt;
&lt;rect x="5" y="45" width="120" height="30" fill="#fed" stroke="#a52"/&gt;
&lt;text x="65" y="64" text-anchor="middle" font-size="11"&gt;Length ≥ priemer?&lt;/text&gt;
&lt;rect x="5" y="80" width="120" height="30" fill="#fed" stroke="#a52"/&gt;
&lt;text x="65" y="99" text-anchor="middle" font-size="11"&gt;Referrer = "-"?&lt;/text&gt;
&lt;text x="145" y="65" font-size="22" font-weight="bold"&gt;OR&lt;/text&gt;
&lt;text x="195" y="60" font-size="14"&gt;→&lt;/text&gt;
&lt;rect x="220" y="40" width="150" height="40" fill="#dfd" stroke="#262"/&gt;
&lt;text x="295" y="58" text-anchor="middle" font-size="11"&gt;nové sedenie&lt;/text&gt;
&lt;text x="295" y="73" text-anchor="middle" font-size="10"&gt;(SESSION_ID += 1)&lt;/text&gt;
&lt;/svg&gt;
&lt;h3&gt;Plná Cooley h-ref vs naša zjednodušená verzia&lt;/h3&gt;
&lt;p&gt;V prednáške Munka 7 je &lt;b&gt;plná (Cooleyho) definícia&lt;/b&gt; h-ref postavená na &lt;b&gt;kontinuite reťaze stránok&lt;/b&gt; — kontroluje, či Referrer aktuálneho kliku &lt;b&gt;sedí&lt;/b&gt; s URL predchádzajúceho kliku toho istého používateľa. Formálne:&lt;/p&gt;
&lt;p&gt;&lt;b&gt;Rovnica (1) — Cooley:&lt;/b&gt; dva po sebe nasledujúce záznamy patria do toho istého sedenia, ak &lt;code&gt;Referrer&lt;sub&gt;i&lt;/sub&gt; == URL&lt;sub&gt;i−1&lt;/sub&gt;&lt;/code&gt; (a zároveň ide o toho istého usera, a časový rozdiel je v rozumnom rámci).&lt;/p&gt;
&lt;p&gt;&lt;b&gt;Inými slovami:&lt;/b&gt; ak na klik B prišiel z A, tak by Referrer pri B mal byť presne A. Ak nie — niečo sa "pretrhlo": buď user zadal URL ručne, otvoril novú záložku, alebo prišiel z externého odkazu (Google, e-mail). To je nový začiatok.&lt;/p&gt;
&lt;table class="thtable"&gt;&lt;tr&gt;&lt;th&gt;Variant&lt;/th&gt;&lt;th&gt;Test "nové sedenie?"&lt;/th&gt;&lt;th&gt;Čo zachytí&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;Plná Cooley&lt;/b&gt;&lt;/td&gt;&lt;td&gt;&lt;code&gt;Referrer&lt;sub&gt;i&lt;/sub&gt; ≠ URL&lt;sub&gt;i−1&lt;/sub&gt;&lt;/code&gt; toho istého usera&lt;/td&gt;&lt;td&gt;každé prerušenie reťaze (priamy vstup AJ skok na nesúvisiacu stránku)&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;Naša zjednodušená&lt;/b&gt;&lt;/td&gt;&lt;td&gt;&lt;code&gt;Referrer == "-"&lt;/code&gt;&lt;/td&gt;&lt;td&gt;iba priamy vstup zvonku (URL napísaný ručne, záložka, externý odkaz bez Referrera)&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;
&lt;p&gt;&lt;b&gt;Príklad rozdielu:&lt;/b&gt; user navštívi &lt;code&gt;/uvod&lt;/code&gt;, potom v novej karte otvorí &lt;code&gt;/kontakt&lt;/code&gt; cez Google. V logu vidíme &lt;code&gt;Referrer = google.com&lt;/code&gt; (NIE "-"). Plná Cooley to označí ako nové sedenie (lebo &lt;code&gt;google.com ≠ /uvod&lt;/code&gt;). Naša zjednodušená verzia to &lt;b&gt;nezachytí&lt;/b&gt; (Referrer nie je "-") — ale väčšinou nám pomôže podmienka (b) "dlhá pauza".&lt;/p&gt;
&lt;p&gt;&lt;b&gt;Prečo sme zjednodušili?&lt;/b&gt; (1) Apache log v projekte má &lt;code&gt;Referrer = "-"&lt;/code&gt; ako jednoznačný signál priameho vstupu; (2) test &lt;code&gt;Referrer == URL_predchadzajuci&lt;/code&gt; by si vyžadoval shift v rámci skupiny &lt;code&gt;USER_ID&lt;/code&gt; a robustnú normalizáciu URL (s/bez slasha, s/bez query); (3) v praxi väčšinu "skokov v reťazi" odchytí už podmienka (b) cez priemernú pauzu.&lt;/p&gt;
&lt;h3&gt;Prečo práve OR z troch indikátorov?&lt;/h3&gt;
&lt;p&gt;Tri podmienky sú &lt;b&gt;nezávislé&lt;/b&gt; — každá zachytí iný typ "predelu" medzi sedeniami. Preto stačí, aby platila &lt;b&gt;hocijedna jedna&lt;/b&gt;:&lt;/p&gt;
&lt;ul&gt;
&lt;li&gt;&lt;b&gt;(a) Length je NaN&lt;/b&gt; — koniec dát pre tohto usera. Posledný klik nemá "nasledujúci", takže ďalší riadok v tabuľke patrí už &lt;b&gt;inému&lt;/b&gt; userovi. Ošetruje hranicu medzi userami.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;(b) Length ≥ priemer&lt;/b&gt; — dlhá pauza, asi išiel preč. Toto je čisto &lt;b&gt;časové&lt;/b&gt; kritérium (analógia STT_MEAN).&lt;/li&gt;
&lt;li&gt;&lt;b&gt;(c) Referrer == "-"&lt;/b&gt; — prišiel zvonku/priamo. Toto je čisto &lt;b&gt;štruktúrne / navigačné&lt;/b&gt; kritérium.&lt;/li&gt;
&lt;/ul&gt;
&lt;p&gt;&lt;b&gt;Analógia (autobusové linky):&lt;/b&gt; predstav si, že každý klik je zastávka. Nové sedenie = "vystúpil a nasadol na inú linku". Vystúpil mohol z troch dôvodov: (a) konečná stanica — žiadny ďalší klik (NaN); (b) dlho stál na zastávke a netrpezlivo odišiel (dlhá pauza); (c) prišiel z úplne iného miesta — z taxíka, nie z predchádzajúcej zastávky (priamy vstup). Stačí jeden z troch dôvodov a vieme, že nastúpil na &lt;b&gt;novú linku&lt;/b&gt; (nové sedenie).&lt;/p&gt;
&lt;p&gt;Keby sme použili AND namiesto OR, požadovali by sme, aby boli &lt;b&gt;všetky tri&lt;/b&gt; splnené naraz — to by takmer nikdy nenastalo a všetky kliky usera by skončili v jednom sedení. OR je preto jediná správna voľba.&lt;/p&gt;
&lt;h3&gt;Vizuálne — pred/po cumsum&lt;/h3&gt;
&lt;pre&gt;klik:        1     2     3     4     5     6
NEW_SESSION: True  False False True  False True
cumsum:        1     1     1    2     2     3
                              ↑           ↑
                       nový začiatok   nový začiatok&lt;/pre&gt;
&lt;p&gt;&lt;code&gt;cumsum&lt;/code&gt; funguje preto, že &lt;code&gt;True == 1&lt;/code&gt; a &lt;code&gt;False == 0&lt;/code&gt; v Pythone. Postupný súčet zhora dole vyrobí číslo sedenia "zadarmo".&lt;/p&gt;
&lt;div class="thbox thpochop"&gt;&lt;h4&gt;Pochop (princíp, prečo)&lt;/h4&gt;&lt;ul&gt;
&lt;li&gt;STT_MEAN by povedal: nové sedenie iba ak pauza ≥ priemer. h-ref pridáva &lt;b&gt;kontext&lt;/b&gt; — prázdny Referrer.&lt;/li&gt;
&lt;li&gt;Prázdny Referrer = user napadol URL ručne, otvoril záložku alebo prišiel z externého zdroja. To je nový "začiatok".&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Plná Cooley h-ref (Munk, prednáška 7)&lt;/b&gt; testuje &lt;code&gt;Referrer == URL_predchadzajuci&lt;/code&gt; v rámci usera — kontroluje &lt;b&gt;reťaz&lt;/b&gt; navigácie. Naša verzia je užšia, ale jednoduchšia a v praxi dáva podobné výsledky vďaka časovej podmienke.&lt;/li&gt;
&lt;li&gt;OR = stačí jeden indikátor zo troch; každý kryje iný typ "predelu" (koniec dát / dlhá pauza / externý vstup).&lt;/li&gt;
&lt;li&gt;Preto h-ref tvorí &lt;b&gt;viac, kratších&lt;/b&gt; sedení ako RLength.&lt;/li&gt;
&lt;/ul&gt;&lt;/div&gt;
&lt;div class="thbox thnabif"&gt;&lt;h4&gt;Nabif (vzorce, čísla, idiómy)&lt;/h4&gt;&lt;ul&gt;
&lt;li&gt;Časové okno = &lt;b&gt;priemer Length = 174 s&lt;/b&gt;.&lt;/li&gt;
&lt;li&gt;Počet sedení: &lt;b&gt;46 693&lt;/b&gt; (viac než RLength = 33 496).&lt;/li&gt;
&lt;li&gt;Podmienky OR (náš projekt): &lt;code&gt;isna() | (Length ≥ mean) | (Referrer == "-")&lt;/code&gt;.&lt;/li&gt;
&lt;li&gt;Plná Cooley h-ref (Munk 7): nové sedenie ak &lt;code&gt;Referrer&lt;sub&gt;i&lt;/sub&gt; ≠ URL&lt;sub&gt;i−1&lt;/sub&gt;&lt;/code&gt; (toho istého usera) — rovnica (1).&lt;/li&gt;
&lt;li&gt;Rozdiel vs. STT_MEAN: h-ref = STT_MEAN + 3. podmienka na Referrer.&lt;/li&gt;
&lt;li&gt;Idióm cumsum: &lt;code&gt;df["NEW"].cumsum()&lt;/code&gt; — &lt;code&gt;True&lt;/code&gt; sa správa ako 1, &lt;code&gt;False&lt;/code&gt; ako 0.&lt;/li&gt;
&lt;/ul&gt;&lt;/div&gt;`,
  '09': `&lt;h2&gt;Krok 09 — Doplnenie ciest pre RLength&lt;/h2&gt;
&lt;p class="thintro"&gt;Browser cache, sieťové výpadky a tlačidlo "Späť" spôsobia, že niektoré stránky chýbajú v logu. Rekonštruujeme ich z &lt;b&gt;mapy webu&lt;/b&gt;, ktorú postavíme zo samotného logu. Munk (prednáška 7) označuje tento krok ako &lt;b&gt;Doplnenie záznamov logovacieho súboru&lt;/b&gt; — posledný krok prípravy dát pred fázou hľadania vzorov.&lt;/p&gt;
&lt;h3&gt;Ako sme to robili v projekte&lt;/h3&gt;
&lt;p&gt;Najprv postavíme &lt;b&gt;mapu webu&lt;/b&gt;: pre každú URL nájdeme &lt;b&gt;najčastejší Referrer&lt;/b&gt; (interný, obsahujúci "ukf.sk") — to je jej &lt;b&gt;kanonický rodič&lt;/b&gt;. Potom prejdeme všetky susedné dvojice (URL[i], URL[i+1]) v rámci toho istého sedenia. Ak URL[i] nie je v mape, ale URL[i+1] áno, vložíme medzi ne rodiča URL[i+1] — pravdepodobne to bola medzistránka, ktorá v logu chýba.&lt;/p&gt;
&lt;pre&gt;&lt;code&gt;# riadky 82–94 skriptu
mapa_df = df[["Referrer","URL"]].copy()
mapa_df["ref_path"] = mapa_df["Referrer"].apply(url_to_path)
mapa_df = mapa_df[mapa_df["Referrer"].str.contains("ukf.sk", case=False, na=False)]
mapa_df = mapa_df.dropna(subset=["ref_path"])
parent_series = mapa_df.groupby("URL")["ref_path"].agg(
    lambda x: x.value_counts().idxmax())

# riadok 97 — MEMBERSHIP set
map_paths = set(parent.keys())

# riadky 134–142 — podmienka doplnenia
if url_from not in map_paths and url_to in map_paths:
    ref_page = parent.get(url_to)
    if ref_page and ref_page != url_from:
        doplneny = curr.copy(); doplneny["URL"] = ref_page
        new_rows.append(doplneny)&lt;/code&gt;&lt;/pre&gt;
&lt;h3&gt;Vizuálne — pred/po&lt;/h3&gt;
&lt;pre&gt;PRED:
  S=5  URL=/uvod        Ref=-
  S=5  URL=/clanok-42   Ref=/blog   ← /blog v logu CHÝBA!

PO doplnení:
  S=5  URL=/uvod
  S=5  URL=/blog        ← DOPLNENÉ (parent[/clanok-42] = /blog)
  S=5  URL=/clanok-42&lt;/pre&gt;
&lt;h3&gt;Derivácia kanonického rodiča — value_counts().idxmax()&lt;/h3&gt;
&lt;p&gt;Predstav si, že chceš zistiť, ktorou linkou najčastejšie chodia ľudia na &lt;code&gt;/clanok-42&lt;/code&gt;. Pozrieš si všetky záznamy v logu, kde URL = &lt;code&gt;/clanok-42&lt;/code&gt;, a vytiahneš ich Referrery. Dostaneš zoznam — niektorí prišli z &lt;code&gt;/blog&lt;/code&gt;, iní z &lt;code&gt;/uvod&lt;/code&gt;, niektorí z Google.&lt;/p&gt;
&lt;p&gt;&lt;b&gt;Krok 1 — spočítaj výskyty.&lt;/b&gt; &lt;code&gt;x.value_counts()&lt;/code&gt; nám pre konkrétny stĺpec vráti tabuľku "hodnota → koľkokrát sa vyskytla", &lt;b&gt;zoradenú zostupne&lt;/b&gt; podľa početnosti.&lt;/p&gt;
&lt;pre&gt;Referrery vedúce na /clanok-42:
   /blog   → 412×
   /uvod   → 87×
   /sport  → 12×&lt;/pre&gt;
&lt;p&gt;&lt;b&gt;Krok 2 — vyber index s najvyššou hodnotou.&lt;/b&gt; &lt;code&gt;.idxmax()&lt;/code&gt; vráti &lt;b&gt;index&lt;/b&gt; (nie hodnotu) najväčšieho prvku. Keďže value_counts indexuje zoznam podľa hodnôt (Referrer-ov) a hodnoty v ňom sú počty, &lt;code&gt;.idxmax()&lt;/code&gt; vráti práve &lt;code&gt;/blog&lt;/code&gt; — t.j. ten Referrer, ktorý sa vyskytol najčastejšie.&lt;/p&gt;
&lt;p&gt;&lt;b&gt;Krok 3 — urob to pre každú URL.&lt;/b&gt; &lt;code&gt;groupby("URL").agg(lambda x: ...)&lt;/code&gt; rozdelí log na skupiny podľa URL a v každej skupine spustí náš lambda výraz. Výsledok je tabuľka URL → kanonický rodič. To je presne mapa webu.&lt;/p&gt;
&lt;p&gt;&lt;b&gt;Analógia — autobusové zastávky.&lt;/b&gt; Stojíš na zastávke &lt;code&gt;/clanok-42&lt;/code&gt; a vidíš, že z 511 ľudí prišlo 412 autobusom z &lt;code&gt;/blog&lt;/code&gt;. Logicky usúdiš, že "najbežnejšia predchádzajúca zastávka" je &lt;code&gt;/blog&lt;/code&gt; — a to je presne kanonický rodič.&lt;/p&gt;
&lt;h3&gt;Audit "major" — MEMBERSHIP, nie HRANY&lt;/h3&gt;
&lt;p&gt;Klasický algoritmus doplnenia v literatúre (Munk, prednáška 7) kontroluje, či medzi A a C existuje &lt;b&gt;hrana&lt;/b&gt; v grafe odkazov — t.j. priamy link "z A vedie na C". My to robíme inak: kontrolujeme len &lt;b&gt;členstvo (membership) v mape&lt;/b&gt; — či URL vôbec poznáme.&lt;/p&gt;
&lt;table class="thtable"&gt;
&lt;tr&gt;&lt;th&gt;Aspekt&lt;/th&gt;&lt;th&gt;Klasika (Munk)&lt;/th&gt;&lt;th&gt;Naše riešenie&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Kontroluje&lt;/td&gt;&lt;td&gt;HRANU: existuje A→C?&lt;/td&gt;&lt;td&gt;MEMBERSHIP: je C v mape?&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Dátová štruktúra&lt;/td&gt;&lt;td&gt;Graf / hrany (A,C)&lt;/td&gt;&lt;td&gt;&lt;code&gt;set(parent.keys())&lt;/code&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Zložitosť overenia&lt;/td&gt;&lt;td&gt;O(1) hash hrán, ale 2× viac dát&lt;/td&gt;&lt;td&gt;O(1) hash URL, polovičný set&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Čo doplní&lt;/td&gt;&lt;td&gt;Najkratšiu cestu cez graf&lt;/td&gt;&lt;td&gt;Vždy &lt;b&gt;jediného kanonického rodiča&lt;/b&gt; cieľa&lt;/td&gt;&lt;/tr&gt;
&lt;/table&gt;
&lt;p&gt;Prečo to stačí: u nás je každá URL spojená so svojím &lt;b&gt;jedným&lt;/b&gt; najčastejším rodičom. Takže keď vidíme "A nepoznám, ale C poznám", vieme, že "najpravdepodobnejší predchodca C" je &lt;code&gt;parent[C]&lt;/code&gt; — a ten vložíme. Nemusíme prehľadávať graf, nemusíme držať hrany. Stačí slovník URL → rodič a set URL.&lt;/p&gt;
&lt;p&gt;&lt;b&gt;Analógia — košík v obchode.&lt;/b&gt; Klasika by si pamätala "z mlieka idú zákazníci k chlebu" (hrany medzi tovarmi). My si pamätáme len "k chlebu sa najčastejšie chodí od mlieka" (jedna mapa: tovar → typický predchodca). Stačí to, lebo nás zaujíma len &lt;i&gt;čo doplniť do košíka&lt;/i&gt;, nie celá topológia obchodu.&lt;/p&gt;
&lt;div class="thbox thpochop"&gt;&lt;h4&gt;Pochop (princíp, prečo)&lt;/h4&gt;&lt;ul&gt;
&lt;li&gt;Apache log je &lt;b&gt;server-side&lt;/b&gt;. Späť tlačidlo zobrazí stránku z cache — žiadny request, žiadny riadok.&lt;/li&gt;
&lt;li&gt;Bez doplnenia by asociačné pravidlá (fáza 2) videli "A → C" namiesto skutočného "A → B → C".&lt;/li&gt;
&lt;li&gt;Mapu staviame zo samotného logu, lebo externú nemáme. Kanonický rodič = najčastejší Referrer (&lt;code&gt;value_counts().idxmax()&lt;/code&gt;).&lt;/li&gt;
&lt;li&gt;Doplníme iba ak &lt;code&gt;url_from&lt;/code&gt; NIE JE v mape a &lt;code&gt;url_to&lt;/code&gt; v mape JE — kontrolujeme &lt;b&gt;členstvo&lt;/b&gt;, nie hrany.&lt;/li&gt;
&lt;li&gt;Munk označuje tento krok ako &lt;b&gt;Doplnenie záznamov logovacieho súboru&lt;/b&gt; — záver prípravy dát pred fázou hľadania vzorov.&lt;/li&gt;
&lt;/ul&gt;&lt;/div&gt;
&lt;div class="thbox thnabif"&gt;&lt;h4&gt;Nabif (vzorce, čísla, idiómy)&lt;/h4&gt;&lt;ul&gt;
&lt;li&gt;Mapa webu: &lt;b&gt;3 141&lt;/b&gt; stránok (postavená z logu).&lt;/li&gt;
&lt;li&gt;Doplnených záznamov: &lt;b&gt;4 032&lt;/b&gt;.&lt;/li&gt;
&lt;li&gt;Celkový počet po doplnení: &lt;b&gt;77 959&lt;/b&gt;.&lt;/li&gt;
&lt;li&gt;Filter interných: &lt;code&gt;Referrer.str.contains("ukf.sk", case=False)&lt;/code&gt; (riadok 87).&lt;/li&gt;
&lt;li&gt;Kanonický rodič: &lt;code&gt;groupby("URL")["ref_path"].agg(lambda x: x.value_counts().idxmax())&lt;/code&gt; (riadok 94).&lt;/li&gt;
&lt;li&gt;Membership check: &lt;code&gt;url_from not in map_paths and url_to in map_paths&lt;/code&gt; (riadok 134).&lt;/li&gt;
&lt;li&gt;Strážka proti duplikátu: &lt;code&gt;ref_page != url_from&lt;/code&gt; (riadok 139).&lt;/li&gt;
&lt;/ul&gt;&lt;/div&gt;`,
  '10': `&lt;h2&gt;Krok 10 — Doplnenie ciest pre h-ref&lt;/h2&gt;
&lt;p class="thintro"&gt;Rovnaký algoritmus ako úloha 09, ale nad sedeniami h-ref. Výsledok je výrazne menší — h-ref má veľa krátkych sedení s málom skokov, takže algoritmus má málo &lt;b&gt;miest&lt;/b&gt;, kde by vôbec mohol niečo doplniť.&lt;/p&gt;

&lt;h3&gt;Ako sme to robili v projekte&lt;/h3&gt;
&lt;p&gt;Identický kód ako 09: postavíme mapu webu, nájdeme kanonického rodiča pre každé URL, prejdeme susedné dvojice v rámci sedenia a doplníme medzistránku. Jediný rozdiel: vstupom je &lt;code&gt;in/08_sedenia_href.csv&lt;/code&gt; (h-ref sedenia) namiesto &lt;code&gt;in/07_sedenia_rlength.csv&lt;/code&gt; (RLength sedenia).&lt;/p&gt;
&lt;p&gt;V skripte &lt;code&gt;doplnenie_href.py&lt;/code&gt;:
&lt;ul&gt;
&lt;li&gt;riadky 95–117 — stavba mapy webu (Referrer → URL, najčastejší rodič cez &lt;code&gt;value_counts().idxmax()&lt;/code&gt;);&lt;/li&gt;
&lt;li&gt;riadky 132–168 — slučka po dvojiciach &lt;code&gt;(curr, next_row)&lt;/code&gt; v rámci jedného &lt;code&gt;SESSION_ID&lt;/code&gt;;&lt;/li&gt;
&lt;li&gt;riadok 157 — hlavná podmienka: &lt;code&gt;url_from not in map_paths and url_to in map_paths&lt;/code&gt;.&lt;/li&gt;
&lt;/ul&gt;&lt;/p&gt;
&lt;pre&gt;&lt;code&gt;parent[url] = mapa.groupby("URL")["ref_path"].agg(
    lambda x: x.value_counts().idxmax())
# pre každý susedný pár v sedení:
if url_from not in map_paths and url_to in map_paths:
    insert parent[url_to] medzi ne&lt;/code&gt;&lt;/pre&gt;

&lt;h3&gt;Vizuálne — porovnanie 09 vs 10&lt;/h3&gt;
&lt;table class="thtable"&gt;&lt;tr&gt;&lt;th&gt;Metóda sedení&lt;/th&gt;&lt;th&gt;Počet sedení&lt;/th&gt;&lt;th&gt;Dĺžka sedenia&lt;/th&gt;&lt;th&gt;Doplnené&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;RLength (09)&lt;/td&gt;&lt;td&gt;33 496&lt;/td&gt;&lt;td&gt;&lt;b&gt;dlhšie&lt;/b&gt;&lt;/td&gt;&lt;td&gt;&lt;b&gt;4 032&lt;/b&gt; (~5.2 %)&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;h-ref (10)&lt;/td&gt;&lt;td&gt;46 693&lt;/td&gt;&lt;td&gt;&lt;b&gt;kratšie&lt;/b&gt;&lt;/td&gt;&lt;td&gt;&lt;b&gt;139&lt;/b&gt; (~0.19 %)&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;

&lt;h3&gt;Vizuálne — prečo h-ref dopĺňa MENEJ (lámanie sedení)&lt;/h3&gt;
&lt;pre&gt;RLength sedenie (1 dlhé sedenie = 5 párov):
  /A → /B → /C → /D → /E → /F     ← 5 susedných dvojíc (5 šancí doplniť)

h-ref to isté rozláme na 3 krátke sedenia:
  /A → /B          ← 1 pár
  /C → /D          ← 1 pár   (Referrer="-" rozlomilo)
  /E → /F          ← 1 pár   (Referrer="-" rozlomilo)
                   = 3 páry spolu (3 šance doplniť)

Doplnenie funguje LEN cez susedné dvojice v rámci JEDNÉHO sedenia
→ menej dvojíc = menej šancí = menej doplnených riadkov.&lt;/pre&gt;

&lt;h3&gt;Vizuálne — pred/po (rovnaký princíp ako 09)&lt;/h3&gt;
&lt;pre&gt;PRED:
  S=42  URL=/uvod        Ref=-
  S=42  URL=/clanok-42   Ref=/blog   ← /blog v logu CHÝBA (cache, Späť)

PO doplnení:
  S=42  URL=/uvod
  S=42  URL=/blog        ← DOPLNENÉ (parent[/clanok-42] = /blog)
  S=42  URL=/clanok-42&lt;/pre&gt;

&lt;div class="thbox thpochop"&gt;&lt;h4&gt;Pochop (princíp, prečo)&lt;/h4&gt;&lt;ul&gt;
&lt;li&gt;&lt;b&gt;Hlavná otázka:&lt;/b&gt; algoritmus 09 a 10 je &lt;b&gt;identický&lt;/b&gt;. Mapa webu sa staví z toho istého logu. Tak prečo 09 doplní &lt;b&gt;4 032&lt;/b&gt; riadkov a 10 len &lt;b&gt;139&lt;/b&gt; (~29× menej)?&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Odpoveď: krátke sedenia majú málo PÁROV.&lt;/b&gt; Doplnenie funguje len medzi dvoma susednými klikmi &lt;b&gt;v tom istom sedení&lt;/b&gt; (riadok 144 v skripte: &lt;code&gt;if curr["SESSION_ID"] != next_row["SESSION_ID"]: continue&lt;/code&gt;). Cez hranicu sedení sa nedopĺňa.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Derivácia od základov:&lt;/b&gt; sedenie s N klikmi má N-1 susedných dvojíc. Sedenie s 2 klikmi má 1 dvojicu. Sedenie s 1 klikom má &lt;b&gt;0 dvojíc&lt;/b&gt; — nikam sa nedá nič vložiť. Celkový počet šancí = súčet (N_i − 1) cez všetky sedenia = &lt;b&gt;celkový počet kliknutí − počet sedení&lt;/b&gt;.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Aplikácia na čísla:&lt;/b&gt; po doplnení máme rovnaké totály ~74 000 kliknutí. Šance pre RLength: 74 000 − 33 496 = &lt;b&gt;~40 500 dvojíc&lt;/b&gt;. Šance pre h-ref: 74 000 − 46 693 = &lt;b&gt;~27 300 dvojíc&lt;/b&gt;. h-ref má teda &lt;b&gt;o tretinu menej dvojíc&lt;/b&gt;, no doplní 29× menej — to znamená, že tie dvojice sú aj &lt;b&gt;menej "podozrivé"&lt;/b&gt;.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Prečo aj menej podozrivých dvojíc:&lt;/b&gt; h-ref láme sedenie hneď, ako Referrer="-" (3. OR podmienka z úlohy 08). Lenže práve &lt;b&gt;prázdny Referrer&lt;/b&gt; je často znak chýbajúcej medzistránky (browser cache, Späť). h-ref tieto situácie &lt;b&gt;agresívne vyhodí na začiatok nového sedenia&lt;/b&gt; — a algoritmus 10 na novom sedení nedopĺňa. RLength tieto kliknutia ponechá v rámci pôvodného sedenia, kde sa môžu doplniť.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Analógia — autobusy:&lt;/b&gt; predstav si linku autobusu so 6 zastávkami (1 cesta = 5 medzizastávok, kde môže byť diera). Ak tú istú trasu rozdelíš na 3 krátke linky po 2 zastávkach, máš už len 3 medzizastávky a kontrolór môže "doplniť chýbajúcu informáciu o ceste" len v tých troch medzerách, nie v pôvodných piatich.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Munk (prednáška 7) — kontext:&lt;/b&gt; doplnenie ciest patrí do fázy &lt;i&gt;Príprava dát&lt;/i&gt; — konkrétne &lt;i&gt;"Doplnené záznamy logovacieho súboru"&lt;/i&gt;. Munk hovorí, že mapa webu je tabuľka &lt;i&gt;(URL → odkazujúca stránka)&lt;/i&gt; a chýbajúce stránky vkladáme do logu tak, aby navigačná cesta bola kompletná (príklad ABCDX → po doplnení ABCDCBAX).&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Munk — princíp:&lt;/b&gt; sedenia rozlišujeme na základe &lt;i&gt;času&lt;/i&gt; (RLength) alebo &lt;i&gt;štruktúry / odkazujúcej stránky&lt;/i&gt; (h-ref). Doplnenie potom rekonštruuje cestu &lt;b&gt;v rámci&lt;/b&gt; už vyznačených sedení — preto má voľba metódy sedení priamy dopad na to, koľko sa dá doplniť.&lt;/li&gt;
&lt;/ul&gt;&lt;/div&gt;

&lt;div class="thbox thnabif"&gt;&lt;h4&gt;Nabif (vzorce, čísla, idiómy)&lt;/h4&gt;&lt;ul&gt;
&lt;li&gt;Doplnených záznamov: &lt;b&gt;139&lt;/b&gt;.&lt;/li&gt;
&lt;li&gt;Celkový počet po doplnení: &lt;b&gt;74 066&lt;/b&gt;.&lt;/li&gt;
&lt;li&gt;Pomer: ~0.19 % oproti 5.2 % pri RLength → &lt;b&gt;~29× menej&lt;/b&gt;.&lt;/li&gt;
&lt;li&gt;Mapa webu identická ako v 09 (stavaná z toho istého logu, ~3 141 stránok).&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Vzorec šancí na doplnenie:&lt;/b&gt; &lt;code&gt;páry = celkový_log − počet_sedení&lt;/code&gt;. RLength: ~40 500 dvojíc. h-ref: ~27 300 dvojíc.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Idióm hlavnej podmienky&lt;/b&gt; (riadok 157): &lt;code&gt;url_from not in map_paths and url_to in map_paths&lt;/code&gt;.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Idióm bezpečnosti&lt;/b&gt; (riadok 162): &lt;code&gt;if ref_page and ref_page != url_from&lt;/code&gt; — zabráni vloženiu duplikátu.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Kľúčový dopad 3. OR podmienky z h-ref&lt;/b&gt;: &lt;code&gt;Referrer == "-"&lt;/code&gt; rozlomí sedenie práve tam, kde by sa najpravdepodobnejšie doplňala medzistránka.&lt;/li&gt;
&lt;/ul&gt;&lt;/div&gt;`,
  'overview': `&lt;h2&gt;Súhrnný prehľad pipelinu&lt;/h2&gt;
&lt;p class="thintro"&gt;Projekt = fáza 1 Web Usage Mining: zo surového Apache logu (12 GB, 47 M riadkov) vyrobíme čistý označený dataset pre asociačné/sekvenčné pravidlá. 10 krokov, každý so vstupom v &lt;code&gt;in/&lt;/code&gt; a výstupom v &lt;code&gt;out/&lt;/code&gt;.&lt;/p&gt;
&lt;h3&gt;Pipeline diagram&lt;/h3&gt;
&lt;pre&gt;00 extrakcia týždňa  (12 GB → 216 MB, 909 828 riadkov)
       │
       ├──→ 01 čistenie (regex + filter)  ──→  211 313
       └──→ 02 robot IPs (z robots.txt)  ──→  250 IP
                          │
                          ↓
              03 filter robotov (4 filtre)  ──→  73 927
                          ↓
              04 obdobie + UNIXTIME           ──→  73 927
                          ↓
              05 USER_ID (IP + Agent)         ──→  14 563 userov
                          ↓
              06 Length (60-min STT)          ──→  μ=174s, med=5s
                   ↓                ↓
          07 RLength (KS→STT_Q)   08 h-ref (3 OR)
              33 496 sedení          46 693 sedení
                   ↓                ↓
          09 dopln. ciest         10 dopln. ciest
              +4 032 (77 959)        +139 (74 066)&lt;/pre&gt;

&lt;h3&gt;Cesta dát: čo sa stane s jedným záznamom&lt;/h3&gt;
&lt;p&gt;Zoberme jeden konkrétny záznam zo surového logu a sledujme ho cez všetkých 10 fáz. Vstup: žiadosť o domovskú stránku &lt;code&gt;/uvod&lt;/code&gt; z IP &lt;b&gt;193.87.12.30&lt;/b&gt; dňa &lt;b&gt;17/Dec/2017&lt;/b&gt; o 06:28:17.&lt;/p&gt;

&lt;table class="thtable"&gt;
&lt;tr&gt;&lt;th&gt;Stage&lt;/th&gt;&lt;th&gt;Skript&lt;/th&gt;&lt;th&gt;Čo sa pridá / zmení&lt;/th&gt;&lt;th&gt;Náš záznam po stage&lt;/th&gt;&lt;/tr&gt;

&lt;tr&gt;&lt;td&gt;&lt;b&gt;Vstup&lt;/b&gt;&lt;/td&gt;&lt;td&gt;wm2020projekt.log (12 GB)&lt;/td&gt;&lt;td&gt;Surový Apache textový riadok.&lt;/td&gt;
&lt;td&gt;&lt;code&gt;193.87.12.30 - - [17/Dec/2017:06:28:17 +0100] "GET /uvod HTTP/1.1" 200 12345 "-" "Mozilla/5.0..."&lt;/code&gt;&lt;/td&gt;&lt;/tr&gt;

&lt;tr&gt;&lt;td&gt;&lt;b&gt;00&lt;/b&gt;&lt;/td&gt;&lt;td&gt;extract_week.py&lt;/td&gt;&lt;td&gt;Riadok obsahuje "17/Dec/2017" → patrí do nášho týždňa, &lt;b&gt;ponechaný&lt;/b&gt;. Ostatné 3 roky vyhodené (47 M → 909 828 r.). Žiadne stĺpce, ešte stále text.&lt;/td&gt;
&lt;td&gt;&lt;code&gt;193.87.12.30 - - [17/Dec/2017:06:28:17 +0100] "GET /uvod ..." 200 ...&lt;/code&gt; (rovnaký text)&lt;/td&gt;&lt;/tr&gt;

&lt;tr&gt;&lt;td&gt;&lt;b&gt;01&lt;/b&gt;&lt;/td&gt;&lt;td&gt;parsovanie_a_cistenie.py&lt;/td&gt;&lt;td&gt;Regex (r. 60-68) rozseká riadok na &lt;b&gt;7 stĺpcov&lt;/b&gt;. 3 filtre: GET-only, status 200-399, žiadne .css/.js/.png. Náš záznam je GET, 200, "/uvod" nie je statika → prejde.&lt;/td&gt;
&lt;td&gt;Tabuľka: &lt;code&gt;IP=193.87.12.30 | DateTime=17/Dec/2017:06:28:17 +0100 | Method=GET | URL=/uvod | Status=200 | Referrer="-" | Agent=Mozilla/5.0...&lt;/code&gt;&lt;/td&gt;&lt;/tr&gt;

&lt;tr&gt;&lt;td&gt;&lt;b&gt;02&lt;/b&gt;&lt;/td&gt;&lt;td&gt;robot_ips.py&lt;/td&gt;&lt;td&gt;Paralelná vetva: zoznam &lt;b&gt;250 IP&lt;/b&gt;, ktoré navštívili /robots.txt (= takmer určite roboti). Náš záznam ide do stage 03 nezmenený, ale stage 02 mu pripraví "čierny zoznam".&lt;/td&gt;
&lt;td&gt;Záznam nepohnutý. Vedľa vzniká súbor &lt;code&gt;02_robot_ips.csv&lt;/code&gt; (250 IP).&lt;/td&gt;&lt;/tr&gt;

&lt;tr&gt;&lt;td&gt;&lt;b&gt;03&lt;/b&gt;&lt;/td&gt;&lt;td&gt;filter_robotov.py&lt;/td&gt;&lt;td&gt;4 filtre: (a) Agent obsahuje "bot/crawl/spider", (b) automaty (cron/curl/wget), (c) prázdny Agent, (d) IP v zozname zo stage 02. Náš Agent je "Mozilla" a IP nie je v 250-tke → prejde.&lt;/td&gt;
&lt;td&gt;Rovnaké stĺpce ako 01, len menej riadkov (211 313 → &lt;b&gt;73 927&lt;/b&gt;).&lt;/td&gt;&lt;/tr&gt;

&lt;tr&gt;&lt;td&gt;&lt;b&gt;04&lt;/b&gt;&lt;/td&gt;&lt;td&gt;obdobie_a_unixtime.py&lt;/td&gt;&lt;td&gt;Pridá stĺpec &lt;b&gt;UNIXTIME&lt;/b&gt; (sekundy od 1.1.1970). Pre nás: 17/Dec/2017 06:28:17 +0100 → &lt;b&gt;1513488497&lt;/b&gt;. Vďaka tomu rozdiel dvoch klikov = jednoduchý odčet čísel.&lt;/td&gt;
&lt;td&gt;Pribudne stĺpec: &lt;code&gt;UNIXTIME=1513488497&lt;/code&gt;.&lt;/td&gt;&lt;/tr&gt;

function openTheory(step){

}

<h3>Úloha 02: vahove_schemy_tf_idf.py — vektorová reprezentácia textu</h3>
<p><strong>Čo robí:</strong> Z hotovej DTM matice frekvencií slov vyrobí 4 odvodené reprezentácie (binary, log, idf, tf-idf) a uloží ich do hárkov v jednom Excel súbore.</p>

<pre><code>binary  = 1 ak tf > 0, inak 0

<p>kde <b>tf</b> = počet výskytov slova v dokumente, <b>df_t</b> = v koľkých dokumentoch sa slovo vyskytuje, <b>N</b> = celkový počet dokumentov.</p>

{num:2,label:`Čistenie dát`,name:`Čistenie dát (čistenie I/II + roboti III/IV)`,reading:`<h2>Téma 2: Čistenie dát</h2>
<p class="lead">Surový Apache log je zmes užitočných návštev a smetia (statické súbory, roboti, duplikáty). Táto téma má 4 skripty, ktoré ho postupne čistia, aby zostali len reálne kliknutia ľudí — vstup pre ďalšie kroky WUM.</p>

<h3>Úloha 01: parsovanie_a_cistenie.py</h3>
<p><strong>Čo robí:</strong> Z textového Apache logu vyrobí tabuľku (DataFrame) a vyhodí nepotrebné riadky.</p>
<p><strong>Prečo:</strong> Bez tohto kroku máme len text, s ktorým sa nedá nič počítať. A ~80 % riadkov je smetie (obrázky, CSS, JS, neúspešné requesty).</p>
<p><strong>Ako:</strong></p>
<ol>
  <li>Skompiluje regex podľa formátu Apache Combined Log.</li>
  <li>Riadok po riadku rozparsuje IP, DateTime, Method, URL, Status, Referrer, Agent.</li>
  <li>Ponechá len <code>GET</code>, status 200–399 a vyhodí URL s príponami <code>.css .js .png .jpg .woff ...</code></li>
</ol>
<p><strong>Kde to nájdeš:</strong> <code>02_cistenie_dat/scripts/01_cistenie_dat_I/parsovanie_a_cistenie.py</code></p>
<p><strong>Príklad riadku:</strong></p>
<pre><code>193.87.12.30 - - [19/Feb/2020:06:25:50 +0100] "GET / HTTP/1.1" 200 20925 "-" "Mozilla/5.0"</code></pre>
<p>Premení sa na riadok tabuľky so stĺpcami IP, DateTime, RequestMethod=GET, URL=/, StatusCode=200, Referrer="-", Agent="Mozilla/5.0".</p>
<p><strong>Číslo na zapamätanie:</strong> ~257 000 riadkov vstup → ~57 650 výstup (zadanie hovorí "približne 56 500").</p>

<h3>Úloha 02: dalsie_cistenie.py</h3>
<p><strong>Čo robí:</strong> Druhé kolo čistenia nad výstupom Úlohy 01 — vyhodí botov, duplikáty a interné URL.</p>
<p><strong>Prečo:</strong> Po Úlohe 01 ešte stále zostali roboti (Googlebot), duplicitné kliknutia (F5 refresh) a Joomla interné cesty, ktoré nie sú obsahové stránky.</p>
<p><strong>Ako:</strong></p>
<ol>
  <li>Vyhodí riadky, kde User-Agent obsahuje <code>bot|crawl|spider|slurp|curl|wget|...</code></li>
  <li>Vyhodí prístupy na <code>robots.txt</code>, <code>/component/</code>, <code>format=feed</code>, <code>.pdf</code>, obrázky.</li>
  <li>Vyhodí duplikáty podľa trojice <code>(IP, DateTime, URL)</code>.</li>
  <li>Ponechá len status 2xx (úspešné zobrazenie stránky).</li>
</ol>
<p><strong>Kde to nájdeš:</strong> <code>02_cistenie_dat/scripts/02_cistenie_dat_II/dalsie_cistenie.py</code></p>
<p><strong>Príklad:</strong> Riadok s Agent="Mozilla/5.0 (compatible; Googlebot/2.1)" sa zmaže, lebo obsahuje "bot". Riadok s Agent="Mozilla/5.0 Firefox" zostane.</p>
<p><strong>Číslo na zapamätanie:</strong> ~57 650 → ~31 500 záznamov.</p>

<h3>Úloha 03: identifikacia_robot_ip.py</h3>
<p><strong>Čo robí:</strong> Zo <strong>surového</strong> logu vytiahne IP všetkých klientov, ktorí si stiahli súbor <code>robots.txt</code>.</p>
<p><strong>Prečo:</strong> <code>robots.txt</code> je inštrukčný súbor pre crawlerov (Robots Exclusion Protocol). Človek v prehliadači naň nemá odkaz — nikdy ho sám nestiahne. Kto si ho stiahol, je robot.</p>
<p><strong>Ako:</strong></p>
<ol>
  <li>Rovnaký regex na parsovanie ako v Úlohe 01.</li>
  <li>Pre každý riadok skontroluje <code>"robots.txt" in url.lower()</code>.</li>
  <li>Ak áno, uloží IP do zoznamu (duplicity ponechá).</li>
</ol>
<p><strong>Kde to nájdeš:</strong> <code>02_cistenie_dat/scripts/03_cistenie_dat_III_roboti/identifikacia_robot_ip.py</code></p>
<p><strong>Príklad:</strong> IP <code>66.249.66.1</code> (Googlebot) si stiahla <code>/robots.txt</code> 5-krát počas dňa — v zozname bude 5-krát. Výstup CSV má 1 stĺpec <code>IP</code>.</p>
<p><strong>Číslo na zapamätanie:</strong> presne <strong>333 záznamov</strong> (~108 unikátnych IP).</p>

<h3>Úloha 04: filtrovanie_robotov.py</h3>
<p><strong>Čo robí:</strong> Z výstupu Úlohy 01 odstráni 4 typy robotov naraz — kombinuje detekciu cez User-Agent aj cez zoznam IP z Úlohy 03.</p>
<p><strong>Prečo:</strong> User-Agent sa dá ľahko sfalšovať (je to obyčajný textový hlavičkový reťazec). IP zo zoznamu pristupujúcich k <code>robots.txt</code> je tvrdší dôkaz. Kombinácia oboch je robustnejšia.</p>
<p><strong>Ako (4 postupné filtre):</strong></p>
<ol>
  <li>Vyhodí riadky, kde Agent obsahuje <code>bot|crawl|spider</code>.</li>
  <li>Vyhodí Agent obsahujúci <code>cron|curl|wget|libwww|ltx71</code> (automaty).</li>
  <li>Vyhodí Agent presne <code>"-"</code> (Apache zápis pre chýbajúci UA).</li>
  <li>Vyhodí riadky, kde IP je v zozname robotov z Úlohy 03 (<code>.isin()</code>).</li>
</ol>
<p><strong>Kde to nájdeš:</strong> <code>02_cistenie_dat/scripts/04_cistenie_dat_IV_roboti/filtrovanie_robotov.py</code></p>
<p><strong>Príklad:</strong> Riadok s Agent="bingbot/2.0" padne v kroku 1. Riadok s Agent="Mozilla/5.0", ale IP=66.249.66.1 padne v kroku 4 (lebo táto IP je v zozname).</p>
<p><strong>Číslo na zapamätanie:</strong> ~57 650 → <strong>~20 666 riadkov</strong> (finálny vstup pre cv2).</p>

{num:3,label:`Identifikácia`,name:`Identifikácia používateľov a sedení`,reading:`<h2>Téma 3: Identifikácia používateľov a sedení</h2>
<p class="lead">Apache log obsahuje surové prístupy — kto, kedy, kam. Z týchto prístupov potrebujeme zrekonštruovať <strong>kto je kto</strong> (USER_ID) a <strong>kedy začalo a skončilo jedno „posedenie pri počítači"</strong> (SESSION_ID). Bez toho sa nedá ďalej analyzovať správanie používateľa.</p>

<h3>Úloha 01: unixtime.py</h3>
<p><strong>Čo robí:</strong> Premieňa textový dátum "19/Feb/2020:06:25:49 +0100" na jedno číslo — sekundy od 1.1.1970.</p>
<p><strong>Prečo:</strong> Rozdiel dvoch UNIX timestampov = počet sekúnd medzi nimi. Žiadne parsovanie kalendára, žiadne časové zóny. Toto číslo potrebujeme pre Length aj sedenia.</p>
<p><strong>Ako:</strong> Pre každý riadok rozdelíme dátum cez <code>split(':')</code>, mesiac "Feb" preložíme cez natvrdo napísaný slovník na číslo 2, potom zavoláme <code>datetime.datetime(rok, mesiac, deň, h, m, s).timestamp()</code>.</p>
<p><strong>Kde to nájdeš:</strong> <code>03_identifikacia/scripts/01_UNIXTIME/unixtime.py</code></p>
<p><strong>Príklad:</strong> "19/Feb/2020:06:25:49 +0100" → <code>1582089949.0</code></p>
<p><strong>Číslo na zapamätanie:</strong> Po UNIX konverzii máme ~20 666 záznamov (rovnako ako po čistení cv1).</p>

<h3>Úloha 02: identifikacia_userov.py</h3>
<p><strong>Čo robí:</strong> Priraďuje každému unikátnemu páru (IP, User-Agent) sekvenčné USER_ID.</p>
<p><strong>Prečo:</strong> Apache log nemá cookies ani login — jediný spôsob ako rozlíšiť ľudí je predpoklad "rovnaká IP + rovnaký prehliadač = ten istý človek".</p>
<p><strong>Ako:</strong> Zoradíme log podľa (IP, Agent, UNIXTIME), aby všetky záznamy jedného usera boli v súvislom bloku. Potom <code>groupby(['IP','Agent']).ngroup() + 1</code> priradí každej skupine integer 1, 2, 3...</p>
<p><strong>Kde to nájdeš:</strong> <code>03_identifikacia/scripts/02_identifikacia_pouzivatelov/identifikacia_userov.py</code></p>
<p><strong>Príklad:</strong> (178.41.1.187, Firefox) → USER_ID=42 pre všetky riadky s touto dvojicou.</p>
<p><strong>Číslo na zapamätanie:</strong> Identifikovaných ~4040 používateľov.</p>

<h3>Úloha 03: vypocet_length.py</h3>
<p><strong>Čo robí:</strong> Pre každého usera počíta čas medzi po sebe idúcimi prístupmi.</p>
<p><strong>Prečo:</strong> Length aproximuje "ako dlho user pozeral predchádzajúcu stránku". Server zaznamenáva len príchod, nie odchod — predpokladáme, že kliknutie na ďalší link ukončilo čítanie.</p>
<p><strong>Ako:</strong> <code>df.groupby('USER_ID')['UNIXTIME'].shift(1)</code> posunie čas o jeden riadok dole v rámci usera. Rozdiel = Length. Ak je Length ≥ 3600 s (hodina), nahradíme ho None — user pravdepodobne odišiel.</p>
<p><strong>Kde to nájdeš:</strong> <code>03_identifikacia/scripts/03_premenna_Length/vypocet_length.py</code></p>
<p><strong>Príklad:</strong> User klikol o 06:25:49, potom o 06:28:30 — Length = 161 s.</p>
<p><strong>Číslo na zapamätanie:</strong> Priemerná Length ~150 s. Prvý prístup každého usera má Length = NaN.</p>

<h3>Úloha 04: stt_mean.py (Session Time Threshold — priemer)</h3>
<p><strong>Čo robí:</strong> Rozdeľuje záznamy na sedenia pomocou prahu = priemer všetkých Length.</p>
<p><strong>Prečo:</strong> Ak user na stránke strávil viac ako priemer, pravdepodobne pauzoval — to je koniec sedenia.</p>
<p><strong>Ako:</strong> Označíme každý záznam, kde <code>Length is NaN OR Length >= mean</code>, ako začiatok nového sedenia. Boolean masku cumsum-neme — True sa kastuje na 1, výsledok je rastúce SESSION_ID.</p>
<p><strong>Kde to nájdeš:</strong> <code>03_identifikacia/scripts/04_STT_MEAN/stt_mean.py</code></p>
<p><strong>Príklad:</strong> Length = [NaN, 50, 80, 300, 40] a priemer = 100 → NEW_SESSION = [T, F, F, T, F] → SESSION_ID = [1, 1, 1, 2, 2].</p>
<p><strong>Číslo na zapamätanie:</strong> Očakávaných ~7500 sedení.</p>

<h3>Úloha 05: stt_q.py (Session Time Threshold — kvartily)</h3>
<p><strong>Čo robí:</strong> Rozdeľuje sedenia pomocou robustnejšieho prahu z kvartilov.</p>
<p><strong>Prečo:</strong> Priemer je citlivý na extrémne dlhé pauzy (1 hodinová pauza potiahne priemer celého datasetu). Kvartily ignorujú okrajové hodnoty — vhodnejšie pre Length s ťažkým pravým chvostom.</p>
<p><strong>Ako:</strong> Vzorec podľa Tukeyho pravidla:</p>
<pre><code>STT_Q = Q3 + 1.5 * IQR
IQR   = Q3 - Q1</code></pre>
<p>Q1 je 25. percentil, Q3 je 75. percentil. Zvyšok algoritmu je rovnaký ako pri STT_MEAN (cumsum trik).</p>
<p><strong>Kde to nájdeš:</strong> <code>03_identifikacia/scripts/05_STT_Q/stt_q.py</code></p>
<p><strong>Číslo na zapamätanie:</strong> Tiež ~7500 sedení, ale prah je vyšší a robustnejší.</p>

<h3>Úloha 06: slength.py (Session Length — pevný limit 10 minút)</h3>
<p><strong>Čo robí:</strong> Sedenie nesmie celkovo trvať dlhšie ako 600 sekúnd (10 minút).</p>
<p><strong>Prečo:</strong> Iný typ heuristiky — STT_* sleduje čas <em>medzi</em> prístupmi, SLength sleduje <em>kumulatívnu</em> dĺžku sedenia.</p>
<p><strong>Ako:</strong> Cumsum tu nestačí (nevie sa resetovať), preto použijeme <code>iterrows()</code>. Pripočítavame Length do kumulatívu; keď kumulatív + Length ≥ 600, otvoríme nové sedenie a reset kumulatívu na Length tohto riadku.</p>
<p><strong>Kde to nájdeš:</strong> <code>03_identifikacia/scripts/06_SLength/slength.py</code></p>
<p><strong>Príklad:</strong> User klikne 5×, časy [100, 200, 250, 150, 80] — po 4. kliknutí kumulatív = 700 → otvorí sa nové sedenie.</p>
<p><strong>Číslo na zapamätanie:</strong> ~6700 sedení (menej než STT, lebo limit je striktnejší).</p>

<h3>Úloha 07: ks_test_exp_rozdelenia.py (overovanie exp. rozdelenia)</h3>
<p><strong>Čo robí:</strong> Overí, či Length pochádza z exponenciálneho rozdelenia pomocou Kolmogorov-Smirnov testu.</p>
<p><strong>Prečo:</strong> Ďalšia úloha (RLength) <em>predpokladá</em> exp. rozdelenie. Najprv treba overiť, či tento predpoklad platí.</p>
<p><strong>Ako:</strong> Spustíme <code>kstest(length, 'expon', args=(0, mean))</code>. Test porovná empirickú CDF s teoretickou. Vykreslí sa aj histogram + PDF a QQ plot.</p>
<p><strong>Kde to nájdeš:</strong> <code>03_identifikacia/scripts/07_RLength_exp/ks_test_exp_rozdelenia.py</code></p>
<p><strong>Číslo na zapamätanie:</strong> Pre Exp(λ) platí <code>E[X] = 1/λ</code>, preto v skripte je <code>scale = mean(Length)</code>.</p>

<h3>Úloha 08: rlength.py (Reference Length — kvantil exp. rozdelenia)</h3>
<p><strong>Čo robí:</strong> Vypočíta časový prah ako kvantil exp. rozdelenia s parametrom p = 0.4 (40 % navigačných stránok).</p>
<p><strong>Prečo:</strong> Ak 40 % stránok sú "len kliknutia" (krátky čas, user neprečítal obsah), prah <code>rlength</code> ich oddelí od reálne čítaných stránok. Dlhé Length = end of session signál.</p>
<p><strong>Ako:</strong> Inverzná CDF exp. rozdelenia:</p>
<pre><code>rlength = -ln(1 - p) * mean(Length)</code></pre>
<p>Pre p = 0.4: <code>-ln(0.6) ≈ 0.5108</code>, takže rlength ≈ 0.51 × 147 ≈ 75 s. Algoritmus potom rovnaký cumsum trik.</p>
<p><strong>Kde to nájdeš:</strong> <code>03_identifikacia/scripts/08_RLength/rlength.py</code></p>
<p><strong>Číslo na zapamätanie:</strong> ~8000 sedení (nižší prah = viac, kratších sedení).</p>

<h3>Úloha 09: h_ref.py (heuristic referrer)</h3>
<p><strong>Čo robí:</strong> Kombinuje časový prah s informáciou o referreri — ak Referrer = "-", je to externý/priamy vstup.</p>
<p><strong>Prečo:</strong> User môže otvoriť novú záložku po krátkej pauze — STT to nezachytí ako nové sedenie, ale Referrer = "-" áno.</p>
<p><strong>Ako:</strong> Tri podmienky cez <strong>bitwise OR</strong> (znak <code>|</code>, nie slovo <code>or</code>):</p>
<pre><code>NEW_SESSION = Length.isna() | Length >= mean | Referrer == '-'</code></pre>
<p>Potom cumsum ako vždy.</p>
<p><strong>Kde to nájdeš:</strong> <code>03_identifikacia/scripts/09_h_ref/h_ref.py</code></p>
<p><strong>Číslo na zapamätanie:</strong> ~7200 sedení.</p>

<div class="summary">
  <h3>TLDR</h3>
  <ul>
    <li><strong>UNIXTIME</strong> je sekundový časový integer (1.1.1970 = 0). Bez neho sa nedajú robiť rozdiely a sedenia.</li>
    <li><strong>USER_ID</strong> = unikátna dvojica (IP, User-Agent). Slabosť: dynamické IP rozdelí jedného človeka, NAT zlúči viac ľudí.</li>
    <li><strong>Length</strong> = čas medzi dvoma prístupmi toho istého usera (cez <code>groupby + shift</code>). Length ≥ 3600 s → None.</li>
    <li><strong>5 metód sedení:</strong> STT_MEAN (priemer), STT_Q (Q3+1.5·IQR), SLength (600 s celkovo), RLength (kvantil exp.), h-ref (čas + Referrer="-").</li>
    <li><strong>Cumsum trik</strong>: boolean maska "tu začína nové sedenie" → <code>.cumsum()</code> = rastúce SESSION_ID. Funguje na hraniciach userov vďaka NaN Length.</li>
  </ul>
</div>`,tasks:[
 {type:`flash`,q:`Čo je UNIX timestamp a prečo ho potrebujeme vo WUM pipeline?`,a:`<b>UNIX timestamp</b> = počet sekúnd od epochy (1.1.1970 00:00 UTC). Výhoda: jediný float reprezentuje moment v čase; <b>rozdiel dvoch hodnôt = počet sekúnd medzi nimi</b> (bez parsovania dátumu, TZ, kalendára). Je to predpoklad pre Length (úloha 03) aj sessionizáciu (úlohy 04–09).`},
 {type:`flash`,q:`Čo je heuristika 'IP + User-Agent' pri identifikácii používateľov?`,a:`Apache log NEMÁ explicitný user identifikátor (žiadne cookies, žiadny login). Predpokladáme, že <b>jedna fyzická osoba = jedna dvojica (IP, User-Agent)</b>. Rovnaká IP + iný prehliadač = iný user (rodina za NAT-om). Iná IP + rovnaký prehliadač = iný user (mobil vs notebook).`},
 {type:`flash`,q:`Aké je teoretické ohraničenie sedenia podľa prednášky 7?`,a:`Sedenie je sekvencia stránok <code>s = (s_1, s_2, ..., s_n)</code> s časovými známkami, pre ktoré platí: <code>t_i - t_(i-1) ≤ δ</code> pre 1 &lt; i ≤ n. Pre poslednú stránku sedenia platí <code>t_(i+1) - t_i &gt; δ</code>. Od tej stránky je definované ďalšie sedenie.`},
 {type:`flash`,q:`📍 Úloha 01: unixtime.py`,a:`Z očisteného logu (cv1) <b>parsuje textový dátum</b> formátu '19/Feb/2020:06:25:49 +0100' a pomocou <code>datetime.datetime(...).timestamp()</code> vytvorí nový stĺpec UNIXTIME (sekundy od 1.1.1970).`},
